l":"Schemas","path":"/en/cat-harness/schemas/folio-assistant-core/"},{"kind":"skills","label":"Skills","path":"/cat-harness/auto-docs/index/skills/core-skills/"},{"kind":"tools","label":"Tools","note":"no viewer yet"},{"kind":"translation-sources","label":"Translation sources","path":"/en/cat-harness/translation-status/"},{"kind":"typologies","label":"Graph typologies","note":"no viewer yet"},{"kind":"validators","label":"Validators","note":"no viewer yet"},{"kind":"voices","label":"Voices","path":"/en/cat-harness/voices/folio-assistant-core/"},{"kind":"workflow-state","label":"Workflow state","note":"no viewer yet"}]}</script><script type="application/json" id="fa-rail" data-fa-root="../.." data-fa-to-root="../..">{"data":"rail-ys608ko4ea","documentIndex":{"label":"Lookup","icon":"§","items":[{"label":"Identifier lookup","icon":"▸","href":"#f"}],"collapsible":true,"open":true}}</script><nav class="fa-nav" aria-label="folio-assistant" data-fa-rail="pending"><a href="../../">Folio Assistant Core</a></nav><script type="application/json" data-fa-visualiser-nav>[{"label":"Identifier lookup","href":"#f"}]</script><h1>Identifier lookup</h1><p>Finds a node this site <em>references</em> but does not hold, by its identifier.
Each lookup downloads one small shard of the index, never the whole of it.
Materialised content is found by the site's own search instead.</p><form id="f"><label for="q">Identifier (for example <code>community/5bff2c18-6c2b-4658-9087-93811d2399c0</code>)</label> <input id="q" name="q" autocomplete="off" spellcheck="false"></form><div id="out" role="status" aria-live="polite"></div><script type="module">
  import { openIndex } from "./lookup.js";
  const params = new URLSearchParams(location.search);
  // `index` is the URL of the directory holding the index's manifest.json,
  // relative to this page. The page names no corpus of its own: each instance
  // hosts its own generated index (bean j7ql), and a link to this page says
  // which one to open.
  const name = params.get("index");
  const out = document.getElementById("out");
  const q = document.getElementById("q");
  let index;
  if (!name) {
    out.textContent = "No index named: open this page with ?index=<the directory holding manifest.json>. Lookup is unavailable, which is not the same as no results.";
  } else {
    try {
      index = await openIndex(new URL(name.endsWith("/") ? name : name + "/", location.href).href);
    } catch (e) {
      out.textContent = "The index could not be read: " + e.message + ". Lookup is unavailable, which is not the same as no results.";
    }
  }
  async function run(value) {
    if (!index || !value.trim()) return;
    const r = await index.lookup(value);
    out.replaceChildren();
    if (r.state === "found") {
      const a = document.createElement("a");
      a.href = r.entry.url;
      a.textContent = r.entry.title;
      out.append(a, " (" + r.entry.id + ", referenced: held at the source, not here)");
    } else if (r.state === "too-short") {
      out.textContent = "Type at least " + r.need + " characters after the namespace.";
    } else {
      out.textContent = "Not in this index.";
    }
  }
  document.getElementById("f").addEventListener("submit", (e) => { e.preventDefault(); run(q.value); });
  window.__idLookup = (v) => index.lookup(v);
  if (params.get("q")) { q.value = params.get("q"); run(q.value); }
</script></body></html>
