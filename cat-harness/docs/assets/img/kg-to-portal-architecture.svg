<?xml version="1.0" encoding="UTF-8"?>
<!--
  KG → package → distribution → portal.

  Hand-authored, and the ONE thing it exists to show is the boundary: the
  repository's side owns the canonical URL, the reader's side owns nothing,
  and the cache between them owns neither. Drawing the cache as a box in the
  publisher's column would make its URL look like the published one — bean
  `xies`, "EXTREME care in URL handling".

  The transport arrow is DASHED and labelled undetermined on purpose. The
  owner stated the ingestion method as not determined, and a solid arrow with
  a protocol on it would be a decision nobody made.

  Paired with skills/folio-core/kg-to-portal.md and
  skills/workflows/kg-to-portal.bpmn. Colours are declared as CSS custom
  properties on the root so a consumer can retheme it without editing shapes,
  and it carries its own dark-mode block because it is inlined into pages this
  file does not control.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 524" width="1000" height="524"
     role="img" aria-labelledby="kgp-title kgp-desc" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title id="kgp-title">Knowledge graph to public portal</title>
  <desc id="kgp-desc">Six stages in three zones. The publisher's zone holds the knowledge graph, the
  selected subgraph, the serialized JSON-LD, the package with its manifest of digests, and the
  signature. The distribution zone holds the origin and, optionally, a cache in front of it. The
  consumer's zone holds the portal, which verifies the package before serving it to readers. The
  arrow from signature to origin is dashed and labelled "transport: undetermined".</desc>

  <style>
    :root, svg {
      --kgp-ink: #1b2733;
      --kgp-muted: #5b6b7a;
      --kgp-edge: #c3ccd6;
      --kgp-pub: #0a5c7a;
      --kgp-pub-wash: #eaf3f7;
      --kgp-dist: #7a4a10;
      --kgp-dist-wash: #fdf4e8;
      --kgp-cons: #1d5c1d;
      --kgp-cons-wash: #f0f6e9;
      --kgp-trust: #6b3fa0;
      --kgp-paper: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root, svg {
        --kgp-ink: #e6edf3; --kgp-muted: #9fb0c0; --kgp-edge: #3a4652;
        --kgp-pub: #6fc4e4; --kgp-pub-wash: #10242e;
        --kgp-dist: #e8ab63; --kgp-dist-wash: #2c2013;
        --kgp-cons: #8fd08f; --kgp-cons-wash: #16240f;
        --kgp-trust: #c2a3e8;
        --kgp-paper: #0f1720;
      }
    }
    .zone { fill: none; stroke-width: 1.5; rx: 10; }
    .zone-label { font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .box { fill: var(--kgp-paper); stroke: var(--kgp-edge); stroke-width: 1.5; rx: 6; }
    .box-t { font-size: 13px; font-weight: 600; fill: var(--kgp-ink); }
    .box-s { font-size: 11px; fill: var(--kgp-muted); }
    .flow { stroke: var(--kgp-muted); stroke-width: 1.8; fill: none; marker-end: url(#kgp-arrow); }
    .flow-dash { stroke-dasharray: 7 5; }
    .flow-t { font-size: 11px; fill: var(--kgp-muted); }
    .flow-t.hot { fill: var(--kgp-dist); font-weight: 600; }
    .note { font-size: 11px; fill: var(--kgp-muted); font-style: italic; }
  </style>

  <defs>
    <marker id="kgp-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--kgp-muted)"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="524" fill="var(--kgp-paper)"/>

  <!-- ZONE 1 — the publisher -->
  <rect class="zone" x="16" y="44" width="516" height="270" stroke="var(--kgp-pub)" fill="var(--kgp-pub-wash)" fill-opacity="0.55"/>
  <text class="zone-label" x="30" y="66" fill="var(--kgp-pub)">Publisher — owns the canonical URL</text>

  <rect class="box" x="36" y="96" width="132" height="70"/>
  <text class="box-t" x="102" y="122" text-anchor="middle">Knowledge graph</text>
  <text class="box-s" x="102" y="140" text-anchor="middle">versioned store</text>
  <text class="box-s" x="102" y="155" text-anchor="middle">(git, or equivalent)</text>

  <rect class="box" x="204" y="96" width="120" height="70"/>
  <text class="box-t" x="264" y="122" text-anchor="middle">Subgraph</text>
  <text class="box-s" x="264" y="140" text-anchor="middle">what may leave</text>
  <text class="box-s" x="264" y="155" text-anchor="middle">— editorial</text>

  <rect class="box" x="360" y="96" width="150" height="70"/>
  <text class="box-t" x="435" y="122" text-anchor="middle">JSON-LD</text>
  <text class="box-s" x="435" y="140" text-anchor="middle">edges coerced @id,</text>
  <text class="box-s" x="435" y="155" text-anchor="middle">node IRIs are fragments</text>

  <rect class="box" x="204" y="212" width="150" height="76"/>
  <text class="box-t" x="279" y="238" text-anchor="middle">Package</text>
  <text class="box-s" x="279" y="256" text-anchor="middle">files + manifest</text>
  <text class="box-s" x="279" y="271" text-anchor="middle">of digests and sizes</text>

  <rect class="box" x="390" y="212" width="120" height="76"/>
  <text class="box-t" x="450" y="238" text-anchor="middle">Signature</text>
  <text class="box-s" x="450" y="256" text-anchor="middle">over the manifest,</text>
  <text class="box-s" x="450" y="271" text-anchor="middle">per asset, or both</text>

  <!-- ZONE 2 — distribution -->
  <rect class="zone" x="556" y="44" width="196" height="270" stroke="var(--kgp-dist)" fill="var(--kgp-dist-wash)" fill-opacity="0.55"/>
  <text class="zone-label" x="570" y="66" fill="var(--kgp-dist)">Distribution</text>

  <rect class="box" x="580" y="96" width="148" height="70"/>
  <text class="box-t" x="654" y="122" text-anchor="middle">Origin</text>
  <text class="box-s" x="654" y="140" text-anchor="middle">publication.host</text>
  <text class="box-s" x="654" y="155" text-anchor="middle">— a tool choice</text>

  <rect class="box" x="580" y="212" width="148" height="76" stroke-dasharray="6 4"/>
  <text class="box-t" x="654" y="238" text-anchor="middle">Cache / CDN</text>
  <text class="box-s" x="654" y="256" text-anchor="middle">optional layer,</text>
  <text class="box-s" x="654" y="271" text-anchor="middle">never the host</text>

  <!-- ZONE 3 — the consumer -->
  <rect class="zone" x="776" y="44" width="208" height="270" stroke="var(--kgp-cons)" fill="var(--kgp-cons-wash)" fill-opacity="0.55"/>
  <text class="zone-label" x="790" y="66" fill="var(--kgp-cons)">Consumer</text>

  <rect class="box" x="800" y="96" width="160" height="70"/>
  <text class="box-t" x="880" y="122" text-anchor="middle">Portal</text>
  <text class="box-s" x="880" y="140" text-anchor="middle">Moodle, intranet,</text>
  <text class="box-s" x="880" y="155" text-anchor="middle">department page</text>

  <rect class="box" x="800" y="212" width="160" height="76"/>
  <text class="box-t" x="880" y="238" text-anchor="middle">Verify</text>
  <text class="box-s" x="880" y="256" text-anchor="middle">digests + signature;</text>
  <text class="box-s" x="880" y="271" text-anchor="middle">cannot check → unknown</text>

  <!-- TRUST ANCHOR — outside all three zones, deliberately -->
  <rect class="box" x="300" y="326" width="440" height="66" stroke="var(--kgp-trust)" stroke-width="2"/>
  <text class="box-t" x="520" y="346" text-anchor="middle" fill="var(--kgp-trust)">GDHCN — DID trustlist (WHO SMART Trust)</text>
  <text class="box-s" x="520" y="363" text-anchor="middle">static did.json on tng-cdn.who.int; the key is resolved from HERE,</text>
  <text class="box-s" x="520" y="377" text-anchor="middle">not read out of the package</text>

  <!-- flows, publisher side -->
  <path class="flow" d="M 168 131 L 198 131"/>
  <path class="flow" d="M 324 131 L 354 131"/>
  <path class="flow" d="M 435 166 L 435 186 L 279 186 L 279 206"/>
  <path class="flow" d="M 354 250 L 384 250"/>

  <!-- the undetermined transport -->
  <path class="flow flow-dash" d="M 510 250 L 545 250 L 545 131 L 574 131"/>
  <text class="flow-t hot" x="528" y="196" text-anchor="middle">transport:</text>
  <text class="flow-t hot" x="528" y="209" text-anchor="middle">undetermined</text>

  <!-- origin → cache → portal, and origin → portal directly -->
  <path class="flow" d="M 654 166 L 654 206"/>
  <path class="flow" d="M 728 250 L 764 250 L 764 131 L 794 131"/>
  <path class="flow" d="M 728 131 L 794 131"/>
  <text class="flow-t" x="756" y="182" text-anchor="middle">either route,</text>
  <text class="flow-t" x="756" y="195" text-anchor="middle">same bytes, and</text>
  <text class="flow-t" x="756" y="208" text-anchor="middle">the same canonical URL</text>

  <path class="flow" d="M 880 166 L 880 206"/>

  <path class="flow flow-dash" d="M 450 288 L 450 320"/>
  <path class="flow flow-dash" d="M 740 358 L 880 358 L 880 292"/>
  <text class="flow-t" x="396" y="304" text-anchor="end">with a key the trustlist carries</text>
  <text class="flow-t" x="812" y="350" text-anchor="middle">resolves the key</text>

  <text class="note" x="30" y="416">The consumer owns nothing: the canonical URL is the origin's. A cache is a faster route to the same bytes; model it as the host and</text>
  <text class="note" x="30" y="432">every citation breaks the day the cache changes.</text>
  <text class="note" x="30" y="450">Money, traffic, graph size and latency decide the transport; each needs a denominator before it is an argument rather than a preference.</text>
  <text class="note" x="30" y="466">A package that is signed and never verified is a package whose signature is decoration. A portal nobody asked is not a portal that checked.</text>
  <text class="note" x="30" y="482">WHO's own trust network is this shape one layer down: static signed artefacts, served from a CDN, fetched a slice at a time.</text>
  <text class="note" x="30" y="498">Stages: select · serialize · package · sign · distribute · verify.</text>
</svg>
