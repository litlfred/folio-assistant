# Jekyll configuration for the folio-assistant documentation site.
#
# Published to GitHub Pages at https://litlfred.github.io/folio-assistant/
# Built and deployed by .github/workflows/docs-site.yml.
#
# Theme: just-the-docs (via remote_theme — the jekyll-remote-theme plugin is
# whitelisted by the github-pages gem, so this works on GitHub Pages).

title: folio-assistant
description: >-
  Content-agnostic agent skills framework — author scientific papers, WHO SMART
  Guidelines, and FHIR Implementation Guides with an LLM, an MCP server, and a
  typed content-object model.

# PINNED. `remote_theme: just-the-docs/just-the-docs` with no ref downloads the
# theme's default-branch HEAD on every build -- confirmed in the CI log:
# "Remote Theme: Downloading https://codeload.github.com/just-the-docs/just-the-docs/zip/HEAD".
# An upstream commit could therefore turn this repo's docs build red with no
# commit of ours, and `docs/assets/js/docs-ui.js` MOVES the theme's own search
# markup into the action launcher -- it binds `.search`, `#search-input` and
# `.search-label` -- so an upstream rename degrades a shipped feature silently
# rather than loudly.
#
# v0.12.0 is the newest RELEASE at or below what the site is rendering today,
# established by fingerprinting the deployed CSS on `gh-pages` rather than by
# assuming: `assets/css/just-the-docs-dark.css` carries
# `outline-offset:-1px;text-wrap:balance`, and `text-wrap: balance` entered
# `_sass/navigation.scss` upstream in 2e1f449 (2026-08-01), after v0.12.0 and
# in no release. So the live theme is upstream `main`, 61 commits past v0.12.0.
# Restricted to the directories that reach rendered output -- `_sass`,
# `_includes`, `_layouts`, `assets` -- v0.12.0..HEAD is exactly that one line.
#
# Moving this pin is NOT an edit somebody makes in passing. It is the
# `upstream-version-adoption` process (`processes/sdlc/upstream-version-adoption.bpmn`,
# skill `skills/sdlc/sdlc-core/upstream-version-adoption.md`): detect, impact
# analysis, MVP on a staging branch, review, and a PERSON decides. Bump this
# literal only as the output of that process.
#
# THIS LINE IS THE ONLY COPY OF THE VERSION. `upstream-pins.json` declares the
# tenant -- the upstream repo, what of ours binds it, what its MVP runs -- and
# points `bun run check:upstream-pins` back HERE to read the ref. A registry
# carrying its own copy would be a second answer to "what are we running",
# free to disagree with the build.
remote_theme: just-the-docs/just-the-docs@v0.12.0

# Site lives under /folio-assistant/ on litlfred.github.io.
baseurl: "/folio-assistant"
url: "https://litlfred.github.io"

# just-the-docs options
search_enabled: true
heading_anchors: true
color_scheme: dark

# Enable Mermaid diagrams in pages (workflow diagrams in the guides).
mermaid:
  version: "10.9.0"

# NO `aux_links`, deliberately.
#
# just-the-docs draws them as text at the top right of the MAIN panel, which
# is where the words "GitHub" sat above every page. The owner asked for that
# gone -- "remove the github.com from the top of the display" (bean `udx8`) --
# and for the forge to be reachable as an icon instead. It is: the Source tile
# in the header's action launcher, beside the JSON-LD and knowledge-graph
# tiles.
#
# The tile does NOT read this key any more either. `aux_links` was doing two
# jobs -- displaying a link, and recording where the repository is -- and only
# the second was wanted. The repository URL is now resolved from the git
# remote by `scripts/sync-docs-harness.ts` into `docs/_data/harness.json`,
# alongside the knowledge-graph and JSON-LD targets, so there is one answer to
# "where is this instance published" rather than one per consumer. Putting a
# link back here would restore the header text this removed.

footer_content: >-
  folio-assistant — code under the Apache License 2.0, documentation under
  CC BY 3.0. Generated schema and API references are rebuilt from source on
  every push to main.

# The TypeDoc API reference is generated HTML; let it pass through untouched
# rather than being processed as Jekyll pages.
keep_files:
  - api

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - folio-assistant-migration.md
  - qou-migration-checklist.md
  - sage-mcp.md
  # Content-addressed payloads (bean `f233`) are copied into the site VERBATIM
  # by docs-site.yml / feature-staging.yml after the build. A skill body
  # carries front matter and `{{ }}`, so Jekyll would render it as a page and
  # the bytes served would no longer hash to their name.
  - payload
  # Directory READMEs that `readme:subgraphs` writes into a declared directory
  # with NO index page of its own (#2094). They are for someone browsing the
  # repository, not site pages: under the github-pages gem set,
  # `jekyll-readme-index` publishes such a README as the directory's
  # `index.html` through a path with no GFM tables, and `check:escaped-markup`
  # fails on the pipes. A directory that has an `index.md` is unaffected. Find
  # new cases with: every tracked README.md under docs/ whose directory holds
  # no index.md or index.html.
  - assets/img/uml/overview/README.md
  - cat-harness/auto-docs/lsi/README.md

plugins:
  - jekyll-remote-theme

# THE PAGES LIST, GROUPED BY THE DOCS GRAPH'S NAMED SUB-GRAPHS — owner,
# 2026-10-05 (bean `xka5`): "group cat-harness docs semantically and make named
# doc subgraphs", no hand-kept categories. A page's group is its FOLDER: each
# entry below sets `parent` for one folder, so a page dropped into `start/` is
# in "Start here" with nothing else to edit. A group's own landing page sets
# `parent: ""` to stay top-level (a null would NOT override the default:
# Jekyll keeps the old value when the new one is nil). Order within a level is the reader's
# locale collation, applied by docs-ui.js (`sortNavByLocale`).
defaults:
  - scope:
      path: "start"
    values:
      parent: "Start here"
  - scope:
      path: "concepts"
    values:
      parent: "Concepts"
  - scope:
      path: "guides"
    values:
      parent: "Authoring guides"
  - scope:
      path: "process"
    values:
      parent: "Process & methodology"
  - scope:
      path: "methodologies"
    values:
      parent: "Process & methodology"
  - scope:
      path: "fhir"
    values:
      parent: "FHIR"
  - scope:
      path: "glossary"
    values:
      parent: "Reference"
  - scope:
      path: "external-schemas"
    values:
      parent: "Reference"
  - scope:
      path: "tools"
    values:
      parent: "Reference"
  - scope:
      path: "subscriptions"
    values:
      parent: "Reference"
  - scope:
      path: "themes"
    values:
      parent: "Reference"
  - scope:
      path: "lsi"
    values:
      parent: "Reference"
  - scope:
      path: "reference"
    values:
      parent: "Reference"
  - scope:
      path: "uml"
    values:
      parent: "Reference"
  - scope:
      path: "cat-harness/published-graphs.md"
    values:
      parent: "Reference"
  - scope:
      path: "prov-qaqc"
    values:
      parent: "Quality"
  - scope:
      path: "fsh-guts"
    values:
      parent: "Quality"
  - scope:
      path: "proposals"
    values:
      parent: "Proposals"
  - scope:
      path: "requirements"
    values:
      parent: "Requirements"
  - scope:
      path: "research-and-analysis"
    values:
      parent: "Research and analysis"
