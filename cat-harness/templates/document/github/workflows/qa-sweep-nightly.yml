# QA-sweep nightly — keeps this folio's QA sidecars current
#
# Written by `folio_init` from the platform's template
# (cat-harness/templates/document/github/workflows/qa-sweep-nightly.yml).
#
# Why this exists
# ────────────────
# A verdict is keyed on its block's content hash, so an edit that fixes a
# finding leaves the old verdict STALE until the sweep runs again. Without a
# periodic re-sweep, stale fails accumulate and the open-fail count reports
# problems that merged pull requests already fixed. In the folio this
# template came from, most open fails were stale by the time anyone looked,
# and one post-merge re-sweep cleared nearly all of them.
#
# Triggers
# ────────
#   workflow_dispatch — manual run, and the only trigger as written.
#   To run it nightly, uncomment the `schedule` below (04:30 UTC, off-peak).
#   It is off by default so a scaffolded folio spends no Actions minutes
#   until its author chooses to.
#
# Steps
# ─────
#   1. Check out main with full history, and the platform.
#   2. Set up bun + install the platform's dependencies.
#   3. Run the platform's qa-sweep over `{{folio}}/` for each non-proof
#      axis (canonical / one-voice / q-usage / compute / detangler). The
#      proof axis needs a Lean toolchain and is left to the Lean workflows.
#   4. If any `*.qa.json` changed: create branch
#      `auto/qa-sweep-nightly-<run id>`, commit, push, open the rolling PR.
#   5. If nothing changed: exit cleanly, no commit, no PR.
#
# What the workflow NEVER does
# ────────────────────────────
# - Never pushes to `main` directly.
# - Never modifies content blocks (.md / .ts / .lean).
# - Only touches `*.qa.json` sidecars.

name: QA sweep nightly

on:
  # schedule:
  #   - cron: "30 4 * * *"
  workflow_dispatch:
    inputs:
      axes:
        description: "Comma-separated axes to sweep (default: canonical,one-voice,q-usage,compute,detangler)"
        required: false
        default: "canonical,one-voice,q-usage,compute,detangler"

permissions:
  contents: write       # branch + commit + push
  pull-requests: write  # open / update the rolling PR

jobs:
  qa-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          submodules: recursive

      - name: Check out the platform if the folio does not carry it
        run: |
          if [ ! -f "{{assistant}}/bun.lock" ]; then
            git clone --depth 1 "{{platform_git}}" "{{assistant}}"
          fi

      - name: Set up bun
        uses: oven-sh/setup-bun@v2

      - name: Install the platform's dependencies
        run: |
          cd "{{assistant}}"
          bun install --frozen-lockfile

      - name: Run QA sweep across non-proof axes
        env:
          AXES: ${{ github.event.inputs.axes || 'canonical,one-voice,q-usage,compute,detangler' }}
        run: |
          set -e
          IFS=',' read -ra AXIS_LIST <<< "$AXES"
          for axis in "${AXIS_LIST[@]}"; do
            axis_trim="$(echo "$axis" | xargs)"
            echo "::group::axis $axis_trim"
            bun run "{{assistant}}/cat-harness/content/pipeline/qa-sweep.ts" "{{folio}}" --axis "$axis_trim" --ci
            echo "::endgroup::"
          done

      # Only sidecars count. A platform submodule shows in `git status` as one
      # path, never as the files inside it, so the pathspec cannot match it.
      - name: Detect changes
        id: changes
        run: |
          changed=$(git status --porcelain -- '*.qa.json' 2>/dev/null | wc -l)
          echo "count=$changed" >> "$GITHUB_OUTPUT"
          if [ "$changed" -eq 0 ]; then
            echo "No sidecar changes — exiting cleanly."
          else
            echo "$changed sidecar entries changed."
          fi

      - name: Branch + commit + push
        if: steps.changes.outputs.count != '0'
        id: push
        env:
          BRANCH: auto/qa-sweep-nightly-${{ github.run_id }}
        run: |
          set -e
          git config user.name "qa-sweep-bot"
          git config user.email "qa-sweep-bot@users.noreply.github.com"

          # Use a run-id-stamped branch so concurrent / repeat runs
          # don't collide. The PR step below dedupes via head-branch
          # lookup so the rolling PR cycles through these branches
          # cleanly.
          git checkout -B "$BRANCH"
          git add -- '*.qa.json' 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "(post-stage diff is clean; nothing to commit)"
            echo "branch=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "qa-sweep: nightly refresh ($(date -u +%Y-%m-%d))"
          git push -u origin "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Open (or surface existing) PR
        if: steps.push.outputs.branch != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.push.outputs.branch }}
        run: |
          set -e
          # Close any prior open nightly PRs so we only ever have one
          # active at a time (the rolling-PR convention).
          prior=$(gh pr list \
            --search 'head:auto/qa-sweep-nightly is:open' \
            --json number,headRefName --jq \
            '.[] | select(.headRefName != "'"$BRANCH"'") | .number')
          for pr in $prior; do
            echo "Closing prior nightly PR #$pr"
            gh pr close "$pr" --comment "Superseded by today's nightly sweep on \`$BRANCH\`."
          done

          # Write the PR body to a temp file. Using --body-file avoids
          # YAML multi-line escaping inside the run: | block.
          BODY_FILE=$(mktemp)
          cat > "$BODY_FILE" <<'PRBODY_EOF'
          Automated nightly QA-sweep refresh.

          Refreshes `*.qa.json` sidecars for the non-proof axes (canonical / one-voice / q-usage / compute / detangler). The proof axis needs a Lean toolchain and is run by the Lean workflows.

          If this PR has zero new fail signals (just metadata churn), it's safe to rebase-merge. If new fails surfaced, triage the offending blocks before merging.

          This PR is auto-generated by `.github/workflows/qa-sweep-nightly.yml`. Any prior open nightly PR was closed in favor of this one.
          PRBODY_EOF

          # Open today's PR (or no-op if already open from a same-day rerun)
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "qa-sweep: nightly refresh ($(date -u +%Y-%m-%d))" \
            --body-file "$BODY_FILE" \
            || echo "(PR already exists for $BRANCH — no-op)"

          rm -f "$BODY_FILE"
