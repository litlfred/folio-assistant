# LeanBlueprint — Build, validate declarations, and deploy to GitHub Pages,
# for every Lean package in this paper folio.
#
# Written by `folio_init` for PAPER folios, from the platform's template
# (cat-harness/templates/paper/github/workflows/blueprint.yml).
#
# Names no paper: a `discover` job finds every `{{folio}}/<paper>/lean/`
# holding a lakefile, and the blueprint is built once per package.
#
# Uses the canonical leanblueprint + docgen-action pipeline:
#   1. Build the Lean package (leanprover/lean-action)
#   2. Compile the blueprint (plasTeX → HTML + PDF)
#   3. Generate doc-gen4 interactive documentation
#   4. Validate \lean{} declaration names (lake exe checkdecls)
#   5. Deploy to the gh-pages branch, one directory per paper
#
# Published artifacts (gh-pages branch):
#   /<paper>/blueprint/         Interactive dependency graph with proof status
#   /<paper>/blueprint.pdf      Print version of the blueprint
#   /<paper>/docs/              doc-gen4 API documentation
#   /<paper>/axiom-report.txt   Verification report
#
# Deployment note:
#   docgen-action's built-in deploy uses actions/deploy-pages (artifact-based),
#   which conflicts with branch-based gh-pages deployment. We set
#   deploy: false and use peaceiris/actions-gh-pages to push the built output
#   to the gh-pages branch instead. Deploy runs only on a push to `main`.
#
# References:
#   - https://github.com/PatrickMassot/leanblueprint
#   - https://github.com/leanprover-community/docgen-action
#   - https://github.com/leanprover/lean-action

name: Blueprint

on:
  workflow_dispatch:
    inputs:
      ref:
        description: >
          Branch, tag, or commit SHA to build the blueprint from.
          Leave blank to use the ref selected in the GitHub UI's
          "Use workflow from" dropdown.
        required: false
        default: ''
        type: string

concurrency:
  group: blueprint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write
  pull-requests: write
  packages: read          # required to pull the paper-assistant container image

jobs:
  discover:
    name: Discover Lean packages
    runs-on: ubuntu-latest
    outputs:
      papers: ${{ steps.find.outputs.papers }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Find every Lake package under the content root
        id: find
        run: |
          papers=()
          for d in "{{folio}}"/*/lean; do
            if [ -f "$d/lakefile.toml" ] || [ -f "$d/lakefile.lean" ]; then
              papers+=("$(basename "$(dirname "$d")")")
            fi
          done
          if [ ${#papers[@]} -eq 0 ]; then
            echo "::error::no {{folio}}/<paper>/lean/ Lake package (lakefile.toml or lakefile.lean) found — nothing to build."
            exit 1
          fi
          echo "papers=$(printf '%s\n' "${papers[@]}" | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"
          echo "lean packages: ${papers[*]}"

  build_blueprint:
    runs-on: ubuntu-latest
    name: Build ${{ matrix.paper }} & blueprint
    needs: discover
    strategy:
      fail-fast: false
      matrix:
        paper: ${{ fromJSON(needs.discover.outputs.papers) }}
    # The platform's paper-assistant image: TeX Live (full), Lean 4, Bun,
    # pandoc, ripgrep, Python.
    container:
      image: ghcr.io/{{platform_repo}}/paper-assistant:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      PAPER: ${{ matrix.paper }}
      FOLIO_PAPER: ${{ matrix.paper }}
      FOLIO_BUILD_DIR: build/${{ matrix.paper }}
      FOLIO_MANIFEST: build/${{ matrix.paper }}/proof-objects.json

    steps:
      # ── Free disk space (mathlib + doc-gen4 need ~10 GB) ─────────
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: false
          android: true
          dotnet: false
          haskell: false
          large-packages: false
          docker-images: false
          swap-storage: false

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.ref }}
          submodules: recursive

      # ── Pre-build: content pipeline + extraction ──────────────────
      - name: Configure environment
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          echo "PYTHONPATH=$GITHUB_WORKSPACE/.github/scripts" >> "$GITHUB_ENV"

      - name: Check out the platform if the folio does not carry it
        run: |
          if [ ! -f "{{assistant}}/bun.lock" ]; then
            git clone --depth 1 "{{platform_git}}" "{{assistant}}"
          fi

      - name: Install the platform's dependencies
        run: |
          cd "{{assistant}}"
          bun install --frozen-lockfile

      - name: Build content objects to LaTeX chapters
        continue-on-error: true
        run: |
          bun run "{{assistant}}/cat-harness/content/pipeline/build.ts" \
            "{{folio}}/$PAPER/$PAPER.ts" \
            --out-dir "$FOLIO_BUILD_DIR/chapters" \
            --generate-main \
            --main-out "$FOLIO_BUILD_DIR/main.tex"
          echo "Generated chapters:"
          ls -la "$FOLIO_BUILD_DIR"/chapters/*.tex 2>/dev/null || echo "  (none)"

      - name: Extract proof objects from LaTeX
        continue-on-error: true
        run: python3 .github/scripts/extract_proof_objects.py

      # ── Build Lean package ───────────────────────────────────────
      - name: Cache Lean build artifacts
        uses: actions/cache@v4
        with:
          path: "{{folio}}/${{ matrix.paper }}/lean/.lake"
          key: lean-ci-${{ runner.os }}-${{ matrix.paper }}-${{ hashFiles(format('{{folio}}/{0}/lean/lean-toolchain', matrix.paper), format('{{folio}}/{0}/lean/lakefile.*', matrix.paper), format('{{folio}}/{0}/lean/lake-manifest.json', matrix.paper)) }}
          restore-keys: |
            lean-ci-${{ runner.os }}-${{ matrix.paper }}-

      - name: Build and lint Lean package
        id: lean_build
        uses: leanprover/lean-action@v1
        with:
          build: true
          lint: false
          lake-package-directory: "{{folio}}/${{ matrix.paper }}/lean"
        continue-on-error: true

      # ── Build blueprint + doc-gen4 (no deploy) ─────────────────
      # docgen-action builds blueprint HTML, blueprint PDF, and doc-gen4
      # API docs into the homepage directory. We disable its built-in
      # deploy and handle deployment ourselves below.
      - name: Compile blueprint and documentation
        id: docgen
        uses: leanprover-community/docgen-action@main
        with:
          blueprint: true
          deploy: false
          homepage: home_page
          lake-package-directory: "{{folio}}/${{ matrix.paper }}/lean"
          references: references.bib
        continue-on-error: true

      # ── Post-build: generate axiom report ────────────────────────
      - name: Generate axiom report
        run: |
          mkdir -p "$FOLIO_BUILD_DIR"
          touch "$FOLIO_BUILD_DIR/build.log"
          python3 .github/scripts/axiom_report.py \
            --build-log "$FOLIO_BUILD_DIR/build.log" \
            --output "$FOLIO_BUILD_DIR/axiom-report.txt"
        continue-on-error: true

      # ── Collect output for deployment ───────────────────────────
      # docgen-action places its output in home_page/_site/ (Jekyll)
      # or directly in home_page/ (blueprint/, blueprint.pdf, docs/).
      # We assemble everything into _deploy/<paper>/ for gh-pages.
      - name: Assemble deployment directory
        run: |
          out="_deploy/$PAPER"
          mkdir -p "$out"

          # 1. If Jekyll built a _site, use that as the base
          if [ -d home_page/_site ]; then
            echo "Found Jekyll _site output"
            cp -r home_page/_site/* "$out/"
          fi

          # 2. Blueprint HTML (interactive dependency graph)
          if [ -d home_page/blueprint ]; then
            echo "Found blueprint HTML output"
            cp -r home_page/blueprint "$out/blueprint"
          fi

          # 3. Blueprint PDF
          if [ -f home_page/blueprint.pdf ]; then
            echo "Found blueprint PDF"
            cp home_page/blueprint.pdf "$out/blueprint.pdf"
          fi

          # 4. doc-gen4 API docs
          if [ -d home_page/docs ] && [ ! -d "$out/docs" ]; then
            echo "Found doc-gen4 output"
            cp -r home_page/docs "$out/docs"
          fi

          # 5. Axiom report and proof-object manifest
          for f in axiom-report.txt proof-objects.json; do
            [ -f "$FOLIO_BUILD_DIR/$f" ] && cp "$FOLIO_BUILD_DIR/$f" "$out/"
          done

          echo "── Deployment contents ──"
          find _deploy -type f | sort | head -50
          echo "Total files: $(find _deploy -type f | wc -l)"

      # ── Upload deploy artifacts for the deploy job ──────────────
      - name: Upload deploy artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: blueprint-deploy-${{ matrix.paper }}
          path: _deploy
          retention-days: 1

  deploy:
    name: Deploy to gh-pages
    runs-on: ubuntu-latest
    needs: [build_blueprint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # One queue for every job that pushes gh-pages: a concurrency group
    # matches on the literal string, so every such job must name this one.
    concurrency:
      group: gh-pages-push
      cancel-in-progress: false
    steps:
      - name: Download deploy artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: blueprint-deploy-*
          path: _deploy
          merge-multiple: true

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_deploy
          publish_branch: gh-pages
          destination_dir: ''
          keep_files: true
          commit_message: >
            docs: deploy blueprint and docs from ${{ github.sha }}
