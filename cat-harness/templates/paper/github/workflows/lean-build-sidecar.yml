# Lean build sidecar — run the (slow) Lean build ONLINE and commit a
# machine-readable failure sidecar back to the branch.
#
# Written by `folio_init` for PAPER folios, from the platform's template
# (cat-harness/templates/paper/github/workflows/lean-build-sidecar.yml).
#
# Why
# ───
# Lean builds are slow and verbose. Instead of building locally and
# pasting terminal output, this workflow builds every Lean package in CI
# and commits `build-logs/lean-build-status.json` (per-package pass/fail,
# failing modules, extracted file:line:col errors + sorry locations) back to
# the branch. An agent reads that sidecar straight from the branch.
#
# How
# ───
#   discover  — every `{{folio}}/<paper>/lean/` holding a lakefile; none is
#               an error, not an empty green run.
#   build     — one job per package: restore its cache, `lake build`, and
#               upload the log plus one status row.
#   sidecar   — gathers every package's log and row, runs the platform's
#               sidecar generator (scripts/lib/lean-build-sidecar.py) and
#               commits the JSON. Runs even when a build failed: capturing
#               the failure is the whole point.
#
# The raw `<paper>.log` files are large and are not committed; only the
# JSON is.
#
# Loop prevention: the commit message carries `[skip ci]`.
#
# Triggers: `workflow_dispatch` only as written.

name: Lean build sidecar

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch/ref to build (blank = the selected ref)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

# Only one sidecar build per branch at a time; a newer run supersedes.
concurrency:
  group: lean-build-sidecar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    name: Discover Lean packages
    runs-on: ubuntu-latest
    outputs:
      papers: ${{ steps.find.outputs.papers }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Find every Lake package under the content root
        id: find
        run: |
          papers=()
          for d in "{{folio}}"/*/lean; do
            if [ -f "$d/lakefile.toml" ] || [ -f "$d/lakefile.lean" ]; then
              papers+=("$(basename "$(dirname "$d")")")
            fi
          done
          if [ ${#papers[@]} -eq 0 ]; then
            echo "::error::no {{folio}}/<paper>/lean/ Lake package (lakefile.toml or lakefile.lean) found — nothing to build."
            exit 1
          fi
          echo "papers=$(printf '%s\n' "${papers[@]}" | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"
          echo "lean packages: ${papers[*]}"

  build:
    name: Build ${{ matrix.paper }}
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        paper: ${{ fromJSON(needs.discover.outputs.papers) }}
    env:
      PAPER: ${{ matrix.paper }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          submodules: recursive

      # The cache action's Tier 2 is the platform's lake-cache.sh.
      - name: Check out the platform if the folio does not carry it
        run: |
          if [ ! -f "{{assistant}}/bun.lock" ]; then
            git clone --depth 1 "{{platform_git}}" "{{assistant}}"
          fi

      - name: Install Lean via elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # Whichever of the package's manifest files exist — the cache key is
      # a hash of them, and the action refuses a file that is not there.
      - name: List the package's manifest files
        id: pkg
        run: |
          d="{{folio}}/$PAPER/lean"
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          {
            echo "files<<$EOF"
            for f in lean-toolchain lakefile.toml lakefile.lean lake-manifest.json; do
              [ -f "$d/$f" ] && echo "$d/$f"
            done
            echo "$EOF"
          } >> "$GITHUB_OUTPUT"

      # Hybrid 3-tier .lake cache, scoped to this package.
      - name: Restore Lean cache
        uses: ./.github/actions/lake-cache-restore
        with:
          package: ${{ matrix.paper }}
          lake-root: "{{folio}}/${{ matrix.paper }}/lean"
          toolchain-file: "{{folio}}/${{ matrix.paper }}/lean/lean-toolchain"
          manifest-files: ${{ steps.pkg.outputs.files }}

      # The build's exit status becomes a ROW, not the job's status, so a
      # failing build still reaches the sidecar job with its log.
      - name: Build + record status
        run: |
          mkdir -p build-logs
          cd "{{folio}}/$PAPER/lean"
          start=$(date +%s)
          if lake build 2>&1 | tee "$GITHUB_WORKSPACE/build-logs/$PAPER.log"; then
            status=ok
          else
            status=fail
          fi
          elapsed=$(( $(date +%s) - start ))
          printf '%s\t%s\t%s\t%s\t%s\n' "$PAPER" "(default)" "$status" "$elapsed" "$PAPER.log" \
            > "$GITHUB_WORKSPACE/build-logs/$PAPER.status.tsv"
          echo "$PAPER: $status (${elapsed}s)"

      - name: Upload log + status row
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-log-${{ matrix.paper }}
          path: |
            build-logs/${{ matrix.paper }}.log
            build-logs/${{ matrix.paper }}.status.tsv
          retention-days: 7

  sidecar:
    name: Generate + commit sidecar
    needs: build
    if: always() && needs.build.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          submodules: recursive

      - name: Check out the platform if the folio does not carry it
        run: |
          if [ ! -f "{{assistant}}/bun.lock" ]; then
            git clone --depth 1 "{{platform_git}}" "{{assistant}}"
          fi

      - name: Gather every package's log
        uses: actions/download-artifact@v4
        with:
          pattern: lean-log-*
          path: build-logs
          merge-multiple: true

      - name: Generate sidecar
        run: |
          cat build-logs/*.status.tsv > build-logs/_status.tsv
          python3 "{{assistant}}/cat-harness/scripts/lib/lean-build-sidecar.py" build-logs

      - name: Commit + push sidecar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain -- build-logs/lean-build-status.json)" ]; then
            echo "Sidecar unchanged — nothing to commit."
            exit 0
          fi
          git add build-logs/lean-build-status.json
          git commit -m "build: lean-build sidecar [skip ci]" -- build-logs/lean-build-status.json
          # The branch may have advanced while CI ran; rebase our single
          # sidecar commit on top, then push.
          git pull --rebase --autostash origin "$GITHUB_REF_NAME" || true
          git push origin "HEAD:$GITHUB_REF_NAME" || echo "::warning::sidecar push failed (branch moved during build)"
