# Publish this layer's subgraph index files for each pushed commit, as a
# package attached to the release `subgraph-index-<sha>` (bean `mo75` G2b;
# owner, 2026-10-24, option A: published per pin in a package, never committed
# and never generated at mount). A hydrated mount of a pin of this repository
# reads `index.hydrated.jsonld` from it, since `docs/subgraph/` is built at
# publish and no commit carries it. Everything is decided in the reusable
# workflow; the contract is `skills/kg/kg-core/remote-mount.md` §"Hydrated:
# the index files are published per pin, in a package".
name: Publish subgraph index package
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    uses: litlfred/cat-harness-tools/.github/workflows/layer-publish-subgraph-index.yml@main
