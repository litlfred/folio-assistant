# A translation review filed as a GitHub issue becomes the recorded
# adjudication, as a pull request (owner, 2026-11-14). The review is filed
# from the translation review page (review.html beside the translation
# status page): catalogues a person found acceptable, and mistranslations
# with suggested text. The issue's author is the reviewer; only owners,
# members and collaborators are recorded. The logic is the harness's,
# called here:
# https://github.com/litlfred/cat-harness-tools/blob/main/.github/workflows/layer-translation-adjudication.yml
name: Translation adjudication

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  adjudicate:
    uses: litlfred/cat-harness-tools/.github/workflows/layer-translation-adjudication.yml@71c795eba5ece6c958c24a54e5817087cb69eb39 # main, with https://github.com/litlfred/cat-harness-tools/pull/2140
    with:
      path-in-repo: .
      # The script at the same commit as the workflow.
      tools-ref: 71c795eba5ece6c958c24a54e5817087cb69eb39
