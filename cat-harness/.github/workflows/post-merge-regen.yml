# Derived-artefact regeneration, BY HAND — bean `folio-assistant-ey1c`.
#
# Owner, 2026-11-06: options "1 3", then "full runs only on manual trigger OR
# release build". A run composes and regenerates the whole folio-assistant
# index, 50-80 minutes of runner time, so nothing here starts one on a
# pull_request, push or schedule event. The only automatic full regen is the
# release build's (`release-npm.yml`, which regenerates into the package it
# publishes and fails rather than publish stale output).
#
# Dispatch it (Actions -> this workflow -> Run workflow, or
# `gh workflow run post-merge-regen.yml -f pr=<number or branch>`):
#
#   - with `pr` set: regenerate THAT PR at its head and, when a tracked file
#     changed, commit ONE "chore(derived): regenerate derived artefacts for
#     <sha>" to the PR's own branch. Only for a PR whose branch is in this
#     repository; a fork's PR is failed with the command to run. A head that
#     is itself a regen commit and still regenerates fails (no fixpoint).
#     With the `REGEN_PUSH_TOKEN` secret (a token with contents: write here)
#     the push starts the PR's checks; without it the push uses GITHUB_TOKEN,
#     which starts none, and the run comments on the PR and fails saying so.
#     The PR's checks then judge the commit, so the regen reaches main through
#     the normal, tested merge.
#   - with `pr` empty, on main: verify and WARN. Regenerate in the runner, say
#     what was stale (a warning and the step summary), and commit, push or
#     open NOTHING.
#
# The `automation/post-merge-regen-*` repair branches and PRs are gone: they
# piled up with no CI once Actions could no longer open PRs here. The hourly
# tick that dispatched a regen whenever main moved is gone with them (it was a
# full run started automatically).
#
# Honest reporting stays: a check with no writer, or whose writer fails, is a
# red run (exit 1), never claimed as current.
#
# Since the split (bean 70lx) `post-merge:regen` is a cat-harness-tools script
# that runs in the composed folio-assistant index, not in this repository on
# its own. The job is the harness's reusable `layer-post-merge-regen.yml`,
# which composes the index with the commit in place and regenerates (owner,
# 2026-10-15: "a"). Branch and staging previews never call it (owner,
# 2026-11-06: "preview builds not required regen").

name: Regen derived artefacts (manual)

on:
  workflow_dispatch:
    inputs:
      pr:
        description: "The PR to regenerate and commit to (its number or head branch). Empty: verify main and warn."
        type: string
        default: ""
      dry_run:
        description: "Dry run (audit only, run no writer, commit nothing)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    if: ${{ inputs.pr == '' }}
    permissions:
      contents: read
    uses: litlfred/cat-harness-tools/.github/workflows/layer-post-merge-regen.yml@main
    with:
      mode: verify
      dry-run: ${{ inputs.dry_run == true }}

  regen-pr:
    if: ${{ inputs.pr != '' }}
    permissions:
      contents: write
      pull-requests: write
    uses: litlfred/cat-harness-tools/.github/workflows/layer-post-merge-regen.yml@main
    with:
      mode: pr
      pr: ${{ inputs.pr }}
      dry-run: ${{ inputs.dry_run == true }}
    secrets:
      regen-push-token: ${{ secrets.REGEN_PUSH_TOKEN }}
