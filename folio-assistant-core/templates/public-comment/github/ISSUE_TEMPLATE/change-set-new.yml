name: New change-set
description: Group public comments that one change to the document would answer. The dashboard's "New change-set from the selected comments" opens this with the comments filled in.
labels: ["change-set"]
body:
  - type: markdown
    attributes:
      value: |
        Only the review committee and the editor can create a change-set. From anyone else this issue is kept as discussion, and the comments it names are linked to the change-sets they are already in.
  - type: input
    id: cs_title
    attributes:
      label: Title
      description: The change, in a few words, as an instruction.
      placeholder: Define "actor" once and use it throughout
    validations:
      required: true
  - type: input
    id: comments
    attributes:
      label: Comments
      description: The public comments it answers.
      placeholder: PC-0042, PC-0107
    validations:
      required: true
  - type: textarea
    id: requirements
    attributes:
      label: Requirements
      description: What the text must do once changed. Not the new text itself; that is the pull request's job.
