name: Discuss a change-set
description: Talk about one proposed change to the document. The public-comment dashboard's Discuss link opens this with the change-set filled in.
labels: ["change-set"]
body:
  - type: markdown
    attributes:
      value: |
        A **change-set** is one change to the document that answers a group of public comments.
        This issue is where people agree what the change should do. The pull request that closes it is where the change is previewed, reviewed and approved.

        Leave the change-set id as it is. After you submit, the change-set's record is written at the top of this issue, and kept up to date there.
  - type: input
    id: cs
    attributes:
      label: Change-set
      description: Its id. The dashboard fills it in.
      placeholder: CS-012
    validations:
      required: true
  - type: textarea
    id: discussion
    attributes:
      label: Discussion
      description: What should the change do? Anything you write here is discussion; nothing in it is a decision.
