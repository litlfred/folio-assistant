name: Recommend or decide on public comments
description: Record a committee recommendation, or the editor's decision, on comments or on a whole change-set.
body:
  - type: markdown
    attributes:
      value: |
        A **recommendation** comes from the review committee (the repository's collaborators). A **decision** comes from the editor (the repository's owner). From anyone else this is kept as discussion and records nothing.

        You can do the same in a comment on any issue, with the lines `pc: PC-0042` and `decide: accepted`, then the reason.
  - type: input
    id: comments
    attributes:
      label: Comments
      description: Comment refs, a change-set id, or both.
      placeholder: PC-0042, PC-0107 or CS-012
    validations:
      required: true
  - type: dropdown
    id: verb
    attributes:
      label: Recommend or decide
      options:
        - Recommend
        - Decide
    validations:
      required: true
  - type: dropdown
    id: code
    attributes:
      label: Decision
      options:
        - accepted
        - accepted-modified
        - not-accepted
        - noted
        - deferred
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Reason
      description: Needed for every code but accepted, because the commenter is owed one.
