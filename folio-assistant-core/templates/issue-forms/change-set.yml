# The change-set request form for a folio under review. Copy it to the
# folio's .github/ISSUE_TEMPLATE/change-set.yml. People make change sets
# (owner, 2026-11-02, Q-CS-1 C): a row on the review sheet's Review Change
# Sets, or this form. The log watcher reads the fields by id
# (tools/review-log-watch/cs-requests.ts, `fromIssue`): keep them.
name: Change set
description: Ask for a new change set, or to split, merge or move comments between change sets.
title: "Change set: "
labels: ["change-set"]
body:
  - type: markdown
    attributes:
      value: |
        A change set groups related comments into one pull request. The agent adds the row to the review sheet and proposes a direction there; an Editor still sets Ready for agent before anything is edited.
  - type: dropdown
    id: kind
    attributes:
      label: What do you need?
      options:
        - New change set
        - Split a change set
        - Merge change sets
        - Move comments to another change set
    validations:
      required: true
  - type: input
    id: title
    attributes:
      label: Title
      description: A short name for the new change set (for a split, one per line in Details).
    validations:
      required: true
  - type: input
    id: change-sets
    attributes:
      label: Change sets
      description: The change sets this is about, e.g. CS-002, CS-005. Leave empty for a new one.
  - type: input
    id: comments
    attributes:
      label: Comments
      description: The comment numbers that belong in it, e.g. No. 126, 131, 326.
  - type: input
    id: committee
    attributes:
      label: Committee (TWG)
      description: The working group that should own it, if you know.
  - type: textarea
    id: details
    attributes:
      label: Details
      description: Why, and for a split which comments go where.
