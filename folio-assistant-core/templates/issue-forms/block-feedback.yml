# The shared feedback form for a folio's document site. Copy it to the
# folio's .github/ISSUE_TEMPLATE/block-feedback.yml: the site build then
# points every 📣 feedback link at it and prefills the fields whose ids it
# knows (content, block, section, source, url). The ids are read by
# cat-harness-tools src/core/edit-links.ts and parsed back by
# folio-assistant-core tools/review-sheet-sync/feedback-issue.ts: keep them.
name: Feedback on the document
description: Comment on one block of the working document. Opened from a 📣 feedback link on the site.
title: "Feedback: "
labels: ["feedback"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you. The first five fields come from the link you clicked; leave them as they are. Editors gather feedback into change sets in the contributor log, and this issue tracks yours.
  - type: input
    id: content
    attributes:
      label: Content
  - type: input
    id: section
    attributes:
      label: Section
  - type: input
    id: block
    attributes:
      label: Block
  - type: input
    id: url
    attributes:
      label: On the site
  - type: input
    id: source
    attributes:
      label: Source
  - type: dropdown
    id: type
    attributes:
      label: Type
      options:
        - General
        - Technical
        - Editorial
    validations:
      required: true
  - type: textarea
    id: comment
    attributes:
      label: Comment
      description: What should change, and why.
    validations:
      required: true
  - type: textarea
    id: proposed
    attributes:
      label: Proposed change
      description: Optional. New wording, or what the text should do.
