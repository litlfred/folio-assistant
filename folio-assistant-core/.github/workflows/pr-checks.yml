# folio-assistant-core's checks on every pull request (owner, 2026-10-14: every
# harnessed layer is judged by ONE reusable workflow the harness owns, and
# "there shouldnt be copying of code"). Everything is decided there.
name: PR checks
on:
  pull_request:
    # Draft PRs run only the fast tier (bean dft1, cat-harness-tools#616);
    # ready_for_review re-runs the full tier the moment a PR is marked ready.
    types: [opened, synchronize, reopened, ready_for_review]
  # main's own run keeps main's answer, the gate seconds and the cone records
  # in caches every PR can read (cat-harness-tools#406, #411); a run on a PR
  # can only read caches saved from its own PR or from main.
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    uses: litlfred/cat-harness-tools/.github/workflows/layer-pr-checks.yml@f35a491d1943fcc54f3dc520d9f1dad3479f36a0 # main
    with:
      # On a draft PR: prepare and typecheck only; the full tier runs on ready_for_review.
      draft-fast-tier: true
      # Five gate shards a side, not the default four (2026-11-01). The gates
      # are split by each shard's expected wall time (cat-harness-tools#1213),
      # so two shards hold the two ~500 s gates and three share the rest. The
      # 8-shard trial (run 41287467368) gave the same ~510 s slowest shard, but
      # its 16 jobs waited up to 17 min for runners.
      gate-shards: 5
      # A PR that touches only the review-sheet tool runs only its tests,
      # about 2 minutes instead of ~30 (owner 2026-10-31, Q-CI1 A).
      quick-paths: >-
        tools/review-sheet-sync/
        skills/content/folio-document-adapter/review-sheet-script.md
      quick-test: tools/review-sheet-sync
  # Post-merge QA of main (owner, 2026-10-30, "Both"): the push run above
  # judged main's whole gate set; this keeps one `main-red` issue open while
  # main is red and closes it when main is green. See
  # https://github.com/litlfred/cat-harness-tools/blob/main/.github/workflows/layer-main-qa.yml
  main-qa:
    needs: checks
    if: ${{ !cancelled() && github.event_name == 'push' }}
    permissions:
      contents: read
      issues: write
      actions: read
    uses: litlfred/cat-harness-tools/.github/workflows/layer-main-qa.yml@f35a491d1943fcc54f3dc520d9f1dad3479f36a0 # main
    with:
      verdict: ${{ needs.checks.outputs.main-verdict }}
      failures: ${{ needs.checks.outputs.main-failures }}
      checks-result: ${{ needs.checks.result }}
