name: Public comment record

# A review's record moves here, from GitHub (folio-assistant issue #2183;
# skill `public-comment`, process `public-comment.bpmn`), as ONE reusable
# workflow. smart-ra's public review (review/public-comment) and dth-hrh's
# working-group review (review/wg-comment) ran byte-identical copies that
# differed only in the store path; that path is now the `store` input.
#
#   a comment anywhere      `pc: PC-0042` / `cs: CS-012` / nothing, then
#                           `recommend: …` (committee) or `decide: …` (editor):
#                           recorded. In a change-set's issue a bare verb means
#                           that change-set.
#   cs-add / cs-remove / cs-title / cs-requirements / cs-merge / cs-split /
#   cs-close / cs-new       change a change-set's record (committee, editor)
#   a mention               of CS-012 or PC-0042, in any issue: linked to it
#   a PR with Closes #N     the change-set's accepted comments: editing, and
#                           incorporated when it merges
#
# The editor is the repository's owner and the committee its collaborators; an
# `editors` or `committee` list in <store>/config.json overrides either.
#
# The caller decides when it runs (smart-ra and dth-hrh: dispatch only, owner
# 2026-10-06) and passes the event through unchanged:
#
#   jobs:
#     record:
#       uses: litlfred/folio-assistant-core/.github/workflows/public-comment.yml@main
#       with:
#         store: review/wg-comment
#         label: wg comment

# Kept HERE, in folio-assistant-core, because it drives this layer's own
# public-comment-changesets.ts: the tools layer below may not name the content
# core (check:reference-direction). Moved from cat-harness-tools (#1038).

on:
  workflow_call:
    inputs:
      store:
        description: "The record's directory in the calling repository."
        type: string
        default: review/public-comment
      label:
        description: "How the record's commits name it ('public comment', 'wg comment')."
        type: string
        default: public comment

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

concurrency:
  # One record update at a time, never cancelled half-way.
  group: comment-record-${{ github.repository }}-${{ inputs.store }}
  cancel-in-progress: false

jobs:
  record:
    # `contains` is case-insensitive: 'pc-' also matches PC-0042, 'cs-' CS-012.
    if: >-
      github.event.sender.type != 'Bot' && (
      (github.event_name == 'issue_comment' && (contains(github.event.comment.body, 'pc-') || contains(github.event.comment.body, 'cs-') || contains(github.event.comment.body, 'cs:') || contains(github.event.comment.body, 'decide:') || contains(github.event.comment.body, 'recommend:'))) ||
      (github.event_name == 'issues' && (github.event.action == 'closed' || github.event.action == 'reopened' || contains(github.event.issue.body, 'pc-') || contains(github.event.issue.body, 'cs-') || contains(github.event.issue.body, 'decide:') || contains(github.event.issue.body, 'recommend:'))) ||
      (github.event_name == 'pull_request_target' && (contains(github.event.pull_request.body, '#') || contains(github.event.pull_request.body, 'cs-'))))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: litlfred/cat-harness-tools/.github/actions/mount-layers@45b0894620099663f17abb584f376502d702422a # main

      - name: Record the event, and bring the issues into line
        # The event's text is untrusted. The tool reads it from the event FILE,
        # never from this shell, and answers on the thread itself.
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STORE: ${{ inputs.store }}
        run: bun run folio-assistant-core/scripts/public-comment-changesets.ts github --store "$STORE" --event "$GITHUB_EVENT_PATH"

      - name: Commit the record
        env:
          ACTOR: ${{ github.actor }}
          URL: ${{ github.event.comment.html_url || github.event.issue.html_url || github.event.pull_request.html_url }}
          EVENT: ${{ github.event_name }}
          STORE: ${{ inputs.store }}
          LABEL: ${{ inputs.label }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          if git diff --quiet -- "$STORE" && [ -z "$(git ls-files --others --exclude-standard "$STORE")" ]; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$STORE"
          git commit -m "$LABEL: record $EVENT by $ACTOR" -m "$URL"
          for attempt in 1 2 3 4; do
            git push origin HEAD && break
            git pull --rebase origin "$BASE"
          done

      # No republish step: the site is built and published by an agent (or
      # folio-site-publish.yml by hand), never by this workflow (bean n3h9).
