# DTH ingest workplan issue form. Copy to .github/ISSUE_TEMPLATE/dth-workplan.yml
# in each litlfred/dth-* fork. Skill: smart-base dth-l1-to-l2-ingest.
name: DTH workplan
description: The workplan for turning a WHO handbook (L1) into an L2 DTH on smart-ra. BPMN, roles and DMN sections are required.
title: "Workplan: <handbook short name>"
labels: ["workplan"]
body:
  - type: markdown
    attributes:
      value: |
        Follows the smart-base skill `dth-l1-to-l2-ingest`. Quote the source verbatim with its page. Thresholds in decision tables come only from the source text.
  - type: textarea
    id: source
    attributes:
      label: 1. Source
      description: IRIS item, ISBN, edition, who-iris library entry, and anything missing from it.
    validations:
      required: true
  - type: textarea
    id: split
    attributes:
      label: 2. Repo vs smart-ra split
      description: What goes in this repo, what goes in smart-ra, what needs smart-base.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: 3. Dependencies
      description: Other DTHs this one mounts (for example dth-pc mounts dth-sc).
  - type: textarea
    id: glossary
    attributes:
      label: 4. Glossary
      description: The source's own glossary terms, and every conflict with smart-ra (raised as a smart-ra issue).
    validations:
      required: true
  - type: textarea
    id: archimate
    attributes:
      label: 5. ArchiMate
      description: Elements and views needed, existing or new, named with the source's terms.
  - type: textarea
    id: bpmn
    attributes:
      label: 6. Business processes as BPMN
      description: One diagram per business process, ids <HB>-BP-nn, each lane naming a role from section 7. Only as deep as the handbook goes.
    validations:
      required: true
  - type: textarea
    id: roles
    attributes:
      label: 7. Roles as structured entries
      description: Persona or actor-definition per role, ids <HB>-R-nn, linked to BPMN lanes, a smart-ra ArchiMate role and a glossary term.
    validations:
      required: true
  - type: textarea
    id: dmn
    attributes:
      label: 8. Decision tables as DMN
      description: Only tables the handbook states, ids <HB>-DT-nn, each citing its source passage. Write "none found" if there are none.
    validations:
      required: true
  - type: textarea
    id: gaps
    attributes:
      label: 9. Schema gaps
      description: Fixed-shape content no kind holds yet. Proposals for architect group and handbook owner review, not approved work.
