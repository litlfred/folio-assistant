# Scenario mapping: the 22 recommendation candidates of the Digital transformation handbook for health
# product catalogue (WHO, 2025; ISBN 978-92-4-011619-1) against the handbook's own roles. Skill
# recommendation-extraction, Part 2. AUTHORED by an agent; no entry carries a `review`, so every link
# stays `candidate`.
#   persona  dth-npc-vocabulary.json (the handbook's roles) -> smart-base generic DAK.Persona.* -> a
#            glossary `candidate` (the NRA and the governance group are bodies no role list holds);
#   process  could-not-determine throughout: the handbook prints no process ids and no health-system
#            process catalogue exists (bean 2ipj). No process is invented;
#   domain   health-system-strengthening throughout.
$schema: l1-scenario-mapping/v1
guide: dth-health-product-catalogue
