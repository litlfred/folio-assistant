name: Folio section-title audit

# The section-title and structure audit, as ONE reusable workflow.
#
#   - MACHINE review — titles and structure: a hard gate.
#   - AGENT review — story-coherence verdicts are judgements, so they live on
#     the default branch in the attestations store
#     (test/attestations/section-title/<document>/section-title-audit.attestations.json).
#
# COMPUTE AND JUDGE (bean 5qy8). Nothing derived is committed, so there is no
# freshness gate: the run computes the derived copy under test/results/ from
# the live manifests and the stored verdicts, and exits 2 (could not
# determine, never green) when the verdict store cannot be read. Open and
# stale slots are reported as a worklist.
#
#   jobs:
#     audit:
#       uses: litlfred/cat-harness-tools/.github/workflows/folio-section-title-audit.yml@main

on:
  workflow_call:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: litlfred/cat-harness-tools/.github/actions/mount-layers@1257da8bbbb8e661391d08b014b16464de19613f # last change to .github/actions/mount-layers
      - name: Machine review — titles + structure (hard gate)
        run: bun run "$FA_TOOLS/pipeline/qa-section-title-audit.ts"
      - name: Compute the derived copy and judge the verdict store
        run: bun run "$FA_TOOLS/pipeline/qa-section-title-audit.ts" --report-only --write-sidecar --thorough
