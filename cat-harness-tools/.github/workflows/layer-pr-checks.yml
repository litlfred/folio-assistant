# The pull-request checks every harnessed layer runs, as ONE reusable workflow.
#
# Owner, 2026-10-14 ("1"): a layer is judged on its own pull requests by one
# workflow the harness owns, called from each layer, rather than a copy per
# layer. Until then only four of the eleven layers had pull-request CI. The
# other seven, this layer's own harness among them, were judged by nothing
# until folio-assistant re-pinned them:
# the 2026-10-06 "defined, not run on events" ruling for the WHO forks
# switched their harness gates off with their IG builds, and the
# initialization process never installed any pull-request checks.
#
# Generalised from the content core's `pr-checks.yml` (14ed7ad), whose
# layout is this repository's `pr-tests.yml`: check out the folio-assistant
# index, mount every instance from its `index.lock.json`, take the lower
# layers at main, and put THE CALLER (at the ref under test) in place of its
# locked mount. Three judgements:
#   - Typecheck, on the PR, when the instance carries a tsconfig.json.
#   - Tests (no new failures): the instance's tests on main and on the PR;
#     fails only on a test the PR newly breaks.
#   - Gates (no new failures): the harness's graph checks over the own
#     instance, and every `check:*` / `*:check` script of the own instance
#     AND its whole dependency harness, its transitive `needs` (owner,
#     2026-10-14: "A harnessed repo should run not just core but all of the
#     checks in the dependency harness"), on main and on the PR; fails only
#     on a gate the PR newly breaks (`run-gates.py`).
#   - Among those gates, in layer mode: the INDEX's own gates over the
#     composed root, the caller swapped in (owner, 2026-10-23, item 2:
#     a layer PR merges only on a green index run with it pinned). The index
#     lints and typechecks every mounted instance, which no gate of the
#     caller's harness did, so a PR could pass here and turn the index red
#     when pinned (cat-harness-tools#385). Which gates is data,
#     `.github/scripts/layer-pr-checks/root-gates.json`; they are judged
#     error by error, so a gate already red on main still fails the PR that
#     adds an error to it (`run-root-gates.py`, `compare-gates.py`).
#   - The INDEX's gates that read every mounted layer (`index-gates.json`:
#     `check:reference-direction:check`, `check:prov-qaqc` and the
#     generated-file `--check`s) are among the declared gates of EVERY
#     caller, the layers below cat-harness-tools included, and every declared
#     gate is judged error by error (`gate_diagnostics.py`), so one already
#     red on main still fails the PR that adds a finding to it. Each of these
#     passed a layer's own PR and broke the index at re-pin:
#     a content layer's PR and cat-harness-tools#1445 (a wrong-direction doc
#     comment, against a gate red on main for other reasons).
#   - Tests, in layer mode: the other instances' test files that name the
#     caller run with its own (`reader-tests.py`, input `reader-tests`), on
#     both sides (two content layers' PRs broke cat-harness-tools'
#     standalone-fixture and navbar-checkout tests this way).
# And one report that never blocks: the caller's directory READMEs, stale or
# current, as a QA warning (owner, 2026-10-16: "QA report, but not gate").
#
# Two modes, because a harnessed repository is one of two shapes:
#   - `layer`: a layer the folio-assistant index mounts (cat-harness, a base
#     harness, ...). The index is checked out and the caller swapped in.
#   - `index`: a repository that is its own index (an IG repository over a
#     base harness, smart-ra, a folio): the caller IS the root, mounted from its
#     own `index.lock.json`, and its own instance is the one it declares at
#     its root, or, when it declares none, every instance it mounts.
# A gate or test already red on main is listed in the step summary, never
# hidden and never counted against the PR.
#
# How a run is laid out (cat-harness-tools#397). A trial run (38866215814)
# took 87 minutes: its shards waited 33-52 minutes for runners, every one of
# eight shards rebuilt its side for 6-10 minutes, main's cached answer never
# matched, and the gates were split by count, not by time. Now:
#   prepare-head, prepare-base  start at once. Each pins the run (one time,
#       shared through the cache), mounts its side and builds it ONCE, then
#       hands its shards what it built. prepare-head also typechecks.
#       prepare-base stops early when main's answer is cached, keyed by what
#       that answer is computed from. Both stop early when a layer PR changes
#       only its own `index.lock.json` / `index.config.json`, which these
#       checks never read.
#   run     `gate-shards` jobs a side (head only when main is cached), split by
#       the seconds the last run recorded.
#   compare joins the shards and judges, as before, and keeps main's answer
#       and the gate seconds for the next run.
#
# Main's STORED answer (owner, 2026-10-23: "build should be in seconds/minutes,
# not tens of minutes"). The exact key above almost never matches on a PR: it
# holds the tips of the branch-kept graphs and the lower layers' mains, which
# move every few minutes, so no layer PR in the 2026-10-23 sample
# hit it in the 2026-10-23 sample, and every PR ran prepare-base and four base
# shards, about half its runner minutes, to recompute main. So on a PR's first
# attempt, when the exact key misses, the answer a run on the caller's main
# saved FOR THE PR'S OWN BASE is used instead: the merge commit's first
# parent, which is `git merge-base origin/main HEAD` of the tree under test.
# A push to main saves it, as before. The PR is then judged against it and its
# base side is not run; the step summary says which main it is and how old.
# Never an EARLIER main's answer (cat-harness-tools#926): the head is the PR
# merged into the current main, so an earlier main's answer charged every
# failure main took on since to the PR, and read main's fixes as already red.
# No answer for the PR's base: the base side is computed, by this run.
# Re-running ALL jobs (a second attempt) recomputes main exactly, as before.
# `reuse-stored-main: false` turns the reuse off.
#
# Main's answer, once found, is RESTORED by prepare-base and handed to
# compare as a run artifact (cat-harness-tools#926). It used to be only looked
# up there and restored by compare, after the head shards, with
# `fail-on-cache-miss`; on https://github.com/litlfred/smart-base/pull/216 (run 41064407930) that was two hours
# later, the entry had been evicted, and the gate failed without judging
# anything. An artifact lives as long as the run. Should the restore or the
# hand-off fail, prepare-base computes main's side itself, as on a miss.
#
# The CI cone (bean `4rbc`, cat-harness-tools#398). On a PR, a declared gate
# whose read set, recorded by a green traced run on the caller's main, is
# unchanged on a side is not run there, and is reported "SKIPPED — inputs
# unchanged since <sha>", never as passed (`run-gates.py` GATE_CONE=skip). The
# records are made by a PUSH to the caller's main, which runs the base side
# only, under `strace` (GATE_CONE=record), and judges nothing: it keeps main's
# answer, the gate seconds and the records. A GitHub cache saved by a PR is
# visible to that PR alone, and one saved on the default branch to every PR,
# so only a push can make records the PRs share. A caller without the `push`
# trigger records nothing, and every gate runs as before.
#
# Pinned to main's record (owner, 2026-10-23, approved on a card at 18:31Z).
# The records above were made against the index, the lower layers and the
# branch-kept graphs as main's push pinned them. A PR pinned them NOW, so
# every gate that reads a lower layer or a graph that moved since read
# "changed" and ran (a content layer's job 120514169054: 3 of 70 gates skipped). So
# on a PR's first attempt the run takes those pins from the newest record a
# push kept, the record's pin time for the index and the lower layers and its
# graph tips, when that record is at most `record-pin-max-hours` old. Only
# the PR's own changes then differ from what main's gates read, and those are
# the gates that run. The judging scripts are still resolved now. Both sides
# use the same pins, so the comparison stays like for like. What it costs: a
# PR is judged against the lower layers as of main's last push, not their
# tip; a change that reached them since is judged by the caller's next push
# to main. Re-running all jobs (a second attempt) pins everything now, as
# before; no record, or one too old: as before.
#
# A caller is the one `uses:` line and nothing else (owner, 2026-10-14:
# "there shouldnt be copying of code"):
#
#   on: { pull_request: {}, push: { branches: [main] }, workflow_dispatch: {} }
#   permissions: { contents: read }
#   jobs:
#     checks:
#       uses: litlfred/cat-harness-tools/.github/workflows/layer-pr-checks.yml@main
#
# `@main` above and below stands for the commit the caller's index.lock.json
# pins: `bun run cat workflow-pins` writes it, `mount:remote` moves it with
# each re-pin, and `check:workflow-pins` fails on a branch (owner, 2026-11-01,
# security audit S1).
#
# Post-merge QA of main (owner, 2026-10-30, "Both"): a push to main runs
# main's whole gate set and tests (the base side, above), and keeps main's
# answer for the PRs based on that commit. It also says whether main ITSELF
# is green (`main-verdict.py`), as this workflow's `main-verdict` and
# `main-failures` outputs. A caller's second job hands them to
# `layer-main-qa.yml`, which keeps one `main-red` issue open while main is
# red and closes it when main is green (it needs `issues: write`, which this
# workflow does not ask for):
#
#   main-qa:
#     needs: checks
#     if: ${{ !cancelled() && github.event_name == 'push' }}
#     permissions: { contents: read, issues: write, actions: read }
#     uses: litlfred/cat-harness-tools/.github/workflows/layer-main-qa.yml@main
#     with:
#       verdict: ${{ needs.checks.outputs.main-verdict }}
#       failures: ${{ needs.checks.outputs.main-failures }}
#       checks-result: ${{ needs.checks.result }}
#
# A layer's root runs the gates of every layer below it as well, and many of
# those cannot apply there. A caller names the gates it judges in its own
# `.github/main-qa-gates.json`, `{"judged": ["<layer>:*", "graph:<layer>:*"]}`
# (fnmatch patterns): only those make main red. The others are listed in the
# run's summary, the red ones as not judged and the passing ones as gates to
# add. No file: every gate is judged (owner, 2026-10-31).
#
# Release-gated CI (owner, card Q-CIB-4 A, 2026-11-08: "CI not gate on
# non-release merge to main"; cat-harness#1158). Every pull request that does
# not carry the `release` label runs the FAST TIER only, draft or ready:
# prepare-head mounts the PR side and typechecks, without derive:publish or
# Chromium; prepare-base, the shards and the index's own gates are skipped;
# and `compare` passes or fails on the typecheck alone. Its verdict is
# reported as "Fast tier only (advisory; the full checks gate a release)",
# never as "No new failures (tests and gates)", and merge-guard's check 5
# treats CI on a non-release merge as advisory.
#
# A PR labelled `release` runs the full tier, as every ready PR did before.
#
# ADDING THE `release` LABEL STARTS THE FULL TIER, once the caller lists
# `labeled` in its `pull_request` types (owner, 2026-11-11, card B: every PR
# passes the full tier before merge). Without it the label starts nothing,
# and a re-run replays the original payload with the OLD labels. A `labeled`
# run for the `release` label is a full-tier run like any other and replaces
# a fast-tier run in flight. Any OTHER label (`ready-to-merge`, ...) is a
# no-op here: prepare-head, prepare-base and compare skip, so nothing is
# judged and no verdict is reported, and its concurrency group is its own
# (keyed by the run id), so it never cancels the PR's real run. A caller that
# adds `labeled` should also skip its `checks` job on such an event and key
# its OWN concurrency group the same way (a caller-level group keyed by
# `github.ref` with cancel-in-progress would still cancel the real run):
#
#   on:
#     pull_request:
#       types: [opened, synchronize, reopened, ready_for_review, labeled]
#   concurrency:
#     group: harness-pr-checks-${{ (github.event.action == 'labeled' && github.event.label.name != 'release') && format('noop-label-{0}', github.run_id) || github.ref }}
#     cancel-in-progress: ${{ github.event_name == 'pull_request' }}
#   jobs:
#     checks:
#       if: github.event.action != 'labeled' || github.event.label.name == 'release'
#
# An all-skipped run judges nothing; merge-guard's check 5 lets it never
# displace an earlier run of the same workflow on the head.
#
# Main's full suite runs on main's INTEGRATION run: a push to main, at most
# once per `integration-minutes` window (prepare-base). This replaces the
# 2026-10-23 "1y" draft rule (bean `dft1`); `draft-fast-tier` is kept as an
# input so callers that pass it still parse, and it no longer changes
# anything.
#
# Everything every caller would otherwise repeat is decided here: the instance
# is the calling repository's name, the folio-assistant ref is `index-ref`'s
# default, the judging scripts are at main, and one run per PR is kept
# (`concurrency`, below). A caller passes an input only when it genuinely
# differs from that: a base harness's `path-in-repo: <instance>` (its
# instance is a sub-directory), a `layers-at-main` the dependencies do not imply, or
# `with: { mode: index }` for a repository that is its own index.

name: Layer PR checks

on:
  workflow_call:
    inputs:
      mode:
        description: "'layer' (mounted by the folio-assistant index) or 'index' (the caller is its own index)."
        required: false
        type: string
        default: "layer"
      instance:
        description: "layer mode: the instance's directory in the folio-assistant index (its mount path); empty means the calling repository's name. index mode: optional."
        required: false
        type: string
        default: ""
      test-path:
        description: "What `bun test` runs, from the root; empty means the instance's directory (layer) or no tests (index)."
        required: false
        type: string
        default: ""
      reader-tests:
        description: "layer mode, with test-path empty: also run the test files of OTHER instances that name this one (`reader-tests.py`), at most this many; more, or 0, runs none of them. They used to run first in the index at re-pin."
        required: false
        type: number
        default: 150
      gate-jobs:
        description: "Gates run at once within one shard (the dependency harness is ~300 gates)."
        required: false
        type: number
        default: 4
      gate-shards:
        description: "Jobs each side's gates (and, in layer mode, its tests) are split across, each on its own machine and checkout (bean lpcs). 1 is one job per side."
        required: false
        type: number
        default: 4
      path-in-repo:
        description: "Where the instance sits in the calling repository; '.' for the repository root."
        required: false
        type: string
        default: "."
      layers-at-main:
        description: "Lower layers taken at main instead of the lock (the caller is never replaced). 'auto': the instance's @litlfred/* dependencies, which it imports by package name and whose main it tracks."
        required: false
        type: string
        default: "auto"
      state-graphs:
        description: "Branch-kept graphs to mount before tests and gates; each must come back mounted."
        required: false
        type: string
        default: "beans todos fsh-guts"
      index-ref:
        description: "layer mode: the folio-assistant ref to check out (main, or a re-pin branch while main's pins are behind)."
        required: false
        type: string
        # It was "claude/nifty-johnson-w3mspn" while folio-assistant main pinned
        # pre-70lx layers; folio-assistant#2529 merged on 2026-10-15.
        default: "main"
      tools-ref:
        description: "The cat-harness-tools ref whose judging scripts run (both sides use the same). `lock`: the commit the caller's index.lock.json pins (cat-harness-tools itself: its own commit)."
        required: false
        type: string
        default: "lock"
      reuse-stored-main:
        description: "On a PR's first attempt, when main's answer for these exact inputs is not cached, judge the PR against the answer a run on the caller's main stored for the PR's own base commit (its merge-base with main) instead of recomputing main (see the header). Off: the base side runs on every cache miss."
        required: false
        type: boolean
        default: true
      pin-to-main-record:
        description: "On a PR's first attempt, mount the index, the lower layers and the branch-kept graphs at the pins of the newest CI cone record a push to the caller's main kept, so only the PR's own changes defeat the cone (see the header). Off: everything is pinned now."
        required: false
        type: boolean
        default: true
      record-pin-max-hours:
        description: "The oldest record, in hours, whose pins a PR takes; an older one is ignored and everything is pinned now."
        required: false
        type: number
        default: 24
      draft-fast-tier:
        description: "Kept so callers that pass it still parse. Since release-gated CI (owner, card Q-CIB-4 A, 2026-11-08) every non-release PR runs the fast tier, draft or not, and this input changes nothing."
        required: false
        type: boolean
        default: false
      integration-minutes:
        description: "Release-gated CI (owner, card Q-CIB-4 A, 2026-11-08): a push to main runs the full suite (main's integration run) at most once per window of this many minutes. The first push in a window runs it; the rest of that window's pushes run nothing, and the next window's first push judges them. 0 runs it on every push."
        required: false
        type: number
        default: 60
      writer-record-hours:
        description: "How often, at most, a push to main re-records EVERY page-build writer under strace (bean fwtz). Every other push records incrementally (cat-harness-tools#1702): it restores the newest records, skips each writer whose recorded reads still match and keeps its record, and traces only the writers whose inputs moved. The full record takes 70-120 minutes; it bounds how long a carried record lives. 0 records fully on every push."
        required: false
        type: number
        default: 24
      writer-record-on-runners:
        description: "Record the page-build writers under strace on a runner after each push to main (layer mode). Off by default (cat-harness-tools#1702, measured 2026-11-09): every full record of cat-harness, fhir-harness and core was cancelled at the 120-minute limit with nothing saved, ~1,700 runner minutes a day, and a layer takes the lower layers at main, so each lower-layer merge moves every writer's code and forces a full record again. Records come from `writer-records-ref.ts publish` instead."
        required: false
        type: boolean
        default: false
      writer-skip:
        description: "Skip a derive:publish writer whose recorded reads are unchanged, putting back what it wrote (bean fwtz). A push to the caller's main records each writer under strace; a PR restores the newest record and skips. Off: every writer runs."
        required: false
        type: boolean
        default: true
      quick-paths:
        description: "Path prefixes in the calling repository, space-separated (a directory ends in `/`). A PR whose every changed file starts with one of them takes the quick lane: the PR side is mounted, installed and typechecked, `quick-test` runs, and nothing else (no main side, no shards, no derive:publish, no gates). Empty: no quick lane."
        required: false
        type: string
        default: ""
      quick-test:
        description: "What `bun test` runs in the quick lane, relative to the instance's directory (run from the root as `./<instance>/<quick-test>`, as the shards run tests). Required when quick-paths is set."
        required: false
        type: string
        default: ""
    # Post-merge QA (owner, 2026-10-30, "Both"): on a push to main, whether
    # main ITSELF is green, for the caller's `layer-main-qa.yml` job, which
    # opens, updates or closes the one `main-red` issue. Empty on a PR.
    outputs:
      main-verdict:
        description: "A push to main only: green, red or unknown, main's own tests and gates (main-verdict.py)."
        value: ${{ jobs.compare.outputs.main-verdict }}
      main-failures:
        description: "A push to main only: what is red on main, as one line of JSON."
        value: ${{ jobs.compare.outputs.main-failures }}

permissions:
  contents: read

# One run per PR (or ref), the newest. The group is this workflow's own, so it
# never collides with a group a caller may still declare. Only a PR's runs
# cancel each other (owner, 2026-10-30, "Both"): a push to main is never
# cancelled by the next one, because each main's run stores the answer that
# the PRs based on THAT commit are judged against (cat-harness-tools#930). A
# run of a PR that is closed or merged is cancelled by the `closed` event,
# here for a caller that triggers on it, and for every workflow on the head
# branch by `layer-cancel-on-close.yml`.
# A PR's runs are keyed by the PR's number, never by `github.ref`: on a
# `closed` event GitHub sets the ref to the BASE branch, so a merged PR's
# closing run joined main's group and, being a pull_request run, cancelled
# main's running push run and the new one (a downstream layer's run 41395643928,
# "higher priority waiting request"). pr-tests.yml is keyed the same way.
# A push run is keyed by its commit as well: even with cancel-in-progress off,
# GitHub keeps only ONE pending run per group and cancels the older pending
# one, so three quick merges cancelled the middle main run (fhir-harness run
# 42917495047, 2026-11-10) and mailed "Some jobs were not successful".
# A `labeled` run for any label but `release` is a no-op, in a group of its
# own: in the PR's group it would cancel the PR's real run.
concurrency:
  group: layer-pr-checks-${{ github.repository }}-${{ (github.event.action == 'labeled' && github.event.label.name != 'release') && format('noop-label-{0}', github.run_id) || github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.ref, github.event_name == 'push' && github.sha || 'run') }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The instance, once: the input when given, else (layer mode) the calling
# repository's name, which is the instance's name for every layer.
env:
  # The GitHub owner of the harness layers (folio-assistant, cat-harness-tools,
  # and the @litlfred/* code layers). Callers may live under any owner.
  HARNESS_OWNER: litlfred
  INSTANCE: ${{ inputs.instance != '' && inputs.instance || (inputs.mode == 'layer' && github.event.repository.name || '') }}

jobs:
  # Each side is prepared ONCE, by its own job, and handed to its shards
  # (cat-harness-tools#397): mount, lower layers at main, the caller swapped
  # in, the graphs kept on branches, the IG pages and `derive:publish`. Every
  # shard used to repeat all of it, 6-10 minutes each, eight times a run
  # (trial run 38866215814: 67 of 200 work-minutes).
  prepare-head:
    name: Prepare the PR side (and typecheck)
    # A push to main has no PR side: it records main's side (the CI cone).
    # Not when `ready-reuse` found this PR already judged on these inputs.
    # Nor on a no-op `labeled` event (any label but `release`).
    needs: [ready-reuse]
    if: ${{ !cancelled() && needs.ready-reuse.outputs.reuse != 'true' && github.event.action != 'closed' && (github.event.action != 'labeled' || github.event.label.name == 'release') && github.event_name != 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SIDE: head
    outputs:
      at: ${{ steps.pins.outputs.at }}
      layers-at: ${{ steps.pins.outputs.layers-at }}
      index: ${{ steps.pins.outputs.index }}
      tools: ${{ steps.pins.outputs.tools }}
      shards: ${{ steps.shards.outputs.list }}
      skip: ${{ steps.lock-only.outputs.skip }}
      quick: ${{ steps.quick.outputs.quick }}
      quick-test: ${{ steps.quick-test.outcome }}
      typecheck: ${{ steps.tsc.outcome }}
    steps:
      # The shard matrix, [1..gate-shards], once, so `run` and `compare` agree
      # on it. A value that is not a whole number from 1 to 16 stops the run
      # here rather than becoming an empty matrix, which would judge nothing.
      - &shards
        id: shards
        env:
          N: ${{ inputs.gate-shards }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$N" | grep -Eq '^([1-9]|1[0-6])$'; then
            echo "::error::gate-shards is '$N'; it must be a whole number from 1 to 16"
            exit 2
          fi
          list="$(seq -s, 1 "$N")"
          echo "gate shards: $N ([${list}])"
          echo "list=[${list}]" >> "$GITHUB_OUTPUT"
      # Owner, 2026-11-01 (security audit S1, Q-SEC-4 "B"): a caller pins this
      # workflow to the cat-harness-tools commit its own index.lock.json names
      # (`bun run cat workflow-pins`), and the judging scripts follow the same
      # pin, so nothing here runs code from a branch tip. `tools-ref: lock` (the
      # default) reads that pin from the caller's index.lock.json at the commit
      # under test; cat-harness-tools itself judges its own commit. Any other
      # value is used as given (a branch is resolved at the pin time below).
      - &tools-lock
        name: The cat-harness-tools commit the caller pins
        id: tools-lock
        env:
          GH_TOKEN: ${{ github.token }}
          WANT: ${{ inputs.tools-ref }}
          INDEX_REF: ${{ inputs.index-ref }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ "$WANT" != "lock" ]; then ref="$WANT"
          elif [ "$GITHUB_REPOSITORY" = "${HARNESS_OWNER}/cat-harness-tools" ]; then ref="$SHA"
          else
            lock() { curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github.raw+json" \
              "$GITHUB_API_URL/repos/$1/contents/index.lock.json?ref=$2"; }
            # A layer the index mounts but which keeps no
            # lock of its own judges with the commit the folio-assistant
            # index pins, which is still a pin and not a branch tip.
            if body="$(lock "$GITHUB_REPOSITORY" "$SHA")"; then from="$GITHUB_REPOSITORY index.lock.json at $SHA"
            else body="$(lock ${HARNESS_OWNER}/folio-assistant "$INDEX_REF")"; from="${HARNESS_OWNER}/folio-assistant index.lock.json at $INDEX_REF"; fi
            ref="$(printf '%s' "$body" | python3 -Ic 'import json,sys; print(next((m["ref"] for m in json.load(sys.stdin).get("mounts", []) if m.get("harness") == "cat-harness-tools"), ""))')"
            # A layer below cat-harness-tools (cat-harness) keeps a lock that
            # cannot mount it: same fall-back, to the index's pin.
            if [ -z "$ref" ] && [[ "$from" != ${HARNESS_OWNER}/folio-assistant* ]]; then
              body="$(lock ${HARNESS_OWNER}/folio-assistant "$INDEX_REF")"; from="${HARNESS_OWNER}/folio-assistant index.lock.json at $INDEX_REF ($GITHUB_REPOSITORY's lock mounts no cat-harness-tools)"
              ref="$(printf '%s' "$body" | python3 -Ic 'import json,sys; print(next((m["ref"] for m in json.load(sys.stdin).get("mounts", []) if m.get("harness") == "cat-harness-tools"), ""))')"
            fi
            [ -n "$ref" ] || { echo "::error::$from pins no cat-harness-tools: mount it, or pass tools-ref"; exit 2; }
          fi
          echo "judging scripts: cat-harness-tools $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - &judging-scripts
        name: The judging scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ env.HARNESS_OWNER }}/cat-harness-tools
          ref: ${{ steps.tools-lock.outputs.ref }}
          path: ci
          sparse-checkout: |
            .github/scripts/layer-pr-checks
            .github/scripts/playwright-chromium
      # One pin time per run attempt, shared by every job through the cache
      # (cat-harness-tools#397). It replaces the `pin` job, which cost the run
      # a second wait for a runner before anything else could start (5 min on
      # trial run 38866215814, 33 min on run 38869216177). The first job
      # to get here writes the time; a job that finds it reads it. Every ref
      # this run follows (the index, the lower layers at main, the judging
      # scripts) is then resolved as of that time, by `resolve-at.sh`, so both
      # sides judge the same commits however far apart their jobs start. A
      # re-run is a new attempt and so a new time: it judges main as it is.
      - &pin-restore
        id: pin-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/pin
          key: layer-pr-checks-pin-${{ github.run_id }}-${{ github.run_attempt }}
      # The newest CI cone record a push to main kept, for its pins (the
      # header's "Pinned to main's record"). The same restore as the shards'.
      - &pin-record
        name: The pins of main's newest record (a PR's first attempt)
        if: >-
          steps.pin-restore.outputs.cache-hit != 'true' && github.event_name != 'push' &&
          inputs.pin-to-main-record && github.run_attempt == '1'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/cone
          key: layer-pr-checks-cone-v1-${{ github.repository }}-none-${{ github.run_id }}
          restore-keys: |
            layer-pr-checks-cone-v1-${{ github.repository }}-
      - &pin-write
        if: steps.pin-restore.outputs.cache-hit != 'true'
        env:
          MODE: ${{ inputs.mode }}
          MAX_HOURS: ${{ inputs.record-pin-max-hours }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pin"
          date -u +%Y-%m-%dT%H:%M:%SZ > "$RUNNER_TEMP/pin/at"
          # The tips of the graphs kept on branches (`cat/<instance>/<graph>`:
          # beans, todos, ...), read ONCE for the run, so both sides mount
          # each graph at the same commit (state-pin.sh). Read
          # live per side, they were minutes apart, and a bean pushed in
          # between was charged to the PR (the trial PR, run 38884159693).
          # A remote that cannot be read is left out, and mounts live.
          for repo in $([ "$MODE" = "layer" ] && echo ${HARNESS_OWNER}/folio-assistant) "$GITHUB_REPOSITORY"; do
            if tips="$(git ls-remote "https://github.com/${repo}.git" 'refs/heads/cat/*')"; then
              printf '%s\n' "$tips" > "$RUNNER_TEMP/pin/state-${repo//\//__}.tsv"
            fi
          done
          python3 - "$RUNNER_TEMP/pin" <<'PY'
          import json, pathlib, sys
          pin = pathlib.Path(sys.argv[1])
          out = {}
          for f in sorted(pin.glob("state-*.tsv")):
              repo = f.name[len("state-"):-len(".tsv")].replace("__", "/")
              tips = {}
              for line in f.read_text().splitlines():
                  if "\t" in line:
                      sha, ref = line.split("\t", 1)
                      tips[ref.removeprefix("refs/heads/")] = sha
              out[repo] = tips
              f.unlink()
          (pin / "state.json").write_text(json.dumps(out, sort_keys=True, indent=1) + "\n")
          PY
          # The index and the lower layers are resolved at `layers-at`: now,
          # or the pin time of main's newest record (restored above, PR only)
          # with its graph tips, when that record carries its pins and is
          # young enough. The judging scripts stay at `at`, now.
          cp "$RUNNER_TEMP/pin/at" "$RUNNER_TEMP/pin/layers-at"
          rec="$RUNNER_TEMP/cone/pin"
          if [ -s "$rec/layers-at" ] && [ -s "$rec/state.json" ] && [ -s "$rec/sha" ]; then
            then_s="$(date -u -d "$(cat "$rec/layers-at")" +%s 2>/dev/null || echo 0)"
            age=$(( ($(date -u +%s) - then_s) / 3600 ))
            if [ "$then_s" -gt 0 ] && [ "$age" -le "$MAX_HOURS" ]; then
              cp "$rec/layers-at" "$RUNNER_TEMP/pin/layers-at"
              cp "$rec/state.json" "$RUNNER_TEMP/pin/state.json"
              cp "$rec/sha" "$RUNNER_TEMP/pin/record"
              echo "pinned to main's record $(cat "$rec/sha") (index, lower layers and graphs as of $(cat "$rec/layers-at"), ${age} h ago)"
            else
              echo "main's newest record is ${age} h old, more than ${MAX_HOURS}: everything is pinned now"
            fi
          fi
      - &pin-save
        if: steps.pin-restore.outputs.cache-hit != 'true'
        continue-on-error: true  # the other side saved first: read its time below
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/pin
          key: layer-pr-checks-pin-${{ github.run_id }}-${{ github.run_attempt }}
      - &pin-reread
        if: steps.pin-restore.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/pin
          key: layer-pr-checks-pin-${{ github.run_id }}-${{ github.run_attempt }}
      - &pins
        name: Pin this run
        id: pins
        env:
          MODE: ${{ inputs.mode }}
          INDEX_REF: ${{ inputs.index-ref }}
          TOOLS_REF: ${{ steps.tools-lock.outputs.ref }}
        run: |
          set -euo pipefail
          at="$(cat "$RUNNER_TEMP/pin/at")"
          # The index and the lower layers: at main's record's pin time when
          # the pin step took it (the header), else at `at`. An older pin
          # cache of this run attempt has no layers-at: `at`.
          layers_at="$(cat "$RUNNER_TEMP/pin/layers-at" 2>/dev/null || echo "$at")"
          resolve=ci/.github/scripts/layer-pr-checks/resolve-at.sh
          index=""
          [ "$MODE" = "index" ] || index="$(bash "$resolve" ${HARNESS_OWNER}/folio-assistant "$INDEX_REF" "$layers_at")"
          tools="$(bash "$resolve" ${HARNESS_OWNER}/cat-harness-tools "$TOOLS_REF" "$at")"
          # The judging scripts at the pinned commit, not wherever the ref
          # moved since this job checked it out.
          git -C ci fetch -q --depth 1 origin "$tools"
          git -C ci checkout -q FETCH_HEAD
          echo "pinned at $at: index ${index:-the caller}, judging scripts $tools"
          if [ "$layers_at" != "$at" ]; then
            msg="Index, lower layers and branch-kept graphs pinned to main's CI cone record $(cat "$RUNNER_TEMP/pin/record" 2>/dev/null || echo '?') (as of $layers_at), so only this PR's own changes make a gate run again. Re-run all jobs to pin them now."
            echo "$msg"; echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          fi
          { echo "at=$at"; echo "layers-at=$layers_at"; echo "index=$index"; echo "tools=$tools"; } >> "$GITHUB_OUTPUT"
      # What this run judges, as the name of an artifact (`ready-reuse.py
      # key`), so a later `ready_for_review` on the same inputs can find it
      # without the log host. Full-tier PR runs only: a draft's run never
      # counts. Recording before the verdict is safe: `decide` also requires
      # this run's "No new failures" job to have succeeded.
      - &judged-key
        name: What this run judges (for a later ready-for-review)
        id: judged-key
        if: github.event_name == 'pull_request' && !(github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'release'))
        continue-on-error: true  # no record means no later reuse, never a red run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_SHA: ${{ github.sha }}
          INDEX: ${{ steps.pins.outputs.index }}
          TOOLS: ${{ steps.pins.outputs.tools }}
        run: |
          script=ci/.github/scripts/layer-pr-checks/ready-reuse.py
          if [ ! -f "$script" ]; then echo "judging scripts without ready-reuse.py: nothing recorded"; echo "key=" >> "$GITHUB_OUTPUT"; exit 0; fi
          STATE="$RUNNER_TEMP/pin/state.json" python3 -I "$script" key
      - name: Record what this run judges
        if: steps.judged-key.outputs.key != ''
        continue-on-error: true
        env:
          KEY: ${{ steps.judged-key.outputs.key }}
        run: |
          mkdir -p "$RUNNER_TEMP/judged"
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/judged/key"
      - if: steps.judged-key.outputs.key != ''
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ steps.judged-key.outputs.key }}
          path: ${{ runner.temp }}/judged
          retention-days: 7
          overwrite: true
      - &checkout-index
        name: Check out the root (the folio-assistant index, or the caller in index mode)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ inputs.mode == 'index' && github.repository || format('{0}/folio-assistant', env.HARNESS_OWNER) }}
          # Index mode: the PR's merge commit on both sides; the base side then
          # steps to its first parent (below). Never `pull_request.base.sha`:
          # it is the base as of the PR's last push, older than the main the
          # merge commit holds whenever main moved since, so head-vs-base would
          # charge main's own changes to the PR (seen on a layer PR on
          # 2026-10-22, where another of that layer's PRs landed between).
          # `github.ref`, never `''`: an expression's `a && '' || b` is `b`,
          # because `''` is falsy, so index mode checked out the caller's
          # `index-ref` default, `main`, and judged main against its own
          # first parent instead of the PR
          # (https://github.com/litlfred/smart-immunizations/pull/35, run
          # 38633852296: `-B main refs/remotes/origin/main`).
          # Layer mode: the one commit `index-ref` named at this run's pin
          # time (the "Pin this run" step), never the ref itself, so every
          # job of the run mounts the same pins.
          # A push (the CI cone's record run): the pushed commit itself.
          ref: ${{ inputs.mode == 'index' && (github.event_name == 'push' && github.sha || github.ref) || steps.pins.outputs.index }}
          fetch-depth: ${{ inputs.mode == 'index' && 2 || 1 }}
          path: fa
      - &base-root
        name: Base side of the root (index mode)
        id: base-root
        # Not on a push: the pushed commit IS main's side, and a merge
        # commit's first parent would be the main before it.
        if: inputs.mode == 'index' && env.SIDE == 'base' && github.event_name != 'push'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DIR: fa
        run: |
          # A PR's merge commit: its first parent is the main it merges into,
          # exactly. Anything else (workflow_dispatch): the default branch's tip.
          set -euo pipefail
          cd "$DIR"
          pr="$(git rev-parse HEAD)"
          if git rev-parse -q --verify 'HEAD^2' >/dev/null; then
            git checkout -q --detach 'HEAD^1'
          else
            git fetch -q --depth 1 origin "$DEFAULT_BRANCH"
            git checkout -q --detach FETCH_HEAD
          fi
          # The first harness PR (owner, 2026-11-01 09:22Z, smart-ips-pilgrimage#7):
          # main has no index.lock.json yet, because this PR adds it, so main
          # cannot be mounted. Main is then no baseline at all, and the PR is
          # judged against itself: it is green unless its own tests or gates
          # cannot run, and the summary says it set the first baseline.
          first=false
          if [ ! -f index.lock.json ]; then
            first=true
            git checkout -q --detach "$pr"
            echo "::notice::first harness PR: main has no index.lock.json, so main's side is this PR's own tree (it sets the first baseline)"
          fi
          echo "first-setup=$first" >> "$GITHUB_OUTPUT"
          git log -1 --format='base side: %h %s'
      - &setup-bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - &caller
        name: Check out the caller
        if: inputs.mode == 'layer'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: src
          fetch-depth: 2
      # Layer mode mounts the folio-assistant index's lock, never the
      # caller's own, so a PR that changes only the caller's pins
      # (`index.lock.json`, `index.config.json`) changes nothing these checks
      # read. It used to cost a full run that judged none of the moved pins
      # (cat-harness-tools#397); it is now reported as such and passes.
      - &lock-only
        name: Does this PR change only the caller's own pins?
        id: lock-only
        if: inputs.mode == 'layer'
        run: |
          set -euo pipefail
          skip=false
          if git -C src rev-parse -q --verify 'HEAD^2' >/dev/null; then
            changed="$(git -C src diff --name-only 'HEAD^1' HEAD)"
            # A here-string, not `printf | grep -q`: with pipefail, grep -q exiting early
            # SIGPIPEs printf on a long list, and the `!` read that as "pins only" (#661).
            if [ -n "$changed" ] && ! grep -Eqv '(^|/)index\.(lock|config)\.json$' <<<"$changed"; then
              skip=true
              echo "only the caller's own pins changed:"; echo "$changed"
            fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
      # The quick lane (bean qkln; owner 2026-10-31, Q-CI1 A): a PR that
      # touches only `quick-paths` runs only `quick-test`, about 2 minutes
      # instead of the full ~30. Never on a push: main always runs in full.
      - &quick
        name: Does this PR change only the quick-lane paths?
        id: quick
        if: inputs.mode == 'layer' && inputs.quick-paths != '' && github.event_name == 'pull_request'
        env:
          PATHS: ${{ inputs.quick-paths }}
          TEST: ${{ inputs.quick-test }}
        run: |
          set -euo pipefail
          quick=false
          if [ -z "$TEST" ]; then echo "::error::quick-paths is set but quick-test is empty"; exit 2; fi
          if git -C src rev-parse -q --verify 'HEAD^2' >/dev/null; then
            changed="$(git -C src diff --name-only 'HEAD^1' HEAD)"
            if [ -n "$changed" ]; then
              quick=true
              while IFS= read -r f; do
                hit=false
                for p in $PATHS; do case "$f" in "$p"*) hit=true; break;; esac; done
                if [ "$hit" != true ]; then quick=false; echo "not quick: $f is outside quick-paths"; break; fi
              done <<<"$changed"
            fi
            [ "$quick" = true ] && { echo "quick lane: every changed file is under: $PATHS"; echo "$changed"; }
          fi
          echo "quick=$quick" >> "$GITHUB_OUTPUT"
      - &caller-base
        name: Base side of the caller
        # Not on a push, for the same reason as the root's base side above.
        if: inputs.mode == 'layer' && env.SIDE == 'base' && github.event_name != 'push'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DIR: src
        run: |
          # A PR's merge commit: its first parent is the main it merges into,
          # exactly. Anything else (workflow_dispatch): the default branch's tip.
          set -euo pipefail
          cd "$DIR"
          if git rev-parse -q --verify 'HEAD^2' >/dev/null; then
            git checkout -q --detach 'HEAD^1'
          else
            git fetch -q --depth 1 origin "$DEFAULT_BRANCH"
            git checkout -q --detach FETCH_HEAD
          fi
          git log -1 --format='base side: %h %s'
      - name: Is there anything to prepare?
        id: skip-prep
        run: echo "hit=${{ steps.lock-only.outputs.skip == 'true' }}" >> "$GITHUB_OUTPUT"
      - name: Keep the caller's git checkout aside, for the README report
        # The swap below drops the caller's `.git`, and `subgraph-readmes.ts
        # --repo` lists only what git tracks.
        if: inputs.mode == 'layer' && steps.skip-prep.outputs.hit != 'true'
        run: cp -a src "$RUNNER_TEMP/own"
      - &mount-cache
        name: Cache remote mounts (bean cis1)
        if: steps.skip-prep.outputs.hit != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /home/runner/.cache/cat-mount
          key: cat-mount-v1-${{ hashFiles('fa/index.lock.json') }}
          restore-keys: |
            cat-mount-v1-
      - &mount
        # A root that carries its own replayer (folio-assistant's
        # `.github/mount-from-lock.sh`) is mounted with it: it knows which
        # layer held the replayer at the commit its lock pins. Otherwise the
        # replayer is `mount-from-lock.ts` at the commit the root's lock pins
        # (cat-harness-tools, or cat-harness before the code moved, bean
        # 70lx); it imports only node:*, so that one file is enough, as
        # the IRIS instance's checks.yml does.
        name: Mount every instance from the root's lock
        if: steps.skip-prep.outputs.hit != 'true'
        env:
          CAT_MOUNT_CACHE_DIR: /home/runner/.cache/cat-mount
        run: |
          set -euo pipefail
          if [ -f fa/.github/mount-from-lock.sh ]; then
            bash fa/.github/mount-from-lock.sh --root fa
            exit 0
          fi
          work="$(mktemp -d)"
          git -C "$work" init -q
          for layer in cat-harness-tools cat-harness; do
            read -r repo sha < <(bun -e '
              const l = JSON.parse(require("node:fs").readFileSync("fa/index.lock.json", "utf-8"));
              const i = (l.instances ?? []).find((x) => x.instance === process.argv[1]);
              console.log(i ? `${i.repository} ${i.sha}` : "- -");
            ' "$layer")
            [ "$repo" = "-" ] && continue
            git -C "$work" fetch -q --depth 1 --filter=blob:none "https://github.com/${repo}.git" "$sha"
            if git -C "$work" checkout -q FETCH_HEAD -- scripts/mount-from-lock.ts 2>/dev/null; then
              bun "$work/scripts/mount-from-lock.ts" --root fa
              exit 0
            fi
          done
          echo "::error::no mount-from-lock replayer at the cat-harness-tools or cat-harness commit fa/index.lock.json pins"
          exit 2
      - &mark
        name: Mark the mounted tree, to hand the shards what is built on top of it
        if: steps.skip-prep.outputs.hit != 'true'
        run: python3 ci/.github/scripts/layer-pr-checks/snapshot.py mark fa "$RUNNER_TEMP/mounted.txt"
      - &lower-layers-main
        name: Take the lower layers at main
        if: steps.skip-prep.outputs.hit != 'true'
        env:
          LAYERS: ${{ inputs.layers-at-main }}
          MODE: ${{ inputs.mode }}
          SUBDIR: ${{ inputs.path-in-repo }}
          PIN_AT: ${{ steps.pins.outputs.layers-at }}
        run: |
          set -euo pipefail
          if [ "$LAYERS" = "auto" ]; then
            # The PR's own package.json in layer mode: its imports are what
            # it is judged against, and the locked copy may predate them.
            pkg="fa/package.json"
            [ "$MODE" = "layer" ] && pkg="src/${SUBDIR:-.}/package.json"
            LAYERS="$(python3 - "$pkg" <<'PY'
          import json, sys
          try:
              p = json.load(open(sys.argv[1]))
          except FileNotFoundError:
              p = {}
          deps = {**p.get("dependencies", {}), **p.get("devDependencies", {}), **p.get("peerDependencies", {})}
          print(" ".join(sorted(d.split("/", 1)[1] for d in deps if d.startswith("@litlfred/"))))
          PY
          )"
            echo "lower layers at main (from @litlfred/* dependencies): ${LAYERS:-none}"
          fi
          # Each at the commit its main held at the run's pin time, so both
          # sides, and every shard after them, take the same lower layers.
          for r in $LAYERS; do
            [ "$r" = "$INSTANCE" ] && continue
            sha="$(bash ci/.github/scripts/layer-pr-checks/resolve-at.sh "${HARNESS_OWNER}/$r" main "$PIN_AT")"
            echo "$r at main: $sha"
            rm -rf "fa/$r"
            git init -q "fa/$r"
            git -C "fa/$r" fetch -q --depth 1 "https://github.com/${HARNESS_OWNER}/$r" "$sha"
            git -C "fa/$r" checkout -q FETCH_HEAD
            rm -rf "fa/$r/.git"
          done
      - &swap
        # A directory holding its own `.git` inside the index checkout is a
        # FOREIGN checkout to `instanceRootsIn`, so it would not be discovered
        # as an instance. Lock mounts carry no `.git`; the swapped-in copy is
        # made to look the same.
        name: Put the caller in place of its locked mount
        if: inputs.mode == 'layer' && steps.skip-prep.outputs.hit != 'true'
        env:
          SUBDIR: ${{ inputs.path-in-repo }}
        run: |
          set -euo pipefail
          rm -rf "fa/$INSTANCE"
          if [ "$SUBDIR" = "." ]; then mv src "fa/$INSTANCE"; else mv "src/$SUBDIR" "fa/$INSTANCE"; fi
          rm -rf "fa/$INSTANCE/.git"
          test -f "fa/$INSTANCE/$INSTANCE.json" || { echo "::error::fa/$INSTANCE/$INSTANCE.json is missing: is path-in-repo right?"; exit 2; }
      - &root-cat
        name: Give the root the `cat` script the harness's commands assume
        if: steps.skip-prep.outputs.hit != 'true'
        # The harness's scripts spawn `bun run cat <name>` from the root
        # (qa:refresh, kg:detangle, regen, ...). A root without that entry
        # (smart-ra) ran /usr/bin/cat instead (smart-ra#65: "/usr/bin/cat:
        # 'qa:refresh': No such file or directory"). Added to the working copy
        # only, the same on base and head; a root that has one keeps it.
        run: python3 ci/.github/scripts/layer-pr-checks/root-cat-script.py fa
      - &install
        name: Install
        if: steps.skip-prep.outputs.hit != 'true'
        working-directory: fa
        run: bun install
      - &chromium
        name: Install Chromium, for the checks that draw through a browser
        # Not on the fast tier (a non-release PR): only derive:publish and the
        # gates draw, and a draft runs neither (owner, 2026-10-23, "1y").
        if: steps.skip-prep.outputs.hit != 'true' && !(github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'release')) && steps.quick.outputs.quick != 'true'
        # `render:bpmn` and the `*:processes:render:check` gates draw BPMN with
        # bpmn-js in Chromium (folio-assistant's B1 test job installs it for
        # the same reason). The index's OWN Playwright installs it, so the
        # browser build is the one that Playwright expects: a bare `npx
        # playwright` may fetch another
        # (seen on a layer PR on 2026-10-22: "Executable doesn't
        # exist at .../chromium_headless_shell-1243").
        working-directory: fa
        run: |
          if [ -x node_modules/.bin/playwright ] && [ -f ../ci/.github/scripts/playwright-chromium/install.sh ]; then
            # Browser always; apt only when a system library is missing
            # (runners lost the Ubuntu mirrors on 2026-11-11, and apt exit
            # 100 failed the tier although nothing needed installing).
            bash ../ci/.github/scripts/playwright-chromium/install.sh node_modules/.bin/playwright
          elif [ -x node_modules/.bin/playwright ]; then
            # The judging scripts are at the cat-harness-tools commit the
            # layer's lock pins, which may predate the installer
            # (cat-harness-tools#1916): install as that commit did.
            echo "the pinned cat-harness-tools has no playwright-chromium/install.sh: installing with --with-deps, as it did"
            node_modules/.bin/playwright install --with-deps chromium
          else
            echo "no playwright in the index: no browser installed"
          fi
      - &state-mount
        name: Mount every graph kept on a branch, and build the IG pages
        if: steps.skip-prep.outputs.hit != 'true' && steps.quick.outputs.quick != 'true'
        # Every branch-kept graph the declarations name (beans, todos,
        # fsh-guts, health, issue-marks, marks, ...), as the index's own CI
        # mounts them with `state:mount`, but through `mountState` directly:
        # `state:mount` also re-lays the remote mounts against the lock, which
        # would refuse the swapped-in caller. Then the IG instances' pages,
        # which are built rather than committed (bean hupw); several gates
        # read them (owner's session 01Pc8v, 2026-10-14: declaration-resolution
        # was red only because neither was done).
        working-directory: fa
        env:
          # ig-index:build reads each IG's GitHub releases.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Both sides mount at the tips the pin step read once for the run
          # (state-pin.sh): GitHub is rewritten to local mirrors of those
          # commits, for the mount only. The root's origin is put in the
          # `.git` form the rewrite matches, and put back after.
          origin="$(git remote get-url origin)"
          git remote set-url origin "${origin%.git}.git"
          (
            eval "$(bash ../ci/.github/scripts/layer-pr-checks/state-pin.sh "$RUNNER_TEMP/pin/state.json" "$RUNNER_TEMP/state-mirror")"
            bun -e '
              import { mountState, report } from "./cat-harness-tools/scripts/state-mount.ts";
              const r = mountState({});
              console.log(report(r));
              // Not fatal: both sides mount the same branches at the same
              // pinned tips, so a graph that will not mount reads the same on
              // base and head, and the compare job judges what the PR
              // changed. Dying here judged nothing (smart-ra#59: issue-marks
              // has no branch on that remote).
              if (r.state === "failed" || r.state === "partial")
                console.log("::warning::state mount " + r.state + ": see the report above; the gates that read those graphs see them unmounted on both sides");
            '
          )
          git remote set-url origin "$origin"
          # An IG instance commits no artefact index: its
          # fhir-artifact-index/ files are built from the IG's AST by
          # `ig-index:build`, which the IG pages below read. Built only when an
          # IG instance on disk is missing its index, so a root whose IGs still
          # commit theirs pays nothing.
          missing="$(find . -mindepth 2 -maxdepth 3 -type d -name fhir-artifact-index -not -path './node_modules/*' \
            -exec sh -c '[ -f "$1/index.json" ] || echo "$1"' _ {} \; | head -n 5 || true)"
          # The script list is read into a variable and grepped as a
          # here-string, not piped: with pipefail, `grep -q` exiting early
          # SIGPIPEs `cut`, and the condition reads false (as in #661).
          scripts="$(bun cat-harness-tools/scripts/run-script.ts --list 2>/dev/null | cut -f1 || true)"
          if [ -n "$missing" ] && grep -qx 'ig-index:build' <<<"$scripts"; then
            echo "IG artefact indexes missing:"; echo "$missing"
            bun cat-harness-tools/scripts/run-script.ts ig-index:build \
              || echo "::warning::ig-index:build failed: the IG pages and the gates that read the indexes see them missing on this side"
          fi
          if python3 -c 'import json,sys; sys.exit(0 if "smart:pages" in json.load(open("package.json")).get("scripts", {}) else 1)'; then
            bun run cat smart:pages
          fi
      - &as-mounted
        name: Judge the mounts as the lock laid them down, before anything is built on them
        # cat-harness-tools#1701: mount:remote:check, mount:lock:check and
        # separation:cutover:check ask whether the pinned bytes are on disk.
        # In the shards they ran over the prepared tree, after derive:publish
        # had written pages and QA results into the mounted layers, so every
        # layer it wrote into read "modified" (smart-ips-pilgrimage run
        # 42455839636, 8 of 9). Judged here, on the tree the lock produced;
        # the shards take this answer (run-gates.py `--as-mounted-record`).
        if: steps.skip-prep.outputs.hit != 'true' && !(github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'release')) && steps.quick.outputs.quick != 'true'
        working-directory: fa
        env:
          OWN: ${{ env.INSTANCE != '' && format('--instance {0}', env.INSTANCE) || '' }}
        # shellcheck disable=SC2086 -- OWN is empty or one flag and its value
        run: python3 ../ci/.github/scripts/layer-pr-checks/run-gates.py . --as-mounted "$RUNNER_TEMP/as-mounted.json" $OWN || true
      - &root-gates
        name: The index's own gates over the composed root (layer mode)
        # After the state mount and the IG pages, before derive:publish, which
        # is the order the index's own TypeScript job runs them in. Never
        # fatal: recorded, and judged by the compare job against main.
        # Part of the full tier: skipped on the fast tier (a non-release PR),
        # with the shard hand-off steps below.
        if: inputs.mode == 'layer' && steps.skip-prep.outputs.hit != 'true' && !(github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'release')) && steps.quick.outputs.quick != 'true'
        working-directory: fa
        run: |
          python3 ../ci/.github/scripts/layer-pr-checks/run-root-gates.py . \
            ../ci/.github/scripts/layer-pr-checks/root-gates.json "$RUNNER_TEMP/root-gates.json" || true
      - &derive-cache
        name: Restore the derive:publish writer cache (cat-harness-tools#400)
        # Owner, 2026-10-30: reuse is ON for layer PR checks only, to measure
        # hit rates before the published site relies on the keys. Entries are
        # keyed by each writer's inputs and script closure (#409), so a stale
        # entry is a key defect, which the derive log's "reused" lines show.
        # Saved per side and run; restored from the newest of this repository.
        if: steps.skip-prep.outputs.hit != 'true' && !(github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'release')) && steps.quick.outputs.quick != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: fa/build/derive-cache
          key: derive-cache-v1-${{ github.repository }}-${{ env.SIDE }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            derive-cache-v1-${{ github.repository }}-${{ env.SIDE }}-
            derive-cache-v1-${{ github.repository }}-
      # Bean fwtz (owner 2026-10-31: "cache the page build", keyed on input
      # content, so changed inputs rebuild). The writer cache above keys on
      # statically derived inputs and reused 0 of 41 writers on
      # https://github.com/litlfred/folio-assistant-core/pull/444. Writer records
      # are traced instead: a push to
      # main records what each writer read and wrote; a PR skips a writer whose
      # every recorded read is unchanged and puts back what it wrote.
      # Published records first (cat-harness-tools#1702; owner 2026-11-08: a
      # cache is published by whoever re-pins, and CI only reads and checks
      # it): `refs/cat/writer-records/<commit>` in the caller's repository,
      # laid down by `writer-records-ref.ts publish`. The PR's base commit's
      # ref, else main's. Plain git, so it needs no script at this side's pins.
      # Not found: the Actions cache below, as before.
      - &writer-ref
        name: Fetch the published writer records (refs/cat/writer-records)
        if: inputs.writer-skip && github.event_name == 'pull_request' && steps.skip-prep.outputs.hit != 'true' && !(github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'release')) && steps.quick.outputs.quick != 'true'
        env:
          REPO_DIR: ${{ inputs.mode == 'layer' && 'src' || 'fa' }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -uo pipefail
          for ref in "refs/cat/writer-records/$BASE" refs/cat/writer-records/main; do
            git -C "$REPO_DIR" fetch --quiet --no-tags origin "+$ref:$ref" 2>/dev/null || continue
            rm -rf fa/build/writer-cone && mkdir -p fa/build/writer-cone
            idx="$RUNNER_TEMP/writer-ref.index"
            if GIT_INDEX_FILE="$idx" git -C "$REPO_DIR" --work-tree "$GITHUB_WORKSPACE/fa/build/writer-cone" checkout "$ref" -- . ; then
              rm -f "$idx"; echo "writer records: $ref ($(git -C "$REPO_DIR" rev-parse --short=12 "$ref"))"; exit 0
            fi
            rm -f "$idx"; rm -rf fa/build/writer-cone
          done
          echo "writer records: no published ref for $BASE or main; the Actions cache is tried"
      - &writer-cone
        name: Restore main's derive:publish writer records (bean fwtz)
        if: inputs.writer-skip && github.event_name == 'pull_request' && steps.skip-prep.outputs.hit != 'true' && !(github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'release')) && steps.quick.outputs.quick != 'true' && hashFiles('fa/build/writer-cone/records.json') == ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: fa/build/writer-cone
          key: writer-cone-v1-${{ github.repository }}-${{ github.event.pull_request.base.sha }}
          restore-keys: writer-cone-v1-${{ github.repository }}-
      - &strace
        name: strace, to record the writers (a push to main)
        if: env.RECORD_WRITERS == 'true' && steps.skip-prep.outputs.hit != 'true'
        run: |
          if command -v strace >/dev/null; then strace -V | head -1; exit 0; fi
          sudo apt-get update -qq && sudo apt-get install -y -qq strace && strace -V | head -1
      - &derive
        name: Build the publish-time pages (derive:publish), on this side
        # Not on the fast tier (a non-release PR) (owner, 2026-10-23, "1y"):
        # only the tests and gates read these pages, and a draft runs neither.
        # The typecheck does not read them. A ready_for_review run builds them.
        if: steps.skip-prep.outputs.hit != 'true' && !(github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'release')) && steps.quick.outputs.quick != 'true'
        # B1 (owner, 2026-10-14; cat-harness#194, cb280cd): the pages an
        # instance declares `builtAtPublish` are no longer committed, and
        # `bun run cat derive:publish` builds them over the mounts, as
        # folio-assistant's `publish-pages` job does before its tests. Gates
        # and tests read them (docs/_data/harness.json, avatars.css, the UML
        # overview, the translated glossary), so without this every caller
        # re-pinned past cb280cd went newly red on head while base, at the
        # older pins, still had them committed (smart-ra#66, run 38690096973).
        # It runs on BOTH sides, after state mount (its `state` writers read
        # the branch-kept graphs) and after the Chromium install (render:bpmn).
        #
        # Never fatal: the gates run whatever happened here. The outcome is
        # recorded as the gate `publish:derive:publish` (run-gates.py
        # `--record`), so the compare job reports a head failure as NEW and
        # one red on main too as such, rather than it vanishing in this log.
        #
        # A root with no `cat` script (smart-ra) is given one for this step
        # only: derive:publish and its writers call `bun run cat <writer>`,
        # which there would run /usr/bin/cat. package.json is restored before
        # the tests and gates, so they judge the checkout as committed.
        env:
          WRITER_SKIP: ${{ inputs.writer-skip }}
        working-directory: fa
        run: |
          set -uo pipefail
          rec="$RUNNER_TEMP/derive-publish.json"
          log="$RUNNER_TEMP/derive-publish.log"
          runner="bun cat-harness-tools/scripts/run-script.ts"
          if [ ! -f cat-harness-tools/scripts/run-script.ts ]; then
            why="cat-harness-tools/scripts/run-script.ts is absent at this side's pin"
          elif ! { $runner --list 2>/dev/null || true; } | cut -f1 | grep -x 'derive:publish' >/dev/null; then
            why="no instance declares derive:publish at this side's pins (its pages are committed there)"
          else
            why=""
          fi
          if [ -n "$why" ]; then
            echo "derive:publish skipped: $why"
            python3 - "$rec" "$why" <<'PY'
          import json, sys
          json.dump({"publish:derive:publish": {"command": "bun run cat derive:publish", "skipped": sys.argv[2]}}, open(sys.argv[1], "w"), indent=1)
          PY
            exit 0
          fi
          # Owner, 2026-10-23 (option A): the QA working copy that
          # `uml:overview` builds here runs `skill:register`, which re-ran
          # nine checks (~190 s) that this side's gate shards run anyway over
          # the same tree. Name the checks the shards run, from the same
          # derivation they use (`run-gates.py --list`); skill-register.ts
          # leaves exactly those to them, in CI only, and reports them as not
          # run here. A list that cannot be derived names nothing: every
          # check is verified here, as before.
          own_flag=""; [ -n "$INSTANCE" ] && own_flag="--instance $INSTANCE"
          # shellcheck disable=SC2086 -- own_flag is empty or one flag and its value
          CAT_SKILL_REGISTER_VERIFIED_BY_GATES="$(python3 ../ci/.github/scripts/layer-pr-checks/run-gates.py . --list $own_flag 2>/dev/null \
            | python3 -c 'import json,sys; print(",".join(sorted({k.split(":", 1)[1] for k in json.load(sys.stdin)["gates"]})))' 2>/dev/null || true)"
          export CAT_SKILL_REGISTER_VERIFIED_BY_GATES
          echo "checks this side's gates run: $(printf '%s' "$CAT_SKILL_REGISTER_VERIFIED_BY_GATES" | tr ',' '\n' | grep -c . || true)"
          injected=""
          if ! python3 -c 'import json,sys; sys.exit(0 if "cat" in json.load(open("package.json")).get("scripts", {}) else 1)'; then
            cp package.json "$RUNNER_TEMP/package.json.orig"
            python3 - <<'PY'
          import json
          p = json.load(open("package.json"))
          p.setdefault("scripts", {})["cat"] = "bun cat-harness-tools/scripts/run-script.ts"
          json.dump(p, open("package.json", "w"), indent=2)
          PY
            injected=1
            echo "root has no \`cat\` script: one is added for derive:publish and removed after it"
          fi
          # GitHub runs this step as `bash -e`, and pipefail is set above, so a
          # failing build would end the step at this pipeline before the
          # recording below (smart-ra#66, job 116366855337). `|| code=$?` keeps
          # the step alive with derive:publish's own exit (tee's is 0).
          code=0
          # Reuse on (cat-harness-tools#400): derive:publish keeps reuse off under
          # CI unless a cache directory is named.
          export CAT_DERIVE_CACHE_DIR="$PWD/build/derive-cache"
          # Writer records (bean fwtz): recorded on a push, used on a PR. A
          # push outside a full window records incrementally: skip a writer
          # whose reads match and keep its record, trace the rest (#1702).
          if [ "$WRITER_SKIP" = "true" ]; then
            if [ "${RECORD_WRITERS:-}" = "true" ]; then
              export CAT_WRITER_RECORD=1
              if [ "${WRITER_RECORD_FULL:-true}" != "true" ] && [ -f build/writer-cone/records.json ]; then
                export CAT_WRITER_SKIP=1
                echo "writer records: incremental, against the newest records kept"
              else
                echo "writer records: full, every writer traced"
              fi
            elif [ -f build/writer-cone/records.json ]; then export CAT_WRITER_SKIP=1
            else echo "writer skip: no records restored, every writer runs"; fi
          fi
          bun run cat derive:publish 2>&1 | tee "$log" || code=$?
          echo "derive cache: $(grep -c '^  reused ' "$log" || true) writer(s) reused, $(grep -c '^  ran ' "$log" || true) ran"
          echo "writer skip: $(grep -c '^  skipped .*put back its outputs' "$log" || true) writer(s) skipped, $(grep -Ec '^  [^ ]+ runs: ' "$log" || true) ran"
          if [ -n "$injected" ]; then cp "$RUNNER_TEMP/package.json.orig" package.json; fi
          # A root that is not the folio-assistant index (no
          # code-quality-gates.yml: a folio, an IG repository) mounts fewer
          # instances than cat-harness's builtAtPublish list assumes (smart-ra#66:
          # smart:pages, beans, glossaries of unmounted instances), so a failed
          # build there is recorded as SKIPPED with its tail, not judged: the
          # pages it did build still serve the gates that read them. In the index
          # it stays a gate, so the index's own build is held to every writer.
          if [ "$code" -ne 0 ] && [ ! -f .github/workflows/code-quality-gates.yml ]; then
            echo "::warning::derive:publish exited $code on the ${{ env.SIDE }} side of a root that is not the index; recorded as skipped, not judged"
            python3 - "$rec" "$code" "$log" <<'PY'
          import json, sys
          tail = open(sys.argv[3], errors="replace").read().strip()[-600:].replace("\n", " / ")
          json.dump({"publish:derive:publish": {"command": "bun run cat derive:publish", "skipped": f"exited {sys.argv[2]} in a root that is not the index: {tail}"}}, open(sys.argv[1], "w"), indent=1)
          PY
          else
            if [ "$code" -ne 0 ]; then
              echo "::error::derive:publish exited $code on the ${{ env.SIDE }} side; the gates still run, and the compare job judges it as the gate publish:derive:publish"
            fi
            python3 - "$rec" "$code" "$log" <<'PY'
          import json, sys
          tail = open(sys.argv[3], errors="replace").read().strip()[-1500:]
          json.dump({"publish:derive:publish": {"command": "bun run cat derive:publish", "exit": int(sys.argv[2]), "tail": tail}}, open(sys.argv[1], "w"), indent=1)
          PY
          fi
      - &writer-cone-save
        name: Keep main's writer records (bean fwtz)
        if: env.RECORD_WRITERS == 'true' && steps.skip-prep.outputs.hit != 'true' && hashFiles('fa/build/writer-cone/records.json') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: fa/build/writer-cone
          key: writer-cone-v1-${{ github.repository }}-${{ github.sha }}
      # The gate on published writer records (cat-harness-tools#1702): a push
      # to main builds every page in full, so it can judge the records PRs
      # skip with. `publish:writer-records` is red when a writer whose record
      # matches would have been put back stale; it is judged with the gates.
      - &writer-records-cached
        name: The newest runner-kept writer records, for the gate (a push)
        if: inputs.writer-skip && github.event_name == 'push' && steps.skip-prep.outputs.hit != 'true' && steps.quick.outputs.quick != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/cached-writer-records
          key: writer-cone-v1-${{ github.repository }}-none-${{ github.run_id }}
          restore-keys: writer-cone-v1-${{ github.repository }}-
      - &writer-records-gate
        name: Judge the published writer records against this full build (a push)
        if: inputs.writer-skip && github.event_name == 'push' && steps.skip-prep.outputs.hit != 'true' && steps.quick.outputs.quick != 'true'
        env:
          REPO_DIR: ${{ inputs.mode == 'layer' && 'src' || 'fa' }}
        run: |
          set -uo pipefail
          verify=fa/cat-harness-tools/scripts/writer-cone-verify.ts
          if ! grep -q -- '--gate' "$verify" 2>/dev/null; then
            echo "writer records gate: not at this side's pins (writer-cone-verify.ts has no --gate)"; exit 0
          fi
          pub="$RUNNER_TEMP/published-writer-records"
          rm -rf "$pub"; mkdir -p "$pub"
          prev=""
          if git -C "$REPO_DIR" fetch --quiet --no-tags origin "+refs/cat/writer-records/main:refs/cat/writer-records/main" 2>/dev/null &&
             git -C "$REPO_DIR" show refs/cat/writer-records/main:records.json > "$pub/records.json" 2>/dev/null; then
            prev="--prev $pub/records.json"
          elif [ -f "$RUNNER_TEMP/cached-writer-records/records.json" ]; then
            # Not published by a re-pinner: the records a runner kept (layer mode), judged the same way.
            cp "$RUNNER_TEMP/cached-writer-records/records.json" "$pub/records.json"
            prev="--prev $pub/records.json"
          fi
          cd fa
          # shellcheck disable=SC2086 -- prev is empty or one flag and its value
          bun cat-harness-tools/scripts/writer-cone-verify.ts $prev --gate "$RUNNER_TEMP/derive-publish.json" --summary "$GITHUB_STEP_SUMMARY" || true
      # The typecheck, once, here: it was its own job, a third machine and
      # a third wait for one `tsc` (cat-harness-tools#397). Its outcome goes
      # to the compare job, which fails on it, so the shards still run.
      - name: tsc --noEmit
        id: tsc
        if: steps.skip-prep.outputs.hit != 'true'
        continue-on-error: true
        working-directory: fa/${{ inputs.mode == 'layer' && env.INSTANCE || '.' }}
        run: |
          if [ -f tsconfig.json ]; then bunx tsc --noEmit -p tsconfig.json; else echo "no tsconfig.json: nothing to typecheck"; fi
      - name: Quick-lane tests
        id: quick-test
        if: steps.quick.outputs.quick == 'true'
        continue-on-error: true
        working-directory: fa
        env:
          TEST: ${{ inputs.quick-test }}
        run: bun test "./$INSTANCE/$TEST"
      - name: Directory READMEs (QA report, never a gate)
        # Owner, 2026-10-16: "QA report, but not gate". A layer's own PR is
        # told when its directory READMEs are stale, as a warning and in the
        # step summary; it is never failed for it. A dispatched regen
        # (`layer-post-merge-regen.yml`, mode `pr`; full runs only on manual
        # trigger or release build, owner 2026-11-06) commits them to the
        # PR's branch. Run from `fa`,
        # so the graph typologies are the composed set, over the caller's own
        # git checkout. A locked cat-harness-tools older than `--repo` reports
        # that it could not judge, rather than a finding.
        if: inputs.mode == 'layer' && steps.skip-prep.outputs.hit != 'true'
        continue-on-error: true
        working-directory: fa
        env:
          SUBDIR: ${{ inputs.path-in-repo }}
        run: |
          set -uo pipefail
          own="$RUNNER_TEMP/own/${SUBDIR:-.}"
          # `|| code=$?`: under Actions' `bash -e` an assignment from a
          # failing command substitution ends the step, so a stale README
          # turned this QA report red with no output and no summary.
          code=0
          out="$(bun cat-harness-tools/scripts/subgraph-readmes.ts --check --repo "$own" 2>&1)" || code=$?
          echo "$out"
          {
            echo "### Directory READMEs (QA, does not block)"
            case "$code" in
              0) echo "Every directory README is current." ;;
              1) echo "Stale READMEs; the post-merge regen opens a repair PR for them after merge:"
                 echo '```'; echo "$out" | grep '✗' || true; echo '```' ;;
              *) echo "Could not judge (exit $code): the locked cat-harness-tools may predate \`--repo\`." ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" = 1 ]; then
            echo "::warning title=Directory READMEs (QA)::$(echo "$out" | grep -c '✗') stale directory README(s); not a gate, repaired after merge"
          fi
          exit 0
      - &timings-restore
        name: The gate seconds the last run of this repository recorded
        if: steps.skip-prep.outputs.hit != 'true' && !(github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'release')) && steps.quick.outputs.quick != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/timings
          key: layer-pr-checks-timings-v1-${{ github.repository }}-${{ github.run_id }}
          restore-keys: |
            layer-pr-checks-timings-v1-${{ github.repository }}-
      - &snapshot-save
        name: Hand this side's prepared root to its shards
        if: steps.skip-prep.outputs.hit != 'true' && !(github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'release')) && steps.quick.outputs.quick != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/prepared"
          python3 ci/.github/scripts/layer-pr-checks/snapshot.py save fa "$RUNNER_TEMP/mounted.txt" "$RUNNER_TEMP/prepared/root"
          cp "$RUNNER_TEMP/derive-publish.json" "$RUNNER_TEMP/prepared/"
          if [ -f "$RUNNER_TEMP/root-gates.json" ]; then cp "$RUNNER_TEMP/root-gates.json" "$RUNNER_TEMP/prepared/"; fi
          if [ -f "$RUNNER_TEMP/as-mounted.json" ]; then cp "$RUNNER_TEMP/as-mounted.json" "$RUNNER_TEMP/prepared/"; fi
          # The previous run's gate seconds, so the shards balance by time.
          if [ -f "$RUNNER_TEMP/timings/gates.json" ]; then cp "$RUNNER_TEMP/timings/gates.json" "$RUNNER_TEMP/prepared/timings.json"; fi
          zstd -q -T0 --rm "$RUNNER_TEMP/prepared/root.tar"
          ls -la "$RUNNER_TEMP/prepared"
      - &upload-prepared
        name: Upload this side's prepared root
        if: steps.skip-prep.outputs.hit != 'true' && !(github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'release')) && steps.quick.outputs.quick != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: prepared-${{ env.SIDE }}
          path: ${{ runner.temp }}/prepared
          retention-days: 1
          compression-level: 0  # already zstd
          if-no-files-found: error

  # Marked ready for review (merge manager, 2026-11-07): a PR the merge queue
  # paces goes draft -> ready -> draft -> ready without a push, and each
  # `ready_for_review` ran the full tier again on the same inputs. This job
  # pins the run exactly as prepare-head would (it writes the run's pin, so
  # both prepare jobs restore the same pins), then asks `ready-reuse.py
  # decide` whether an earlier run of this workflow already passed "No new
  # failures" on the same head, base.sha, merge tree and pins. If so, both
  # prepare jobs and the shards are skipped and `compare` reports "SKIPPED --
  # already passed as judged in run <url>". When the earlier run recorded no
  # pins, it counts only within `record-pin-max-hours`. Anything it cannot
  # read is no reuse. Reading runs needs `actions: read` on the caller's job;
  # without it the API refuses and every job runs, as before.
  ready-reuse:
    name: Already judged? (marked ready for review)
    if: github.event_name == 'pull_request' && github.event.action == 'ready_for_review'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      reuse: ${{ steps.decide.outputs.reuse }}
      run-url: ${{ steps.decide.outputs.run_url }}
    steps:
      - *tools-lock
      - *judging-scripts
      - *pin-restore
      - *pin-record
      - *pin-write
      - *pin-save
      - *pin-reread
      - *pins
      - name: Did an earlier run pass on these exact inputs?
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_SHA: ${{ github.sha }}
          INDEX: ${{ steps.pins.outputs.index }}
          TOOLS: ${{ steps.pins.outputs.tools }}
          MAX_HOURS: ${{ inputs.record-pin-max-hours }}
        run: |
          script=ci/.github/scripts/layer-pr-checks/ready-reuse.py
          if [ ! -f "$script" ]; then echo "judging scripts without ready-reuse.py: no reuse"; echo "reuse=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          STATE="$RUNNER_TEMP/pin/state.json" python3 -I "$script" decide
      # A reused run records the same key, so a further draft -> ready
      # round finds this run as well.
      - name: Record what the reused run judged
        if: steps.decide.outputs.reuse == 'true'
        continue-on-error: true
        env:
          KEY: ${{ steps.decide.outputs.key }}
        run: |
          mkdir -p "$RUNNER_TEMP/judged"
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/judged/key"
      - if: steps.decide.outputs.reuse == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ steps.decide.outputs.key }}
          path: ${{ runner.temp }}/judged
          retention-days: 7
          overwrite: true

  prepare-base:
    name: Prepare the main side, unless main's answer is cached
    # Not on the fast tier (a non-release PR): it has no full tier to compare
    # against. `run` then skips too, because it needs this job to succeed.
    # Nor when `ready-reuse` found this PR already judged on these inputs,
    # nor on a no-op `labeled` event (any label but `release`).
    needs: [ready-reuse]
    if: ${{ !cancelled() && needs.ready-reuse.outputs.reuse != 'true' && github.event.action != 'closed' && (github.event.action != 'labeled' || github.event.label.name == 'release') && !(github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'release')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SIDE: base
    outputs:
      at: ${{ steps.pins.outputs.at }}
      layers-at: ${{ steps.pins.outputs.layers-at }}
      index: ${{ steps.pins.outputs.index }}
      tools: ${{ steps.pins.outputs.tools }}
      key: ${{ steps.base-key.outputs.key }}
      # True when main's answer is not computed by this run: cached under the
      # exact key, or stored by a run on the caller's main (`stored-key`).
      cached: ${{ steps.base-hit.outputs.hit }}
      # The key main's answer was restored from, and which it is: `exact` or
      # `this PR's main` (the header). compare reads the answer itself from
      # this run's `base-answer` artifact, never from the cache.
      stored-key: ${{ steps.base-hit.outputs.key }}
      stored-tier: ${{ steps.base-hit.outputs.tier }}
      # The commit of main this run computes, when it does (kept beside its answer).
      own-sha: ${{ steps.base-key.outputs.own-sha }}
      cone: ${{ steps.base-key.outputs.cone }}
      shards: ${{ steps.shards.outputs.list }}
      # Whether this job built main's side for its shards. The `run` job reads
      # it on a push, where there is no PR side to wait for.
      prepared: ${{ steps.skip-prep.outputs.hit != 'true' }}
      # A push that ran nothing ON PURPOSE (owner, Q-MQA-2 A): `batched` (this
      # window's integration run already started; `window` names it) or
      # `pins-only`. Empty otherwise. Main's verdict is then `unknown` and
      # deferred, never "could not determine".
      deferred: ${{ steps.skip-prep.outputs.deferred }}
      window: ${{ steps.integ-bucket.outputs.bucket }}
      # True on the first harness PR: main had no lock, so main's side is
      # the PR's own tree (see the base-root step).
      first-setup: ${{ steps.base-root.outputs.first-setup == 'true' }}
      # Whether this push re-records every page-build writer (writer-record-hours);
      # otherwise it records incrementally (cat-harness-tools#1702).
      writer-record-full: ${{ steps.writer-stamp.outputs.full }}
      writer-bucket: ${{ steps.writer-bucket.outputs.bucket }}
    steps:
      # The same matrix as prepare-head's; a push has no prepare-head.
      - *shards
      - *tools-lock
      # Has a push recorded every page-build writer in this window? (bean fwtz;
      # owner, 2026-11-01, card Q-CIS-2 A: off the main path.) A cache key per
      # window of `writer-record-hours`: the first push in a window records
      # every writer and saves the stamp; the rest record incrementally, tracing
      # only the writers whose reads moved (cat-harness-tools#1702, option D of
      # the 2026-11-08 CI bottleneck analysis: records from every main batch).
      - name: Is a writer record due? (a push)
        id: writer-bucket
        if: github.event_name == 'push' && inputs.writer-skip
        env:
          HOURS: ${{ inputs.writer-record-hours }}
        run: |
          set -euo pipefail
          if [ "${HOURS:-0}" -le 0 ] 2>/dev/null; then echo "bucket=$GITHUB_SHA" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "bucket=$(( $(date -u +%s) / (3600 * HOURS) ))" >> "$GITHUB_OUTPUT"
      - name: Was the writer record made in this window?
        id: writer-stamp-lookup
        if: steps.writer-bucket.outcome == 'success'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/writer-stamp
          key: writer-record-stamp-v1-${{ github.repository }}-${{ steps.writer-bucket.outputs.bucket }}
          lookup-only: true
      - name: Record every writer on this push, or only the ones whose reads moved?
        id: writer-stamp
        if: steps.writer-bucket.outcome == 'success'
        env:
          HIT: ${{ steps.writer-stamp-lookup.outputs.cache-hit == 'true' }}
        run: |
          if [ "$HIT" = "true" ]; then
            echo "every page-build writer was recorded in this ${{ inputs.writer-record-hours }}-hour window: this push records incrementally"
            echo "full=false" >> "$GITHUB_OUTPUT"
          else
            echo "full=true" >> "$GITHUB_OUTPUT"
          fi
      - *judging-scripts
      - *pin-restore
      - *pin-record
      - *pin-write
      - *pin-save
      - *pin-reread
      - *pins
      - *checkout-index
      - *base-root
      - *setup-bun
      - *caller
      - *lock-only
      - *quick
      - *caller-base
      # The base side is main, and main's answer does not depend on the PR
      # (bean cis2). It is cached under what it is computed FROM: the index
      # commit, the caller's base tree, the lower layers' commits, the judging
      # scripts' content, the branch-kept graphs' tips and the inputs that
      # change the gate set. The old key
      # also held the current main tips of cat-harness-tools and cat-harness,
      # which layer mode never mounts (it mounts the index's lock), so any
      # merge to either missed every layer's cache (cat-harness-tools#397).
      - name: Key main's answer by what it is computed from (bean cis2)
        id: base-key
        env:
          MODE: ${{ inputs.mode }}
          LAYERS: ${{ inputs.layers-at-main }}
          SUBDIR: ${{ inputs.path-in-repo }}
          TEST_PATH: ${{ inputs.test-path }}
          READERS: ${{ inputs.reader-tests }}
          PIN_AT: ${{ steps.pins.outputs.layers-at }}
        run: |
          set -euo pipefail
          root_tree="$(git -C fa rev-parse 'HEAD^{tree}')"
          src_tree="none"
          [ "$MODE" = "layer" ] && src_tree="$(git -C src rev-parse 'HEAD^{tree}')"
          if [ "$LAYERS" = "auto" ]; then
            pkg="fa/package.json"; [ "$MODE" = "layer" ] && pkg="src/${SUBDIR:-.}/package.json"
            LAYERS="$(python3 -c 'import json,sys
          try: p=json.load(open(sys.argv[1]))
          except FileNotFoundError: p={}
          d={**p.get("dependencies",{}),**p.get("devDependencies",{}),**p.get("peerDependencies",{})}
          print(" ".join(sorted(x.split("/",1)[1] for x in d if x.startswith("@litlfred/"))))' "$pkg")"
          fi
          lower=""
          for r in $LAYERS; do
            [ "$r" = "$INSTANCE" ] && continue
            lower="$lower $r=$(bash ci/.github/scripts/layer-pr-checks/resolve-at.sh "${HARNESS_OWNER}/$r" main "$PIN_AT")"
          done
          scripts="$(cd ci/.github/scripts/layer-pr-checks && find . -type f ! -name '*.pyc' | sort | xargs sha256sum | sha256sum | cut -d' ' -f1)"
          # The graphs kept on branches (`cat/<instance>/<graph>`: beans,
          # todos, ...), which both sides mount at their tips. Bean lpcs's open
          # question, answered here: in the key, so a bean that moved
          # since main was judged is never charged to the PR. A miss costs
          # runner time only; the base side runs beside the head side. A tip
          # that cannot be read is a miss, never a hit.
          # The tips this run pinned (the pin step), which both sides mount.
          state="$(sha256sum < "$RUNNER_TEMP/pin/state.json" | cut -d' ' -f1)"
          for repo in $([ "$MODE" = "layer" ] && echo ${HARNESS_OWNER}/folio-assistant) "$GITHUB_REPOSITORY"; do
            python3 -c 'import json,sys; sys.exit(0 if sys.argv[2] in json.load(open(sys.argv[1])) else 1)' "$RUNNER_TEMP/pin/state.json" "$repo" \
              || state="$state $repo=unreadable-$(date +%s%N)"
          done
          raw="v5|$MODE|$INSTANCE|$root_tree|$src_tree|$lower|$scripts|$TEST_PATH|$READERS|$state"
          echo "main's answer is computed from: $raw"
          hash="$(printf '%s' "$raw" | sha256sum | cut -d' ' -f1)"
          # The caller's own tree leads the hash, so a PR can find main's
          # stored answer for its own base commit by prefix when the rest
          # moved (the header's "main's STORED answer"). The judging scripts
          # lead it too (v5): an answer made by other judging scripts has
          # other gates, tests and diagnostics, and a head gate main's answer
          # never ran would read as NEW.
          own_tree="$src_tree"; own_dir=src
          [ "$MODE" = "layer" ] || { own_tree="$root_tree"; own_dir=fa; }
          any="layer-pr-checks-main-v5-${GITHUB_REPOSITORY}-${scripts:0:16}-"
          key="${any}${own_tree}-$hash"
          {
            echo "key=$key"
            echo "prefix-own=${any}${own_tree}-"
            echo "own-sha=$(git -C "$own_dir" rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"
          # The CI cone's records of the same main (cat-harness-tools#398). A
          # PR restores the newest under the prefix, not this exact key: a
          # record is checked path by path, so an older main's still serves.
          echo "cone=layer-pr-checks-cone-v1-${GITHUB_REPOSITORY}-$hash" >> "$GITHUB_OUTPUT"
      # Restored here, not only looked up: compare runs after the head
      # shards, hours later on a busy day, and the entry may be evicted by
      # then (cat-harness-tools#926). What is restored goes to compare as an
      # artifact (below).
      - name: Is main's answer already known?
        id: base-lookup
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/base-results
          key: ${{ steps.base-key.outputs.key }}
      - name: Are this main's cone records already kept? (a push)
        id: cone-lookup
        if: github.event_name == 'push'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/cone
          key: ${{ steps.base-key.outputs.cone }}
          lookup-only: true
      # Not for these exact inputs: the answer a run on the caller's main
      # stored for the PR's OWN base commit, the merge commit's first parent
      # (`git merge-base origin/main HEAD` of the tree under test), whose tree
      # leads the key. Never an earlier main's (the header): on a miss the
      # base side is computed. A PR's first attempt only: re-running all jobs
      # is how main is recomputed exactly. Never on a push, which is main's
      # own run.
      - name: Has a run on main stored an answer for this PR's base?
        id: stored-lookup
        if: >-
          steps.base-lookup.outputs.cache-hit != 'true' && github.event_name != 'push' &&
          inputs.reuse-stored-main && github.run_attempt == '1'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/base-results
          key: ${{ steps.base-key.outputs.key }}
          restore-keys: |
            ${{ steps.base-key.outputs.prefix-own }}
      # A PR only: a push computes main's side whatever is cached.
      - name: Hand main's answer to the compare job
        id: base-answer
        if: >-
          github.event_name != 'push' &&
          (steps.base-lookup.outputs.cache-hit == 'true' || steps.stored-lookup.outputs.cache-matched-key != '')
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: base-answer
          path: |
            ${{ runner.temp }}/base-results/junit.xml
            ${{ runner.temp }}/base-results/gates.json
            ${{ runner.temp }}/base-results/from.json
          if-no-files-found: error
          retention-days: 1
      - name: Skip the base side when it is
        id: base-hit
        env:
          EXACT: ${{ steps.base-lookup.outputs.cache-hit == 'true' }}
          KEY: ${{ steps.base-key.outputs.key }}
          STORED: ${{ steps.stored-lookup.outputs.cache-matched-key }}
          HANDED: ${{ steps.base-answer.outcome == 'success' }}
          PUSH: ${{ github.event_name == 'push' }}
          DIR: ${{ runner.temp }}/base-results
        run: |
          set -euo pipefail
          hit=false; key=""; tier=""
          if [ "$EXACT" = "true" ]; then
            key="$KEY"; tier=exact
          elif [ -n "$STORED" ]; then
            key="$STORED"; tier="this PR's main"
          fi
          if [ "$PUSH" = "true" ]; then
            # main's own run judges nothing and reads no answer: "kept" is all
            # it asks, to skip work that is already kept (below).
            [ "$EXACT" = "true" ] && hit=true
          elif [ -n "$key" ]; then
            # Restored AND handed to compare, with both halves of the answer:
            # only then is main's side not computed. Anything less is a miss,
            # never a red gate (cat-harness-tools#926).
            if [ "$HANDED" = "true" ] && [ -s "$DIR/junit.xml" ] && [ -s "$DIR/gates.json" ]; then
              hit=true
              echo "main's answer ($tier, $key) is restored and handed to compare: the base side is not run"
            else
              echo "main's answer ($tier, $key) was found but could not be restored and handed on: main's side is computed by this run"
              key=""; tier=""
            fi
          else
            echo "no answer for this PR's base commit is kept: main's side is computed by this run"
          fi
          { echo "hit=$hit"; echo "key=$key"; echo "tier=$tier"; } >> "$GITHUB_OUTPUT"
      # Main's integration run is batched (release-gated CI, owner, card
      # Q-CIB-4 A, 2026-11-08): the first push in each window of
      # `integration-minutes` runs the full suite and stamps the window; the
      # window's later pushes find the stamp and run nothing. The next
      # window's first push judges every merge since. A started run is never
      # cancelled (Q-CIS-1): a batched push simply does not start the work.
      - name: Is main's integration run due in this window? (a push)
        id: integ-bucket
        if: github.event_name == 'push' && inputs.integration-minutes > 0
        env:
          MINUTES: ${{ inputs.integration-minutes }}
        run: echo "bucket=$(( $(date -u +%s) / (60 * MINUTES) ))" >> "$GITHUB_OUTPUT"
      - name: Has this window's integration run started?
        id: integ-lookup
        if: steps.integ-bucket.outcome == 'success'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/integration-stamp
          key: integration-stamp-v1-${{ github.repository }}-${{ steps.integ-bucket.outputs.bucket }}
          lookup-only: true
      # A PR needs only main's answer. A push is run for the records, so it
      # stops early only when it would make neither (both already kept), or
      # when this window's integration run already started.
      - name: Is there anything to prepare?
        id: skip-prep
        env:
          BATCHED: ${{ steps.integ-lookup.outputs.cache-hit == 'true' }}
          PUSH: ${{ github.event_name == 'push' }}
          PINS_ONLY: ${{ steps.lock-only.outputs.skip == 'true' }}
          QUICK: ${{ steps.quick.outputs.quick == 'true' }}
          BASE_HIT: ${{ steps.base-hit.outputs.hit == 'true' }}
          CONE_HIT: ${{ steps.cone-lookup.outputs.cache-hit == 'true' }}
        run: |
          hit=false
          # Why nothing runs, for main's verdict on a push (owner, Q-MQA-2 A):
          # `batched` and `pins-only` are deferred on purpose, never "could
          # not determine".
          deferred=""
          if [ "$PINS_ONLY" = "true" ] || [ "$QUICK" = "true" ]; then hit=true; [ "$PINS_ONLY" = "true" ] && deferred=pins-only
          elif [ "$PUSH" = "true" ] && [ "$BATCHED" = "true" ]; then
            hit=true; deferred=batched
            echo "main's integration run already started in this window: this push runs nothing, and the next window's first push judges it" | tee -a "$GITHUB_STEP_SUMMARY"
          elif [ "$PUSH" = "true" ]; then { [ "$BASE_HIT" = "true" ] && [ "$CONE_HIT" = "true" ]; } && hit=true
          elif [ "$BASE_HIT" = "true" ]; then hit=true
          fi
          echo "hit=$hit" >> "$GITHUB_OUTPUT"
          echo "deferred=$deferred" >> "$GITHUB_OUTPUT"
      - name: Stamp this window's integration run
        if: steps.integ-bucket.outcome == 'success' && steps.integ-lookup.outputs.cache-hit != 'true' && steps.skip-prep.outputs.hit != 'true'
        run: mkdir -p "$RUNNER_TEMP/integration-stamp" && echo "$GITHUB_SHA $GITHUB_RUN_ID" > "$RUNNER_TEMP/integration-stamp/stamp"
      - name: Save the stamp
        if: steps.integ-bucket.outcome == 'success' && steps.integ-lookup.outputs.cache-hit != 'true' && steps.skip-prep.outputs.hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/integration-stamp
          key: integration-stamp-v1-${{ github.repository }}-${{ steps.integ-bucket.outputs.bucket }}
      - *mount-cache
      - *mount
      - *mark
      - *lower-layers-main
      - *swap
      - *root-cat
      - *install
      - *chromium
      - *state-mount
      - *as-mounted
      - *root-gates
      - *derive-cache
      - *writer-ref
      - *writer-cone
      - *strace
      - *derive
      - *writer-cone-save
      - *writer-records-cached
      - *writer-records-gate
      - *timings-restore
      - *snapshot-save
      - *upload-prepared

  # Main's writer records (bean fwtz), on their own machine beside the base
  # side: tracing every derive:publish writer under strace took the base
  # side's preparation from ~10 to 56 minutes (run
  # https://github.com/litlfred/folio-assistant-core/actions/runs/41251751682). PRs read only the records this job saves, so nothing waits
  # on it but the run's own end.
  record-writers:
    name: Record main's page-build scripts (bean fwtz)
    needs: [prepare-base]
    # Every push (cat-harness-tools#1702): a full record once per
    # `writer-record-hours` window, an incremental one otherwise. LAYER mode
    # only (owner 2026-11-08, hybrid): a layer's PRs take the lower layers at
    # main, so the writers' code moves with every lower-layer merge and no
    # re-pin marks it. An index-mode repository changes that code only when
    # it re-pins, so its re-pinner publishes the records
    # (`writer-records-ref.ts publish`) and no runner records them.
    if: >-
      !cancelled() && inputs.writer-skip && inputs.writer-record-on-runners && inputs.mode == 'layer' && github.event_name == 'push' &&
      needs.prepare-base.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      SIDE: base
      RECORD_WRITERS: "true"
      WRITER_RECORD_FULL: ${{ needs.prepare-base.outputs.writer-record-full != 'false' }}
    steps:
      - id: skip-prep
        run: echo "hit=false" >> "$GITHUB_OUTPUT"
      - *tools-lock
      - *judging-scripts
      - *pin-restore
      - *pin-record
      - *pin-write
      - *pin-save
      - *pin-reread
      - *pins
      - *checkout-index
      - *base-root
      - *setup-bun
      - *caller
      - *caller-base
      - *mount-cache
      - *mount
      - *mark
      - *lower-layers-main
      - *swap
      - *root-cat
      - *install
      - *chromium
      - *state-mount
      # An incremental record starts from the newest records a push kept, and
      # the outputs entries beside them, which a skipped writer is put back from.
      - name: Restore the newest writer records (an incremental record)
        if: env.WRITER_RECORD_FULL != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: fa/build/writer-cone
          key: writer-cone-v1-${{ github.repository }}-${{ github.sha }}
          restore-keys: writer-cone-v1-${{ github.repository }}-
      - *strace
      - *derive
      - *writer-cone-save
      - name: Stamp this window's writer record (writer-record-hours)
        if: env.WRITER_RECORD_FULL == 'true' && steps.skip-prep.outputs.hit != 'true' && hashFiles('fa/build/writer-cone/records.json') != ''
        run: |
          mkdir -p "$RUNNER_TEMP/writer-stamp"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/writer-stamp/sha"
      - name: Keep the stamp
        if: env.WRITER_RECORD_FULL == 'true' && steps.skip-prep.outputs.hit != 'true' && hashFiles('fa/build/writer-cone/records.json') != ''
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/writer-stamp
          key: writer-record-stamp-v1-${{ github.repository }}-${{ needs.prepare-base.outputs.writer-bucket }}

  # Each side is `gate-shards` jobs, on separate machines (bean lpcs, step 3).
  # The ~300 gates ran one at a time, ~2500 s a side
  # (smart-immunizations-uganda#4, run 38784912691: 2514 s base, 2637 s
  # head), and cannot share one machine's pool because some of them write. A
  # shard no longer prepares its side (cat-harness-tools#397): it mounts the
  # same lock, which the mount cache makes quick, and applies what its side's
  # prepare job built on top of it. The base side is not run at all when
  # main's answer is cached. The gates are split by the seconds the last run
  # recorded, so the shards finish together, rather than by count (trial
  # run 38866215814: 2267 s in one shard, 626 s in another).
  run:
    name: ${{ matrix.side }} — tests and gates, shard ${{ matrix.shard }}/${{ inputs.gate-shards }}
    needs: [prepare-head, prepare-base]
    # A PR: both prepare jobs succeeded and the PR changes more than its pins.
    # A push: main's side was prepared (prepare-head does not run, so the
    # default `success()` would skip this job).
    if: >-
      !cancelled() && needs.prepare-base.result == 'success' && (
        (github.event_name == 'push' && needs.prepare-base.outputs.prepared == 'true') ||
        (github.event_name != 'push' && needs.prepare-head.result == 'success' && needs.prepare-head.outputs.skip != 'true' && needs.prepare-head.outputs.quick != 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        side: ${{ fromJSON(github.event_name == 'push' && '["base"]' || (needs.prepare-base.outputs.cached == 'true' && '["head"]' || '["base","head"]')) }}
        shard: ${{ fromJSON(needs.prepare-base.outputs.shards) }}
    env:
      SIDE: ${{ matrix.side }}
    steps:
      # The steps shared with the prepare jobs ask whether there is anything
      # to prepare; a shard always runs them.
      - id: skip-prep
        run: echo "hit=false" >> "$GITHUB_OUTPUT"
      - name: The judging scripts, at the commit this run pinned
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ env.HARNESS_OWNER }}/cat-harness-tools
          ref: ${{ matrix.side == 'base' && needs.prepare-base.outputs.tools || needs.prepare-head.outputs.tools }}
          path: ci
          sparse-checkout: |
            .github/scripts/layer-pr-checks
            .github/scripts/playwright-chromium
      - name: Check out the root, at the commit this run pinned
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ inputs.mode == 'index' && github.repository || format('{0}/folio-assistant', env.HARNESS_OWNER) }}
          ref: ${{ inputs.mode == 'index' && (github.event_name == 'push' && github.sha || github.ref) || (matrix.side == 'base' && needs.prepare-base.outputs.index || needs.prepare-head.outputs.index) }}
          fetch-depth: ${{ inputs.mode == 'index' && 2 || 1 }}
          path: fa
      - *base-root
      - *setup-bun
      - *mount-cache
      - *mount
      - name: Fetch what this side's prepare job built
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: prepared-${{ matrix.side }}
          path: ${{ runner.temp }}/prepared
      - name: Apply it over the mount
        run: |
          set -euo pipefail
          p="$RUNNER_TEMP/prepared"
          zstd -q -d --rm "$p/root.tar.zst"
          python3 ci/.github/scripts/layer-pr-checks/snapshot.py apply fa "$p/root"
          cp "$p/derive-publish.json" "$RUNNER_TEMP/derive-publish.json"
          if [ -f "$p/root-gates.json" ]; then cp "$p/root-gates.json" "$RUNNER_TEMP/root-gates.json"; fi
          if [ -f "$p/as-mounted.json" ]; then cp "$p/as-mounted.json" "$RUNNER_TEMP/as-mounted.json"; fi
          # The same seconds in every shard of this side, so they agree on the split.
          if [ -f "$p/timings.json" ]; then echo "GATE_TIMINGS=$p/timings.json" >> "$GITHUB_ENV"; fi
      # The CI cone's records (bean `4rbc`, cat-harness-tools#398): the newest
      # a push to the caller's main kept. Never this run's own key, so it is
      # always the prefix that matches. The path is the one the compare job
      # saves (a cache restores only under the paths it was saved with);
      # ci-cone.ts reads them where it writes them, `build/ci-cone/` in the
      # root, which its read sets leave out. None restored: every gate runs,
      # as before the cone.
      - name: The CI cone's records from the caller's main
        id: cone-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/cone
          key: layer-pr-checks-cone-v1-${{ github.repository }}-none-${{ github.run_id }}
          restore-keys: |
            layer-pr-checks-cone-v1-${{ github.repository }}-
      - name: Put them where ci-cone.ts reads them
        if: steps.cone-restore.outputs.cache-matched-key != ''
        env:
          KEY: ${{ steps.cone-restore.outputs.cache-matched-key }}
        run: |
          set -euo pipefail
          echo "CI cone records: $KEY"
          mkdir -p fa/build/ci-cone
          cp "$RUNNER_TEMP/cone/records.json" fa/build/ci-cone/records.json
      # The result store (scripts/result-store.ts, cat-harness-tools#1503):
      # every green cone record pushes to main kept, many per gate, so a PR on
      # an older base, or a merge-train run, can still match one. Restored from
      # the newest key, like the records; a cache restores only under the path
      # it was saved with, so it lands in RUNNER_TEMP and is copied into the
      # root, where ci-cone.ts reads it (read sets leave it out). None
      # restored: main's record alone decides, as before.
      - name: The result store from the caller's main
        id: store-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/result-store
          key: layer-pr-checks-results-v1-${{ github.repository }}-none-${{ github.run_id }}
          restore-keys: |
            layer-pr-checks-results-v1-${{ github.repository }}-
      - name: Put it where ci-cone.ts reads it
        if: steps.store-restore.outputs.cache-matched-key != ''
        env:
          KEY: ${{ steps.store-restore.outputs.cache-matched-key }}
        run: |
          set -euo pipefail
          echo "Result store: $KEY"
          mkdir -p fa/build
          cp -R "$RUNNER_TEMP/result-store" fa/build/result-store
      - name: strace, for the records (a push)
        # Measured in bean `4rbc`: `strace -f` costs a traced gate 3-10x, so
        # it runs on main's pushes only, never on a PR's critical path. Not
        # fatal: without it, run-gates.py says so and records nothing.
        if: github.event_name == 'push'
        continue-on-error: true
        run: |
          if command -v strace >/dev/null; then strace -V | head -1; exit 0; fi
          sudo apt-get update -qq && sudo apt-get install -y -qq strace && strace -V | head -1
      - *install
      - *chromium
      - name: bun test
        working-directory: fa
        # Judged by the compare job, not by this exit code.
        #
        # Sharded like folio-assistant's `typescript-test` (bean dlqu): the
        # shard travels in BUN_OPTIONS, set on THIS step only, so the gates
        # below, some of which run `bun`, are never narrowed by it. The shards
        # of a side together run the suite once; the compare job joins their
        # reports. `check:test-budgets` (a gate) reads this shard's report.
        env:
          TEST_PATH: ${{ inputs.test-path != '' && inputs.test-path || (inputs.mode == 'layer' && format('./{0}', env.INSTANCE) || '') }}
          # Layer mode with no test-path: the other instances' tests that name
          # this one too (reader-tests.py), on both sides, so a test another
          # layer keeps about this one fails on its PR, not at re-pin.
          READERS: ${{ inputs.mode == 'layer' && inputs.test-path == '' && inputs.reader-tests || 0 }}
          BUN_OPTIONS: ${{ inputs.gate-shards > 1 && format('--shard={0}/{1}', matrix.shard, inputs.gate-shards) || '' }}
        run: |
          if [ "${READERS:-0}" -gt 0 ] 2>/dev/null; then
            readers="$(python3 ../ci/.github/scripts/layer-pr-checks/reader-tests.py . "$INSTANCE" "$READERS" | tr '\n' ' ')"
            [ -n "$readers" ] && { echo "with the tests of other instances that name $INSTANCE: $readers"; TEST_PATH="$TEST_PATH $readers"; }
          fi
          if [ -z "$TEST_PATH" ]; then
            echo "no test-path in index mode: no tests run"
            echo '<?xml version="1.0"?><testsuites tests="0" failures="0"></testsuites>' > "$RUNNER_TEMP/junit.xml"
          else
            # shellcheck disable=SC2086 -- TEST_PATH may name several paths
            bun test $TEST_PATH --reporter=junit --reporter-outfile="$RUNNER_TEMP/junit.xml" || true
            # A layer with no test files (bootstrap: prose and schemas) makes
            # bun exit before writing a report. That is zero tests, not a
            # failure, and the compare job reads it as such on both sides.
            if [ ! -s "$RUNNER_TEMP/junit.xml" ]; then
              echo "no test files under $TEST_PATH: no tests run"
              echo '<?xml version="1.0"?><testsuites tests="0" failures="0"></testsuites>' > "$RUNNER_TEMP/junit.xml"
            fi
          fi
          test -s "$RUNNER_TEMP/junit.xml"
      - name: Gates
        # Judged by the compare job, not by this exit code.
        #
        # The inputs gates take from this run (run-gates.py SUPPLIED_INPUTS):
        #   GATE_JUNIT     the report the tests step above wrote, for
        #                  check:test-budgets.
        #   GATE_DIFF_BASE the commit the PR's diff starts from, for
        #                  check:corpus-gate --since. Index mode only: the root
        #                  IS the caller, a merge commit fetched at depth 2. On
        #                  head it is the merge's first parent, so the gate
        #                  judges exactly what the PR adds; on base it is base
        #                  itself, so main is judged on nothing it did not
        #                  already hold. Layer mode leaves it unset: the root is
        #                  the folio-assistant index and the caller was swapped
        #                  in without its .git, so the gate is skipped with that
        #                  reason rather than judging folio-assistant's history.
        #   GATE_SHARD     i/N: this job runs only its slice of the sorted
        #                  gate set (run-gates.py `shard_names`).
        #   GATE_CONE      the CI cone (bean `4rbc`, cat-harness-tools#398):
        #                  `skip` on a PR, both sides, so a gate whose recorded
        #                  read set is unchanged on a side is SKIPPED there;
        #                  `record` on a push, which traces the rest.
        env:
          GATE_CONE: ${{ github.event_name == 'push' && 'record' || 'skip' }}
          GATE_JOBS: ${{ inputs.gate-jobs }}
          GATE_SHARD: ${{ matrix.shard }}/${{ inputs.gate-shards }}
          OWN: ${{ env.INSTANCE != '' && format('--instance {0}', env.INSTANCE) || '' }}
          MODE: ${{ inputs.mode }}
          SIDE: ${{ env.SIDE }}
        # shellcheck disable=SC2086 -- OWN, ROOT_GATES and AS_MOUNTED are empty or one flag and its value
        run: |
          set -euo pipefail
          export GATE_JUNIT="$RUNNER_TEMP/junit.xml"
          GATE_DIFF_BASE=""
          if [ "$MODE" = "index" ]; then
            if [ "$SIDE" = "head" ] && git -C fa rev-parse -q --verify 'HEAD^2' >/dev/null; then
              GATE_DIFF_BASE="$(git -C fa rev-parse 'HEAD^1')"
            else
              GATE_DIFF_BASE="$(git -C fa rev-parse HEAD)"
            fi
            echo "corpus-gate diff base ($SIDE): $GATE_DIFF_BASE"
          fi
          export GATE_DIFF_BASE
          # Layer mode: the index's own gates, run by the prepare job. Always
          # passed there, so a side that wrote none is recorded as exit 2.
          ROOT_GATES=""
          [ "$MODE" = "layer" ] && ROOT_GATES="--record $RUNNER_TEMP/root-gates.json"
          # The mount gates, judged by the prepare job on the tree as mounted
          # (cat-harness-tools#1701); with no record they run here as before.
          AS_MOUNTED=""
          [ -f "$RUNNER_TEMP/as-mounted.json" ] && AS_MOUNTED="--as-mounted-record $RUNNER_TEMP/as-mounted.json"
          python3 ci/.github/scripts/layer-pr-checks/run-gates.py fa "$RUNNER_TEMP/gates.json" $OWN --record "$RUNNER_TEMP/derive-publish.json" $ROOT_GATES $AS_MOUNTED
      # The artefact's own name, inside it: when the compare job's download
      # matches ONE artefact (one shard, one side), the action unpacks it into
      # `results/` itself rather than `results/<name>/`, and this file is how
      # the compare job puts it back where merge-shards.py looks.
      - name: Name this shard's artefact inside it
        env:
          NAME: results-${{ matrix.side }}-${{ matrix.shard }}
        run: printf '%s\n' "$NAME" > "$RUNNER_TEMP/artefact-name"
      # A push records: carry this shard's store out (what it restored plus
      # what ci-cone.ts run filed), for the compare job to union and keep.
      - name: Carry the result store out (a push)
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          set -euo pipefail
          if [ -d fa/build/result-store ]; then cp -R fa/build/result-store "$RUNNER_TEMP/result-store-out"; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: results-${{ matrix.side }}-${{ matrix.shard }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/junit.xml
            ${{ runner.temp }}/gates.json
            ${{ runner.temp }}/gates-shard.json
            ${{ runner.temp }}/cone-records.json
            ${{ runner.temp }}/result-store-out
            ${{ runner.temp }}/artefact-name

  # `!cancelled()`, not the default `success()`: a shard or prepare job that
  # failed or timed out must make this job RED (its artefact is missing,
  # merge-shards.py exits 2), never skip it, which a required check reads as
  # a pass.
  #
  # On a push to main (the CI cone's record run) it judges nothing: there is no
  # PR side. It joins main's shards, keeps main's answer, the gate seconds and
  # the cone's records for the PRs, and is red only when that join fails.
  compare:
    # The fast tier (a non-release PR) reports under its own name, never as
    # "No new failures": that green was read as the full verdict when a draft
    # was marked ready and merged before the full run reported
    # (https://github.com/litlfred/fhir-harness/pull/167 and #169, 2026-10-24).
    name: ${{ (github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'release')) && 'Fast tier only (advisory; the full checks gate a release)' || 'No new failures (tests and gates)' }}
    needs: [ready-reuse, prepare-head, prepare-base, run]
    # A no-op `labeled` run (any label but `release`) judged nothing, so it
    # reports no verdict.
    if: ${{ !cancelled() && github.event.action != 'closed' && (github.event.action != 'labeled' || github.event.label.name == 'release') }}
    runs-on: ubuntu-24.04
    outputs:
      main-verdict: ${{ steps.main-verdict.outputs.verdict }}
      main-failures: ${{ steps.main-verdict.outputs.failures }}
    steps:
      - name: Does this PR change only the caller's own pins?
        id: pins-only
        env:
          SKIP: ${{ needs.prepare-head.result == 'success' && needs.prepare-head.outputs.skip == 'true' }}
          PUSH: ${{ github.event_name == 'push' }}
          PREPARED: ${{ needs.prepare-base.outputs.prepared }}
          DRAFT: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'release') }}
          QUICK: ${{ needs.prepare-head.outputs.quick == 'true' }}
          REUSED: ${{ needs.ready-reuse.result == 'success' && needs.ready-reuse.outputs.reuse == 'true' }}
          REUSED_RUN: ${{ needs.ready-reuse.outputs.run-url }}
        run: |
          if [ "$REUSED" = "true" ]; then
            msg="SKIPPED — already passed as judged in run $REUSED_RUN (same head, base and pins; marked ready for review)."
            echo "$msg"; echo "$msg" >> "$GITHUB_STEP_SUMMARY"
            echo "only=true" >> "$GITHUB_OUTPUT"
          elif [ "$PUSH" = "true" ]; then
            if [ "$PREPARED" = "true" ]; then
              echo "a push to main: main's side is joined and kept, with the CI cone's records; nothing is judged"
              echo "only=false" >> "$GITHUB_OUTPUT"
            else
              msg="A push to main whose answer and CI cone records are already kept (or that changes only the caller's pins): nothing was run."
              echo "$msg"; echo "$msg" >> "$GITHUB_STEP_SUMMARY"
              echo "only=true" >> "$GITHUB_OUTPUT"
            fi
          elif [ "$SKIP" = "true" ]; then
            msg="This PR changes only the caller's own pins (index.lock.json, index.config.json). Layer mode mounts the folio-assistant index's lock, never the caller's, so the tests and gates would judge nothing it changed: nothing was run."
            echo "$msg"; echo "$msg" >> "$GITHUB_STEP_SUMMARY"
            echo "only=true" >> "$GITHUB_OUTPUT"
          elif [ "$QUICK" = "true" ]; then
            msg="quick lane: this PR changes only \`${{ inputs.quick-paths }}\`, so only \`bun test ${{ inputs.quick-test }}\` and the typecheck ran (no main side, shards, derive:publish or gates)."
            echo "$msg"; echo "$msg" >> "$GITHUB_STEP_SUMMARY"
            echo "only=true" >> "$GITHUB_OUTPUT"
            echo "quick=true" >> "$GITHUB_OUTPUT"
          elif [ "$DRAFT" = "true" ]; then
            msg="fast tier: this PR was prepared and typechecked only. Release-gated CI (owner, card Q-CIB-4 A, 2026-11-08): a non-release PR runs the fast tier, and the tests, the gates and the comparison with main run on main's integration run and on a PR labelled \`release\`."
            echo "$msg"; echo "$msg" >> "$GITHUB_STEP_SUMMARY"
            echo "only=true" >> "$GITHUB_OUTPUT"
            echo "draft=true" >> "$GITHUB_OUTPUT"
          else
            echo "only=false" >> "$GITHUB_OUTPUT"
          fi
      # Each prepare job pinned the run on its own (they share one time, the
      # first to start writes it). Should both ever have written one, the two
      # sides may have judged different commits: could not determine.
      - name: Both sides judged the same commits
        if: steps.pins-only.outputs.only != 'true' && github.event_name != 'push'
        env:
          HEAD_INDEX: ${{ needs.prepare-head.outputs.index }}
          BASE_INDEX: ${{ needs.prepare-base.outputs.index }}
          HEAD_TOOLS: ${{ needs.prepare-head.outputs.tools }}
          BASE_TOOLS: ${{ needs.prepare-base.outputs.tools }}
        run: |
          echo "index: head ${HEAD_INDEX:-the caller}, base ${BASE_INDEX:-the caller}"
          echo "judging scripts: head $HEAD_TOOLS, base $BASE_TOOLS"
          if [ -z "$HEAD_TOOLS" ] || [ "$HEAD_INDEX" != "$BASE_INDEX" ] || [ "$HEAD_TOOLS" != "$BASE_TOOLS" ]; then
            echo "::error::the two sides were pinned to different commits, or one was not prepared: could not determine"
            exit 2
          fi
      # A push always: main's own verdict (below) reads main-verdict.py.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.pins-only.outputs.only != 'true' || github.event_name == 'push'
        with:
          repository: ${{ env.HARNESS_OWNER }}/cat-harness-tools
          ref: ${{ github.event_name == 'push' && needs.prepare-base.outputs.tools || needs.prepare-head.outputs.tools }}
          sparse-checkout: .github/scripts/layer-pr-checks
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: steps.pins-only.outputs.only != 'true'
        with:
          path: results
          pattern: results-*
      # One shard on one side (`gate-shards: 1` with main's answer cached, or a
      # push) is one artefact, which the action unpacks into `results/` itself.
      # Put it under its own name, as with two or more (bootstrap-tools#68,
      # run 41359773941: "the artefact results-head-1 is missing").
      - name: Keep a lone artefact under its own name
        if: steps.pins-only.outputs.only != 'true'
        run: |
          set -euo pipefail
          if [ -f results/artefact-name ]; then
            name="$(cat results/artefact-name)"
            case "$name" in results-head-[0-9]*|results-base-[0-9]*) ;; *) echo "::error::results/artefact-name is '$name'"; exit 2 ;; esac
            mkdir -p "results/$name"
            find results -maxdepth 1 -type f -exec mv {} "results/$name/" \;
            echo "one artefact, unpacked flat: moved under results/$name"
          fi
      # Handed on by prepare-base, which restored it (cat-harness-tools#926):
      # an artifact of this run, never a cache entry that can be evicted
      # while the head shards run. `cached` is true only when it was handed.
      - name: Main's answer, cached or stored (bean cis2)
        if: steps.pins-only.outputs.only != 'true' && needs.prepare-base.outputs.cached == 'true' && github.event_name != 'push'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: base-answer
          path: ${{ runner.temp }}/base-results
      - name: Say which main the PR is judged against
        if: steps.pins-only.outputs.only != 'true' && needs.prepare-base.outputs.cached == 'true' && github.event_name != 'push'
        env:
          TIER: ${{ needs.prepare-base.outputs.stored-tier }}
          KEY: ${{ needs.prepare-base.outputs.stored-key }}
        run: |
          python3 - "$RUNNER_TEMP/base-results/from.json" "$TIER" "$KEY" <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, sys
          from datetime import datetime, timezone
          path, tier, key = sys.argv[1:4]
          try:
              f = json.load(open(path))
          except (OSError, ValueError):
              f = {}
          print("### Main's side: stored, not recomputed\n")
          if tier == "exact":
              print("Main's answer for exactly these inputs was cached; the base side was not run again.")
          else:
              print(f"Main's answer for these exact inputs was not cached, so this PR is judged against the answer stored for **{tier}**, and main was not recomputed.")
          if f:
              age = ""
              try:
                  at = datetime.fromisoformat(f["pinned_at"].replace("Z", "+00:00"))
                  age = f", {int((datetime.now(timezone.utc) - at).total_seconds() // 3600)} h ago"
              except (KeyError, ValueError):
                  pass
              print(f"\n- main: `{f.get('main', '?')}`, pinned at {f.get('pinned_at', '?')}{age}")
              print(f"- index: `{f.get('index') or 'the caller'}`; run: {f.get('run', '?')}")
          else:
              print(f"\n- stored before its provenance was kept: `{key}`")
          if tier != "exact":
              print("\nIt is the answer for this PR's own base commit; a failure that reached it after that run through the index, a lower layer or a branch-kept graph shows here as new. If a NEW failure below is not this PR's, re-run **all** jobs: a second attempt recomputes main exactly.")
          PY
      - name: Say that this is the first harness PR
        if: steps.pins-only.outputs.only != 'true' && needs.prepare-base.outputs.first-setup == 'true'
        run: |
          {
            echo "### First harness PR: no baseline on main"
            echo
            echo "Main has no \`index.lock.json\` yet, because this PR adds it, so main cannot be mounted. Main's side was computed from this PR's own tree: nothing below can be new, and every failing gate is listed as the baseline this PR sets. Later PRs are judged against main as usual."
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Join each side's shards
        id: join
        if: steps.pins-only.outputs.only != 'true'
        # Exits 2 when any expected shard is missing or the shards do not
        # cover the gate set exactly once: could not determine, never a pass.
        env:
          N: ${{ inputs.gate-shards }}
          # A push ran main's side whatever was cached: it was run for the records.
          CACHED: ${{ needs.prepare-base.outputs.cached == 'true' && github.event_name != 'push' }}
          PUSH: ${{ github.event_name == 'push' }}
          OWN_SHA: ${{ needs.prepare-base.outputs.own-sha }}
          PIN_AT: ${{ needs.prepare-base.outputs.layers-at }}
          INDEX: ${{ needs.prepare-base.outputs.index }}
        run: |
          set -euo pipefail
          sides="base head"
          [ "$PUSH" = "true" ] && sides="base"
          if [ "$CACHED" = "true" ]; then
            mkdir -p merged
            cp -r "$RUNNER_TEMP/base-results" merged/base
            sides="head"
          fi
          for side in $sides; do
            python3 .github/scripts/layer-pr-checks/merge-shards.py results "$side" "$N" "merged/$side"
          done
          if [ "$CACHED" != "true" ]; then
            mkdir -p "$RUNNER_TEMP/base-results"
            cp merged/base/junit.xml merged/base/gates.json "$RUNNER_TEMP/base-results/"
            # Which main this answer is, for a PR that is judged against it
            # stored (the header): shown in that PR's step summary.
            python3 - "$RUNNER_TEMP/base-results/from.json" <<'PY'
          import json, os, sys
          json.dump({
              "main": os.environ["OWN_SHA"],
              "pinned_at": os.environ["PIN_AT"],
              "index": os.environ["INDEX"],
              "run": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }, open(sys.argv[1], "w"), indent=1)
          PY
          fi
          mkdir -p "$RUNNER_TEMP/timings"
          if [ "$PUSH" = "true" ]; then
            cp merged/base/gates.json "$RUNNER_TEMP/timings/gates.json"
          else
            cp merged/head/gates.json "$RUNNER_TEMP/timings/gates.json"
          fi
      - name: Keep main's answer for the next run (bean cis2)
        if: steps.join.outcome == 'success' && needs.prepare-base.outputs.cached != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/base-results
          key: ${{ needs.prepare-base.outputs.key }}
      # The cone's records, from main's shards (cat-harness-tools#398). Saved
      # from a push, so on the default branch, where every PR can restore them.
      # This run's pins, kept beside the records, so a PR mounts what main's
      # gates read (the header's "Pinned to main's record").
      - name: The pins main's side was mounted at (a push)
        if: steps.join.outcome == 'success' && github.event_name == 'push'
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/pin
          key: layer-pr-checks-pin-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Join the CI cone's records (a push)
        id: cone
        if: steps.join.outcome == 'success' && github.event_name == 'push'
        continue-on-error: true
        env:
          N: ${{ inputs.gate-shards }}
          LAYERS_AT: ${{ needs.prepare-base.outputs.layers-at }}
        run: |
          set -euo pipefail
          python3 .github/scripts/layer-pr-checks/merge-cone.py results base "$N" "$RUNNER_TEMP/cone/records.json" "$GITHUB_SHA"
          if [ -f "$RUNNER_TEMP/cone/records.json" ]; then
            echo "kept=true" >> "$GITHUB_OUTPUT"
            # Without both, a PR pins everything now, as before.
            if [ -n "$LAYERS_AT" ] && [ -s "$RUNNER_TEMP/pin/state.json" ]; then
              mkdir -p "$RUNNER_TEMP/cone/pin"
              printf '%s\n' "$LAYERS_AT" > "$RUNNER_TEMP/cone/pin/layers-at"
              cp "$RUNNER_TEMP/pin/state.json" "$RUNNER_TEMP/cone/pin/state.json"
              printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/cone/pin/sha"
              echo "kept with the records: the pins of $GITHUB_SHA (index and lower layers as of $LAYERS_AT)"
            fi
          fi
      - name: Keep the CI cone's records for the PRs (a push)
        if: steps.cone.outputs.kept == 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/cone
          key: ${{ needs.prepare-base.outputs.cone }}
      # The result store (cat-harness-tools#1503): the union of what main's
      # shards carried out, newest 16 per gate, under a key of its own run. A
      # PR restores the newest such key, so the store grows across pushes
      # instead of being replaced.
      - name: Join the result store (a push)
        id: store
        # Only a push to the default branch saves: its cache is the one every
        # PR can restore, and a PR's own run never writes it, so no branch
        # can plant results for another.
        if: steps.join.outcome == 'success' && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        continue-on-error: true
        run: |
          set -euo pipefail
          shopt -s nullglob
          python3 .github/scripts/layer-pr-checks/merge-results.py "$RUNNER_TEMP/result-store" results/results-base-*/result-store-out
          if [ -d "$RUNNER_TEMP/result-store" ] && [ -n "$(ls -A "$RUNNER_TEMP/result-store")" ]; then echo "kept=true" >> "$GITHUB_OUTPUT"; fi
      - name: Keep the result store for the PRs (a push)
        if: steps.store.outputs.kept == 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/result-store
          key: layer-pr-checks-results-v1-${{ github.repository }}-${{ github.sha }}-${{ github.run_id }}
      - name: Keep the gate seconds, to balance the next run's shards
        if: steps.join.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/timings
          key: layer-pr-checks-timings-v1-${{ github.repository }}-${{ github.run_id }}-${{ github.run_attempt }}
      # Main's own verdict, on a push (post-merge QA; owner, 2026-10-30,
      # "Both"): from this run's joined base side, or, when this push ran
      # nothing because main's answer for exactly these inputs was already
      # kept, from that answer. Never compared with anything; the caller's
      # `layer-main-qa.yml` job reports it. No answer to read: unknown.
      - name: Main's kept answer (a push that joined nothing)
        if: ${{ !cancelled() && github.event_name == 'push' && steps.join.outcome != 'success' && needs.prepare-base.outputs.key != '' }}
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/base-results
          key: ${{ needs.prepare-base.outputs.key }}
      # The gates this layer judges (owner, 2026-10-31, "Layers declare their
      # gates"): the caller's own `.github/main-qa-gates.json` at the pushed
      # commit. A layer's root also runs the gates of the layers below it,
      # and many cannot apply there. No file: every gate is judged.
      - name: The gates this layer declares (a push)
        if: ${{ !cancelled() && github.event_name == 'push' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: caller-declared
          sparse-checkout: .github/main-qa-gates.json
          sparse-checkout-cone-mode: false
      - name: Main's own verdict (a push)
        id: main-verdict
        if: ${{ !cancelled() && github.event_name == 'push' }}
        env:
          JOINED: ${{ steps.join.outcome == 'success' }}
          DEFERRED: ${{ needs.prepare-base.outputs.deferred }}
          WINDOW: ${{ needs.prepare-base.outputs.window }}
        # A push that ran nothing on purpose (owner, Q-MQA-2 A) has no answer
        # to read, so main-verdict.py says `unknown`. That is DEFERRED, and
        # the failures say so: `{"deferred": ..., "judged-by": ...}`, which
        # layer-main-qa.yml does not count as could-not-determine. The script
        # is the pinned one; this wrapper is in the workflow every layer
        # calls at main.
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/base-results"
          [ "$JOINED" = "true" ] && dir=merged/base
          out="$RUNNER_TEMP/main-verdict.out"
          : > "$out"
          GITHUB_OUTPUT="$out" python3 .github/scripts/layer-pr-checks/main-verdict.py "$dir" caller-declared/.github/main-qa-gates.json
          verdict="$(sed -n 's/^verdict=//p' "$out" | tail -n 1)"
          if [ "$verdict" = unknown ] && [ -n "$DEFERRED" ]; then
            case "$DEFERRED" in
              batched) reason="batched: this window's integration run (window ${WINDOW:-?}) already started"; by="the next window's first push" ;;
              *) reason="$DEFERRED: this push changes only the caller's pins"; by="the next push that changes more than pins" ;;
            esac
            failures="$(REASON="$reason" BY="$by" python3 -Ic 'import json,os; print(json.dumps({"deferred": os.environ["REASON"], "judged-by": os.environ["BY"]}))')"
            { echo "verdict=unknown"; echo "failures=$failures"; } >> "$GITHUB_OUTPUT"
            echo "Main's verdict: deferred ($reason); judged by $by." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            cat "$out" >> "$GITHUB_OUTPUT"
          fi
      # A push that should have been judged (not batched, not pins-only) and
      # has no answer is a hole, not a deferral (owner, Q-MQA-2 B): main's
      # side ran nothing, or ran and kept no gates.json, and before this the
      # job went green with main's verdict `unknown`.
      - name: A push that should have been judged has main's answer
        if: ${{ !cancelled() && github.event_name == 'push' }}
        env:
          VERDICT: ${{ steps.main-verdict.outputs.verdict }}
          DEFERRED: ${{ needs.prepare-base.outputs.deferred }}
          PREPARED: ${{ needs.prepare-base.outputs.prepared }}
        run: |
          if [ "$VERDICT" = unknown ] && [ -z "$DEFERRED" ]; then
            echo "::error::this push should have been judged (not batched, not pins-only; main's side prepared: $PREPARED) but main's answer could not be read: no base-results/gates.json. Could not determine is never green."
            exit 1
          fi
          echo "main's verdict: ${VERDICT:-none}${DEFERRED:+ (deferred: $DEFERRED)}"
      - name: Tests
        id: tests
        if: steps.pins-only.outputs.only != 'true' && github.event_name != 'push'
        continue-on-error: true
        run: python3 .github/scripts/layer-pr-checks/compare-test-failures.py merged/base/junit.xml merged/head/junit.xml
      - name: Gates
        id: gates
        if: steps.pins-only.outputs.only != 'true' && github.event_name != 'push'
        continue-on-error: true
        run: python3 .github/scripts/layer-pr-checks/compare-gates.py merged/base/gates.json merged/head/gates.json
      # The typecheck runs in the head side's prepare job; it is judged here.
      - name: Verdict
        if: steps.pins-only.outputs.only != 'true' && github.event_name != 'push' && (steps.tests.outcome != 'success' || steps.gates.outcome != 'success' || needs.prepare-head.outputs.typecheck == 'failure')
        run: |
          echo "::error::tests: ${{ steps.tests.outcome }}, gates: ${{ steps.gates.outcome }}, typecheck: ${{ needs.prepare-head.outputs.typecheck }} — see the step summary"
          exit 1
      # The quick lane is judged here: its tests and the typecheck. A PR side
      # that could not be prepared is red, never a pass.
      - name: Quick-lane verdict
        if: steps.pins-only.outputs.quick == 'true'
        env:
          PREPARED: ${{ needs.prepare-head.result }}
          TESTS: ${{ needs.prepare-head.outputs.quick-test }}
          TYPECHECK: ${{ needs.prepare-head.outputs.typecheck }}
        run: |
          echo "quick lane: prepare-head $PREPARED, tests ${TESTS:-not run}, typecheck ${TYPECHECK:-not run}" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$PREPARED" = "success" ] || { echo "::error::quick lane: the PR side could not be prepared ($PREPARED)"; exit 1; }
          [ "$TESTS" = "success" ] || { echo "::error::quick lane: tests ${TESTS:-not run}"; exit 1; }
          [ "$TYPECHECK" != "failure" ] || { echo "::error::quick lane: typecheck failed"; exit 1; }
      # The fast tier (a non-release PR) is judged here. A PR
      # side that could not be prepared is red, never a pass. So is a failed
      # typecheck.
      - name: Draft verdict (fast tier)
        if: steps.pins-only.outputs.draft == 'true'
        env:
          PREPARED: ${{ needs.prepare-head.result }}
          TYPECHECK: ${{ needs.prepare-head.outputs.typecheck }}
        run: |
          echo "prepare-head: $PREPARED, typecheck: ${TYPECHECK:-not run}"
          echo "fast tier: prepare-head $PREPARED, typecheck ${TYPECHECK:-not run}" >> "$GITHUB_STEP_SUMMARY"
          if [ "$PREPARED" != "success" ]; then
            echo "::error::fast tier: the PR side could not be prepared ($PREPARED)"
            exit 1
          fi
          if [ "$TYPECHECK" = "failure" ]; then
            echo "::error::fast tier: typecheck failed"
            exit 1
          fi

  # Whoever re-pins publishes the layers cache ref (owner, 2026-11-08 09:42Z:
  # "make it responsibility of whoever repinned. gate"). A PR that changes
  # the index's `index.lock.json` must find `refs/cat/layers/<key>` for its
  # new lock at this repository: `mount:remote` pushes it after a re-pin, and
  # `bun run cat layers:publish` pushes it by hand. This job only asks
  # (`git ls-remote`, seconds); the build and the push never run on a runner.
  # A PR that leaves the lock alone owes nothing and passes.
  layers-ref:
    name: Layers cache ref for a re-pinned lock
    if: inputs.mode == 'index' && github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          path: fa
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - name: Is this lock's layers ref published?
        run: |
          set -euo pipefail
          [ -f fa/index.lock.json ] || { echo "no index.lock.json: nothing to check"; exit 0; }
          base='HEAD^1'
          git -C fa rev-parse -q --verify 'HEAD^2' >/dev/null || base='HEAD~1'
          if git -C fa diff --quiet "$base" HEAD -- index.lock.json 2>/dev/null; then
            echo "index.lock.json is unchanged by this PR: no layers ref owed"
            exit 0
          fi
          read -r repo sha < <(bun -e '
            const l = JSON.parse(require("node:fs").readFileSync("fa/index.lock.json", "utf-8"));
            const i = (l.instances ?? []).find((x) => x.instance === "cat-harness-tools");
            console.log(i ? `${i.repository} ${i.sha}` : "- -");
          ')
          [ "$repo" != "-" ] || { echo "::notice::the lock pins no cat-harness-tools: the gate is not enabled"; exit 0; }
          work="$(mktemp -d)" && git -C "$work" init -q
          git -C "$work" fetch -q --depth 1 --filter=blob:none "https://github.com/${repo}.git" "$sha"
          git -C "$work" checkout -q FETCH_HEAD -- scripts/mount-from-lock.ts
          # A pin older than the gate has no --check-layers, and an unknown
          # flag there would run a full mount instead: report and pass.
          if ! grep -q -- '--check-layers' "$work/scripts/mount-from-lock.ts"; then
            echo "::notice::the pinned cat-harness-tools (${sha:0:12}) predates layers:check; the gate starts with the next re-pin"
            exit 0
          fi
          # A sandbox's publish waits on its claude/cat-layers/<key> branch
          # until layers-move.yml moves it (state `pending`): wait for it.
          for i in $(seq 1 30); do
            out="$(CAT_LAYERS_URL="https://github.com/${{ github.repository }}.git" \
              bun "$work/scripts/mount-from-lock.ts" --check-layers --root fa --changed-from "$base" 2>&1)" && { echo "$out"; exit 0; }
            echo "$out"
            case "$out" in *"(pending)"*) sleep 20 ;; *) break ;; esac
          done
          echo "::error::this PR re-pins index.lock.json but its layers cache ref is not published. Whoever re-pinned runs \`bun run cat layers:publish\` from their checkout (mount:remote does it after a re-pin); from a sandbox it lands on a claude/cat-layers/ branch that layers-move.yml moves."
          exit 1

  # The lock's harness pins agree with the pinned harnesses' own locks (owner,
  # 2026-11-11, after a content layer's main went red on pins skewed between
  # new and old mains). A layer that pins harness X at A while another pinned
  # harness Y, at its pin, pins X at B must have A contain B: Y was built and
  # tested against X at B. And every pin is FRESH (owner, 2026-11-11, card
  # "A: Agree check + freshness"): at its repository's main HEAD when the run
  # looks, or a descendant of it, so a re-pin moves every layer together. Every
  # pull request that changes `index.lock.json`, in either mode, on the fast
  # tier; one that leaves the lock alone passes. `check-lock-coherence.ts`
  # says why "contains" and not "equals", and why freshness too.
  lock-coherence:
    name: Lock pins agree with each other and are at main
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          path: fa
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - name: Do this lock's harness pins agree, and are they at main?
        run: |
          set -euo pipefail
          [ -f fa/index.lock.json ] || { echo "no index.lock.json: nothing to check"; exit 0; }
          base='HEAD^1'
          git -C fa rev-parse -q --verify 'HEAD^2' >/dev/null || base='HEAD~1'
          if git -C fa diff --quiet "$base" HEAD -- index.lock.json 2>/dev/null; then
            echo "index.lock.json is unchanged by this PR: nothing to check"
            exit 0
          fi
          # The judging script at the cat-harness-tools commit the lock pins,
          # as layers-ref takes its replayer.
          read -r repo sha < <(bun -e '
            const l = JSON.parse(require("node:fs").readFileSync("fa/index.lock.json", "utf-8"));
            const m = (l.mounts ?? []).find((x) => x.harness === "cat-harness-tools");
            console.log(m ? `${m.repository} ${m.ref}` : "- -");
          ')
          [ "$repo" != "-" ] || { echo "::notice::the lock pins no cat-harness-tools: the gate is not enabled"; exit 0; }
          work="$(mktemp -d)" && git -C "$work" init -q
          git -C "$work" fetch -q --depth 1 --filter=blob:none "https://github.com/${repo}.git" "$sha"
          if ! git -C "$work" checkout -q FETCH_HEAD -- scripts/check-lock-coherence.ts scripts/git-ancestry.ts 2>/dev/null; then
            echo "::notice::the pinned cat-harness-tools (${sha:0:12}) predates lock:coherence:check; the gate starts with the next re-pin"
            exit 0
          fi
          set +e
          bun "$work/scripts/check-lock-coherence.ts" --lock fa/index.lock.json --cache "$RUNNER_TEMP/lock-coherence"
          code=$?
          set -e
          case "$code" in
            0) exit 0 ;;
            1) echo "::error::this PR's index.lock.json pins a harness older than (or diverged from) what another pinned harness's own lock pins it at, or behind its repository's main. Re-pin every harness named above to its current main in one re-pin (\`bun run cat mount:remote\`), so every layer runs against what it was tested with." ;;
            *) echo "::error::could not determine whether this lock's pins agree and are at main (exit $code): a fetch or an ancestry query failed, and that is never read as a pass. Re-run the job; if it persists, read the reasons above." ;;
          esac
          exit 1
