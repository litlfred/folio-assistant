# QA sweep — every integration watcher over this folio's blocks.
#
# Written by `folio_init` from cat-harness-tools/templates/document/. The
# steps are the platform's, in ONE reusable workflow
# (litlfred/cat-harness-tools/.github/workflows/folio-qa-sweep.yml): it mounts
# the layers index.lock.json pins, sweeps `{{folio}}/`, and publishes the
# derived verdicts to this repository's orphan `qa-reports` branch.
# Dispatch-only until you enable the pull_request trigger.
name: QA sweep (all integration watchers)

on:
  workflow_dispatch:
  # pull_request:
  #   types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  qa-sweep:
    uses: litlfred/cat-harness-tools/.github/workflows/folio-qa-sweep.yml@main
    with:
      folio: "{{folio}}"
