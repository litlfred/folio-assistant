# QA sweep nightly — keeps this folio's QA verdicts current on qa-reports.
#
# Written by `folio_init` from cat-harness-tools/templates/document/. The
# steps are the platform's reusable
# litlfred/cat-harness-tools/.github/workflows/folio-qa-sweep-nightly.yml.
# Never opens a pull request committing derived verdicts to main.
name: QA sweep nightly

on:
  workflow_dispatch:
    inputs:
      axes:
        description: "Comma-separated axes to sweep"
        required: false
        default: "canonical,one-voice,q-usage,compute,detangler"

permissions:
  contents: write

jobs:
  qa-sweep:
    uses: litlfred/cat-harness-tools/.github/workflows/folio-qa-sweep-nightly.yml@main
    with:
      folio: "{{folio}}"
      axes: ${{ inputs.axes }}
