<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="c@t-harness">
  <title>c@t-harness — grumpy, with at-sign eyes</title>
  <g fill="none" stroke="#4b5563" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- ears -->
    <path d="M28 44 L16 2 L52 26 Z" fill="#b7c9a8"/>
    <path d="M92 44 L104 2 L68 26 Z" fill="#b7c9a8"/>
    <path d="M30 37 L22 12 L45 27 Z" fill="#93a884" stroke="none"/>
    <path d="M90 37 L98 12 L75 27 Z" fill="#93a884" stroke="none"/>
    <!-- head: flat on top, heavy jowls -->
    <path d="M24 48 C24 28 40 20 60 20 C80 20 96 28 96 48
             C96 76 84 98 60 98 C36 98 24 76 24 48 Z" fill="#c9ced6"/>
    <!-- brows: the whole expression lives here -->
    <path d="M30 40 L49 48" stroke-width="4.4"/>
    <path d="M90 40 L71 48" stroke-width="4.4"/>
    <!-- eyes, each a small @ -->
    <g stroke-width="2.6">
      <path d="M46.4 62.8 A8 8 0 1 1 51.5 57.7" />
      <circle cx="42" cy="56" r="2.9" fill="#4b5563"/>
      <path d="M81.4 62.8 A8 8 0 1 1 86.5 57.7" />
      <circle cx="77" cy="56" r="2.9" fill="#4b5563"/>
    </g>
    <!-- nose and the frown -->
    <path d="M55 72 L65 72 L60 78 Z" fill="#9aa2ad"/>
    <path d="M60 78 L60 82"/>
    <path d="M60 82 q-10 9 -18 1"/>
    <path d="M60 82 q10 9 18 1"/>
    <!-- whiskers -->
    <g stroke-width="2.2" opacity="0.8">
      <path d="M38 78 L10 72"/><path d="M38 84 L11 86"/>
      <path d="M82 78 L110 72"/><path d="M82 84 L109 86"/>
    </g>
  </g>
</svg>
