<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="c@t-harness">
  <title>c@t-harness — a grumpy cat is the inner a of the @, with big sage ears</title>
  <g fill="none" stroke="#4b5563" stroke-linecap="round" stroke-linejoin="round">
    <!-- the @ ring, open at the lower right -->
    <path d="M74.8 102.4 A44 44 0 1 1 101.1 76.1" stroke-width="9"/>
