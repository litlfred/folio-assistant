    <path d="M37.1 63.8 L26 28 L51.5 52.2 Z" fill="#b7c9a8" stroke-width="5"/>
    <path d="M70.9 63.8 L82 28 L56.5 52.2 Z" fill="#b7c9a8" stroke-width="5"/>
