<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="c@t-harness">
  <title>c@t-harness — the @ mark as a single-colour mask</title>
  <!--
    THE MASK FORM OF `cat-mark.svg`. Bean `nwrm`.

    `cat-mark.svg` bakes six colour literals — #6f8b66 sage, #cfe0c2 pale
    sage, #ffffff face and whiskers — and is drawn with <img>, which no page
    CSS can reach. So the mark could follow neither the colour scheme nor the
    instance's declared tone, and `cat-harness` rendered a SAGE mark inside a
    tile themed from its declared hue of 268. Two colour vocabularies for one
    instance, which is the drift `schemas/theme.ts` exists to have ended.

    Owner: *"I want theme like in avaatars"*. An avatar is a MASK plus a
    `background-color` derived from one declared hue, so this is the same
    drawing expressed as alpha: opaque where the mark should take the colour,
    TRANSPARENT where it should cut out and show the page through.

    ## The cut-outs are the design, not a compromise

    `cat-mark.svg`'s own description says the whiskers are *"cut in white
    across the sage"*, and the face is a white counter inside the cat's head.
    Both are cut-outs already; the only thing this loses is the pale-sage EAR
    step, which flattens into the body. That is the cost the owner accepted
    when choosing one colour with cut-outs over two hand-derived tones.

    ## Why a <mask> rather than painting transparent shapes

    SVG has no "erase": a transparent shape drawn over a filled one shows the
    filled one. So the layers go inside a <mask>, where WHITE shows and BLACK
    hides, and the mask is applied to one full-bleed rect. The stacking order
    below is `cat-mark.svg`'s own, unchanged — halo hides, body shows again,
    face and whiskers hide — because the drawing already depends on it.
  -->
  <defs>
    <path id="catOuter" d="M33.5 60
      C32.8 52 33.2 45.5 34.2 42 L35 24 L52.5 40.5
      C55.5 39 65.5 39 68.5 40.5 L86 24 L86.8 42
      C87.8 45.5 88.2 52 87.5 60
      C87.5 77 77.5 86 60.5 86 C43.5 86 33.5 77 33.5 60 Z"/>
    <mask id="markMask" maskUnits="userSpaceOnUse" x="0" y="0" width="120" height="120">
      <!-- The @ ring and its tail — shown. -->
      <g fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round">
        <circle cx="60.5" cy="57.8" r="42.8" stroke-dasharray="224 44.9" stroke-dashoffset="-63"/>
        <path d="M70.5 99.6 Q 88 102.5 98 89.5"/>
      </g>
      <!-- The halo that separates the cat from the ring — a CUT-OUT. -->
      <use href="#catOuter" fill="#000000" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
      <!-- The cat, shown again over the hole the halo just made. -->
      <use href="#catOuter" fill="#ffffff"/>
      <!-- The ears. Pale sage in the colour mark; here they are simply part
           of the body, which is the one tonal step this form gives up. -->
      <path d="M37 43 L37.4 28.5 L49.5 39.5 Z" fill="#ffffff"/>
      <path d="M84 43 L83.6 28.5 L71.5 39.5 Z" fill="#ffffff"/>
      <!-- The face — a CUT-OUT, as it is a white counter in the colour mark. -->
      <path d="M60.5 47.5 C71 47.5 78 55 78 64.5 C78 74 71 81 60.5 81
               C50 81 43 74 43 64.5 C43 55 50 47.5 60.5 47.5 Z" fill="#000000"/>
      <!-- The whiskers — cut ACROSS the ring, exactly as the colour mark
           describes them. -->
      <g stroke="#000000" stroke-width="2.4" stroke-linecap="round" fill="none">
        <path d="M40.5 56.5 Q33 55 27.5 55.8"/>
        <path d="M40 63.5 Q32.5 63.5 26.5 65"/>
        <path d="M40.5 70 Q34 72 29.5 74.5"/>
        <path d="M80.5 56.5 Q88 55 93.5 55.8"/>
        <path d="M81 63.5 Q88.5 63.5 94.5 65"/>
        <path d="M80.5 70 Q87 72 91.5 74.5"/>
      </g>
    </mask>
  </defs>
  <rect x="0" y="0" width="120" height="120" fill="#000000" mask="url(#markMask)"/>
</svg>
