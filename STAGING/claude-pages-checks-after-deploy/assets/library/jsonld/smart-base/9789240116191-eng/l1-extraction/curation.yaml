  p25:s1:
  - as: recommendation
    key: NPC-R04
    basis: The chapter's opening statement, without the running header the splitter joined to it.
    statement: For effective use of data in operations, analysis, and decision-making, the integrity and quality of data must be consistently and continuously maintained.
  p25:s3:
  - as: recommendation
    key: NPC-R05
    basis: A normative 'should' on data management policies.
  p25:s5:
