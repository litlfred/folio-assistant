  p22:s1:
  - as: recommendation
    key: NPC-R02
    basis: One bullet of the step table on page 22; the splitter read the table as one sentence.
    statement: Regulatory policies and guidelines must promote efficient mechanisms for stakeholders such as manufacturers, distributors and other suppliers to share the required data.
  - as: recommendation
    key: NPC-R03
    basis: A second bullet of the same step table.
    statement: Timelines with phased roll-out of policies should be outlined to ensure effective compliance by manufacturers.
  p23:s1:
