    basis: A note on reading the chapter's steps, not guidance.
  p26:s1:
  - as: recommendation
    key: NPC-R06
    basis: The footnoted (*) statement on page 26, without the running header.
    statement: 'Master data management procedures should include the following key elements to continuously and securely maintain master data: • Data governance framework: Establish clear policies, roles,
      responsibilities, and processes to ensure data quality and consistency for use across the health supply chain.'
  p26:s3:
    as: exclude
    reason: editorial
    basis: Defines the data owner role the governance framework in NPC-R06 assigns. Was a `remark` (definition) of NPC-R06; L1 3.0's remark attaches only to a recommendation, and NPC-R06 is an implementation-practice (owner ruling 1b, 2026-10-12), so it is proposed for exclusion until remark is licensed on a practice upstream.
  p27:s1:
  - as: recommendation
    key: NPC-R07
    basis: A bullet of the step table on page 27.
    statement: Data harmonization activities must consider all sources of product data, as well as the systems, processes, and organizations or stakeholders that will utilize this data.
  p28:s1:
  - as: recommendation
    key: NPC-R08
    basis: The footnoted (*) statement on page 28, without the running header.
    statement: Master data definitions and structures should include provisions for maintaining product classifications, generic product information, and trade item details.
  p29:s3:
  - as: recommendation
    key: NPC-R09
    basis: Printed under 'Best practices'; the figure caption before it is not part of it.
    statement: It is generally recommended to avoid including product classification or product characteristics such as dosage and strength in the generic national product code.
  p29:s4:
  - as: recommendation
    key: NPC-R10
    basis: Best practice, first sentence of the bullet; the splitter joined the next bullet.
    statement: Instead, a system-generated sequential numeric or alphanumeric code should be used.
  - as: recommendation
    key: NPC-R11
    basis: The next 'Best practices' bullet.
    statement: Product characteristics such as dosage, strength, pack size, and route of administration should be defined as attributes and linked to the product codes.
  p29:s5:
  - as: recommendation
    key: NPC-R12
    basis: A 'Best practices' bullet.
    statement: Generic national product codes, including drug codes and medicinal product identifiers (when using the WHO Drug Dictionary), should be mapped to trade item-specific identifiers, such as GTINs,
      or similar unique identifiers where GTINs are not available.
  - as: recommendation
    key: NPC-R13
    basis: A 'Best practices' bullet.
    statement: The product coding system should maintain uniform code lengths and ensure scalability to accommodate an increasing number of unique products.
  - as: recommendation
    key: NPC-R14
    basis: A 'Best practices' bullet.
    statement: Product master data structures should support the mapping of one generic national product code to multiple corresponding trade items.
  p29:s6:
  - as: recommendation
    key: NPC-R15
    basis: Continues NPC-R14's bullet; the remark after it explains why (packaging hierarchies are critical).
    statement: In addition, the data structure should organize multiple packaging levels and quantity relationships across those.
  p32:s4:
  - as: recommendation
    key: NPC-R16
    basis: A normative 'should' on data sensitivity categories.
  p32:s5:
  - as: recommendation
    key: NPC-R17
    basis: A normative 'should' on access control; follows NPC-R16.
  p32:s7:
  - as: recommendation
    key: NPC-R18
    basis: A bullet of the step on establishing a master data governance group.
    statement: The governance group should support the overall governance and planning of product master data standardization, capture, and dissemination activities, and provide leadership and oversight
      for all data management efforts.
