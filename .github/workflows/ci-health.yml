# bpmn: cat-harness/processes/sdlc/ci-health-watch.bpmn
# CI health watchdog — the backstop for the report nobody is in the room to read.
#
# `docs-site.yml` was triggered by all 30 `main` pushes between 2026-06-29 and
# 2026-08-26, and failed every one. Bean `xom7` fixed the *visibility* half:
# `cat-harness/scripts/check-ci-health.ts` classifies every workflow's state on the default
# branch, and `session-start-coord-sweep.sh` prints it where agent attention
# already goes.
#
# That leaves the half this workflow is for. A report printed at session start
# is only ever seen by someone who starts a session. The failure mode being
# guarded against is precisely a quiet stretch with nobody looking — which is
# the stretch in which no session starts either. Bean `ynu8`.
#
# Why not just GitHub's own failure email: it sent 30 of them, and the whole
# premise of `xom7` is that it is a channel nobody reads. So this does not add
# another. It maintains ONE tracking issue, which shows in the repo's open-issue
# count on the front page, and closes it when `main` is clean again.
#
# It fires on TWO different blind spots, and they are not the same defect.
# Bean `kgho`, 2026-09-30:
#
#   - a QUIET stretch, with nobody working: the weekly `schedule:` below. This
#     is `ynu8`'s original case, and its reasoning is unchanged.
#   - an ACTIVE stretch: `main` moves every 7.7 min here (measured over 186
#     merges in 24h) and a red `main` blocks every branch in flight at once.
#     `391j` had NINE red-`main` incidents in one day and needed three
#     `Unblock main:` fixes in a week — and each of those cost somebody the time
#     to NOTICE first, which is the part a weekly cadence cannot shorten.
#     Weekly cannot bound that, because the premise of the weekly
#     argument — "the sweep already covers every day somebody is working" — is
#     about whether a session STARTS, not about how long a red persists inside
#     one. So `workflow_run` below fires on the failing run itself.
#
# Cost: this repository is PUBLIC, so standard GitHub-hosted runners are free.
# One ~40s job a week, plus one per FAILING gating run on `main` — nothing at
# all while `main` is green, because the job is conditioned on the triggering
# run's conclusion. The cost scales with the defect, not with the merge cadence.

name: CI health watchdog

on:
  # Weekly, not daily. The defect is "nobody noticed for two months", not
  # "nobody noticed for a day", and the session-start sweep already covers every
  # day somebody is actually working. A weekly backstop bounds the blind spot to
  # seven days without turning the tracking issue into a feed.
  schedule:
    - cron: '17 9 * * 1'
  # ...and on the failure itself, for the ACTIVE stretch the weekly cadence
  # cannot bound. Bean `kgho`.
  #
  # WHY `workflow_run` AND NOT `push`. A `push`-triggered run starts at the same
  # instant as the gating workflows it exists to report on, so it would read
  # them as `in_progress` — which `check:ci-health` correctly declines to call
  # red, and rightly refuses to call green either. The result would be a job
  # that runs 186 times a day to report "could not determine". `workflow_run`
  # fires AFTER the triggering run completes, so the state it reads is settled.
  # That is this module's own could-not-determine discipline applied to the
  # trigger rather than fought against.
  #
  # The two named are the workflows that GATE `main` — the ones whose red is
  # what a person needs to hear about. `docs-site.yml` also runs on `main` and
  # is deliberately absent: it is a publish step, its failure does not block a
  # merge, and the weekly sweep reports it like everything else. Naming it here
  # would turn a broken preview into an immediate page.
  #
  # NOT filtered to the failing case HERE. `workflow_run` takes no `conclusions:`
  # filter, so the condition is on the job, where `conclusion == 'failure'` is
  # checkable. A skipped job costs no runner and still reports as a run, which is
  # the honest record of "asked, nothing to do".
  workflow_run:
    workflows: ["Code-quality gates", "JSON-LD generated-file drift"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ci-health
  cancel-in-progress: false

jobs:
  report:
    # bpmn-node: Start_Sweep
    name: Report CI health on the default branch
    # On a `workflow_run` trigger, only a RED triggering run is worth a sweep;
    # the schedule and a manual dispatch always sweep. Written as "not
    # workflow_run OR red" rather than as a list of allowed events, so adding a
    # future trigger does not silently skip the job — the failure mode `1xhc`
    # is about.
    #
    # RED IS FIVE CONCLUSIONS, NOT ONE. This said `== 'failure'` until review on
    # #1725 pointed out the gap: `check:ci-health` calls a workflow red when its
    # newest settled run is anything other than `success`, and its
    # `NOT_A_VERDICT` set — the only conclusions that are neither red nor green —
    # is exactly `cancelled`, `skipped`, `neutral`. So `timed_out`,
    # `action_required`, `stale` and `startup_failure` are all red by this
    # repository's own definition, and any of them can leave a gating workflow
    # blocking `main`. Under `== 'failure'` the job skipped and the tracking
    # issue waited up to a week for the cron — the very latency this trigger
    # exists to remove, for four conclusions out of five.
    #
    # Listed positively rather than as "not success and not NOT_A_VERDICT",
    # because a GitHub expression cannot read that set and a hand-written
    # negation would be a second spelling of it. `workflow-triggers.test.ts`
    # holds the two in agreement — it derives this list from `NOT_A_VERDICT`
    # and fails if they drift.
    if: >-
      github.event_name != 'workflow_run' ||
      contains(fromJSON('["failure","timed_out","action_required","stale","startup_failure"]'),
               github.event.workflow_run.conclusion)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true
          # REQUIRED, and not an optimisation to shave off. The `superseded`
          # rule asks `git log -1 --format=%cI -- <workflow file>` to find out
          # whether a red verdict predates a change to the file that produced
          # it. A shallow clone cannot answer, `workflowChangedAt` returns
          # undefined, and the check correctly leaves the failure reported —
          # which would resurrect the two permanent false fires that rule exists
          # to retire (`witness-refresh.yml`, `qa-sweep.yml`; bean `lq7e`).
          # The whole history is 3.8 MiB.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check CI health
        id: check
        run: |
          set +e
          bun run check:ci-health --out "$RUNNER_TEMP/ci-health.md"
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          # 0 = clean, 1 = live failure(s), 2 = could not check. Anything else
          # is a crash in the checker, and is treated as "could not check".
          # bun exits 1 on an uncaught exception too, so exit 1 alone does not
          # distinguish "found live failures" from "crashed". The report file is
          # what separates them: `--out` writes it before any exit path, so a
          # red always has one and a crash before that point does not. Without
          # this, a crash would open a tracking issue quoting a stale file.
          report="$RUNNER_TEMP/ci-health.md"
          if [ "$status" = "1" ] && [ ! -s "$report" ]; then
            echo "::warning::checker exited 1 without writing a report — treating as unchecked"
            status=2
          fi
          case "$status" in
            0) echo "verdict=clean" >> "$GITHUB_OUTPUT" ;;
            1) echo "verdict=red" >> "$GITHUB_OUTPUT" ;;
            *) echo "verdict=unknown" >> "$GITHUB_OUTPUT" ;;
          esac
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Ensured for BOTH issue paths, not just the one that creates. The clean
      # path filters `gh issue list --label ci-health` too, and on a repo where
      # nothing has ever gone red that label would not otherwise exist yet.
      # Skipped on `unknown`, where neither path runs and a label hiccup must
      # not be what fails the job.
      - name: Ensure the tracking label exists
        if: steps.check.outputs.verdict != 'unknown'
        run: gh label create ci-health --color B60205 --description "Automated CI health watchdog" --force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Open or update the tracking issue
        if: steps.check.outputs.verdict == 'red'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            cat "$RUNNER_TEMP/ci-health.md"
            echo
            echo "---"
            echo
            echo "Maintained by [\`ci-health.yml\`]($RUN_URL). This issue is edited in place"
            echo "each week and closed automatically once \`main\` is clean, so its body is"
            echo "always the current state rather than a log. Bean \`ynu8\`."
          } > "$RUNNER_TEMP/issue-body.md"

          existing=$(gh issue list --label ci-health --state open \
            --json number --jq '.[0].number // empty')

          if [ -n "$existing" ]; then
            # Edit rather than comment: an edit does not notify, so a failure
            # that persists for weeks stays one unread-count of one.
            gh issue edit "$existing" --body-file "$RUNNER_TEMP/issue-body.md"
            echo "updated issue #$existing"
          else
            gh issue create \
              --title "CI is red on the default branch" \
              --label ci-health \
              --body-file "$RUNNER_TEMP/issue-body.md"
          fi

      - name: Close the tracking issue when main is clean
        if: steps.check.outputs.verdict == 'clean'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          existing=$(gh issue list --label ci-health --state open \
            --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue close "$existing" \
              --comment "Every workflow with a recent run on the default branch is green again. Closed by \`ci-health.yml\`."
            echo "closed issue #$existing"
          else
            echo "clean, and no tracking issue open — nothing to do."
          fi

      # "Could not check" is not "healthy". The checker refuses to render an
      # unreachable API as green, and so does this: the tracking issue is left
      # exactly as it is — NEVER closed — and the job fails, which makes this
      # workflow itself red on `main`, which next week's run will report. The
      # watchdog is watched by the watchdog.
      - name: Refuse to report success on an unchecked repo
        if: steps.check.outputs.verdict == 'unknown'
        run: |
          echo "::error::CI health could not be determined (exit ${{ steps.check.outputs.status }})."
          echo "::error::Treat this as unknown, not as green. The tracking issue was left untouched."
          exit 1
