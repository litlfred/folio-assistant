# bpmn: cat-harness/processes/sdlc/code-quality-gates.bpmn
# Code-quality gates — cheap, fast static checks that protect compute infra.
#
# Four jobs (the first three per
# docs/handover/2026-06-09-affectionate-hopper-handover.md §2).
#
# TWO of the four jobs gate THIS repo; two scan trees only a folio has. Which
# is which is stated in each job, and a job with nothing to scan says so
# rather than printing OK — see the note on `lean-bare-import`.
#
#   1. Lean bare-import gate — HARD FAIL on `import Mathlib` (the whole
#      library). A bare `import Mathlib` pulls the entire Mathlib build cone
#      into a single content-block / lib file, which is what drives the
#      >9-min full-library `lake build` timeout. Targeted imports keep the
#      per-file dependency cone (and CI build) small. FOLIO tree: the Lean
#      sources live in `content/<paper>/lean/`, so in the platform repo this
#      job has nothing to scan and skips.
#
#   2. Python unused / wildcard imports — HARD GATE (promoted from
#      warn-only). ruff F401 (unused import) + F403 (`from x import *`) over
#      this repo's Python. It used to scan `folio-assistant/computations` and
#      `tools`, neither of which exists here — ruff warned about the missing
#      paths and exited 0, so the step reported a clean baseline it had never
#      computed. Repointed at the trees that hold the 44 real files, which
#      surfaced 24 live F401s; those were drained, so the rule is an error.
#      This job also RUNS `scripts/tests/*.test.py`, which previously ran
#      nowhere: run-tests.sh delegates to `bun test` and that collects only
#      `*.test.ts`, so the Python tests were green by never executing.
#
#   3. TypeScript gate — HARD FAIL on `bun test`, `bun run lint`, and
#      `tsc --noEmit`. Each is a real regression gate rather than a baseline
#      report: the suite is 428 pass / 0 fail; `tsc` covers all five trees
#      (`src`, `schemas`, `content`, `scripts`, `adapters`), not just `src`;
#      and `eslint` has every rule at `error` — the `warn` tier is empty, so
#      a red lint always means a regression rather than pre-existing debt.
#      Without this job none of that is enforced: the ratchet only works if
#      something runs it — which is exactly what went wrong, see `on:` below.
#
#   4. Rust wildcard imports — WARN-ONLY ratchet. Lightweight grep report
#      of non-test `use ...::*;` in tools/ (full `clippy -D
#      clippy::wildcard_imports` is the eventual upgrade, but a cargo build
#      on every PR is too heavy for a static gate; the grep ratchet flags
#      new wildcard imports cheaply). FOLIO tree: zero `.rs` files here, so
#      this job skips.

name: Code-quality gates

on:
  # This workflow was added by the commit "ci: give the ratchet something to
  # run in", whose message correctly reported that "no folio-assistant workflow
  # triggers on `pull_request`" — and was then written `workflow_dispatch`-only,
  # so it never ran. The fix for "nothing runs the ratchet" was itself something
  # that never runs. Of 33 workflows here, exactly two auto-trigger
  # (atomic-mass-gen-check, docs-site) and neither runs any TypeScript check.
  #
  # No `paths:` filter. The TypeScript job is the gate for the whole repo, and
  # a filter is how a gate stops covering the file that broke it.
  pull_request:
  # The MERGE QUEUE — bean `nytj`. A pull_request run tests the PR merged with
  # main AS IT WAS WHEN THE PR WAS PUSHED; anything that lands on main after
  # that is untested in combination. Three times on 2026-09-23 a generated
  # measurement (`kg:detangle`, `kg:audit`) was green on the branch and green
  # on main and stale on the two merged — "the state that breaks is the one
  # neither party evaluates". A merge_group run tests EXACTLY the commit that
  # will land. No job here reads event_name or head_ref, which a merge_group
  # run leaves empty — checked, and kept that way.
  #
  # THIS TRIGGER HAS NEVER FIRED AND CANNOT — bean `1hjm`, measured 2026-09-30.
  # It read "inert until the owner turns the merge queue on for `main`" until
  # then, which promised a pending state that cannot arrive: the repository's
  # ruleset form offers thirteen rules and `Require merge queue` is not among
  # them. GitHub renders only the rules a repository is ELIGIBLE for, so the
  # absence is the measurement, and the rule behind it is organization
  # ownership: merge queues are available in a public repository owned by an
  # ORGANIZATION, or a private one owned by an organization on Enterprise
  # Cloud. `folio-assistant` is public and owned by the user `litlfred`, so it
  # is outside both arms. Sourced with one caveat recorded in `1hjm`: the page
  # itself is egress-blocked from the agent container, so that wording comes
  # from web search OVER the page rather than from the page.
  #
  # The trigger is KEPT anyway, deliberately: it becomes correct with no work
  # if the repository ever moves under an organization, and removing it would
  # only have to be undone. What was wrong was the claim about WHY it is inert
  # — an agent reading the old sentence concludes the queue is one owner click
  # away, which is what happened repeatedly across one session before anybody
  # looked at the form.
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean-bare-import:
    # bpmn-node: Task_Lean
    name: Lean bare-import gate (hard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # HARD GATE: a bare `import Mathlib` (optionally trailing whitespace)
      # at the start of a line is forbidden in content Lean files. Use
      # targeted imports (run `#min_imports` after a clean build to find
      # them).
      - name: No bare `import Mathlib`
        run: |
          set -euo pipefail
          # Say which of the two facts this is. `content/` in the PLATFORM repo
          # holds only `pipeline/` — zero .lean files — so this printed
          # "OK — no bare 'import Mathlib'" having looked at nothing at all.
          # "None found" and "nothing to look at" are different, and a gate that
          # reports the first while meaning the second is worse than no gate:
          # it reads as coverage. The Lean tree lives in the FOLIO; this job is
          # here for folios that vendor this workflow.
          # THREE states, not two, and the missing one is what broke this.
          #
          # This was `count=$(find content … | wc -l)` guarding `-eq 0`. It
          # distinguished "no Lean files" from "some Lean files" and had no
          # answer for "no `content/` AT ALL" — so when the move (bean `wggr`)
          # put this repo's `content/` under `cat-harness/`, `find` exited 1 on
          # the missing directory, `set -o pipefail` promoted that to the
          # pipeline's status, and `set -e` killed the job. A gate written
          # expressly to skip when there is nothing here failed instead.
          #
          # `2>/dev/null` hid the message and not the exit code, which is why it
          # reads as a mystery rather than as "directory not found".
          #
          # `content/` stays UNPREFIXED deliberately: this job is vendored by
          # folios, where the Lean tree really is at `content/<paper>/lean/`.
          # Prefixing it would fix this repo and break every folio.
          if [ ! -d content ]; then
            echo "SKIP — no content/ directory (this is the PLATFORM repo; the Lean tree lives in a folio). Nothing scanned."
            exit 0
          fi
          count=$(find content -name '*.lean' | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "SKIP — content/ exists but holds no .lean files. Nothing scanned."
            exit 0
          fi
          echo "Scanning $count Lean file(s)…"
          if matches=$(grep -rnE '^import Mathlib[[:space:]]*$' \
                content --include='*.lean' 2>/dev/null); then
            echo "::error::Bare 'import Mathlib' found — use targeted imports (#min_imports). Offenders:"
            echo "$matches" | while IFS= read -r line; do
              echo "::error::$line"
              echo "  $line"
            done
            exit 1
          fi
          echo "OK — no bare 'import Mathlib' in $count Lean file(s)"

  python-imports:
    # bpmn-node: Task_Python
    name: Python unused/wildcard imports (hard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install "ruff>=0.5"

      # The Python backends the scripts actually import, from the file
      # `schemas/python-deps.ts` generates. Bean `68dt`: nothing declared them
      # before, so `pdf-structure.py` needed PyMuPDF and CI had no way to know
      # — which made every PDF path one CI could not exercise, the `5rfy`
      # defect (a gate that never fires).
      #
      # `requirements.txt` is the LEAN set. `requirements-extended.txt` is
      # deliberately NOT installed: camelot-py is 912 KB but pulls numpy,
      # pandas and OpenCV — 323 MB, measured 2026-09-20, more than the whole
      # lean set — for one script. That is a cost statement, not a
      # deprecation; `pdf-tables.py` is live and its tests run outside CI.
      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # HARD GATE, promoted from warn-only. Same rule as eslint: a check is an
      # error only once its count is zero, and this repo's count is zero — the
      # 24 live F401s were drained in the same commit that repointed the scan.
      # `continue-on-error` is gone with it; a new unused import fails here.
      - name: ruff F401,F403
        #
        # Was pointed at `folio-assistant/computations tools`. Neither exists
        # here: `tools/` is a folio tree, and `folio-assistant/computations` is
        # a FOLIO-RELATIVE path (inside a folio, the platform is the
        # `folio-assistant/` symlink) — so in this repo it would mean
        # `folio-assistant/folio-assistant/computations`. ruff exits non-zero on
        # a missing path, and `continue-on-error` swallowed that, so the step
        # has been reporting a clean baseline it never computed.
        #
        # Scan the trees that hold this repo's 44 Python files. Missing paths
        # are dropped rather than passed to ruff, and an empty set is stated.
        run: |
          set -uo pipefail
          targets=""
          for d in cat-harness/scripts .github/scripts cat-harness/content/pipeline cat-harness/schemas cat-harness/src cat-harness/adapters; do
            [ -d "$d" ] && targets="$targets $d"
          done
          if [ -z "$targets" ]; then
            echo "SKIP — no Python trees present in this repo. Nothing scanned."
            exit 0
          fi
          echo "Scanning:$targets"
          ruff check --select F401,F403 --output-format=github \
            --exclude '**/_deprecated/**' \
            $targets

      # THIS STEP IS FOR THIS REPOSITORY'S OWN SCRIPTS, NOT FOR PACKAGES IT
      # PUBLISHES. A publishable package's Python tests run in the `typescript`
      # job, under `bun run check:published-packages`, which discovers them
      # from each package's `pyproject.toml` and installs that package's own
      # `[project.optional-dependencies] test`.
      #
      # The split is not tidiness. This step runs each file as a BARE SCRIPT
      # (`python3 "$t"`) and installs no pytest, so a pytest suite dropped into
      # the glob below would define its test functions, execute none of them
      # and exit 0 — reporting a pass it never computed. That is exactly what
      # `cat-harness/schemas/block-qa-schema/tests/test_python.py` would have
      # done, and why widening this glob was the WRONG repair for bean `1s5s`.
      #
      # The Python tests under scripts/tests/ ran nowhere. run-tests.sh
      # delegates to `bun test`, which only collects `*.test.ts`, and no
      # workflow named them — so pdf-text-repair.test.py and
      # who-l1-extractor.test.py were green by never being executed. They
      # are self-contained (no pypdf, no network) and take under a second.
      #
      # Discovered rather than listed, so a new one is picked up by
      # existing; a listed set is a set that goes stale.
      - name: Python tests (cat-harness/scripts/tests/*.test.py)
        run: |
          set -uo pipefail
          shopt -s nullglob
          tests=(cat-harness/scripts/tests/*.test.py)
          if [ ${#tests[@]} -eq 0 ]; then
            echo "SKIP — no Python tests present."
            exit 0
          fi
          rc=0
          for t in "${tests[@]}"; do
            echo "=== $t ==="
            python3 "$t" || rc=1
          done
          exit $rc

  typescript-static:
    # bpmn-node: Task_TypeScript
    name: TypeScript — lint and types (hard)
    #
    # Lint and typecheck, in a job of their own since bean `dlqu`. They used to
    # share a job with `bun test`, which forced an ordering rule on that job:
    # Actions stops at the first failing step, so `bun test` — red on `main` by
    # the owner's decision while the `t8g3` drift stood — had to run LAST or it
    # masked lint and typecheck (bean `om30`). In separate jobs nothing can mask
    # anything, so the rule is no longer something an author has to remember.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Exits 0 on warnings by design; a non-zero exit means a rule that had
      # been driven to zero has regressed.
      - name: bun run lint
        run: bun run lint

      # TypeScript 7 typechecks; TypeScript 6 stays installed as `typescript`
      # because typescript-eslint (8.x) requires the TS6 JS API and throws on
      # TS >= 7, and TS7's `typescript` main export carries no compiler API.
      # So `node_modules/.bin/tsc` is TS 6.0.3 (hoisted from
      # @typescript/typescript6's own dependency) and `bunx tsc` would
      # typecheck with the WRONG compiler while reading green. This step
      # names the TS7 launcher by path, which can only be TS7 (same command
      # as the `typecheck` script).
      - name: tsc --noEmit
        run: bun node_modules/typescript7/bin/tsc --noEmit -p tsconfig.json

  typescript-test:
    # bpmn-node: Task_TypeScript
    name: TypeScript — bun test, shard ${{ matrix.shard }}/4
    #
    # Bean `dlqu`. `bun test` was 7m30s-7m45s sequential (three `main` runs,
    # 2026-10-02); `--parallel` (one isolated worker per core) took it to
    # 3m28s-5m01s, which still made this the workflow's slowest job once e2e
    # was sharded. So the suite is split across four jobs on separate machines,
    # each SEQUENTIAL inside (see the step for why not `--parallel`).
    #
    # THE SHARD TRAVELS IN `BUN_OPTIONS`, which Bun prepends to every
    # invocation, and NOT as `--shard=${{ matrix.shard }}/4` on the command
    # line: `gatesFrom` runs a `bun` line locally with no shell, so an
    # interpolation there would reach the local gate run as literal text (bean
    # `9zok`). The command stays `bun test --parallel`, which locally — with no
    # `BUN_OPTIONS` — is the whole suite, as it should be. Measured before
    # relying on it: the two shards of a 4-file sample ran 50 + 54 tests, the
    # unsharded run 104; and a plain `bun run` ignores `--shard`, so the
    # scripts the tests spawn are unaffected. Nothing under test spawns
    # `bun test` itself, which is the one place the flag would be inherited
    # and halve a run silently — keep it that way.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # A cap, because a parallel worker that spins (measured once locally:
    # one `bun test` worker at 97 % CPU for 20 minutes, nothing else left) is
    # not stopped by a per-test timeout, and the Actions default is six hours.
    # a shard measured 2m07s-2m21s; 20 is ~9x that, so a red here is a hang, never a slow day.
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # NO `--parallel` — measured, and the failure is a hang, not a slowdown.
      # Bun's in-process worker pool (1.3.14) left one worker spinning at
      # ~97 % CPU until the job cap: on 2026-10-03 shard 1/2 of a 4-worker run
      # (`ca3468d19`) and shard 2/3 of a 2-WORKER run (`ff9d8ebb4`, run 2, after
      # 0/72 on a nine-file local sample had made 2 workers look safe). A plain
      # sequential `bun test` has never hung here (three `main` runs, a 903 s
      # local run). So the parallelism comes from SHARDING ACROSS MACHINES
      # instead: four jobs, each a sequential `bun test` over a quarter of the
      # files. Separate machines also share no working tree, so the in-tree
      # write races `--parallel` exposed cannot recur (bean `dlqu`).
      - name: bun test
        env:
          BUN_OPTIONS: --shard=${{ matrix.shard }}/4
        run: bun test

  typescript:
    # bpmn-node: Task_TypeScript
    name: TypeScript — tests, lint, types (hard)
    #
    # The check NAME that branch protection and the beans cite, kept on a job
    # that is green only when the static job and EVERY test shard succeeded.
    # `if: always()` so a failed or cancelled part turns this red rather than
    # SKIPPING it: a skipped required check reads as neither red nor green,
    # the vacuous pass bean `0qjq` measured.
    needs: [typescript-static, typescript-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: lint, types and every test shard succeeded
        env:
          STATIC: ${{ needs.typescript-static.result }}
          TESTS: ${{ needs.typescript-test.result }}
        run: |
          echo "lint+types: $STATIC   tests: $TESTS"
          test "$STATIC" = "success" && test "$TESTS" = "success"

  gates:
    # bpmn-node: Task_RepositoryGates
    name: Repository gates (hard)
    #
    # ## Why this is a SECOND job and not more steps in `typescript`
    #
    # Bean `om30`. `bun test` was step 2 of 47 here, and Actions stops a job at
    # its first failing step. No step in the job carried `continue-on-error`, so
    # while `main` carried its deliberate `t8g3` drift failure, the 45 steps
    # after it — **113 `bun run` invocations** — did not execute at all. A gate
    # that was never asked and a gate that passed look identical from outside,
    # which is bean `xom7`'s defect one level down: at the STEP rather than the
    # workflow.
    #
    # It was not hypothetical. `kg:detangle:check` sits in this block, and it is
    # the only instrument positioned to catch the defect `xd1g` fixed:
    # `check:published-packages` (also in this block) installs that package's own
    # declared devDependencies into
    # `cat-harness/schemas/block-qa-schema`, so a runner reaching the detangle
    # check has no nested `node_modules` and measures the tracked corpus, while
    # any developer container has the install and agrees with the poisoned
    # value. CI was the one place that disagreement was visible, and CI never
    # got there. The committed number drifted 1441 -> 1442 unnoticed meanwhile.
    #
    # There is deliberately NO `needs: typescript`. The whole point is that a
    # red test must not stop these from being asked; they are independent
    # questions about the repository and the owner chose this split over
    # `continue-on-error` precisely because it changes nothing about what is
    # asserted — the drift still fails, in its own lane.
    #
    # Adding a gate step here rather than to `typescript` is the default now.
    # `typescript` is the three checks its name promises; everything else is a
    # repository gate and belongs in this job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      # `check:published-packages`, below, is the one gate in this job that
      # leaves TypeScript: `@litlfred/block-qa-schema` ships a Python half
      # beside its npm one, and a package this repository publishes has to
      # work in both languages or neither. The gate installs that package's
      # OWN declared test extras itself, so nothing about it is named here —
      # but it cannot conjure an interpreter, and it treats an absent one as
      # a FINDING rather than a skip, so this step is what keeps that finding
      # from being the normal state. Bean `1s5s`.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"


      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The base workflow processes are strict; a content package may relax a
      # step only by declaring it with a reason, and never a step the BPMN marks
      # relaxable="false". This fails when a relaxation names something that no
      # longer exists — otherwise it sits in the file looking like policy while
      # permitting nothing, and nobody finds out until the day it matters.
      - name: workflow policy
        run: bun run check:workflow-policy

      # Guards the placement of the step at the END of this job. Kept here, near
      # the top, because it is cheap and because a structural rule about the file
      # should be checked before the file's other 100-odd gates spend five
      # minutes acting on it. Bean `cpss`.
      - name: a gate that may be red by decision is its job's last step
        run: bun run check:red-gate-is-last

      # Beside the step above because both judge the WORKFLOW rather than the
      # corpus, and both want to fail before the job spends five minutes acting
      # on a file that is wrong. Bean `3ozg`: an unpinned Bun made
      # `engine_version` record whoever ran last, which rewrote 86 QA sidecars
      # and left `bun run gates`' tree-mutation detector reporting "NOT clean"
      # on every branch, pristine `main` included.
      - name: every workflow installs the pinned Bun
        run: bun run check:bun-pin

      # Every skill citation naming a section of an `AGENTS.md` resolves, or
      # says WHICH `AGENTS.md` it means. Turned on 2026-09-19 once the backlog
      # reached zero (bean `1hsf`) — gating before that would have blocked
      # unrelated work on debt the check had only just measured.
      #
      # Two of the original twenty were in NEITHER repository and were rewritten
      # as plain rules; the rest were correct citations of the folio's file and
      # are now qualified. A citing file declaring its own destination is the
      # contract, so this cannot be satisfied by editing the platform's prose.
      - name: AGENTS.md cross-references
        run: bun run check:agents-xref:strict

      # Every artefact an instance DECLARES exists, and its links resolve.
      # The complement of the check above, which verifies citations INTO an
      # `AGENTS.md`: this one verifies the links OUT of it, and of every other
      # declared asset.
      #
      # Gating from the first commit, unlike `agents-xref`, because there is no
      # backlog — the declarations and the gate land together, so it starts at
      # zero findings rather than measuring debt. Bean `v8gh` is what it would
      # have caught: seven dead links in the root `AGENTS.md`, five broken by
      # one directory move, including the one its own banner calls the place to
      # start, so a cold agent following the banner hit a 404.
      - name: declared assets exist and resolve
        run: bun run check:declared-assets

      # The same question one level up: declared assets are FILES, these are
      # DIRECTORIES, and nothing asked about them until bean `8mbk`.
      #
      # It could not have been caught by reading a consumer, because every
      # consumer is correct: `resolveDirectories` is existence-filtered, so an
      # absent declared directory is dropped before anyone sees it. The
      # declaration then asserts a directory is ours, and every scan of it
      # reports a clean run over nothing — the `dh4f` shape inside the resolver
      # they all share.
      #
      # Gating from the first commit, same reasoning as the step above: 66
      # declared directories across 14 instances, ZERO findings, so this starts
      # at zero rather than measuring debt. The escape hatch is a declared
      # `absent: { reason }`, and an exemption whose directory later appears is
      # a finding too — that is the direction that rots quietly.
      - name: declared directories exist, or say why not
        run: bun run check:declared-dirs

      # THE OTHER DIRECTION of the step above. `check:declared-assets` walks
      # declared -> disk; this walks disk -> declared, over the repository ROOT,
      # which every other sweep skips because the root is deliberately not an
      # instance. That is exactly where an undeclared file survives: commit
      # `0301fbd2` put three 1.6-1.8 MB PNGs there with spaces and commas in
      # their names and no gate noticed, and an automated pass then misread them
      # as a regeneration of the existing art. A file nothing declares is a file
      # nothing reasons about.
      #
      # Gating from the first commit, like its sibling and for the same reason:
      # the root is clean as of this change, so it starts at zero findings
      # rather than measuring a backlog.
      - name: no undeclared files at the repository root
        run: bun run check:undeclared-files:check

      # `bootstrap/bootstrap.jsonld` HAD a staleness gate here, because it was
      # committed. It no longer is — it is built at render time into the
      # published site by `docs-site.yml` — so there is no committed copy to
      # go stale and nothing for a byte gate to compare against.
      #
      # NOTHING WAS DROPPED WITH IT, and that is worth saying rather than
      # assuming: the gate compared bytes, while every property it was
      # protecting is asserted directly in `scripts/tests/bootstrap-graph.test.ts`
      # against `buildCatBootstrapDocument()` — purity, id ordering, no absolute
      # build paths, skills derived from disk, graph kinds a subset of the
      # declaration, and the `omitted` list. Those run in `bun test`, which
      # the TypeScript job above already runs. Removing a check whose
      # coverage lives elsewhere is fine; removing one and saying so is what
      # stops the next reader reinstating it.
      #
      # ONE QUALIFICATION, added by bean `dyd3`: `buildCatBootstrapDocument()`
      # is no longer what the site publishes at that URL —
      # `kg-export --instance ./bootstrap` is, and the two documents differ on
      # 74 of their 88 nodes. Those assertions are properties of a builder
      # that publishes nothing. `kg-export.test.ts` is where the published
      # document's are, and the two guards in `bootstrap-graph.test.ts` that
      # DO reach the site are the ones about publication: the path the `@id`
      # names, and exactly one publisher per workflow. Since 2026-09-30 that
      # publisher is bootstrap-tools' `export-graph.ts` (bean `xsqm`), whose
      # own properties are asserted in `bootstrap-tools/scripts/export-graph.test.ts`.

      # Every `<folio:skill ref>` in a diagram names a skill that exists.
      # `corpus-search` and `paper-relevance-triage` were referenced by two
      # diagrams and resolved to nothing, so `workflow_next` would have handed
      # an agent the name of something it cannot open. Dangling is a hard
      # failure; an activity naming NO skill is only reported, because a human
      # sign-off step has no skill to name and failing on it would force a
      # fake ref onto a real step.
      - name: workflow skill refs
        run: bun run check:workflow-refs

      # A task's containing swimlane must DEFINE itself -- bean `sqtq`, issue
      # #596. Measured 2026-09-21: 157 task-containing lanes, every one named
      # and NONE documented, so the defined-terms index #596 asks for would
      # have shipped 157 labels with no definitions. Three axes, because a
      # glossary term needs all three: a name, a definition, and both
      # extractable for translation. An activity in NO lane is reported
      # UNDETERMINED rather than counted as passing, and zero diagrams is a
      # finding rather than a clean run (`6tkl`).
      - name: swimlane definitions
        run: bun run check:lane-documentation:check

      # ...and the PROCESS says what it is for -- bean `7rna`. The sibling one
      # level up. `gen-docs-auto`'s index took the first `<documentation>`
      # after the process opened, so a process carrying none borrowed its
      # first LANE's and presented it as what the process was for -- which
      # became true the day `sqtq` wrote 157 lane documentations. 16 of 61
      # were in that state; all 61 now define themselves, so `--strict` is
      # what runs here and a new diagram cannot land undefined.
      - name: process definitions
        run: bun run check:process-documentation

      # ...and the glossary those definitions feed -- bean `lqo9` slice 2,
      # issue #596. The DOCUMENT is derived and not committed; the LEDGER is,
      # because a derived document has no memory: delete a role and its
      # concept stops appearing, which is what "never existed" also looks
      # like. This gate is what keeps the ledger current, so retirement stays
      # distinguishable from accident. Two runs, never one wider scan --
      # `7u3g`, the isolation two earlier sessions walked into.
      - name: swimlane glossary ledger
        run: |
          bun run glossary:check
          bun run glossary:check:bootstrap

      # Core's glossary (owner, 2026-09-23: "put glossary into
      # folio-assistant-core"): every `folio-glossary/v1` document validates,
      # and the glossary/ page and its SKOS JSON-LD are current.
      - name: glossary page and SKOS
        run: |
          bun run check:glossary
          # Bean `lqo9` (owner, 2026-09-24: "Authored terms only"): every
          # authored term's labels and definition have a current .pot in
          # every locale, beside the BPMN templates.
          bun run glossary:pot:check
          # Bean `7wou` (owner, 2026-09-29: "extracting exsiting glossary
          # needs compaision to existing termonology/coding"). Reports and
          # never grades: an unmapped candidate may be a term this corpus is
          # right to coin. It fails only on a result that breaks its own
          # schema — notably an `undetermined` row with no reason, which is
          # the one way silence could read as "no match" (bean `dh4f`).
          bun run check:term-mapping

      # The agentic engine's after-check (#1180 step 5): every workflow
      # instance's history as W3C PROV-O, with authorizeTask re-run on each
      # step. ADVISORY (owner, 2026-09-23): findings are reported on the
      # prov-qaqc/ page, never fatal. This fails only on stale outputs, a
      # prov:Activity that does not validate, or an internal error.
      - name: PROV-O QA/QC report
        run: bun run check:prov-qaqc

      # KG subscriptions (issue #1719, epic bean `fnx4`): the known substrates,
      # derived from the declarations wherever a fact exists, and every
      # subscription with the state of each chosen part. Generated and
      # network-free; this fails only when the page is stale.
      - name: KG subscriptions page is current
        run: bun run subscriptions:viz:check

      # The graph per locale -- bean `jmpb`, on the owner's ruling. This gate
      # is NOT about how much is translated (nothing is, measured 2026-09-22:
      # 58 of 62 .pot templates are diagrams and none has a .po). It checks
      # the two properties a translation effort must never break: the CORE
      # graph references no translation -- no hasTranslation, no
      # availableLocales, no locale key, no per-locale @id -- and a translated
      # node keeps its @id, because a translation is not a new term.
      - name: graph per locale
        run: |
          bun run kg:locale:check
          bun run kg:locale:check:bootstrap

      # A model declares its languages, or it is a finding -- bean `46uh`.
      # This gate is NOT red on an empty registry: an agent is not a valid
      # source for the evidence `validation` asks for, so it ships empty and a
      # person adds entries. It IS red (exit 2) on a registry this code cannot
      # read, because reporting a malformed file as "no models" would let an
      # agent fall through to English believing a determination was made.
      - name: model languages declared
        run: bun run check:model-languages

      # Every link OUT of the files an agent reads first — bean `v8gh`.
      # `AGENTS.md` carried seven dead links, five broken by one directory
      # move, including the onboarding guide its own banner calls the place to
      # start. `readme:audit` covers README.md only and `check:agents-xref`
      # covers citations INTO AGENTS.md, so a directory move could silently
      # break the one file every agent opens first.
      - name: agent entry links
        run: bun run check:agent-entry-links

      # What `AGENTS.md` ASSERTS about the code — bean `77ex`. The two checks
      # above bracket it without covering it: `agents-xref` verifies citations
      # INTO the file, `agent-entry-links` verifies links OUT of it, and
      # neither reads what the prose says is true.
      #
      # Gating from the first commit, because it starts at zero findings:
      # every claim on the current file holds. The two it was written for are
      # both historical, and the second is why the ABSENCE half exists — at
      # `08f43c55b2` the file placed `resolveSkillDirs` in a module that DID
      # declare it, so the location claim was true and only "has no caller"
      # was false. `AGENTS.md` states the cost in its own voice: a stale gap
      # notice is worse than none, because an agent that believes it either
      # avoids the feature or rebuilds it.
      - name: AGENTS.md claims about code
        run: bun run check:agents-claims

      # Which `.github/workflows/*.yml` are documented as BPMN — bean `7yvd`,
      # owner: "make sure all workflows documented as bpmn".
      #
      # NOT `--strict` yet, deliberately. Coverage is 0 of 38 as this lands, so
      # a strict gate would be red on arrival and switched off within the day.
      # What it DOES fail on is the two unambiguous states: a workflow whose
      # YAML cannot be read (exit 2 — could-not-determine is never rendered as
      # clean, and an unreadable file is the one state that can hide a gap),
      # and a diagram declaring a workflow that is not there (exit 1, the same
      # tier as a dangling `<folio:skill ref>` above). The gap itself is
      # reported so the number is visible and moves.
      - name: workflow BPMN coverage
        run: bun run check:workflow-coverage

      # CURRENCY IS NOT VALIDITY, and this is the pair that proves it.
      # `render:bpmn:check` asks whether the committed SVG is what the renderer
      # produces. It was GREEN across 68 labels reading
      # `Dependency advisories&#10;(WARN-ONLY)` in published diagrams, and
      # correctly so — the renderer faithfully produced the wrong thing. This
      # asks about the OUTPUT'S CONTENT, which is the question a reader has.
      # Bean `li5y`.
      #
      # In the FAST SET, not beside `render:bpmn:check` in the e2e job, and that
      # placement was corrected after measuring it: `render:bpmn:check` lives
      # there because bpmn-js renders through a BROWSER. This check needs none —
      # it reads committed SVG text — so putting it there bought cohesion and
      # cost reach, since `bun run gates` is the fast set and would never have
      # run it. A contributor editing a diagram runs that, not `--all`.
      #
      # A ratchet, not a gate on the whole corpus: six diagrams are already
      # affected and fixing them is a sweep with a five-locale translation
      # consequence. Known counts are baselined; a NEW file, or a baselined file
      # GAINING a label, fails.
      - name: no rendered label shows a character reference as literal text
        run: bun run check:rendered-labels:check

      # Every Tool's `satisfies` names a skill that exists, and every io port
      # references a type the shared vocabulary declares. The schema can require
      # `satisfies` to be non-empty; it cannot know whether the names resolve,
      # because a schema does not get to read the tree. A skill with NO Tool is
      # reported and not failed — many skills are pure judgement and have no
      # mechanism to name.
      - name: tool definitions
        run: bun run check:tools

      # Every voice rule cites a library section that is actually there.
      #
      # A voice is a rule set OVERLAID on the house voice, and 36 of this
      # repo's 37 rules cite `library/<slug>/sections/<id>.md` as the passage
      # they were derived from. A citation that does not resolve is a rule
      # nobody can check against its source — the `blv9` class (a link-shaped
      # value that does not dereference), in the one place where the source is
      # the entire justification for the rule.
      #
      # IT WAS WIRED AS AN npm SCRIPT AND RUN BY NOTHING. Measured
      # 2026-09-19: `grep -rn 'check:voices' .github/` returned zero. That is
      # the `xom7` shape — a gate that looks green from inside the repo
      # because nothing ever runs it — with the workflow missing outright
      # rather than failing. Found while inventorying the planned `library/`
      # extraction, which would have broken 28 citations silently.
      - name: voice citations resolve
        run: bun run check:voices

      # The other half of the same claim: the rules are cited, AND the
      # instruction body beside them does not restate them uncited.
      #
      # `schemas/voice-skill.ts` said "`check:voice-skills` enforces it" from
      # the day it was written, and four `SKILL.md` files repeat the claim in
      # their own prose — a promise made in five places and kept in none until
      # this gate (bean `n8br`). An absent gate nobody was told about leaves a
      # reviewer reading carefully; an absent gate a doc comment promises
      # leaves them reading PAST.
      #
      # Measured over the four voices here, 37 rules: zero findings. A check
      # that fires on every subject is wrong and so is one that can never
      # fire, so it is falsified rather than trusted — five mutations, each
      # caught, in `tests/voice-skills.test.ts`.
      - name: voice skills do not restate their own rules
        run: bun run check:voice-skills

      # Workflow YAML GitHub will actually parse, and no attacker-controlled
      # expression interpolated into a run body.
      #
      # This exists because a workflow GitHub cannot parse does NOT fail
      # loudly — it produces a run named by its file PATH instead of its
      # `name:`, because there is no name to read. Two workflows sat red for a
      # day that way in 2026-08; I reproduced it on 2026-09-18 by adding a
      # second `env:` to a step that already had one, after `yaml.safe_load`
      # accepted the file. Most loaders take the last duplicate silently, so
      # "it parses locally" was never evidence.
      - name: workflow yaml
        run: bun run check:workflows

      # Every script path a workflow invokes resolves, from the directory the
      # step actually runs in. Bean `52dz`. The #223 split moved the platform's
      # scripts under `cat-harness/` and the workflows naming them without that
      # prefix kept naming them without it — which is not a type error, not a
      # lint error and not a test failure, so nothing here could see it.
      #
      # THREE workflows were live and broken when this was added: `ci-health`
      # (weekly), `upstream-pins` (weekly) and `health-check` (DAILY), each
      # crashing on its first command. `ci-health` exists to catch workflows
      # failing where nobody looks, so it had been failing at its own job.
      # Eight more were `workflow_dispatch`-only, two of them never once run.
      #
      # This step is the point: the previous sentence describes what happens
      # when a check lives in `package.json` and no workflow invokes it.
      - name: workflow script paths
        run: bun run check:workflow-paths

      # The same defect one layer in, and the one a READER hits first: a script
      # whose own usage string names a path that is not the script. 178
      # occurrences across 67 files when this was added, every one a casualty of
      # the #223 split moving the platform under `cat-harness/` while the usage
      # strings kept the pre-split spelling.
      #
      # A separate step from the one above for the reason those two are separate
      # from each other: this needs no cwd model and no exemptions, because a
      # self-reference has no audience to guess at. `check:command-paths` PASSES
      # over all 178 by design — `aboutThisTree` judges a path only when its
      # first segment is a directory that exists at the root, so these land in
      # its folio-relative bucket (306 of them, counted rather than judged). The
      # general question is bean `52dz`'s open half and is NOT gated here.
      - name: usage strings name their own script
        run: bun run check:usage-paths

      # THE OTHER DIRECTION FROM `ovkk`, and the reason it needs a gate at all
      # is that this direction is silent.
      #
      # `ovkk` was a term USED and not DECLARED: a JSON-LD processor drops it,
      # so the data goes missing and somebody eventually notices — 34 names,
      # 3583 occurrences. A prefix DECLARED and never used costs nothing at
      # runtime. `skos:` sat bound in the published `@context` and emitted by
      # zero nodes from the day it was written, while `tabular-csvw.ts` said
      # in prose that this graph speaks it.
      #
      # It counts EMISSIONS over the published `.jsonld` documents, not
      # `prefix:` literals in source — the two disagree, and measuring source
      # reported `doco:` 1112 for a vocabulary no document here emits.
      - name: every bound prefix is emitted, or declared forward with a reason
        run: bun run check:context-emission

      # The rest of the actor -> role -> skill -> task joins, and the committed
      # sidecars that record them. A `critical` finding is a broken reference:
      # a lane binding a role that is not declared, a role carrying a skill
      # that does not exist, a gateway naming a decision table that will not
      # load. `--check` also fails on a STALE sidecar, which is the point of
      # committing them — without a durable previous answer, a lane that has
      # been unbound since it was drawn and one that broke in the commit under
      # review look identical to a reviewer.
      #
      # Not `--strict`: `major` findings are missing joins rather than broken
      # ones, and gating on them today would fail the build on debt this gate
      # was added to make visible.
      # A skill's I/O contract must publish at the address its own `$id`
      # claims. All 44 once carried a github.com URL that returns 403 -- born
      # that way on 2026-03-24 and never dereferenced, so nothing noticed for
      # six months. This is what makes that non-repeatable.
      #
      # Runs WITHOUT --base-url: a committed `$id` is always canonical, and a
      # preview overrides the base at export time only.
      - name: skill I/O schema addresses
        run: bun run kg:schema:check

      # A WORKING validator that had lost its wiring — bean `shzs`. It validates
      # every skill package manifest against `SkillPackageManifest` plus the
      # `.claude/skills/` JSON, and it was in `package.json` once (two commits
      # touched it there) and in no workflow now. That is `1xhc`'s class exactly:
      # a gate that does not fire is indistinguishable from one that passed.
      #
      # Safe to wire because it is GREEN on this tree — 9 of 9 package manifests,
      # 16 files, 0 errors — so this locks in a property the repo HAS rather than
      # demanding work. Counted from the whole output, not from a `tail`: reading
      # the last eight lines first made it look like 6 of 9, which was wrong.
      - name: skill manifests and framework JSON
        run: bun run check:skills

      # A skill that arrived without its declarations, REFUSED HERE instead of
      # surfacing as six obscure failures on somebody else's PR. Seven merges
      # between 2026-09-24 and 2026-09-26 each broke the gate set that way, and
      # each was repaired by whoever opened the next PR rather than by its
      # author -- because CI judges the MERGE of each head into the base, so the
      # cost lands downstream of the change that caused it. The failure names
      # `bun run skill:register`, which performs the whole chain; a gate that
      # states the defect and not the remedy is how six tests came to mean
      # "somebody read the corpus and work it out".
      #
      # The command it names was `skills:register` until the owner consolidated
      # the two (2026-09-26). Keep this step pointed at whichever one survives:
      # the gate is the only thing that makes the obligation binding, and for
      # four days it was on the command that was NOT in CI.
      - name: every skill is declared, and declares nothing absent
        run: bun run skill:register:check

      # The skills graph's LSI index is written by the registration chain
      # (`lsi:skills`) and read by kg:audit's `tool-downstream-fresh`. Checked on its
      # own so an edited skill with a stale index names THIS step, not a
      # kg-qa sidecar two generators away (bean `ansc`).
      - name: the skills graph's LSI index is fresh
        run: bun run lsi:skills:check

      - name: the LSI index viewer page is current
        run: bun run lsi:viz:check

      # Bean 3spu: a soft hyphen in section text splits a word for every
      # reader; both PDF rungs join them, and this says none came back.
      - name: no library section carries a soft hyphen
        run: bun run check:soft-hyphens

      # Bean rkqp: structure.json has two variants (pdf, notebook) read through
      # one accessor; a reader that builds the path itself learns one and
      # misreads the next. The owner chose a literal allowlist (2026-09-30).
      - name: structure.json is named only by its accessor
        run: bun run check:structure-accessor

      - name: knowledge-graph audit
        run: bun run kg:audit:check

      # The same audit, over EVERY declared instance rather than the root alone.
      #
      # Not a second answer to the step above — it is the step above, with its
      # range fixed. `kg:audit:check` audits the auditor's own instance, so for
      # as long as it was the only step, 13 of 15 nested instances had no
      # `test/results` at all and `audit:coverage` could not tell "audited and
      # clean" from "never audited" for any of them (bean `bjzs`, the `dh4f`
      # defect at instance scale).
      #
      # It also catches a staleness nothing else could: an instance's
      # `kg-qa.manifest.json` records the auditor's hash, so every instance's
      # manifest goes stale the moment `kg-audit.ts` changes. Measured on this
      # loop's first run — bootstrap's had been stale and no gate said so,
      # because no gate ran its audit.
      - name: knowledge-graph audit, every declared instance
        run: bun run kg:audit:all:check

      # kg-export's committed `qa-results/v1` sidecars are current (bean `v556`).
      #
      # It had no `--check` until then, so it was in no verify/write pair and
      # outside check:artefact-verification's inventory. Measured on main
      # `cf3e624`: `kg-export.bootstrap.qa-results.json` carried a stale hash
      # AND hid three findings, with every gate green. Also reports a committed
      # `kg-export.<stub>` sidecar that no instance owns as an orphan.
      - name: kg-export QA sidecars are current
        run: bun run kg:export:check

      # WHICH audits reach which kind of node — the neighbour of the audit
      # above, not a second answer to it. `kg:audit:check` judges the nodes it
      # covers; this measures WHAT IS COVERED AT ALL, which nothing asked
      # before bean `xutg` and which got answered by inference instead: an
      # agent read a sidecar count of zero over the bean store and reported
      # beans "effectively unaudited", while eight gates audit them.
      #
      # `--check` and NOT `--strict`: it fails on a STALE SIDECAR, which is the
      # half a reviewer needs (it is what lets "never audited" be told from
      # "lost its audit in this commit"). The findings are reported — 4 kinds
      # hold files nothing audits, and a gate refusing every push until
      # somebody writes criteria for `interaction/` is a gate that gets
      # switched off. `audit:coverage:strict` is for the day that closes.
      # `--require-all` as of bean `3srh`: every one of the 145 gates CI runs now
      # DECLARES what kind of node it covers, so the flag that was "for the day
      # the gap is closed" enforces a property this tree HAS rather than
      # demanding work — the same reasoning as `check:skills` above.
      #
      # What it buys is the report's own honesty. While any gate was undeclared,
      # every "unaudited" verdict was only an UPPER BOUND and the output said so.
      # With none undeclared the four remaining kinds are a verdict, and this
      # step is what stops a new gate arriving undeclared and quietly turning
      # them back into an upper bound.
      - name: audit coverage is measured, current, and every gate has declared
        run: bun run audit:coverage:require-all

      # ADVISORY ON THE FINDINGS, HARD ON THE STALENESS, and the split is the
      # whole point of this step existing at all. `xd1g` Done-when 3 wanted a
      # check that catches the next bare-walk scanner; a syntactic filter
      # cannot be one (62 findings loose, 4 tight, and the tight one misses
      # eleven of twelve), so what this gates is DRIFT: the committed census
      # disagreeing with the tree means the number moved and nobody looked.
      #
      # The counts themselves never fail. Gating on them would be the wall
      # somebody switches off, which is `2krx`'s reasoning and it is right.
      # The owner ruled on 2026-09-27 that the census ships anyway so the
      # number stays visible, over the objection that a check which cannot
      # fail is `1xhc`; this arrangement is what gives it something real to
      # fail on.
      - name: the root-scan census is current
        run: bun run root-scan-census:check

      # The four graphs `audit:coverage` reported as `typed-only` — a schema
      # parses their nodes and nothing had an opinion about what they SAY.
      # Bean `h1wq`, at the owner's ask (2026-09-24).
      #
      # Three of its four families are determined empties on this tree, and the
      # fourth caught a real one: the committed health report was written by a
      # checker that no longer existed, so its staging remedy still told a reader
      # to apply `staging:cleanup` to an orphaned preview — which bean `7umv`
      # had already proved cannot work. Stale advice presented as the fix.
      #
      # Exit 2 (a family that could not be read) is a FAILURE here, not a pass:
      # could-not-determine outranks a finding, because a sweep blind on one
      # family has not cleared the others.
      - name: harness state graphs are judged, not just typed
        run: bun run check:harness-state:check

      # Issue #1719, slice 4: every subscription has its substrate snapshot at
      # its pin, each snapshot's bytes match their digest and re-judge to the
      # committed summary, and none is orphaned. Offline — it reads what
      # `kg:subscribe` wrote and never fetches. It JUDGES `substrate-snapshot`.
      - name: KG subscriptions have their snapshots, and each holds
        run: bun run kg:subscribe:check

      # Issue #1719, slices 5-6: every materialised part of a subscription --
      # a subgraph, or one asset -- still hashes to its record (a tree digest,
      # so a file ADDED in place is caught, which the per-file
      # `check:materialized-fixity` walk cannot see), is still chosen and
      # declared, sits at its subscription's pin, and no bytes sit in a
      # subscription's directory without a record. Offline; never fetches.
      - name: KG materialised parts hold, and nothing sits unrecorded
        run: bun run kg:materialize:check

      # And `--strict` too, now that it is GREEN — the four `typed-only` kinds
      # were the only thing holding it red, and the step above judges them. Wired
      # on the same reasoning as `check:skills`: it locks in a property this tree
      # HAS rather than demanding work.
      #
      # A SECOND step rather than a third flag on the one above, because the two
      # lock different things and a reader should be able to see which broke:
      # `--require-all` that every gate has declared, `--strict` that every kind
      # with files is JUDGED and not merely typed.
      - name: every kind with files is judged, not merely typed
        run: bun run audit:coverage:strict

      # The detangle measurements are PINNED, not graded. This fails on a STALE
      # sidecar or an orphaned one — never on a number being "wrong", because
      # the carve is an adjudication a person makes (`detangle.ts`, "taste is a
      # declared step"). Bean `sb6z`: the model was correct and unexercised, so
      # a regression in it was invisible until somebody ran it by hand AND
      # remembered last time's numbers.
      - name: detangle measurements are current
        run: bun run kg:detangle:check

      # THE CROSS-INSTANCE WRONG-DIRECTION AXIS, and it is a SECOND step
      # rather than a third flag on the one above — same reasoning as
      # `audit:coverage:require-all` / `audit:coverage:strict` a few steps
      # back: the two lock different things and a reader should be able to see
      # which broke. Here the difference is sharper than there, because the
      # two steps stand on opposite sides of the pinned/graded line:
      #
      #   - the step ABOVE grades NOTHING. It fails on a stale or orphaned
      #     sidecar, because the carve is an adjudication a person makes
      #     (`detangle.ts`, "taste is a declared step"). That ruling stands.
      #   - this step grades exactly ONE number. A module's BUCKET is taste;
      #     an import pointing at an instance that declares a dependency on
      #     you is a contradiction between two `<instance>.json` files, and no
      #     adjudication makes it consistent.
      #
      # Owner's ruling on bean `p11x`, 2026-09-30, Option 2: leave
      # `check:partition` instance-scoped and make `kg:detangle` the
      # cross-instance gate, "since it already sees the axis (it is the one
      # check that caught `bf5l`'s sabotage)". `check:partition` resolves its
      # ROOT to `<checkout>/cat-harness`, so its 0 is scoped to ONE instance
      # and is silent about edges between already-extracted siblings. `bf5l`
      # measured the discriminator: with `cat-harness/schemas/intake.ts`
      # importing `folio-assistant-core`, `check:instance-graph` and
      # `check:partition` were both green and this axis reported 1.
      #
      # It is wired as BLOCKING because the count is 0 today, which is the
      # repository's standing precedent for switching a reporter into an
      # enforcer (the ruff comment, and `repo-partition.ts`'s own per-axis
      # history): a check is an error only once its count is zero, because
      # turning a red gate on just teaches the next agent to append `|| true`.
      #
      # It WRITES NOTHING, so it does not inherit `ymsu` — that defect is
      # `bun test` repairing a sidecar a later gate then compares against
      # itself, and a live-computed edge count has no sidecar to repair.
      # `ymsu` is open and was NOT fixed here; the owner accepted that cost
      # when ruling Option 2 over the "fix `ymsu` first" variant.
      #
      # Two things it reports rather than grades, both because grading them
      # would mean grading a could-not-determine: `undetermined` edges (no
      # declaration settles their direction) and the dangling refs its
      # denominator excludes (bean `cjvs`). Both counts are PRINTED by the
      # step; no number for either is written down here, because a count in a
      # comment is a claim that outlives its measurement.
      - name: no wrong-direction edges across declared instances
        run: bun run kg:detangle:direction

      # The same direction rule, over MODULE LOADS in every code file of every
      # declared instance — no scan list. The step above reaches only the
      # directories in `kg-detangle.ts`'s `SCAN`, and states that an import
      # from an unlisted directory is "real and invisible to it": with `bf5l`'s
      # sabotage planted in `cat-harness/adapters/` (not in `SCAN`), measured
      # 2026-09-30, the step above printed 0 and exited 0, this one printed 1
      # and exited 1. This does NOT widen `SCAN` or touch that step's pinned
      # adjudications (the owner's Option 2 ruling on `p11x` stands); it is a
      # second subject — a module an instance cannot be lifted out without —
      # judged by the same `allowedFromNeeds`, so the two cannot disagree about
      # an edge both see.
      #
      # `--all` because every instance's count was 0 once `builtin-adapters.ts`
      # stopped holding `../<instance>/` paths (the adapters are now declared by
      # the instances that ship them), and a check becomes an error once its
      # count is zero. It also catches a module-path literal handed to a
      # variable `import()` — the shape that table had — and PRINTS the
      # `import(expr)` calls it cannot read as could-not-determine, never as 0.
      - name: no module imports from an instance built on top of its own
        run: bun run check:import-direction --all

      # Every term the code can MINT has a definition in the published
      # vocabulary. 93 classes and properties hang off `FOLIO_NS`, and until
      # 2026-09-19 nothing served that stem at all — the dead-link walk in
      # `kg-export.test.ts` exempted it BY NAME, so the one check that could
      # have noticed was told not to look.
      #
      # It reads the source rather than a list: a scan for `${FOLIO_NS}X`
      # across every non-test module, unioned with what a real export emits,
      # because `kg-export.ts:712` mints `${FOLIO_NS}${type}` from a registry
      # group name and neither source alone is sound. Adding a term and not
      # defining it fails here, which is the whole point — a vocabulary that
      # documents only what somebody remembered to document is not a
      # vocabulary.
      - name: namespace vocabulary is complete
        run: bun run ns:check

      # `bootstrap`'s JSON Schemas are GENERATED from Zod in
      # `cat-harness/schemas/`, because bootstrap promises a Bootstrapping Agent it
      # needs no tools and therefore cannot hold a `.ts` of its own. This is the
      # `--check` twin `schema-management` requires of any new rendering:
      # three schema generators rotted here before, because nothing ever asked
      # whether their output still matched their input.
      #
      # A red here means the Zod moved and the published document did not —
      # and that document sits at an `$id` consumers already follow.
      - name: bootstrap schemas are current
        run: bun run bootstrap:schemas:check

      # The second half of the same render pipeline (owner, 2026-09-29: "need
      # Zod usage in bootstrap tools as part of validation in rendering
      # pipeline"; ported from PR #1514, bean `81tw`): the step above judges
      # the SCHEMAS against their Zod; this judges the DOCUMENTS bootstrap
      # carries — its declaration, its model registry, any discussion
      # document — against the same Zod. A run that cannot find bootstrap, or
      # validates nothing, fails.
      - name: bootstrap documents parse against their Zod
        run: bun run bootstrap:validate

      # bootstrap's vocabulary, `bootstrap/ns.jsonld`: exactly its defined
      # terms and graph kinds, written by bootstrap-tools and committed, and
      # copied to the site as-is (owner, 2026-09-30, bean `xsqm`).
      - name: bootstrap vocabulary is current
        run: bun run bootstrap:vocabulary:check

      # The split, rehearsed (Phase 4, bean `xsqm`): bootstrap and
      # bootstrap-tools copied alone into an empty directory as sibling clones,
      # and bootstrap-tools' checks and tests run there. The closure gate
      # proves no IMPORT reaches up; this proves no script or test READS
      # anything only the monorepo has. Its first run found two such reads.
      - name: bootstrap-tools passes standing alone beside bootstrap
        run: bun run check:bootstrap-standalone

      # `docs/reference/**` is generated from skill sources and must not be
      # hand-edited, but nothing verified it had been REGENERATED after a
      # source change. document-intake.md sat 35 lines behind its source and
      # the published docs site served the stale copy. --check writes nothing
      # and names every file that would change.
      - name: generated docs are current
        run: |
          bun run cat-harness/scripts/gen-schema-docs.ts --check
          bun run skills:docs:check

      # Document ingestion's FIRST step, generated from the Tool nodes that
      # implement it (owner, 2026-09-29: "generate documentation from Tool
      # documentation of the upload Task/Skill as first step of document
      # ingestion process"). Its own step rather than a line appended to the
      # one above, so a reader sees WHICH generator went stale: it derives the
      # step, its skill and its Tools from `document-ingestion.bpmn` and the
      # tools graph, so an edit to either of two graphs stales it and neither
      # of those graphs' own gates would notice.
      - name: the upload step's page is current
        run: bun run upload-step:docs:check

      # Every skill that declares `user_invocable: true` has a slash command,
      # and every command has a declared skill (bean `j6t3`). Measured
      # 2026-09-30: 40 declared, 3 reachable, and `/prepare-merge` a command
      # whose skill declared nothing. BOTH directions fail, because a check
      # that only asked the first would never have found the second.
      - name: every user-invocable skill has a command, and every command a skill
        run: bun run skill:commands:check

      # The README's AUTHORED half. `readme-sections.ts` owns the marked
      # regions; this owns every other link, and `AGENTS.md` claims that
      # "between the two tools no link in a folio README is unaccounted for".
      #
      # It ran in NO workflow until 2026-09-19 (bean `t373`) -- a check that
      # exists, works, and is wired to nothing. That is `xom7` (a workflow
      # failing unseen) and `cnlf` (a workflow that never fires) in a third
      # form, and it is why `main` carried eight dead README paths after the
      # site root moved to `docs/<stub>/`.
      #
      # TWO READMEs are audited, and that is not belt and braces. Until
      # 2026-09-20 there was one file: `cat-harness` declared the repository's
      # README as its own with `scope: "repository"`, so `readme:audit` with no
      # argument resolved to the root's. Issue #592 split them — every instance
      # now owns its own — and the bare command silently narrowed to
      # cat-harness's, taking the root README's 41 links out of this gate
      # without failing anything. A gate that stops covering something is worse
      # than one that never did: it still reports green.
      #
      # `readme:sync:root:check` IS wired now, and the comment that used to sit
      # here saying otherwise was true when written: this README carried zero
      # markers, because generated sections belong to a folio. It carries
      # `cat-harness:instances` as of #592 — the table of instances, generated
      # from the declarations — and an unchecked generated section is exactly
      # the hand-kept list that section exists to replace.
      - name: README links resolve
        run: |
          bun run readme:audit:root
          bun run readme:audit

      - name: The root README's generated sections are current
        run: bun run readme:sync:root:check

      # EVERY instance's README, each against its own declaration. The two
      # steps above and below name one README apiece; `readme:toc` (the
      # README's own table of contents) is carried by every harness README,
      # and a generated region nothing checks is a hand-kept list that is
      # wrong the first time somebody adds a heading.
      - name: Every instance README's generated sections are current
        run: bun run readme:sync:all:check

      # bootstrap's README carries `kg:processes` (its diagrams, drawn) and
      # `kg:files` (every file it holds), both generated from its declaration
      # (owner, 2026-09-29). The pictures themselves are checked by
      # `render:bpmn:check`; this checks the README that shows them.
      - name: bootstrap's README generated sections are current
        run: bun run readme:sync:bootstrap:check

      # One README per LIBRARY ITEM, from its own manifest (bean `qgjh`, owner
      # 2026-09-30: "like bootstrap readmes"). BEFORE the directory READMEs:
      # a library's README links each item row to the item's README only once
      # it exists, so `regen`, which asks these in order, must write it first.
      - name: Every library item's README is current
        run: bun run library:readmes:check

      # One README per declared directory, generated from the declaration by
      # `subgraph-readmes` (owner, 2026-09-29). The pre-commit hook runs the
      # same check; this is the gate a commit that skipped the hook still meets.
      - name: Every declared directory's README is current
        run: bun run readme:subgraphs:check

      # An instance's IRIs are `<iriBase><version>/…` for programs and
      # `<iriBase>v<major>/…` for people (owner, 2026-09-29). The copies that
      # cannot be derived at read time — BPMN xmlns, code-list values, fixture
      # strings — must match the declared version; `bun run iri:sync` fixes them.
      - name: Every literal release IRI is at its declared version
        run: bun run iri:sync:check

      # bootstrap-tools may depend on bootstrap and nothing above it (bean
      # `xsqm`): its own files, zod and the runtime. Tested with planted
      # violations, because a boundary check never seen failing checks nothing.
      - name: bootstrap-tools imports nothing above bootstrap
        run: bun run check:tools-closure

      # A published node's own identifier ($id, or a JSON-LD @id) under an
      # instance's release base must name the path its file actually sits at,
      # so publishing files where they sit serves every identifier (owner,
      # 2026-09-29: "make QA gate for KG nodes").
      - name: Every published node's identifier is its file's path
        run: bun run check:node-iris

      # Agent memory is authored under `memory/` and ASSEMBLED into
      # `.claude/agent-memory/<agent>/MEMORY.md`, which is what the Claude Code
      # harness injects. An entry edited and never assembled is a fact the
      # author believes an agent has and the agent has never seen -- invisible,
      # because the generated file still reads perfectly well without it.
      - name: agent memory is assembled
        run: bun run agent-memory:check

      # Fifteen gates that were REGISTERED IN package.json AND RUN BY NOBODY.
      #
      # Measured 2026-09-19: of 33 `check:`/`:check` scripts, 21 appeared in no
      # workflow at all. That is bean `5rfy`'s defect -- a gate that never
      # fires -- and it is worse than a missing gate, because `package.json`
      # advertises it and an agent (this one, repeatedly, this session) runs it
      # by hand, reports it green, and reasonably assumes CI does the same. It
      # does not. A sibling who does not run them merges the break.
      #
      # All thirteen PASS on `main` as of this commit, so wiring them locks in
      # a property the repo HAS rather than demanding work to reach one. They
      # share a step because they are fast and because thirteen near-identical
      # entries is noise; `-e` means the first failure names itself and stops.
      #
      # DELIBERATELY NOT WIRED, and each for a stated reason -- an unexplained
      # omission here is how the next person re-derives this list:
      #   render:bpmn:check     -- needs a BROWSER: bpmn-js renders through
      #                            Chromium, and this job installs none. It is
      #                            not dropped, it is MOVED to the e2e job,
      #                            which already has one. It passed on my
      #                            machine only because a browser had been
      #                            staged there earlier in the session -- the
      #                            precise "green locally, red on a clean
      #                            runner" gap these gates exist to close.
      #
      # The scripts CI deliberately does NOT gate used to be listed here, in
      # this comment. They now live in `SCRIPT_EXEMPTIONS` (scripts/gates.ts),
      # because a comment cannot be compared against the set it describes:
      # it covered six of the nine unwired check scripts, and the other three
      # -- health:check, landing:data:check, landing:sticky:check -- had no
      # reason anywhere and nothing said so. `bun run gates` now reports any
      # check script no workflow runs. Bean `ot9a`.
      #
      # One entry here was also FALSE. `translate-*:check` was excluded as
      # needing "a translation toolchain not installed on this runner"; both
      # run clean on a bare checkout, measured 2026-09-20, and both are wired
      # below. A reason nothing checks is free to stop being true.
      # `ahab`: a translated page sits one directory deeper than the page it
      # was translated from, and 745 of its links did not move with it. That
      # is invisible to `check:subgraphs` BY DESIGN — `docs/` is renderable,
      # so a link it cannot resolve here goes to the counted-never-asserted
      # bucket, where `architecture.md -> api/` legitimately lives.
      #
      # The control that separates them only exists for a translated page:
      # the same link, read from its SOURCE page's directory. 745 resolved
      # there and 30 did not, and the 30 are the ones a blanket rewrite would
      # have broken.
      #
      # ABOVE the drift gate DELIBERATELY. It was first registered below it,
      # beside `translation index is current`, and CI showed what that costs:
      # steps 43-49 read `skipped` because a job stops at its first failing
      # step, and step 42 is red on main by the owner's decision. A gate in
      # that region is registered and can never fire — `1xhc` — and this one
      # would have been born that way, in a change whose own subject is a
      # check that could not report. `om30` is the precedent and this is the
      # same mistake one job over.
      - name: translated pages' links resolve at their own depth
        run: bun run translated-links:check

      # ABOVE the drift gate DELIBERATELY, same as `translated-links:check`
      # directly above and for the same reason it records: this step sat 535
      # lines BELOW the drift batch, and a job stops at its first failing step.
      # The drift is deliberately red (owner's decision, bean `ngxj`, issue
      # #206), so `docs:pages:check` could not fire on any PR — the `om30`
      # masking shape, third instance in this file.
      #
      # Measured 2026-09-26 (bean `9x01`): the drift batch is step 40 of this
      # job's 46, so SIX steps were unreachable. Five remain below it and are
      # not this change's to move; the count and their names are on the bean.
      # One of the five is "translation index is current", which is masked by
      # the translation drift — so the gate that would catch a stale
      # `translations.json` cannot fire while the catalogues are missing, and
      # that is why the stale index found earlier today had to be fixed by hand.
      - name: generated docs pages are current
        run: bun run docs:pages:check

      # ABOVE the drift batch DELIBERATELY, like the two steps directly above.
      # A gate registered INSIDE that batch does not run at all: the batch is
      # one `run: |` block under `set -e` holding 106 gates, and
      # `translation:drift:check` is the THIRD of them, so the 103 after it have
      # never executed on any PR or any push to `main`. Bean `cpss` carries the
      # measurement; `check:workflow-injection` and
      # `check:artefact-verification` are two of the 103, both landed the same
      # day this was measured.
      #
      # That is the whole reason this gate is its own step. Satisfying
      # `no check script is unrun` by appending to the batch would have
      # registered it, reported it, and never run it — which is worse than not
      # wiring it, because the PR would go green saying otherwise.
      - name: every claimed locale has a page behind it
        run: bun run check:available-locales

      # ITS OWN STEP, above the batch. The reason changed under this gate while it
      # was in review, and the original is recorded because it is why the gate
      # exists: `translation:drift:check` used to be the THIRD of 106 commands in
      # one `set -e` batch, so a check placed after it never ran, and a check
      # ABOUT the drift's silence placed there would have been silenced by it.
      #
      # `cpss` has since fixed that structurally (#1436, option (b)): the drift is
      # no longer in the batch at all, it is the LAST step of the job, and a gate
      # enforces that it stays there. So this step is no longer dodging the drift
      # specifically. It stays its own step above the batch anyway, for the reason
      # `check:available-locales` above states: a gate inside that batch is one the
      # batch can still stop, and being registered while never running is worse
      # than not being wired, because the PR goes green saying otherwise.
      #
      # WHAT THIS GATE ASKS, and the measurement is corrected from an earlier
      # revision of this comment. It asks of the CHANGE what the drift gate asks of
      # the corpus: does what you are about to merge publish a translated page with
      # no `.po`? On `6ec97bd64ab^` it reports 5, exit 1. An earlier version of
      # this block said the backlog "went 25 -> 36" and that 35 was this gate's
      # finding count — BOTH WRONG and retracted on bean `3sm2`. 35 and 15 are the
      # counts of added files that PUBLISH a translation; the findings were 5 and 2,
      # and the 35 came from a hand-mutation that dropped the `existsSync` check.
      # The corpus backlog went 27 -> 8, downward.
      #
      # The argument that survives is about control flow and never rested on a
      # count: a job stops at its first failing step, so a gate held red by decision
      # cannot report GROWTH in its own subject — which is what a change-keyed gate
      # can do and a corpus-keyed one cannot.
      #
      # It reads the DIFF, so it needs the base ref: `actions/checkout` fetches
      # shallowly and `origin/main` is not a ref until this fetch. Without it the
      # gate exits 2 — could not determine — which is red rather than a false
      # pass, on purpose (`nytj`): a gate that cannot run must not read as green.
      - name: a change may not publish a translation with no catalogue
        env:
          # BOUND, not interpolated into the `run:` body — bean `j0zs` hardened
          # exactly this surface, and the rule there is to refuse the SHAPE rather
          # than judge each value, even for something as inert as a SHA.
          #
          # Read by the SCRIPT rather than spliced into its argv, and that is the
          # load-bearing part. `gatesFrom` in `gates.ts` takes every `bun …` LINE
          # of a step body as its own gate and runs it verbatim, so an `if`/`else`
          # holding two invocations registers the same check twice and runs both
          # with this variable unset — measured 2026-09-26, one of the two exited 2
          # locally with `--base needs a ref`, and the pair also took the gate
          # census from 167 to 168 and stranded `audit-coverage`'s sidecar. One
          # command line is what makes `bun run gates` run what CI runs.
          CATALOGUE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # THE FETCH is conditional; the invocation is not. On a `pull_request`
          # checkout HEAD is the merge commit, so it already CONTAINS the base:
          # `merge-base(base, HEAD) == base`, which makes `base..HEAD` the same SET
          # as `base...HEAD` while computing no merge base at all. That matters
          # because this gate's first CI run exited 2 — `--depth=200 origin main`
          # created the ref (`* [new branch] main -> origin/main`) and
          # `origin/main...HEAD` still could not resolve, a grafted shallow history
          # having no common ancestor to find. Two dots need none, so one commit
          # is enough to fetch.
          #
          # With no base handed to us (a `push` run, or locally) the script falls
          # back to three dots against `main`, where the history is connected, and
          # names the range it used either way.
          if [ -n "$CATALOGUE_BASE_SHA" ]; then
            git fetch --no-tags --depth=1 origin "$CATALOGUE_BASE_SHA"
            bun run translation:catalogue:check
          else
            # NO pull-request context: a `workflow_dispatch` or `merge_group`
            # run. `CATALOGUE_BASE_SHA` is empty, and the old fallback then ran
            # the three-dot path against an `origin/main` this very fetch had
            # just CREATED as a shallow graft — which has no merge base, so the
            # script exited 2, "could not determine", every time.
            #
            # That made a dispatched run of this workflow UNPASSABLE, which is
            # not a nuisance but a trap: `check-head-has-run.ts` tells an
            # operator to dispatch when a head has no run, so following the
            # repository's own advice attached a red hard gate to a PR that had
            # not earned it. Measured on #1633, 2026-10-01, run 36789391040 —
            # the only red among twelve checks, and it was the advice, not the
            # branch. Issue #823, bean `sddf`.
            #
            # Deepen until a merge base EXISTS, then name it. `--base` is the
            # script's two-dot path and needs no merge base of its own, but a
            # base still has to be supplied.
            git fetch --no-tags --prune --depth=200 origin main || true
            base="$(git merge-base origin/main HEAD 2>/dev/null || true)"
            if [ -z "$base" ]; then
              git fetch --no-tags --unshallow origin main 2>/dev/null \
                || git fetch --no-tags --deepen=2000 origin main 2>/dev/null || true
              base="$(git merge-base origin/main HEAD 2>/dev/null || true)"
            fi
            if [ -n "$base" ]; then
              bun run translation:catalogue:check -- --base "$base"
            else
              # Still could-not-determine, and it stays exit 2 rather than
              # becoming a pass. `dh4f`: the one thing this must never do is
              # render "I could not look" as "nothing is wrong".
              echo "::error::no merge base against origin/main after deepening — the catalogue check cannot run on this event"
              exit 2
            fi
          fi

      - name: voices projection and viewer are current
        run: bun run voices:viz:check

      # THE VOICES SHAPE, NOT THE LIBRARY SHAPE, and that distinction is the
      # whole reason this is gated while `library:viz:check` twenty lines
      # below is not. The folio projection derives from the declared `folio`
      # directories and the JSON nodes in them — three stickies in one
      # directory today — so it changes when somebody edits or adds a landing
      # sticky, and NOT when somebody else merges. A red here is an omission
      # by the author of the diff, every time, which is the test the comment
      # above states. Bean `7ofc`.
      - name: folio projection and viewer are current
        run: bun run folio:viz:check

      # REGRESSIONS ONLY, and that is the `library:viz` ruling applied rather
      # than an exception to it. The viewer-nav audit walks the whole docs
      # tree, so its sidecar goes stale the moment anybody adds a generated
      # page anywhere — gating on staleness would make a red mean "somebody
      # else merged", which is the shape the owner ruled ungated on
      # 2026-09-20. A page that WAS railed and is not any more is the author
      # of the diff, every time. Staleness and the still-unwired pages are
      # `bun run viewer:nav:strict`, which the author of a new generator runs.
      # Bean `edx7`.
      - name: viewer pages keep the navbar they had
        run: bun run check:viewer-nav

      # The handler namespace's own index. Gated on the same ground as the
      # voices projection: it derives from the DECLARATIONS (which kinds each
      # instance declares, and whether a `coverage.visualiser` names a
      # published path), not from the whole repository — so a red means
      # somebody changed a declaration and did not regenerate.
      #
      # It is also the one page a navbar tile points at: `siteLinks` publishes
      # `kg` as `/<stub>/`, and `verifySiteLinks` reports `unknown` rather
      # than `dead` on an unbuilt tree, so nothing else here would notice it
      # going missing until production (bean `8h42`).
      - name: handler namespace index is current
        run: bun run handler:index:check

      # NOT GATED: the schema and library projections.
      #
      # `schema:viz:check` and `library:viz:check` exist and are worth running
      # locally, but they are deliberately NOT in this gate set. Owner's call,
      # 2026-09-20, after the gate went red twice on PR #583 for a reason that
      # was never the author's doing.
      #
      # Both projections are derived from the WHOLE repository, so any branch
      # alive for more than a few minutes finds them stale against the merge
      # ref. Measured across one session: `main` moved four times — 120, 2, 2
      # and 11 commits — and twice that was enough to redden this gate on a
      # branch whose own tree was correct. A red that means "somebody else
      # merged while you worked" is not an omission by whoever sees it, and it
      # fails the standard stated eight lines above: "a real omission, every
      # time."
      #
      # Nothing published goes stale. `docs-site.yml` runs the WRITERS at
      # deploy, so the page a reader opens is regenerated from the tree being
      # published. What can lag is the committed copy on `main`, which exists
      # to be browsable on GitHub — and a browsable copy one merge behind is a
      # far smaller cost than a gate contributors learn to re-run without
      # reading.
      #
      # The other `--check` gates here stay, and the difference is their
      # INPUTS: each derives from a narrow set of files, so its red really does
      # mean the author of the diff forgot to regenerate.

      # The translation index is what the navbar's locale filter reads. It is
      # derived from what each page DECLARES — `lang`, and `translation_source`
      # naming what it expresses — never from a directory whose name looks like
      # a language subtag. Three outcomes, and the third is why this is not a
      # plain diff: exit 2 means the translation set could NOT BE DETERMINED
      # (no Jekyll site where one was expected, or a page whose front matter
      # will not parse and that something translates), which must never be
      # published as "this folio has no translations".
      #
      # It also catches the one thing that is easy to forget and invisible
      # locally: a translated page with no `nav_exclude: true` goes into the
      # statically built navbar for EVERY reader, whatever locale they chose.
      - name: translation index is current
        run: bun run translation:index:check

      # ── LAST ON PURPOSE, and this is the whole point of the placement ──────
      #
      # `translation:drift:check` is the one gate in this job that has been red
      # BY DECISION (bean `ngxj`, issue #206) rather than by defect. It used to
      # be the THIRD of 107 `bun run` lines inside "gates that were registered
      # and never run" — one `run: |` block under `set -e` — so while it was red
      # the 104 invocations after it never executed, on any PR or any push to
      # `main`.
      #
      # Measured 2026-09-26 (bean `cpss`): of those 104, eighteen have no test
      # anywhere that references the same script, so for those eighteen the
      # masked gate was the only thing watching. The other 86 had a test twin,
      # which is a second line of defence rather than an excuse — and both
      # figures are BOUNDS, not counts, because the twin was matched on script
      # basename.
      #
      # The cost was measured too, twice. `check:partition` (in the masked
      # region) reported an unclassified module the hour the batch first ran
      # through. And "translation index is current", three steps above, is the
      # gate that would have caught a stale `docs/_data/translations.json` —
      # which had to be repaired BY HAND on 2026-09-26 after CI reported green
      # on the branch carrying it. The gate existed the whole time.
      #
      # So the invariant is now STRUCTURAL rather than remembered: a gate that
      # may be deliberately red belongs last, where the set it masks is empty.
      # Anything added after this step re-creates the defect, and the reason it
      # is safe here is only that nothing follows.
      #
      # Three earlier changes moved ONE gate each to just above the batch
      # (`ee964c7411` for `translated-links:check`, then `docs:pages:check` and
      # `check:available-locales`). Each was correct and none of them scaled:
      # "put your gate above the drift" is a rule every future author has to be
      # told, while "the deliberate red is last" is a rule the file enforces.
      - name: translations have not drifted from their source
        run: bun run translation:drift:check

  gates-unrun:
    # bpmn-node: Task_UnrunGates
    name: Repository gates — registered, never run elsewhere (hard)
    #
    # Split out of `gates` by bean `dlqu`. This one step measured 1m46s-2m28s
    # over four runs (2026-10-02), four times the next-longest step, and a
    # job's steps run one after another, so it alone set a quarter of the
    # `gates` job's wall-clock. In a job of its own it runs BESIDE the other
    # repository gates instead of after them.
    #
    # Moved whole and unchanged: the same `set -e` block, the same commands,
    # the same setup as `gates`. No `needs:` on `gates` and none from it, for
    # the reason `gates` gives about `typescript` — independent questions,
    # asked independently, so one red cannot stop the other being asked.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: gates that were registered and never run
        run: |
          set -e
          # Wired 2026-09-20 (bean `ot9a`): each was declared in package.json
          # and run by no workflow. `translate-kg-viewer:check` was RED on
          # main for an unknown stretch while CI stayed green -- a gate no
          # workflow runs cannot fail, which is bean `xom7` one level down.
          bun run translate-kg-viewer:check
          # Every uncatalogued page has a `.pot` for a translator to work from.
          #
          # It used to carry an ordering note — "BEFORE the drift check on
          # purpose ... anything placed after it never runs" — and that note is
          # gone because the thing it worked around is gone:
          # `translation:drift:check` is no longer in this block at all. It is
          # the LAST step of this job, so it masks nothing. Bean `cpss`.
          #
          # This does NOT turn the drift check green and is not meant to: a
          # `.pot` is the translator's input, a `.po` is their output, and 19 of
          # 27 of those outputs are provably not derivable (bean `f6r1`). What it
          # guards is that the input exists — measured 2026-09-26, not one of
          # the 25 pages had a `.pot` OR a `.po` in any locale, so the campaign
          # had nothing to be handed.
          bun run translation:pot:check
          # `lvk9`: when the extractor's segmentation changes, msgids in the
          # committed catalogues stop matching their source. Deleting them throws
          # away translation work; leaving them shows a translator strings the
          # page does not contain. This fails when a stale entry is not `#~`
          # obsolete, and `bun run translation:obsolete` marks them.
          #
          # It also reports three states it will NOT fold into a count — a
          # catalogue sourced from a `.ts` rather than markdown, one that declares
          # no source at all, and one whose declared source is ambiguous — because
          # "no findings over the subset I could resolve" is exactly what produced
          # a wrong published claim on #1433.
          #
          # This step carried a placement rationale until the `cpss` merge: it
          # asked to sit BEFORE `translation:drift:check` so a deliberately-red
          # gate could not bury it, the `1xhc` shape. That reason is gone rather
          # than satisfied — the drift check is no longer in this block at all,
          # it is the last step of the job, and `check:red-gate-is-last` enforces
          # that structurally near the top. The note is recorded rather than
          # deleted because a reader who finds this line above nothing in
          # particular would otherwise re-derive the ordering question from
          # scratch.
          bun run translation:obsolete:check
          # Bean `eief`: a stubbed tool must not read as a working one, and a
          # stub that has outlived its tool must fail rather than linger.
          bun run check:tabular-stubs
          bun run translate-bpmn:check
          # bootstrap/ is a NESTED instance, so the run above does not scan its
          # three diagrams and must not -- widening that scan re-introduces the
          # leak `instance-graph-isolation.test.ts` exists to stop (`7u3g`).
          # Its templates therefore need their own run, pointed at the instance
          # that owns them. Bean `j28g`: they previously sat under
          # cat-harness/translations/ where nothing refreshed them, and
          # log-message.pot was measured missing the lane documentation added
          # to its own diagram the same day.
          bun run translate-bpmn:bootstrap:check
          bun run landing:sticky:check
          bun run landing:data:check
          # `sjic`: the Jekyll sidebar's navbar is RENDERED by the same module
          # every mounted page uses, and committed as an include. Gated here
          # because a stale include is a sidebar that disagrees with the rail
          # about what a harness holds -- which is the defect the bean is
          # about, arriving again through the back door.
          bun run navbar:include:check
          bun run check:agents-xref
          # Bean `rsi6`: `@litlfred/block-qa-schema` is the only package here
          # that ships to npm, and NO workflow built it. PR #914 bumped its
          # typescript 5.9.3 -> 7.0.2, passed TEN checks, and left the package
          # unbuildable -- `tsup --dts` delegates to rollup-plugin-dts, which
          # bundles its own TypeScript 5.7.3 and dies on TypeScript 7's
          # compiler API. Ten green checks, not one of which read the file the
          # PR changed. The set is derived from the git index, and an EMPTY
          # set fails rather than passing: a sweep that examined nothing has
          # not cleared anything.
          bun run check:published-packages
          # Bean `b963`: a path inside a fenced COMMAND is not a link, not a
          # symbol claim and not a literal in a .ts file, so all three
          # neighbouring checks miss it by design. The cold-start line every
          # agent runs first rotted in exactly that gap.
          bun run check:command-paths
          # Bean `b963` fourth class. It does NOT catch a re-rooted ascent —
          # three designs for that were measured and failed. It makes a name
          # that claims an anchor land on it, which removes the ambiguity the
          # defect hid behind: PLATFORM meant the repo root in one test and
          # cat-harness/ in five siblings, in one directory.
          bun run check:anchor-names
          # Bean `fx5r`'s last open item, and the only one a test could not
          # close: the other four fixed particular strings. PR #1362 fixed the
          # two advice strings in check-head-has-run.ts and MISSED the third
          # copy in pr-checks-present.yml, which kept being posted to live PRs
          # for four days, because nothing linked them. The rule is structural
          # rather than about intent -- a mention passes when its neighbourhood
          # says something about the field's reliability, whether that is a
          # caution or a measured licence, and fails when it is bare.
          bun run check:stale-field-advice
          # Bean `jijc`, under the owner's REPLACE ruling on `b5f0`:
          # DECLARATION_FILENAME existed the whole time and 20 non-test call
          # sites built the path from a literal instead, which is what turns
          # the rename into a 121-file sweep. Prose, test fixtures, template
          # construction and cross-instance sites are each CLASSIFIED and
          # counted rather than failed -- and `docs/_data/harness.json` is a
          # different file that must NOT be renamed.
          bun run check:declaration-filename
          # Bean `hrv2`: the sibling above hunts the RETIRED name, so it is blind
          # to a filename that is wrong but real -- AGENTS.md named
          # `folio-assistant.config.json`, a file that exists and declares no
          # graph. This one checks the CLAIM: prose pairing a declared graph id
          # with a declaration file, verified against the declarations. Its
          # vocabulary is derived from them, so an empty result is reported as
          # unknown rather than as a pass.
          bun run check:declaration-claims
          # A Liquid interpolation feeding src/srcset/href resolves, or says
          # it cannot be told (bean `blv9`). The FIFTH shape of one class in
          # this repo -- a link-shaped value that does not dereference --
          # and every earlier instance was found by a person asking whether a
          # URL resolved, never by a test. Only a LITERAL is decidable: a
          # variable is DECLINED and listed, because `viewHref`/`editHref`
          # hold absolute forge URLs that the filter would break.
          bun run check:docs-templates
          # Every declared image `role` is read by something that can actually
          # REACH it (bean `5yrl`, split out of `blv9`). Scans
          # declaration -> consumer, the direction `themes.test.ts` cannot:
          # that walks theme -> role, so a role NO theme names is outside its
          # domain by construction, which is how `landing-architecture` sat
          # declared and unnamed. Half two is the half that matters -- the
          # favicon shape, where a caller EXISTS and cannot match, because
          # `imagesForRole` is layout-keyed and a mark declares no layout.
          bun run check:image-roles
          bun run check:bean-parents
          # Does a bean's BODY name a parent its front matter does not carry?
          # `check:bean-parents` validates the declared graph; this asks whether
          # the declaration agrees with the bean's own prose. 4ccr's body named
          # a parent while its front matter carried none, and GOAL 2's queue
          # omitted 24 open items including ob3m (bean tlj9). The phrase set is
          # narrow by measurement: 338 bean-id mentions in bodies, 1 in a
          # placement phrase.
          bun run check:bean-parent-prose:check
          # Every file in an `uploads` or `library` graph carries a name that is
          # safe to link to. `uploads/PIIS2589750021000388 (2).pdf` broke the
          # generated README's Markdown link — a target ends at the first `)` —
          # which reddened main through `every link in every generated README
          # resolves`. Owner ruling 2026-09-30: normalise the NAME, not the link.
          bun run check:upload-names:check
          # Bean `e8m3`, on the owner's VIEW ruling. `beans/defs/archive/` held 631
          # bean-defs while `beans/beans.json` declared it nowhere — the `dh4f`
          # family INVERTED, and invisible to check:declared-dirs and
          # check:harness-dirs by construction, because both compare declarations
          # against disk and not the reverse. It also holds the invariant the
          # ruling implies: an archived bean that is still open is work no count
          # can see, which is the 35-bean defect e8m3 was filed over.
          bun run check:bean-archive
          bun run check:bean-blocks
          # Bean `m61r`, issue #1853: a pull request adds to a bean it does not
          # own by writing a NOTE, one file per branch per bean, instead of
          # appending — `ob3m` cost five hand-merges in one afternoon because
          # every append conflicted with every other. This judges each note
          # (front matter, a bean that exists, and the file name its own front
          # matter derives — the rule that keeps two writers apart) and fails
          # on a stale generated index. Writer: `bun run beans:notes`.
          bun run beans:notes:check
          # Bean `kpcl`, issue #956: `in-progress` stopped carrying information --
          # 99 claims, 77 untouched for a day or more. The obvious sweep assumes
          # its own answer, so this gate owns only the half that is PURE GRAPH:
          # a bean whose status its own children refute. No clock, because a
          # clock-dependent gate turns CI red at an arbitrary hour with nobody
          # having changed anything -- `beans.ts` declines a stale-in-progress
          # finding for the same reason. The age sweep is `-- --sweep` and never
          # sets the exit code. Baselined at the one the store carries (`5a3l`,
          # completed over 12 open children), so a NEW one fails.
          bun run check:bean-rollup
          # Bean `sfhr`: three store defects `beans check` cannot see, because
          # none of them is a link -- an empty body on an open bean, a `title:`
          # block scalar that swallowed the body's first lines, and a prose
          # blocker naming a bean that is `completed` or `scrapped`. Baselined
          # at the eight the store had, so a NEW one fails and the backlog is
          # listed rather than demanded.
          bun run check:bean-bodies
          # Bean `7pp6`: a markdown line whose FIRST character is `<` makes
          # kramdown open a raw HTML block, and with no close tag the REST OF THE
          # PAGE stays raw -- tables print as rows of pipes. The usual cause is an
          # inline code span wrapped across a line break.
          #
          # `check:escaped-markup` already catches this, but only on a BUILT tree,
          # and that runs in docs-site.yml AFTER merge. So five of these shipped
          # green and reddened `main`: four closed at once by `7w1a` (`<agentId>`,
          # `<branch>`, `<file.json>`, `<name>.config.json`) and `<slide>` by
          # #1730, which cost NINE consecutive `Docs site` failures. Each was
          # repaired by reflowing the one source that had it; a fix repeated five
          # times is a missing gate, not five accidents.
          #
          # Column 0 only, outside fences and front matter, with autolinks and
          # real html elements excused BY NAME -- including the
          # `<details markdown="1">` that `7w1a` deliberately introduced. Of 6
          # column-0 matches across 2314 files, four were not this defect, so a
          # check designed from the one example would fire on valid documentation.
          # Lands green over 706 sources: it locks the class, it does not open a
          # backlog.
          bun run check:escaped-markup:source
          # Bean `t7ao`: check:bean-bodies reads front matter by REGEX, and a
          # regex over a broken document does not notice the document is
          # broken. A bean committed with a literal `\1` where `updated_at:`
          # belonged passed 92 gates, then took `beans list`, `roadmap` and
          # `prime` down for every reader -- the store loads as a unit, and
          # `prime` is the first command in the AGENTS.md cold start. Fails
          # hard on a bean NO loader will read; a duplicate key (which `beans`
          # itself tolerates) is baselined at the two the store carries, so a
          # NEW one fails and the existing two are listed rather than demanded.
          bun run check:bean-front-matter
          # Bean `k59d`: check:bean-bodies reads a SENTENCE (`blocked on `id``).
          # A milestone states its blockers as a ROUTE, so both GOAL milestones
          # advertised finished work as next and neither detector could see it.
          # Two rules only -- an id that is an operand of an arrow, and a
          # numbered step under a path heading -- with prose that merely
          # mentions a closed bean deliberately NOT examined and said so.
          bun run check:stale-paths
          # Bean `bbbl`: a bean tagged `ready-to-close` carries the evidence its
          # session did find. Fails only on a tag with no `## Evidence` -- the
          # parking space the skill forbids. Closing them stays the owner's.
          bun run check:ready-to-close
          # Bean `bbbl` / the owner's waiver rule: a malformed waiver reads as
          # permission and carries none, so it fails here rather than at the
          # gate it claims to have opened.
          bun run check:waivers
          # Bean `oh78`: a bean and its issue must reach each other. The
          # bean -> issue direction and the tracked-issue reverse are checked
          # here; the general reverse needs the API and prints as undetermined
          # rather than as clean.
          bun run check:bean-issue-links
          # Bean `8v0y`: a bean that carries a SKILL'S CONTRACT instead of
          # pointing at it. `kn0t` held a second copy of
          # ig-publisher-reduction.md and it had drifted in four places; the P1
          # one turned "the navigation is DIFFED, and the difference is empty
          # or explained entry by entry" into "navigation matches", which would
          # have let a phase be declared done on an impression -- the first
          # entry in that skill's own `Do not` list. NOT a similarity check:
          # kn0t's three real drifts score Jaccard 0.25/0.54/0.33, all below
          # any usable floor, because semantic drift is a REWRITE. Structural
          # instead -- a table enumerating phases, each row carrying its own
          # exit condition. Measured over the whole store: 0 of 888 beans, and
          # 1 of 1 on kn0t as it stood before PR #1185.
          bun run check:bean-restates-skill
          bun run check:python-deps
          bun run deps:python:check
          bun run check:l1-complete
          bun run check:l1-complete -- --check
          # Issue #1794, bean `8iqc`: l1-complete asks whether ingestion
          # PRODUCED each artefact; this asks whether it is any good -- a
          # title that is the slug, or "Abies" off a scanned cover, passes
          # every completeness test. ADVISORY: the findings are reported in
          # the committed sidecar and do not fail; a stale sidecar or a
          # could-not-determine entry does.
          bun run check:library-qa:check
          # Bean `q7ey`: an ingested upload retires to `fsh-guts/uploads/`.
          # The rule was written and hand-swept on 2026-09-30, and that one
          # sweep left eight files in two places and a whole harness
          # unswept -- so the rule needed enforcement, not a better sweep.
          # Blocking on a bare queue drop; who-iris's per-source intake
          # directories are reported and advisory, because moving the PDF
          # out of one would orphan its `intake.json` and that layout is
          # being reworked in #1612.
          bun run check:uploads-retired
          bun run check:catalogue
          # Bean `06e3` §4(b): every harness declaring a `docs` graph owes at
          # least one MEANINGFULLY POPULATED page. Exit 2 — could not
          # determine — is a failure here and not a pass, which is the whole
          # reason the check exists rather than a file-exists test.
          bun run check:docs-populated
          bun run check:declared-paths
          bun run check:fallback-roles
          # `--require-all` as of bean `rj0n`. The flag existed "for the day the gap
          # is meant to be closed" and could NEVER have passed: all seven kinds it
          # counted were either not JSON (`.bpmn`, `.puml`, `.md`, `.ts`) or had no
          # nodes at all, so the count read as a seven-item backlog over a real
          # backlog of zero. Each now declares WHY a runtime validator cannot
          # apply, naming the file format or the absent subject — a fact a reader
          # can check, so "not applicable" cannot launder a real gap.
          #
          # Safe to wire because it is GREEN on this tree, as with `check:skills`:
          # it locks in a property the repo HAS. What it buys is that a kind added
          # tomorrow without deciding shows up as `undeclared` rather than joining
          # a backlog nobody reads.
          bun run check:kind-validators:require-all
          # The UML overview is drawn from the declarations and the kind
          # validators just checked, so it goes stale when either changes.
          bun run uml:overview:check
          bun run check:artifact-index
          bun run smart-trust:pages:check
          # smart-base's landing page and artefact index, from the same generic
          # generator (fhir-harness/scripts/gen-ig-pages.ts, #1767).
          bun run smart-base:pages:check
          bun run smart-immunizations:pages:check
          # The OpenAPI harness (cat-openapi, bean s4ta): every document an
          # instance's cat-openapi.config.json names is held verbatim and matches
          # its provenance, and its per-operation pages and IRIs are current.
          bun run smart-trust:openapi:check
          bun run smart-trust:openapi:pages:check
          # smart-base's DAK document kind, generated from DAK_COMPONENTS
          # (stage D5, #1767): stale the moment a component is added.
          bun run smart-base:document-kinds:check
          # smart-kg L1 documents kept beside library entries (bean 8pzh):
          # stale the moment a section text or structure.json they read changes.
          bun run smart-base:smart-kg-l1:check
          # The DTH terminology findings page (#1984): stale the moment the
          # candidate list or the authored alternatives change, and red when a
          # quote no longer matches the section it cites.
          bun run smart-base:dth-terms:check
          bun run document-kinds:viz:check
          # P2's refusal record (bean ntyj): every published XML/Turtle
          # representation this pipeline does not render, per IG, generated
          # from the artefact index -- so it goes stale the moment the index
          # is re-ingested, and a stale record misstates what was refused.
          bun run p2:refusals:check
          # The IG AST's JSON Schemas and JSON-LD context are generated from
          # the Zod declaration readAst validates through (bean l0lq), so a
          # field added to the Zod without regenerating leaves downstream
          # consumers validating against a stale contract.
          bun run ig-ast:schema:check
          # The fsh-guts index is generated from the graph, so it goes stale the
          # moment a file is relocated there -- which is the ONE operation that
          # graph exists for. Gated here rather than trusted, same as every
          # other generated page.
          bun run fsh-guts:viz:check
          # The tools index is generated from the Tool nodes, so it goes stale
          # the moment one is added or its `satisfies` changes.
          bun run tools:viz:check
          # The themes page renders every theme in schemas/themes.ts with its
          # declared art, so it goes stale the moment a theme, a palette or a
          # crop changes.
          bun run theme:page:check
          # Theme art intake over every declared backdrop role. Reported but
          # ungated until 2026-09-24 because `landing-architecture` had no mobile
          # crop; the owner supplied it, so a refusal here is now a regression.
          bun run check:theme-art:check
          # Every harness's LHS navbar entry: does its declared `icon` resolve,
          # and does one artefact wear one glyph across the two registries that
          # draw it? `:check` and NOT `:strict`, deliberately — the advisory
          # family is "art declared, no icon named", which is the owner's call
          # about whether an instance wants a mark at all, not a regression.
          # Same line `check:theme-art` drew above, for the same reason.
          bun run check:navbar-consistency:check
          # Every instance declaring a `themes` graph: does it load, and does
          # each theme validate? The gate that TRULY covers the `themes` kind —
          # three others declared `@covers themes` while resolving no themes
          # directory (bean `z6xd`), so the kind read audited over ground
          # nothing reached. Theme KINDS are reported and never graded: which
          # theme may style who-iris's card is the owner's call (#1584).
          bun run check:instance-themes:check
          # The methodologies index renders the `methodology` graph across
          # EVERY instance that declares one, so it goes stale when any of them
          # adopts a method, ingests a source, or changes an `applies-when`.
          # Gated for the reason every generated page here is: a stale viewer
          # is a page that reports a corpus that no longer exists.
          bun run methodologies:viz:check
          # The external-schemas index renders the registry AND resolves every
          # `usedBy` path in it, so it goes stale when a record is added, an
          # edition bumps, or a file a record names is renamed. The last of
          # those is the one nothing else would notice.
          bun run external-schemas:viz:check
          bun run processes:viz:check
          # MATERIALIZED CONTENT IS READ-ONLY, enforced rather than advised
          # (owner's ruling, 2026-09-22). Hashes every materialized artefact
          # against its recorded digest: an edit in place fails here. A
          # publication step that legitimately rewrites one updates the fixity
          # in the same change, which is what makes the exception checkable
          # instead of a carve-out.
          bun run check:materialized-fixity
          # Every skill a remote-package wrapper declares is MATERIALIZED at the
          # commit that wrapper pins — offline, no fetch (issue #556).
          bun run check:remote-skills
          bun run check:read-only-graphs
          bun run check:actor-reach
          bun run check:harness-dirs
          # A bootstrap schema names no outside concept — no derivative's
          # content model, layer names or standards (owner, issue #1164).
          bun run check:bootstrap-concepts
          # A filed requirement parses as one, its id is its file name, and no
          # name is both a proposal and a requirement (issue #1164).
          bun run check:requirements
          # Does a path-filtered workflow rebuild when the scripts it RUNS
          # change? `docs-site.yml` named eight generators and ran 22, so a
          # fix to `kg-export.ts` -- the script producing both graph documents
          # the site serves -- merged to `main` and fired NO RUN. The outage
          # `40fl` fixed and the silence after the fix were one defect seen
          # twice (bean `tyyc`). Derived from each workflow's own `run:` steps,
          # never a list here.
          bun run check:artefact-verification
          bun run check:workflow-injection
          bun run check:secret-leaks
          bun run check:lockfile-pinning
          bun run check:qa-reviewer-permission
          bun run check:workflow-script-paths
          # Can this repository be CHECKED OUT? Every other gate here asks
          # whether the content is right; this one asks whether the tree can be
          # created at all. Seven sidecars named `req:<slug>` made the clone
          # abort on Windows — the fetch succeeds, then `error: invalid path`
          # takes the WHOLE working tree, so the author sees nothing and CI,
          # being Linux, saw nothing either (2026-09-21, bean `en68`).
          bun run check:portable-paths
          # A backtick inside a viewer's page template closes the string
          # and turns the rest of the page into TypeScript. The compiler
          # already refuses it, so this is about the MESSAGE: it names a
          # token on the offending line and never mentions backticks, and
          # four separate sessions have lost a build to that. Four in-file
          # warnings did not stop it.
          bun run check:viewer-backticks
          # One config per instance: `<name>.config.json` at the
          # instantiation root. This repository instantiates more than
          # one harness, so a single `harness.config.json` at the repo
          # root had become an answer to a question with two answers.
          bun run check:instance-config
          # Every INSTANTIATED harness has a mark of its own. The kind axis is
          # check-avatar-coverage; this is the instance axis, which nothing
          # checked until 2026-09-22 — `harness-tiles.ts` claimed the generic
          # fallback was "reported as a finding" while `genericAvatar` was
          # computed and read by nobody, so `folio-assistant` rendered a
          # question mark until the owner saw it. Bean `zc7m`.
          bun run check:avatar-instances
          # ...and the KIND axis, which no package script or CI step ran until
          # bean `bo44` (2026-10-01): `check-avatar-coverage --check` existed,
          # still wrote its sidecar, and nothing called it. The `:check` form
          # judges and writes nothing.
          bun run check:avatar-coverage:check
          # A reader's folio must be the SAME folio in every library they
          # browse (F8/F9). A page that forgets the mount is a folio that
          # silently disappears when they follow a link — the page renders,
          # the library works, and nothing else reports it. Bean `jpjt`.
          bun run check:folio-mount
          # Every instance renders its OWN graph, and an unreadable one is
          # `undetermined` rather than a pass (bean `z4mq` item 3).
          bun run check:instance-render
          # ADVISORY by design, so it exits 0 on findings (bean `2krx`): of 22
          # directories this instance declares, 2 have a renderer, and a hard
          # gate on day one is a wall somebody switches off. It is here so the
          # count is visible on every run and cannot drift unnoticed — the same
          # path `undeclared` took in check:instance-render before it became
          # fatal. `--strict` is the switch for the day the number is low
          # enough to hold.
          bun run check:subgraph-coverage
          bun run check:published-refs
          # The publishability CENSUS, and it is expected to report every
          # instance as UNDECIDED — §6 Q1 of `instance-versioning.md` is open,
          # and absence there means "nobody has said", never "internal". So
          # this runs for the list rather than for a verdict, and its own
          # report says in that many words that an all-undecided census is not
          # a pass. Advisory; `--strict` fails only on the two CROSS-INSTANCE
          # rules a per-declaration parse cannot hold (a duplicate id, an
          # unreadable declaration).
          bun run check:publishable
          # TWO questions about a code file, never averaged: is it in a
          # DECLARED directory, and is it REACHABLE from a Tool node. They
          # fail independently and are fixed by different work, so a single
          # coverage number would let a rise in one hide a fall in the other —
          # which is the defect bean `ylj7` was opened for. Advisory: both
          # questions have open beans, and a gate that fails on a backlog is a
          # gate somebody switches off.
          bun run check:code-accounting
          # §4's bump, computed from the exported-surface diff rather than
          # claimed by a commit message. §4.1's falsifier was run before this
          # was built — 18 patch / 1 minor / 1 major over 20 commits on main —
          # and it reports "no publishable instance" today, which is a stated
          # nothing rather than a clean run. Advisory until an instance
          # declares `publishable`.
          bun run check:version-bump
          bun run check:graph-kind-work
          # One place says what an asset ROLE is — purpose, layer and
          # delivery. A per-asset restatement of any of the three is a
          # second answer free to disagree, and `KgAssetSchema` strips it
          # WITHOUT A WORD, so the declaration reads as if it carried one
          # while no consumer ever saw it (bean `7syd`).
          bun run check:asset-roles
          # Every instance's dependency graph resolves: no missing dependency,
          # no cycle. At runtime a missing one only WARNS (owner, bean
          # `a1lq`), because a partial checkout looks the same; CI has the
          # whole checkout, so here it fails.
          bun run check:instance-graph
          # Concern groups (placement PR0c, bean `ejye`): every grouping
          # kind's groups are declared from within, are codes of
          # `code-lists/concern-group.json`, are declared once, and a higher
          # instance's same-named directory is a member rather than a group
          # of its own.
          bun run check:concern-groups
          # No module scope resolves the folio directory. `folioDir` throws
          # on a malformed declaration, and a throw during evaluation strands
          # every export below it — which is how bean `95s1` got an error
          # 3,186 lines from its cause that looked like a circular import.
          bun run check:module-scope-resolution
          # Every foreign-instance export `docs-site.yml` actually runs, run
          # the way it runs it — no `--base-url`, on the declaration's own
          # authority. The deploy failed SEVEN consecutive times on `main`
          # (2026-09-21) on one command this set did not contain, and six
          # merges landed against the green it printed meanwhile. The
          # invocations are read out of the deploy YAML rather than listed,
          # so adding one there is covered here with no edit; finding none
          # is exit 1, not a pass (issue #720, bean `u1iu`).
          bun run check:published-instance-exports
          # A preview must run the generators the deploy runs, with the same
          # instance arguments. `3jhq` was exactly this: staging ran the
          # exporter but not for the foreign instance, so two links 404ed on
          # every preview. Deploy and preview are DERIVED (the deploy passes no
          # `--base-url`), so neither is named in the check (bean `qgpo`).
          bun run check:invocation-parity

          # The generators THIS FILE invokes directly, run as a set.
          # Seven `--check` invocations live in workflow YAML and in no
          # `package.json` script, so a local sweep of `check:*` came
          # back clean while `gen-skill-docs --check` was red here
          # (2026-09-20). It reads them out of the YAML rather than
          # listing them, so a new one is covered the day it is added.
          bun run check:ci-invocations

          # Its sibling, also reading the workflow YAML rather than a list: a
          # job that RUNS a platform script must have CHECKED OUT the
          # platform's submodules, because `cat-harness/schemas/` imports from
          # `bootstrap-tools`. Measured 2026-10-02 — `feature-staging.yml`'s
          # `cleanup` job had failed on exactly this for six consecutive runs
          # and `STAGING/` held 80 previews, 47 for closed PRs. The failure is
          # worse than a missing cleanup: `rm -rf` runs, then `render-log.ts`
          # dies and aborts the step under `bash -e`, so the commit and push
          # never happen — a cleanup that reports failure having changed
          # nothing, while looking from outside like one that ran.
          bun run check:workflow-submodules
          # The per-kind state dashboards under `<base>/<graph>/dashboard/`.
          # COMMITTED pages, so a difference is somebody who changed the
          # generator, the renderer it inlines, or the declaration, and did
          # not regenerate — the same contract `schema:viz:check` uses.
          bun run state:visualizer:check
          bun run harness:dirs:check
          bun run check:schema-nodes
          bun run check:retired-front-matter
          bun run check:raci
          # Subgraph containment, and how far the corpus is from the
          # owner's "subgraphs should be disconnected" (bean `x4v4`). It
          # REPORTS entanglement and broken links rather than refusing
          # them — the disentangling is known-outstanding work, and a gate
          # on that is one somebody switches off. Non-zero only on the
          # third state: a file whose edges could not be read at all.
          bun run check:subgraphs
          # Does each methodology's cited `origin` resolve to an ingested
          # source? Six cited one and NONE was in any library when this
          # axis was added (2026-09-22), so it REPORTS rather than gates,
          # on the same reasoning as `check:subgraphs` above. It is
          # non-zero only for a node whose front matter does not validate
          # or whose `evidence` points at a bib-slug no library holds —
          # a citation that claims to resolve and does not is worse than
          # none, because every listing reads it as backed.
          bun run check:methodology-evidence:check
          # The layout norm, ENFORCED AS A RATCHET rather than as a gate
          # on the whole corpus: no declared directory sits inside another
          # declared directory, with the four `skills/voices` nestings that
          # exist today baselined. A pair not in the baseline fails, so
          # `cat-harness` — which reached zero on 2026-09-22 and has no
          # baseline entry — cannot regress. Owner: "follow established
          # norms on layout. qa to enforce."
          bun run check:layout-norms:check
          # Every ingested source records its licence, or records that nobody
          # could find it and where they looked (issue #1023). It REPORTS
          # absence and `unknown`, because the field is new, and fails only on
          # a record that claims something it cannot back. The `:check` form
          # compares the committed sidecar and writes nothing (bean `i2kp`):
          # the writing form, run as the gate, rewrote what it should judge.
          bun run check:source-licence:check
          # Every declared harness visualiser has a wireframe, checked at a web
          # AND a mobile viewport (issue #1023; owner: "need both web and
          # mobile layouts in usability reviews"). Gated: a visualiser added
          # without a wireframe, or a wireframe checked at one width, fails.
          bun run check:wireframes:check
          # The four above run in their JUDGE form (`:check`, bean `bo44`):
          # compute, judge, write nothing. Their bare forms rewrite their own
          # QA sidecar on every run, so the gate CI ran was also the writer of
          # the record it reported into — a gate that cannot fail on its
          # sidecar's content, and that leaves the tree dirty. Exit 2 is
          # could-not-determine and is never a pass.
          #
          # The KG export, judged in memory: a root field or term outside the
          # `@context`, or a keyword/alias collision, fails; an unread source
          # is exit 2. Until `bo44` only the deploy ran the exporter, so a
          # fatal export finding surfaced at publish time rather than on the PR.
          # `kg:export:judge`, not `:check`: `kg:export:check` is the sidecar
          # currency gate above (bean `v556`); the owner kept both (2026-10-02).
          bun run kg:export:judge
          bun run check:xml-comments
          bun run check:orphan-verdicts
          # Every QA judgement is held in the attestation store (beans `2gst`,
          # `8wj1`, D2): no kg-qa sidecar still carries one, and every non-script
          # block/translation verdict in a derived report is held there too.
          bun run qa:attestations:migrate:check
          bun run check:partition
          # Every XML namespace the corpus declares is reconciled against a
          # specification record naming its EDITION. Added with the registry
          # (2026-09-20): a diagram conforming to a spec nobody named is the
          # defect that registry exists to end, and a registry nothing runs is
          # the `xom7` shape one level along.
          bun run external-schemas:check
          # Code lists -- every closed set of codes (adjudication answers, the
          # namespaces this project mints) is a node with a definition and a
          # source per code, not a string in an attribute. Owner, 2026-09-23.
          # Refuses a malformed list, and an adjudication naming no list.
          bun run code-lists:check
          # Vocabulary mapping tables (bean k74z): each parses, each derived
          # target copies an authoritative one, each system resolves, and each
          # can be produced as a FHIR ConceptMap. Owner, 2026-10-02.
          bun run vocab-mappings:check
          bun run docs:harness:check
          # Every instantiated harness ABOVE THE FLOOR owes a board, and the
          # board it owes shows the whole folio. Owner, 2026-09-21: "Any
          # harness above bootsteap has a board filled with all contents."
          # Gated because a harness added without one renders a navbar tile
          # pointing at a folio with no board -- which looks exactly like a
          # folio whose board is empty, and the two are different facts.
          bun run boards:default:check
          # The derived sub-graph indexes (bean `06e3`). Gated for the same
          # reason every other generated artefact here is: an index that has
          # drifted from the graph it claims to index is worse than none,
          # because it reads as current. It also reports an ORPHAN -- a
          # sub-graph page whose sub-graph now contributes nothing -- which is
          # `ankg`'s helper doing its job in a third generator.
          bun run docs:auto:check
          bun run gen:jsonld:check
          bun run readme:sync:check
          bun run avatars:css:check
          bun run themes:css:check
          # The navbar's geometry (`sjic`). GATED because the defect it closes
          # was invisible to every test that existed: `navbar.ts` and
          # `docs-ui.css` each stated the widths and each had a test asserting
          # its OWN copy, so both were green while the rail rested at 40px and
          # the sidebar at 56px -- two navbars the owner had asked to be
          # "presented same way". The generated file is only half the fix; a
          # snapshot that may go stale silently is the same defect with an
          # extra step.
          bun run navbar:geometry:check
          # The ingested-IRIS replica pages, generated from who-iris/catalogue/.
          # A generated page nobody gates drifts from the graph it claims to
          # render, and this one carries byte counts and download links -- the
          # two things a reader would take on trust.
          bun run iris:pages:check
          # The Dublin Core renderings (DC XML + DCMI-Terms JSON-LD) of every
          # catalogue record an item names, published beside the replica
          # pages (bean `7eak`). Fails on a missing, stale or orphaned
          # rendering -- the item pages link these files, so a stale one is
          # wrong metadata served under a link a harvester trusts.
          bun run dc:render:check
          # The prefix-sharded identifier lookup over who-iris's REFERENCED
          # nodes (bean `4pm8`). Gated because a stale shard still answers:
          # it finds a node the catalogue no longer references, and a reader
          # cannot tell a stale hit from a current one.
          bun run id-lookup:check
          # The cover thumbnails, checked against the sha256, byte count and
          # PNG dimensions the catalogue nodes declare. The narrow half of
          # `yl5w` this script owns: a `materialized` claim it makes is a claim
          # it checks. It also refuses a THUMBNAIL that does not declare itself
          # derived, so a cover we rasterised cannot read as one IRIS supplied.
          #
          # NO PDF BACKEND IS INSTALLED HERE AND NONE IS NEEDED. This job
          # installs `ruff` and nothing else, and the first version of this
          # gate re-rendered each cover through PyMuPDF -- so it threw
          # `pymupdf is not installed` on every run and turned the branch red
          # three times. Four of the five claims need no decoder: the bytes
          # exist, their digest matches, their length matches, and their pixel
          # dimensions are readable straight out of the PNG's IHDR chunk. Only
          # "these bytes are what that PDF renders to" needs the backend, and
          # `--check` says in its own output which of the two it ran.
          bun run iris:covers:check
          bun run translation:block-qa:check
          # The translation STATUS page and its projection, bean `lnur`.
          # Stale-checked rather than merely generated, for the reason every
          # other generated artefact here is: a page carrying numbers nobody
          # regenerated is a page that lies by aging, which is `d2kp`.
          #
          # It exits 2 when no `translation-sources` directory is declared,
          # and that is NOT a pass — a folio with no translations is a real
          # state, and this generator is not the thing that gets to decide
          # the absence means "nothing to report".
          bun run translation:status:check

      # UN-FOLDED 2026-09-19, bean `folio-assistant-d2kp`.
      #
      # This was a CONTINUATION LINE of the step above: more-indented, so YAML
      # folded it into one plain scalar and the runner executed
      #
      #     bun run agent-memory:check bun run cat-harness/scripts/gen-docs-pages.ts --check
      #
      # `cat-harness/scripts/agent-memory.ts` ignores trailing arguments and exits 0, so
      # the gate its own comment described had NEVER RUN. Two months of green.
      #
      # It could not simply be un-folded, and that is the more interesting
      # half. `gen-docs-pages` wrote LIVE QA VERDICTS into the pages -- the
      # state class, the glyph and "0 fail, 0 warn, 10 pass, 0 n/a" -- so a
      # page went stale whenever a sweep changed its mind. Measured on `main`
      # at ed3403322: 12 pages stale, one of them because the actor-kind fixes
      # in #353 turned a failing criterion GREEN. Enabling the check as it
      # stood would have reddened every KG-touching PR that did not also
      # regenerate, which teaches exactly the wrong lesson.
      #
      # So the verdicts came out of the pages first. `docs/*.md` now carries
      # only corpus STRUCTURE -- which nodes exist, which QA families apply,
      # and whether a sidecar exists at all -- and the badge fetches its page's
      # verdict index at load, the way the QA panel has always fetched its
      # contents. The witness projections under `test/results/witnesses/` are
      # gated on EXISTENCE and not on contents, because their contents are a
      # function of the sidecars and of the working tree and the site build
      # regenerates them on every publish.
      #
      # What a red here means now: somebody added a node, renamed a block, ran
      # a first sweep, or moved a sidecar, and did not regenerate. A real
      # omission, every time.
      # NAMED, not the long path, and that is the whole point of bean `9x01`
      # finding 4: every page this generator writes carries a banner ending "and
      # `docs:pages:check` fails on the difference", and that script did not
      # exist — `bun run docs:pages:check` answered `Script not found` while this
      # step ran the same guard by its path. The documented command and the
      # enforced command are now ONE STRING, so neither can drift from the other.
      #
      # Adding the script alone was not enough: `gates.test.ts > no check script
      # is unrun` then reported `docs:pages:check` as declared and run by no
      # workflow — bean `ot9a`'s defect, which is what this job's "gates that
      # were registered and never run" step exists for. Two guards, opposite
      # directions, and only this line satisfies both.

      # GATED, unlike the two projections below, and the difference is the
      # INPUT SET — which is the standard those two are excused against.
      #
      # `schema:viz` and `library:viz` derive from the WHOLE repository, so any
      # branch alive for more than a few minutes finds them stale against the
      # merge ref and a red means "somebody else merged". The voices projection
      # derives from the declared `voices` directories and the declarations
      # naming them: four voices in two instances, changed when somebody edits
      # a voice. A red here means a voice was added or a rule was edited and
      # the page was not regenerated — an omission by the author of the diff,
      # every time, which is exactly the test stated twenty lines above.

  # ── End-to-end, including the accessibility gate ────────────────────
  #
  # `bunx playwright test` ran in NO workflow before this job. Twenty-nine e2e
  # tests existed and none of them was ever a gate — they passed on whichever
  # machine a contributor happened to run them on, which is not a gate, it is a
  # habit.
  #
  # It is added here rather than left to a follow-up because bean `gjli` states
  # a rule ("ALL UI MUST FOLLOW ACCESSIBILITY GUIDELINES") and a rule whose
  # check does not run is an assertion. `test/a11y.e2e.ts` would have been
  # decoration without this.
  #
  # Chromium comes from `playwright install --with-deps`, the same call
  # `docs-site` and `feature-staging` already make to render BPMN, so this
  # introduces no new capability requirement.
  e2e-shard:
    # bpmn-node: Task_E2E
    name: End-to-end + accessibility, shard ${{ matrix.shard }}/3
    #
    # Bean `dlqu`. `playwright test` was 4m33s of this job's 5m16s with ONE
    # worker, and once `bun test` ran in parallel this was the workflow's
    # slowest job. So the suite runs as three shards, each with one worker per
    # core (`playwright.config.ts`), and the `e2e` job below carries the check
    # name and goes red unless every shard succeeded.
    #
    # The shard reaches Playwright as `E2E_SHARD` in the ENVIRONMENT, never as
    # `--shard=${{ matrix.shard }}` on the command line: `gatesFrom` runs a
    # `bun` line locally with no shell, so an interpolation in it would arrive
    # as literal text (bean `9zok`). Unset, as it is locally, means the whole
    # suite — which is what `bun run gates --all` should run.
    # A cap, because a parallel worker that spins (measured once locally:
    # one `bun test` worker at 97 % CPU for 20 minutes, nothing else left) is
    # not stopped by a per-test timeout, and the Actions default is six hours.
    # a shard measured 1m55s-2m37s; 20 is ~8x that, so a red here is a hang, never a slow day.
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      # Every shard reports, so one red shard does not hide another's result.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: npx --yes playwright install --with-deps chromium

      # The suite generates what it needs under _kg/ if absent, so the
      # artefacts under test are the ones the deploy emits rather than a
      # committed fixture that could agree with the test and disagree with
      # what ships. Since bean `dlqu` that happens once per run, in
      # `cat-harness/test/e2e-global-setup.ts`, before any worker starts.
      # Here rather than in the `typescript` job because bpmn-js renders
      # through Chromium, which only this job installs. Before the e2e run so
      # a stale SVG is reported on its own terms rather than inside a browser
      # test's output. Shard 1 only: it reads the whole tree, so asking it
      # three times would cost three times and answer once.
      - name: rendered BPMN SVGs are current
        if: matrix.shard == 1
        run: bun run render:bpmn:check

      - name: playwright test
        env:
          E2E_SHARD: ${{ matrix.shard }}/3
        run: bunx playwright test

      # KEEP THE REPORT WHEN THE JOB GOES RED — bean `yqc4`.
      #
      # A red e2e job here was unreadable to anyone who could not reach
      # GitHub's log host: the check run's annotations carry only `Process
      # completed with exit code 1`, and the `list` reporter writes to the log
      # and nowhere else. An artifact is fetchable from the REST API, so the
      # failing test, its error and its stack survive where a reader can get
      # at them.
      #
      # `if: failure()` rather than `always()`: a green run's report is noise.
      #
      # `if-no-files-found: ignore` is deliberate and was paid for. Shard 1
      # runs `render:bpmn:check` BEFORE this step, so when THAT fails the job
      # is red with no report ever written — and that is exactly how the
      # 2026-10-03 incident presented: shard 1 dying in 37 s while shards 2
      # and 3 took ~2 min and passed. `error` here would add a second, louder
      # failure on top of the real one and point at the wrong step.
      - name: Keep the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

      # Every .sh a user runs by hand or wires into a config has a .bat beside
      # it, generated from one template by scripts/gen-bat-wrappers.sh. A
      # script added to WRAPPED without a regenerate, or a wrapper edited by
      # hand, is the drift this catches; --check writes nothing. Shard 1 only,
      # for the reason the BPMN check gives.
      - name: windows .bat wrappers are current
        if: matrix.shard == 1
        run: bun run bat:sync:check

  e2e:
    # bpmn-node: Task_E2E
    name: End-to-end + accessibility (hard)
    #
    # The check NAME that branch protection and the beans cite, kept on a job
    # that completes the multi-instance task: it is green only when every
    # shard SUCCEEDED. `if: always()` so that a failed or cancelled shard turns
    # this red rather than SKIPPING it — a skipped required check reads as
    # neither red nor green, which is the vacuous pass bean `0qjq` measured.
    needs: e2e-shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: every shard succeeded
        env:
          SHARDS: ${{ needs.e2e-shard.result }}
        run: |
          echo "e2e shards: $SHARDS"
          test "$SHARDS" = "success"

  rust-wildcard:
    # bpmn-node: Task_Rust
    name: Rust wildcard imports (warn-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # WARN-ONLY ratchet: count non-test `use ...::*;` wildcard imports in
      # tools/. Test modules (`#[cfg(test)]` / `use super::*;`) are the bulk
      # of the legitimate baseline, so they're reported but not failed.
      - name: Wildcard `use ...::*;` report
        continue-on-error: true
        run: |
          set -uo pipefail
          # Same distinction as the Lean gate: there are ZERO .rs files in this
          # repo, so "OK — no non-test wildcard imports" was reporting a clean
          # result for a scan of nothing. `tools/` is a folio tree; this job is
          # here for folios that vendor this workflow.
          count=$(find tools -name '*.rs' 2>/dev/null | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "SKIP — no tools/**/*.rs in this repo (the Rust tree lives in the folio). Nothing scanned."
            exit 0
          fi
          # Char class covers digits too (e.g. base64::prelude::*, sha2::*) and
          # underscores (wasm_bindgen::prelude::*, extendr_api::prelude::*).
          matches=$(grep -rnE '^[[:space:]]*use [A-Za-z0-9_:]+::\*;' \
            tools --include='*.rs' 2>/dev/null | grep -vE 'use super::\*;' || true)
          if [ -n "$matches" ]; then
            echo "::warning::Non-test wildcard imports in tools/ (ratchet — narrow when touched):"
            echo "$matches" | while IFS= read -r line; do
              echo "::warning::$line"
              echo "  $line"
            done
          else
            echo "OK — no non-test wildcard imports in $count Rust file(s)"
          fi

  dependency-advisories:
    # bpmn-node: Task_Advisories
    name: Dependency advisories (warn-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # WARN-ONLY by the owner's decision on bean `j41m`, and the reason is
      # worth keeping next to the step: a HARD gate on advisories hands a
      # transitive advisory nobody can patch the power to red every PR until
      # somebody adds a suppression — and the suppression is what rots.
      # `.github/dependabot.yml` is the other half: it turns the same
      # advisories into reviewable PRs rather than into a gate.
      #
      # `bun audit` needs the registry, not the modules, so there is no
      # install step. Adding one would make a dependency resolve a
      # precondition of asking whether dependencies are safe.
      #
      # NO `continue-on-error` and NO `|| true`. The script exits 0 in every
      # state on purpose, and keeps the three states apart in its OUTPUT
      # instead — which is the only place they can be kept apart once the exit
      # code carries no information. `|| true` is exactly how "could not
      # determine" becomes "fine", and this workflow has paid for that once
      # already: see the ruff note at the top of this file, where a step
      # "warned about the missing paths and exited 0, so it reported a clean
      # baseline it had never computed."
      - name: Known advisories against the resolved tree
        run: bun run check:dependency-advisories

  skill-registration-chain:
    # bpmn-node: Task_SkillChain
    name: Skill-registration chain, unmasked (hard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # THE ORIGINAL JUSTIFICATION IS GONE, and saying so is the point. This
      # job was added because all six of these checks lived in the `typescript`
      # job behind `bun test`, which runs the kg-audit and detangle WRITERS and
      # repaired two artefacts before their checks read them (bean `ymsu`) --
      # making this "the only place they are read against the tree as checked
      # out". The `gates` job now runs all six and never runs `bun test`, so
      # they are unmasked there. Measured 2026-09-26 on the merged tree.
      #
      # What survives, and why this is kept rather than deleted: ONE command a
      # skill author runs (`bun run skill:register`) that regenerates and
      # verifies the chain together, a committed QA sidecar recording which
      # steps ran, and ONE named failure instead of six unrelated generated
      # files -- which is bean `v625`'s actual complaint, and what the six
      # separate steps cannot give.
      #
      # Its first CI run earned the place regardless: it went red on
      # `kg:detangle:check` and the cause was 1214 files of a gitignored
      # `node_modules/` counted as graph nodes, pinned in a committed sidecar.
      - name: the registration chain is current, read unmasked
        run: bun run skill:register:check

  qa-publish:
    # bpmn-node: Task_QaPublish
    name: Publish QA results to qa-reports (not a gate)
    #
    # Bean `16ei`, arc `3fva`, owner rulings D1 and D3: each run's QA results
    # go to the orphan `qa-reports` branch, keyed `main/<sha>/` on a push to
    # main and `pr/<n>/<head-sha>/` on a same-repository PR.
    #
    # ## A SEPARATE job, after the gates, whatever they concluded
    #
    # `needs: gates` orders it after the gates; `always()` runs it even when
    # they are red, because the evidence of a red commit is evidence too, and
    # the manifest records the gates' result beside it. Being its own job is
    # what keeps a red publish from masking a gate: it fails in its own lane
    # and the gates' verdict is untouched.
    #
    # ## It is not a gate, and `gates.ts` knows it
    #
    # This is the only job here with `contents: write`, and `gates.ts` skips a
    # job holding it (`publishes`), so `bun run gates` never pushes from a
    # contributor's machine.
    #
    # ## Fork PRs
    #
    # A fork PR's token is read-only (spike `3ds9`). `qa:publish --github`
    # decides that itself and exits 0 with a `::notice` naming the reason, so
    # the skip is stated, never silent and never a red run.
    #
    # ## What it publishes — `qa:refresh` decides, and says whether it is whole
    #
    # Bean `3hk4`. While `test/results/` is still tracked, the commit's own
    # copy IS the record and nothing is regenerated (`5hox` needs `main/<sha>`
    # byte-identical to it). Once `5hox` removes it, a fresh checkout holds one
    # file there, so `qa:refresh` runs the declared QA writers into the empty
    # tree first. Not an artifact from `gates`: its gates are in judge mode and
    # write nothing, so its working copy is this checkout's. A refresh that
    # leaves a writer failed, a family empty or a file unclaimed is INCOMPLETE,
    # this job fails, and `qa:publish --completeness` refuses to store it — a
    # partial entry is never published as if it were the commit's record.
    needs: [gates]
    if: ${{ always() && (github.event_name == 'push' || github.event_name == 'pull_request') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: qa-publish-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The PRODUCER of `kg-export.bootstrap.qa-results.json` (bean `0utt`,
      # owner ruling 2026-10-01: keep the file, give it a producer). Both
      # deploys publish bootstrap through bootstrap-tools' `export-graph.ts`,
      # which writes no QA sidecar, so before this step only a hand run wrote
      # it and `check:published-instance-exports` reported "no workflow
      # producer". Run here, before the publish, so what reaches `qa-reports`
      # is this commit's export. The document goes to the runner's temp dir:
      # the sidecar is the product. That gate reads this line as the producer.
      - name: Regenerate the bootstrap kg-export QA sidecar
        run: bun run cat-harness/scripts/kg-export.ts --instance ./bootstrap --out "$RUNNER_TEMP/bootstrap-kg-export.jsonld"

      # Every write to `qa-reports` goes through `qa-store.ts`: fetch the tip,
      # splice, `commit-tree -p`, push without `-f`, three attempts with the
      # backoff from `backoff-sleep.ts`. `check:workflows` fails a raw push
      # (`qa-reports-unretried`).
      # Bean `3hk4`. Tracked copy present: accounts for it and runs nothing.
      # Absent (after `5hox`): runs every writer in `QA_WRITERS`
      # (`qa-refresh.ts`) into the empty tree, then checks each wrote and every
      # file is claimed. Exit 1 on an incomplete tree fails the job here, so
      # the publish below never runs on it. After the kg-export step above,
      # whose sidecar it accounts for as an `external` family.
      - name: Produce this run's QA working copy, and say whether it is complete
        run: bun run qa:refresh --github --report "$RUNNER_TEMP/qa-refresh.json"

      - name: Publish this run's QA results (skips fork PRs with a notice)
        env:
          GATES_RESULT: ${{ needs.gates.result }}
        run: bun run qa:publish --github --completeness "$RUNNER_TEMP/qa-refresh.json" --gates-result "$GATES_RESULT"

      # Bean `cxcn` (reader audit F7): the corpus VALIDATION the unit tests did
      # over the committed tree — every kg-qa sidecar validates, no critical
      # criterion fails, every home carries its manifest, no conflict marker,
      # every badge's witness is there — run over the entry this job just
      # stored, read back through qa-store. It walks every HOSTED home
      # (`cat-harness/test/results/bootstrap/`, …), which the old test never
      # did. It keys the entry exactly as the publish does, so a fork PR skips
      # with the same stated notice; any other miss is UNKNOWN (exit 2), never
      # a pass. In this job, not in `gates`, because it judges the STORED
      # record, which exists only after the publish.
      - name: The stored QA entry validates, hosted homes included
        run: bun run check:qa-corpus --github
