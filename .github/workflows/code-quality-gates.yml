# Code-quality gates — cheap, fast static checks that protect compute infra.
#
# Four jobs (the first three per
# docs/handover/2026-06-09-affectionate-hopper-handover.md §2).
#
# TWO of the four jobs gate THIS repo; two scan trees only a folio has. Which
# is which is stated in each job, and a job with nothing to scan says so
# rather than printing OK — see the note on `lean-bare-import`.
#
#   1. Lean bare-import gate — HARD FAIL on `import Mathlib` (the whole
#      library). A bare `import Mathlib` pulls the entire Mathlib build cone
#      into a single content-block / lib file, which is what drives the
#      >9-min full-library `lake build` timeout. Targeted imports keep the
#      per-file dependency cone (and CI build) small. FOLIO tree: the Lean
#      sources live in `content/<paper>/lean/`, so in the platform repo this
#      job has nothing to scan and skips.
#
#   2. Python unused / wildcard imports — HARD GATE (promoted from
#      warn-only). ruff F401 (unused import) + F403 (`from x import *`) over
#      this repo's Python. It used to scan `folio-assistant/computations` and
#      `tools`, neither of which exists here — ruff warned about the missing
#      paths and exited 0, so the step reported a clean baseline it had never
#      computed. Repointed at the trees that hold the 44 real files, which
#      surfaced 24 live F401s; those were drained, so the rule is an error.
#      This job also RUNS `scripts/tests/*.test.py`, which previously ran
#      nowhere: run-tests.sh delegates to `bun test` and that collects only
#      `*.test.ts`, so the Python tests were green by never executing.
#
#   3. TypeScript gate — HARD FAIL on `bun test`, `bun run lint`, and
#      `tsc --noEmit`. Each is a real regression gate rather than a baseline
#      report: the suite is 428 pass / 0 fail; `tsc` covers all five trees
#      (`src`, `schemas`, `content`, `scripts`, `adapters`), not just `src`;
#      and `eslint` has every rule at `error` — the `warn` tier is empty, so
#      a red lint always means a regression rather than pre-existing debt.
#      Without this job none of that is enforced: the ratchet only works if
#      something runs it — which is exactly what went wrong, see `on:` below.
#
#   4. Rust wildcard imports — WARN-ONLY ratchet. Lightweight grep report
#      of non-test `use ...::*;` in tools/ (full `clippy -D
#      clippy::wildcard_imports` is the eventual upgrade, but a cargo build
#      on every PR is too heavy for a static gate; the grep ratchet flags
#      new wildcard imports cheaply). FOLIO tree: zero `.rs` files here, so
#      this job skips.

name: Code-quality gates

on:
  # This workflow was added by the commit "ci: give the ratchet something to
  # run in", whose message correctly reported that "no folio-assistant workflow
  # triggers on `pull_request`" — and was then written `workflow_dispatch`-only,
  # so it never ran. The fix for "nothing runs the ratchet" was itself something
  # that never runs. Of 33 workflows here, exactly two auto-trigger
  # (atomic-mass-gen-check, docs-site) and neither runs any TypeScript check.
  #
  # No `paths:` filter. The TypeScript job is the gate for the whole repo, and
  # a filter is how a gate stops covering the file that broke it.
  pull_request:
  # The MERGE QUEUE — bean `nytj`. A pull_request run tests the PR merged with
  # main AS IT WAS WHEN THE PR WAS PUSHED; anything that lands on main after
  # that is untested in combination. Three times on 2026-09-23 a generated
  # measurement (`kg:detangle`, `kg:audit`) was green on the branch and green
  # on main and stale on the two merged — "the state that breaks is the one
  # neither party evaluates". A merge_group run tests EXACTLY the commit that
  # will land. Inert until the owner turns the merge queue on for `main`;
  # harmless before. No job here reads event_name or head_ref, which a
  # merge_group run leaves empty — checked, and kept that way.
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean-bare-import:
    name: Lean bare-import gate (hard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # HARD GATE: a bare `import Mathlib` (optionally trailing whitespace)
      # at the start of a line is forbidden in content Lean files. Use
      # targeted imports (run `#min_imports` after a clean build to find
      # them).
      - name: No bare `import Mathlib`
        run: |
          set -euo pipefail
          # Say which of the two facts this is. `content/` in the PLATFORM repo
          # holds only `pipeline/` — zero .lean files — so this printed
          # "OK — no bare 'import Mathlib'" having looked at nothing at all.
          # "None found" and "nothing to look at" are different, and a gate that
          # reports the first while meaning the second is worse than no gate:
          # it reads as coverage. The Lean tree lives in the FOLIO; this job is
          # here for folios that vendor this workflow.
          # THREE states, not two, and the missing one is what broke this.
          #
          # This was `count=$(find content … | wc -l)` guarding `-eq 0`. It
          # distinguished "no Lean files" from "some Lean files" and had no
          # answer for "no `content/` AT ALL" — so when the move (bean `wggr`)
          # put this repo's `content/` under `cat-harness/`, `find` exited 1 on
          # the missing directory, `set -o pipefail` promoted that to the
          # pipeline's status, and `set -e` killed the job. A gate written
          # expressly to skip when there is nothing here failed instead.
          #
          # `2>/dev/null` hid the message and not the exit code, which is why it
          # reads as a mystery rather than as "directory not found".
          #
          # `content/` stays UNPREFIXED deliberately: this job is vendored by
          # folios, where the Lean tree really is at `content/<paper>/lean/`.
          # Prefixing it would fix this repo and break every folio.
          if [ ! -d content ]; then
            echo "SKIP — no content/ directory (this is the PLATFORM repo; the Lean tree lives in a folio). Nothing scanned."
            exit 0
          fi
          count=$(find content -name '*.lean' | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "SKIP — content/ exists but holds no .lean files. Nothing scanned."
            exit 0
          fi
          echo "Scanning $count Lean file(s)…"
          if matches=$(grep -rnE '^import Mathlib[[:space:]]*$' \
                content --include='*.lean' 2>/dev/null); then
            echo "::error::Bare 'import Mathlib' found — use targeted imports (#min_imports). Offenders:"
            echo "$matches" | while IFS= read -r line; do
              echo "::error::$line"
              echo "  $line"
            done
            exit 1
          fi
          echo "OK — no bare 'import Mathlib' in $count Lean file(s)"

  python-imports:
    name: Python unused/wildcard imports (hard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install "ruff>=0.5"

      # The Python backends the scripts actually import, from the file
      # `schemas/python-deps.ts` generates. Bean `68dt`: nothing declared them
      # before, so `pdf-structure.py` needed PyMuPDF and CI had no way to know
      # — which made every PDF path one CI could not exercise, the `5rfy`
      # defect (a gate that never fires).
      #
      # `requirements.txt` is the LEAN set. `requirements-extended.txt` is
      # deliberately NOT installed: camelot-py is 912 KB but pulls numpy,
      # pandas and OpenCV — 323 MB, measured 2026-09-20, more than the whole
      # lean set — for one script. That is a cost statement, not a
      # deprecation; `pdf-tables.py` is live and its tests run outside CI.
      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # HARD GATE, promoted from warn-only. Same rule as eslint: a check is an
      # error only once its count is zero, and this repo's count is zero — the
      # 24 live F401s were drained in the same commit that repointed the scan.
      # `continue-on-error` is gone with it; a new unused import fails here.
      - name: ruff F401,F403
        #
        # Was pointed at `folio-assistant/computations tools`. Neither exists
        # here: `tools/` is a folio tree, and `folio-assistant/computations` is
        # a FOLIO-RELATIVE path (inside a folio, the platform is the
        # `folio-assistant/` symlink) — so in this repo it would mean
        # `folio-assistant/folio-assistant/computations`. ruff exits non-zero on
        # a missing path, and `continue-on-error` swallowed that, so the step
        # has been reporting a clean baseline it never computed.
        #
        # Scan the trees that hold this repo's 44 Python files. Missing paths
        # are dropped rather than passed to ruff, and an empty set is stated.
        run: |
          set -uo pipefail
          targets=""
          for d in cat-harness/scripts .github/scripts cat-harness/content/pipeline cat-harness/schemas cat-harness/src cat-harness/adapters; do
            [ -d "$d" ] && targets="$targets $d"
          done
          if [ -z "$targets" ]; then
            echo "SKIP — no Python trees present in this repo. Nothing scanned."
            exit 0
          fi
          echo "Scanning:$targets"
          ruff check --select F401,F403 --output-format=github \
            --exclude '**/_deprecated/**' \
            $targets

      # The Python tests under scripts/tests/ ran nowhere. run-tests.sh
      # delegates to `bun test`, which only collects `*.test.ts`, and no
      # workflow named them — so pdf-text-repair.test.py and
      # who-l1-extractor.test.py were green by never being executed. They
      # are self-contained (no pypdf, no network) and take under a second.
      #
      # Discovered rather than listed, so a new one is picked up by
      # existing; a listed set is a set that goes stale.
      - name: Python tests (cat-harness/scripts/tests/*.test.py)
        run: |
          set -uo pipefail
          shopt -s nullglob
          tests=(cat-harness/scripts/tests/*.test.py)
          if [ ${#tests[@]} -eq 0 ]; then
            echo "SKIP — no Python tests present."
            exit 0
          fi
          rc=0
          for t in "${tests[@]}"; do
            echo "=== $t ==="
            python3 "$t" || rc=1
          done
          exit $rc

  typescript:
    name: TypeScript — tests, lint, types (hard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Each step is a separate gate so the Actions UI names the one that
      # broke, rather than a single opaque "quality" failure.
      - name: bun test
        run: bun test

      # Exits 0 on warnings by design; a non-zero exit means a rule that had
      # been driven to zero has regressed.
      - name: bun run lint
        run: bun run lint

      - name: tsc --noEmit
        run: bunx tsc --noEmit -p tsconfig.json

      # The base workflow processes are strict; a content package may relax a
      # step only by declaring it with a reason, and never a step the BPMN marks
      # relaxable="false". This fails when a relaxation names something that no
      # longer exists — otherwise it sits in the file looking like policy while
      # permitting nothing, and nobody finds out until the day it matters.
      - name: workflow policy
        run: bun run check:workflow-policy

      # Every skill citation naming a section of an `AGENTS.md` resolves, or
      # says WHICH `AGENTS.md` it means. Turned on 2026-09-19 once the backlog
      # reached zero (bean `1hsf`) — gating before that would have blocked
      # unrelated work on debt the check had only just measured.
      #
      # Two of the original twenty were in NEITHER repository and were rewritten
      # as plain rules; the rest were correct citations of the folio's file and
      # are now qualified. A citing file declaring its own destination is the
      # contract, so this cannot be satisfied by editing the platform's prose.
      - name: AGENTS.md cross-references
        run: bun run check:agents-xref:strict

      # Every artefact an instance DECLARES exists, and its links resolve.
      # The complement of the check above, which verifies citations INTO an
      # `AGENTS.md`: this one verifies the links OUT of it, and of every other
      # declared asset.
      #
      # Gating from the first commit, unlike `agents-xref`, because there is no
      # backlog — the declarations and the gate land together, so it starts at
      # zero findings rather than measuring debt. Bean `v8gh` is what it would
      # have caught: seven dead links in the root `AGENTS.md`, five broken by
      # one directory move, including the one its own banner calls the place to
      # start, so a cold agent following the banner hit a 404.
      - name: declared assets exist and resolve
        run: bun run check:declared-assets

      # The same question one level up: declared assets are FILES, these are
      # DIRECTORIES, and nothing asked about them until bean `8mbk`.
      #
      # It could not have been caught by reading a consumer, because every
      # consumer is correct: `resolveDirectories` is existence-filtered, so an
      # absent declared directory is dropped before anyone sees it. The
      # declaration then asserts a directory is ours, and every scan of it
      # reports a clean run over nothing — the `dh4f` shape inside the resolver
      # they all share.
      #
      # Gating from the first commit, same reasoning as the step above: 66
      # declared directories across 14 instances, ZERO findings, so this starts
      # at zero rather than measuring debt. The escape hatch is a declared
      # `absent: { reason }`, and an exemption whose directory later appears is
      # a finding too — that is the direction that rots quietly.
      - name: declared directories exist, or say why not
        run: bun run check:declared-dirs

      # THE OTHER DIRECTION of the step above. `check:declared-assets` walks
      # declared -> disk; this walks disk -> declared, over the repository ROOT,
      # which every other sweep skips because the root is deliberately not an
      # instance. That is exactly where an undeclared file survives: commit
      # `0301fbd2` put three 1.6-1.8 MB PNGs there with spaces and commas in
      # their names and no gate noticed, and an automated pass then misread them
      # as a regeneration of the existing art. A file nothing declares is a file
      # nothing reasons about.
      #
      # Gating from the first commit, like its sibling and for the same reason:
      # the root is clean as of this change, so it starts at zero findings
      # rather than measuring a backlog.
      - name: no undeclared files at the repository root
        run: bun run check:undeclared-files:check

      # `bootstrap/bootstrap.jsonld` HAD a staleness gate here, because it was
      # committed. It no longer is — it is built at render time into the
      # published site by `docs-site.yml` — so there is no committed copy to
      # go stale and nothing for a byte gate to compare against.
      #
      # NOTHING WAS DROPPED WITH IT, and that is worth saying rather than
      # assuming: the gate compared bytes, while every property it was
      # protecting is asserted directly in `scripts/tests/bootstrap-graph.test.ts`
      # against `buildCatBootstrapDocument()` — purity, id ordering, no absolute
      # build paths, skills derived from disk, graph kinds a subset of the
      # declaration, and the `omitted` list. Those run in `bun test`, which
      # the TypeScript job above already runs. Removing a check whose
      # coverage lives elsewhere is fine; removing one and saying so is what
      # stops the next reader reinstating it.
      #
      # ONE QUALIFICATION, added by bean `dyd3`: `buildCatBootstrapDocument()`
      # is no longer what the site publishes at that URL —
      # `kg-export --instance ./bootstrap` is, and the two documents differ on
      # 74 of their 88 nodes. Those assertions are properties of a builder
      # that publishes nothing. `kg-export.test.ts` is where the published
      # document's are, and the two guards in `bootstrap-graph.test.ts` that
      # DO reach the site are the ones about publication: the path the `@id`
      # names, and exactly one publisher per workflow.

      # Every `<folio:skill ref>` in a diagram names a skill that exists.
      # `corpus-search` and `paper-relevance-triage` were referenced by two
      # diagrams and resolved to nothing, so `workflow_next` would have handed
      # an agent the name of something it cannot open. Dangling is a hard
      # failure; an activity naming NO skill is only reported, because a human
      # sign-off step has no skill to name and failing on it would force a
      # fake ref onto a real step.
      - name: workflow skill refs
        run: bun run check:workflow-refs

      # A task's containing swimlane must DEFINE itself -- bean `sqtq`, issue
      # #596. Measured 2026-09-21: 157 task-containing lanes, every one named
      # and NONE documented, so the defined-terms index #596 asks for would
      # have shipped 157 labels with no definitions. Three axes, because a
      # glossary term needs all three: a name, a definition, and both
      # extractable for translation. An activity in NO lane is reported
      # UNDETERMINED rather than counted as passing, and zero diagrams is a
      # finding rather than a clean run (`6tkl`).
      - name: swimlane definitions
        run: bun run check:lane-documentation

      # ...and the PROCESS says what it is for -- bean `7rna`. The sibling one
      # level up. `gen-docs-auto`'s index took the first `<documentation>`
      # after the process opened, so a process carrying none borrowed its
      # first LANE's and presented it as what the process was for -- which
      # became true the day `sqtq` wrote 157 lane documentations. 16 of 61
      # were in that state; all 61 now define themselves, so `--strict` is
      # what runs here and a new diagram cannot land undefined.
      - name: process definitions
        run: bun run check:process-documentation

      # ...and the glossary those definitions feed -- bean `lqo9` slice 2,
      # issue #596. The DOCUMENT is derived and not committed; the LEDGER is,
      # because a derived document has no memory: delete a role and its
      # concept stops appearing, which is what "never existed" also looks
      # like. This gate is what keeps the ledger current, so retirement stays
      # distinguishable from accident. Two runs, never one wider scan --
      # `7u3g`, the isolation two earlier sessions walked into.
      - name: swimlane glossary ledger
        run: |
          bun run glossary:check
          bun run glossary:check:bootstrap

      # The graph per locale -- bean `jmpb`, on the owner's ruling. This gate
      # is NOT about how much is translated (nothing is, measured 2026-09-22:
      # 58 of 62 .pot templates are diagrams and none has a .po). It checks
      # the two properties a translation effort must never break: the CORE
      # graph references no translation -- no hasTranslation, no
      # availableLocales, no locale key, no per-locale @id -- and a translated
      # node keeps its @id, because a translation is not a new term.
      - name: graph per locale
        run: |
          bun run kg:locale:check
          bun run kg:locale:check:bootstrap

      # A model declares its languages, or it is a finding -- bean `46uh`.
      # This gate is NOT red on an empty registry: an agent is not a valid
      # source for the evidence `validation` asks for, so it ships empty and a
      # person adds entries. It IS red (exit 2) on a registry this code cannot
      # read, because reporting a malformed file as "no models" would let an
      # agent fall through to English believing a determination was made.
      - name: model languages declared
        run: bun run check:model-languages

      # Every link OUT of the files an agent reads first — bean `v8gh`.
      # `AGENTS.md` carried seven dead links, five broken by one directory
      # move, including the onboarding guide its own banner calls the place to
      # start. `readme:audit` covers README.md only and `check:agents-xref`
      # covers citations INTO AGENTS.md, so a directory move could silently
      # break the one file every agent opens first.
      - name: agent entry links
        run: bun run check:agent-entry-links

      # What `AGENTS.md` ASSERTS about the code — bean `77ex`. The two checks
      # above bracket it without covering it: `agents-xref` verifies citations
      # INTO the file, `agent-entry-links` verifies links OUT of it, and
      # neither reads what the prose says is true.
      #
      # Gating from the first commit, because it starts at zero findings:
      # every claim on the current file holds. The two it was written for are
      # both historical, and the second is why the ABSENCE half exists — at
      # `08f43c55b2` the file placed `resolveSkillDirs` in a module that DID
      # declare it, so the location claim was true and only "has no caller"
      # was false. `AGENTS.md` states the cost in its own voice: a stale gap
      # notice is worse than none, because an agent that believes it either
      # avoids the feature or rebuilds it.
      - name: AGENTS.md claims about code
        run: bun run check:agents-claims

      # Which `.github/workflows/*.yml` are documented as BPMN — bean `7yvd`,
      # owner: "make sure all workflows documented as bpmn".
      #
      # NOT `--strict` yet, deliberately. Coverage is 0 of 38 as this lands, so
      # a strict gate would be red on arrival and switched off within the day.
      # What it DOES fail on is the two unambiguous states: a workflow whose
      # YAML cannot be read (exit 2 — could-not-determine is never rendered as
      # clean, and an unreadable file is the one state that can hide a gap),
      # and a diagram declaring a workflow that is not there (exit 1, the same
      # tier as a dangling `<folio:skill ref>` above). The gap itself is
      # reported so the number is visible and moves.
      - name: workflow BPMN coverage
        run: bun run check:workflow-coverage

      # Every Tool's `satisfies` names a skill that exists, and every io port
      # references a type the shared vocabulary declares. The schema can require
      # `satisfies` to be non-empty; it cannot know whether the names resolve,
      # because a schema does not get to read the tree. A skill with NO Tool is
      # reported and not failed — many skills are pure judgement and have no
      # mechanism to name.
      - name: tool definitions
        run: bun run check:tools

      # Every voice rule cites a library section that is actually there.
      #
      # A voice is a rule set OVERLAID on the house voice, and 36 of this
      # repo's 37 rules cite `library/<slug>/sections/<id>.md` as the passage
      # they were derived from. A citation that does not resolve is a rule
      # nobody can check against its source — the `blv9` class (a link-shaped
      # value that does not dereference), in the one place where the source is
      # the entire justification for the rule.
      #
      # IT WAS WIRED AS AN npm SCRIPT AND RUN BY NOTHING. Measured
      # 2026-09-19: `grep -rn 'check:voices' .github/` returned zero. That is
      # the `xom7` shape — a gate that looks green from inside the repo
      # because nothing ever runs it — with the workflow missing outright
      # rather than failing. Found while inventorying the planned `library/`
      # extraction, which would have broken 28 citations silently.
      - name: voice citations resolve
        run: bun run check:voices

      # The other half of the same claim: the rules are cited, AND the
      # instruction body beside them does not restate them uncited.
      #
      # `schemas/voice-skill.ts` said "`check:voice-skills` enforces it" from
      # the day it was written, and four `SKILL.md` files repeat the claim in
      # their own prose — a promise made in five places and kept in none until
      # this gate (bean `n8br`). An absent gate nobody was told about leaves a
      # reviewer reading carefully; an absent gate a doc comment promises
      # leaves them reading PAST.
      #
      # Measured over the four voices here, 37 rules: zero findings. A check
      # that fires on every subject is wrong and so is one that can never
      # fire, so it is falsified rather than trusted — five mutations, each
      # caught, in `tests/voice-skills.test.ts`.
      - name: voice skills do not restate their own rules
        run: bun run check:voice-skills

      # Workflow YAML GitHub will actually parse, and no attacker-controlled
      # expression interpolated into a run body.
      #
      # This exists because a workflow GitHub cannot parse does NOT fail
      # loudly — it produces a run named by its file PATH instead of its
      # `name:`, because there is no name to read. Two workflows sat red for a
      # day that way in 2026-08; I reproduced it on 2026-09-18 by adding a
      # second `env:` to a step that already had one, after `yaml.safe_load`
      # accepted the file. Most loaders take the last duplicate silently, so
      # "it parses locally" was never evidence.
      - name: workflow yaml
        run: bun run check:workflows

      # Every script path a workflow invokes resolves, from the directory the
      # step actually runs in. Bean `52dz`. The #223 split moved the platform's
      # scripts under `cat-harness/` and the workflows naming them without that
      # prefix kept naming them without it — which is not a type error, not a
      # lint error and not a test failure, so nothing here could see it.
      #
      # THREE workflows were live and broken when this was added: `ci-health`
      # (weekly), `upstream-pins` (weekly) and `health-check` (DAILY), each
      # crashing on its first command. `ci-health` exists to catch workflows
      # failing where nobody looks, so it had been failing at its own job.
      # Eight more were `workflow_dispatch`-only, two of them never once run.
      #
      # This step is the point: the previous sentence describes what happens
      # when a check lives in `package.json` and no workflow invokes it.
      - name: workflow script paths
        run: bun run check:workflow-paths

      # THE OTHER DIRECTION FROM `ovkk`, and the reason it needs a gate at all
      # is that this direction is silent.
      #
      # `ovkk` was a term USED and not DECLARED: a JSON-LD processor drops it,
      # so the data goes missing and somebody eventually notices — 34 names,
      # 3583 occurrences. A prefix DECLARED and never used costs nothing at
      # runtime. `skos:` sat bound in the published `@context` and emitted by
      # zero nodes from the day it was written, while `tabular-csvw.ts` said
      # in prose that this graph speaks it.
      #
      # It counts EMISSIONS over the published `.jsonld` documents, not
      # `prefix:` literals in source — the two disagree, and measuring source
      # reported `doco:` 1112 for a vocabulary no document here emits.
      - name: every bound prefix is emitted, or declared forward with a reason
        run: bun run check:context-emission

      # The rest of the actor -> role -> skill -> task joins, and the committed
      # sidecars that record them. A `critical` finding is a broken reference:
      # a lane binding a role that is not declared, a role carrying a skill
      # that does not exist, a gateway naming a decision table that will not
      # load. `--check` also fails on a STALE sidecar, which is the point of
      # committing them — without a durable previous answer, a lane that has
      # been unbound since it was drawn and one that broke in the commit under
      # review look identical to a reviewer.
      #
      # Not `--strict`: `major` findings are missing joins rather than broken
      # ones, and gating on them today would fail the build on debt this gate
      # was added to make visible.
      # A skill's I/O contract must publish at the address its own `$id`
      # claims. All 44 once carried a github.com URL that returns 403 -- born
      # that way on 2026-03-24 and never dereferenced, so nothing noticed for
      # six months. This is what makes that non-repeatable.
      #
      # Runs WITHOUT --base-url: a committed `$id` is always canonical, and a
      # preview overrides the base at export time only.
      - name: skill I/O schema addresses
        run: bun run kg:schema:check

      # A WORKING validator that had lost its wiring — bean `shzs`. It validates
      # every skill package manifest against `SkillPackageManifest` plus the
      # `.claude/skills/` JSON, and it was in `package.json` once (two commits
      # touched it there) and in no workflow now. That is `1xhc`'s class exactly:
      # a gate that does not fire is indistinguishable from one that passed.
      #
      # Safe to wire because it is GREEN on this tree — 9 of 9 package manifests,
      # 16 files, 0 errors — so this locks in a property the repo HAS rather than
      # demanding work. Counted from the whole output, not from a `tail`: reading
      # the last eight lines first made it look like 6 of 9, which was wrong.
      - name: skill manifests and framework JSON
        run: bun run check:skills

      - name: knowledge-graph audit
        run: bun run kg:audit:check

      # The detangle measurements are PINNED, not graded. This fails on a STALE
      # sidecar or an orphaned one — never on a number being "wrong", because
      # the carve is an adjudication a person makes (`detangle.ts`, "taste is a
      # declared step"). Bean `sb6z`: the model was correct and unexercised, so
      # a regression in it was invisible until somebody ran it by hand AND
      # remembered last time's numbers.
      - name: detangle measurements are current
        run: bun run kg:detangle:check

      # Every term the code can MINT has a definition in the published
      # vocabulary. 93 classes and properties hang off `FOLIO_NS`, and until
      # 2026-09-19 nothing served that stem at all — the dead-link walk in
      # `kg-export.test.ts` exempted it BY NAME, so the one check that could
      # have noticed was told not to look.
      #
      # It reads the source rather than a list: a scan for `${FOLIO_NS}X`
      # across every non-test module, unioned with what a real export emits,
      # because `kg-export.ts:712` mints `${FOLIO_NS}${type}` from a registry
      # group name and neither source alone is sound. Adding a term and not
      # defining it fails here, which is the whole point — a vocabulary that
      # documents only what somebody remembered to document is not a
      # vocabulary.
      - name: namespace vocabulary is complete
        run: bun run ns:check

      # `bootstrap`'s two JSON Schemas are GENERATED from Zod in
      # `bootstrap-tools`, because bootstrap promises an Initiator it needs
      # no tools and therefore cannot hold a `.ts` of its own. This is the
      # `--check` twin `schema-management` requires of any new rendering:
      # three schema generators rotted here before, because nothing ever asked
      # whether their output still matched their input.
      #
      # A red here means the Zod moved and the published document did not —
      # and that document sits at an `$id` consumers already follow.
      - name: bootstrap schemas are current
        run: bun run bootstrap-tools:schemas:check

      # `docs/reference/**` is generated from skill sources and must not be
      # hand-edited, but nothing verified it had been REGENERATED after a
      # source change. document-intake.md sat 35 lines behind its source and
      # the published docs site served the stale copy. --check writes nothing
      # and names every file that would change.
      - name: generated docs are current
        run: |
          bun run cat-harness/scripts/gen-schema-docs.ts --check
          bun run cat-harness/scripts/gen-skill-docs.ts --check

      # The README's AUTHORED half. `readme-sections.ts` owns the marked
      # regions; this owns every other link, and `AGENTS.md` claims that
      # "between the two tools no link in a folio README is unaccounted for".
      #
      # It ran in NO workflow until 2026-09-19 (bean `t373`) -- a check that
      # exists, works, and is wired to nothing. That is `xom7` (a workflow
      # failing unseen) and `cnlf` (a workflow that never fires) in a third
      # form, and it is why `main` carried eight dead README paths after the
      # site root moved to `docs/<stub>/`.
      #
      # TWO READMEs are audited, and that is not belt and braces. Until
      # 2026-09-20 there was one file: `cat-harness` declared the repository's
      # README as its own with `scope: "repository"`, so `readme:audit` with no
      # argument resolved to the root's. Issue #592 split them — every instance
      # now owns its own — and the bare command silently narrowed to
      # cat-harness's, taking the root README's 41 links out of this gate
      # without failing anything. A gate that stops covering something is worse
      # than one that never did: it still reports green.
      #
      # `readme:sync:root:check` IS wired now, and the comment that used to sit
      # here saying otherwise was true when written: this README carried zero
      # markers, because generated sections belong to a folio. It carries
      # `cat-harness:instances` as of #592 — the table of instances, generated
      # from the declarations — and an unchecked generated section is exactly
      # the hand-kept list that section exists to replace.
      - name: README links resolve
        run: |
          bun run readme:audit:root
          bun run readme:audit

      - name: The root README's generated sections are current
        run: bun run readme:sync:root:check

      # Agent memory is authored under `memory/` and ASSEMBLED into
      # `.claude/agent-memory/<agent>/MEMORY.md`, which is what the Claude Code
      # harness injects. An entry edited and never assembled is a fact the
      # author believes an agent has and the agent has never seen -- invisible,
      # because the generated file still reads perfectly well without it.
      - name: agent memory is assembled
        run: bun run agent-memory:check

      # Fifteen gates that were REGISTERED IN package.json AND RUN BY NOBODY.
      #
      # Measured 2026-09-19: of 33 `check:`/`:check` scripts, 21 appeared in no
      # workflow at all. That is bean `5rfy`'s defect -- a gate that never
      # fires -- and it is worse than a missing gate, because `package.json`
      # advertises it and an agent (this one, repeatedly, this session) runs it
      # by hand, reports it green, and reasonably assumes CI does the same. It
      # does not. A sibling who does not run them merges the break.
      #
      # All thirteen PASS on `main` as of this commit, so wiring them locks in
      # a property the repo HAS rather than demanding work to reach one. They
      # share a step because they are fast and because thirteen near-identical
      # entries is noise; `-e` means the first failure names itself and stops.
      #
      # DELIBERATELY NOT WIRED, and each for a stated reason -- an unexplained
      # omission here is how the next person re-derives this list:
      #   render:bpmn:check     -- needs a BROWSER: bpmn-js renders through
      #                            Chromium, and this job installs none. It is
      #                            not dropped, it is MOVED to the e2e job,
      #                            which already has one. It passed on my
      #                            machine only because a browser had been
      #                            staged there earlier in the session -- the
      #                            precise "green locally, red on a clean
      #                            runner" gap these gates exist to close.
      #
      # The scripts CI deliberately does NOT gate used to be listed here, in
      # this comment. They now live in `SCRIPT_EXEMPTIONS` (scripts/gates.ts),
      # because a comment cannot be compared against the set it describes:
      # it covered six of the nine unwired check scripts, and the other three
      # -- health:check, landing:data:check, landing:sticky:check -- had no
      # reason anywhere and nothing said so. `bun run gates` now reports any
      # check script no workflow runs. Bean `ot9a`.
      #
      # One entry here was also FALSE. `translate-*:check` was excluded as
      # needing "a translation toolchain not installed on this runner"; both
      # run clean on a bare checkout, measured 2026-09-20, and both are wired
      # below. A reason nothing checks is free to stop being true.
      - name: gates that were registered and never run
        run: |
          set -e
          # Wired 2026-09-20 (bean `ot9a`): each was declared in package.json
          # and run by no workflow. `translate-kg-viewer:check` was RED on
          # main for an unknown stretch while CI stayed green -- a gate no
          # workflow runs cannot fail, which is bean `xom7` one level down.
          bun run translate-kg-viewer:check
          # Bean `07p7`: a published translation that has drifted from its
          # source is a section a reader cannot reach in their language.
          bun run translation:drift:check
          # Bean `eief`: a stubbed tool must not read as a working one, and a
          # stub that has outlived its tool must fail rather than linger.
          bun run check:tabular-stubs
          bun run translate-bpmn:check
          # bootstrap/ is a NESTED instance, so the run above does not scan its
          # three diagrams and must not -- widening that scan re-introduces the
          # leak `instance-graph-isolation.test.ts` exists to stop (`7u3g`).
          # Its templates therefore need their own run, pointed at the instance
          # that owns them. Bean `j28g`: they previously sat under
          # cat-harness/translations/ where nothing refreshed them, and
          # log-message.pot was measured missing the lane documentation added
          # to its own diagram the same day.
          bun run translate-bpmn:bootstrap:check
          bun run landing:sticky:check
          bun run landing:data:check
          bun run check:agents-xref
          # Bean `b963`: a path inside a fenced COMMAND is not a link, not a
          # symbol claim and not a literal in a .ts file, so all three
          # neighbouring checks miss it by design. The cold-start line every
          # agent runs first rotted in exactly that gap.
          bun run check:command-paths
          # Bean `b963` fourth class. It does NOT catch a re-rooted ascent —
          # three designs for that were measured and failed. It makes a name
          # that claims an anchor land on it, which removes the ambiguity the
          # defect hid behind: PLATFORM meant the repo root in one test and
          # cat-harness/ in five siblings, in one directory.
          bun run check:anchor-names
          # Bean `jijc`, under the owner's REPLACE ruling on `b5f0`:
          # DECLARATION_FILENAME existed the whole time and 20 non-test call
          # sites built the path from a literal instead, which is what turns
          # the rename into a 121-file sweep. Prose, test fixtures, template
          # construction and cross-instance sites are each CLASSIFIED and
          # counted rather than failed -- and `docs/_data/harness.json` is a
          # different file that must NOT be renamed.
          bun run check:declaration-filename
          # Bean `hrv2`: the sibling above hunts the RETIRED name, so it is blind
          # to a filename that is wrong but real -- AGENTS.md named
          # `folio-assistant.config.json`, a file that exists and declares no
          # graph. This one checks the CLAIM: prose pairing a declared graph id
          # with a declaration file, verified against the declarations. Its
          # vocabulary is derived from them, so an empty result is reported as
          # unknown rather than as a pass.
          bun run check:declaration-claims
          # A Liquid interpolation feeding src/srcset/href resolves, or says
          # it cannot be told (bean `blv9`). The FIFTH shape of one class in
          # this repo -- a link-shaped value that does not dereference --
          # and every earlier instance was found by a person asking whether a
          # URL resolved, never by a test. Only a LITERAL is decidable: a
          # variable is DECLINED and listed, because `viewHref`/`editHref`
          # hold absolute forge URLs that the filter would break.
          bun run check:docs-templates
          # Every declared image `role` is read by something that can actually
          # REACH it (bean `5yrl`, split out of `blv9`). Scans
          # declaration -> consumer, the direction `themes.test.ts` cannot:
          # that walks theme -> role, so a role NO theme names is outside its
          # domain by construction, which is how `landing-architecture` sat
          # declared and unnamed. Half two is the half that matters -- the
          # favicon shape, where a caller EXISTS and cannot match, because
          # `imagesForRole` is layout-keyed and a mark declares no layout.
          bun run check:image-roles
          bun run check:bean-parents
          # Bean `kpcl`, issue #956: `in-progress` stopped carrying information --
          # 99 claims, 77 untouched for a day or more. The obvious sweep assumes
          # its own answer, so this gate owns only the half that is PURE GRAPH:
          # a bean whose status its own children refute. No clock, because a
          # clock-dependent gate turns CI red at an arbitrary hour with nobody
          # having changed anything -- `beans.ts` declines a stale-in-progress
          # finding for the same reason. The age sweep is `-- --sweep` and never
          # sets the exit code. Baselined at the one the store carries (`5a3l`,
          # completed over 12 open children), so a NEW one fails.
          bun run check:bean-rollup
          # Bean `sfhr`: three store defects `beans check` cannot see, because
          # none of them is a link -- an empty body on an open bean, a `title:`
          # block scalar that swallowed the body's first lines, and a prose
          # blocker naming a bean that is `completed` or `scrapped`. Baselined
          # at the eight the store had, so a NEW one fails and the backlog is
          # listed rather than demanded.
          bun run check:bean-bodies
          # Bean `t7ao`: check:bean-bodies reads front matter by REGEX, and a
          # regex over a broken document does not notice the document is
          # broken. A bean committed with a literal `\1` where `updated_at:`
          # belonged passed 92 gates, then took `beans list`, `roadmap` and
          # `prime` down for every reader -- the store loads as a unit, and
          # `prime` is the first command in the AGENTS.md cold start. Fails
          # hard on a bean NO loader will read; a duplicate key (which `beans`
          # itself tolerates) is baselined at the two the store carries, so a
          # NEW one fails and the existing two are listed rather than demanded.
          bun run check:bean-front-matter
          # Bean `k59d`: check:bean-bodies reads a SENTENCE (`blocked on `id``).
          # A milestone states its blockers as a ROUTE, so both GOAL milestones
          # advertised finished work as next and neither detector could see it.
          # Two rules only -- an id that is an operand of an arrow, and a
          # numbered step under a path heading -- with prose that merely
          # mentions a closed bean deliberately NOT examined and said so.
          bun run check:stale-paths
          # Bean `bbbl`: a bean tagged `ready-to-close` carries the evidence its
          # session did find. Fails only on a tag with no `## Evidence` -- the
          # parking space the skill forbids. Closing them stays the owner's.
          bun run check:ready-to-close
          # Bean `bbbl` / the owner's waiver rule: a malformed waiver reads as
          # permission and carries none, so it fails here rather than at the
          # gate it claims to have opened.
          bun run check:waivers
          # Bean `oh78`: a bean and its issue must reach each other. The
          # bean -> issue direction and the tracked-issue reverse are checked
          # here; the general reverse needs the API and prints as undetermined
          # rather than as clean.
          bun run check:bean-issue-links
          bun run check:python-deps
          bun run deps:python:check
          bun run check:l1-complete
          bun run check:l1-complete -- --check
          bun run check:catalogue
          # Bean `06e3` §4(b): every harness declaring a `docs` graph owes at
          # least one MEANINGFULLY POPULATED page. Exit 2 — could not
          # determine — is a failure here and not a pass, which is the whole
          # reason the check exists rather than a file-exists test.
          bun run check:docs-populated
          bun run check:declared-paths
          bun run check:fallback-roles
          bun run check:kind-validators
          # The UML overview is drawn from the declarations and the kind
          # validators just checked, so it goes stale when either changes.
          bun run uml:overview:check
          bun run check:artifact-index
          bun run smart-trust:pages:check
          # The fsh-guts index is generated from the graph, so it goes stale the
          # moment a file is relocated there -- which is the ONE operation that
          # graph exists for. Gated here rather than trusted, same as every
          # other generated page.
          bun run fsh-guts:viz:check
          # The tools index is generated from the Tool nodes, so it goes stale
          # the moment one is added or its `satisfies` changes.
          bun run tools:viz:check
          # The methodologies index renders the `methodology` graph across
          # EVERY instance that declares one, so it goes stale when any of them
          # adopts a method, ingests a source, or changes an `applies-when`.
          # Gated for the reason every generated page here is: a stale viewer
          # is a page that reports a corpus that no longer exists.
          bun run methodologies:viz:check
          # The external-schemas index renders the registry AND resolves every
          # `usedBy` path in it, so it goes stale when a record is added, an
          # edition bumps, or a file a record names is renamed. The last of
          # those is the one nothing else would notice.
          bun run external-schemas:viz:check
          bun run processes:viz:check
          # MATERIALIZED CONTENT IS READ-ONLY, enforced rather than advised
          # (owner's ruling, 2026-09-22). Hashes every materialized artefact
          # against its recorded digest: an edit in place fails here. A
          # publication step that legitimately rewrites one updates the fixity
          # in the same change, which is what makes the exception checkable
          # instead of a carve-out.
          bun run check:materialized-fixity
          bun run check:read-only-graphs
          bun run check:actor-reach
          bun run check:harness-dirs
          # Does a path-filtered workflow rebuild when the scripts it RUNS
          # change? `docs-site.yml` named eight generators and ran 22, so a
          # fix to `kg-export.ts` -- the script producing both graph documents
          # the site serves -- merged to `main` and fired NO RUN. The outage
          # `40fl` fixed and the silence after the fix were one defect seen
          # twice (bean `tyyc`). Derived from each workflow's own `run:` steps,
          # never a list here.
          bun run check:artefact-verification
          bun run check:workflow-injection
          bun run check:secret-leaks
          bun run check:lockfile-pinning
          bun run check:qa-reviewer-permission
          bun run check:workflow-script-paths
          # Can this repository be CHECKED OUT? Every other gate here asks
          # whether the content is right; this one asks whether the tree can be
          # created at all. Seven sidecars named `req:<slug>` made the clone
          # abort on Windows — the fetch succeeds, then `error: invalid path`
          # takes the WHOLE working tree, so the author sees nothing and CI,
          # being Linux, saw nothing either (2026-09-21, bean `en68`).
          bun run check:portable-paths
          # A backtick inside a viewer's page template closes the string
          # and turns the rest of the page into TypeScript. The compiler
          # already refuses it, so this is about the MESSAGE: it names a
          # token on the offending line and never mentions backticks, and
          # four separate sessions have lost a build to that. Four in-file
          # warnings did not stop it.
          bun run check:viewer-backticks
          # One config per instance: `<name>.config.json` at the
          # instantiation root. This repository instantiates more than
          # one harness, so a single `harness.config.json` at the repo
          # root had become an answer to a question with two answers.
          bun run check:instance-config
          # Every INSTANTIATED harness has a mark of its own. The kind axis is
          # check-avatar-coverage; this is the instance axis, which nothing
          # checked until 2026-09-22 — `harness-tiles.ts` claimed the generic
          # fallback was "reported as a finding" while `genericAvatar` was
          # computed and read by nobody, so `folio-assistant` rendered a
          # question mark until the owner saw it. Bean `zc7m`.
          bun run check:avatar-instances
          # A reader's folio must be the SAME folio in every library they
          # browse (F8/F9). A page that forgets the mount is a folio that
          # silently disappears when they follow a link — the page renders,
          # the library works, and nothing else reports it. Bean `jpjt`.
          bun run check:folio-mount
          # Every instance renders its OWN graph, and an unreadable one is
          # `undetermined` rather than a pass (bean `z4mq` item 3).
          bun run check:instance-render
          # ADVISORY by design, so it exits 0 on findings (bean `2krx`): of 22
          # directories this instance declares, 2 have a renderer, and a hard
          # gate on day one is a wall somebody switches off. It is here so the
          # count is visible on every run and cannot drift unnoticed — the same
          # path `undeclared` took in check:instance-render before it became
          # fatal. `--strict` is the switch for the day the number is low
          # enough to hold.
          bun run check:subgraph-coverage
          bun run check:published-refs
          # The publishability CENSUS, and it is expected to report every
          # instance as UNDECIDED — §6 Q1 of `instance-versioning.md` is open,
          # and absence there means "nobody has said", never "internal". So
          # this runs for the list rather than for a verdict, and its own
          # report says in that many words that an all-undecided census is not
          # a pass. Advisory; `--strict` fails only on the two CROSS-INSTANCE
          # rules a per-declaration parse cannot hold (a duplicate id, an
          # unreadable declaration).
          bun run check:publishable
          # §4's bump, computed from the exported-surface diff rather than
          # claimed by a commit message. §4.1's falsifier was run before this
          # was built — 18 patch / 1 minor / 1 major over 20 commits on main —
          # and it reports "no publishable instance" today, which is a stated
          # nothing rather than a clean run. Advisory until an instance
          # declares `publishable`.
          bun run check:version-bump
          bun run check:graph-kind-work
          # One place says what an asset ROLE is — purpose, layer and
          # delivery. A per-asset restatement of any of the three is a
          # second answer free to disagree, and `KgAssetSchema` strips it
          # WITHOUT A WORD, so the declaration reads as if it carried one
          # while no consumer ever saw it (bean `7syd`).
          bun run check:asset-roles
          # Every instance's dependency graph resolves: no missing dependency,
          # no cycle. At runtime a missing one only WARNS (owner, bean
          # `a1lq`), because a partial checkout looks the same; CI has the
          # whole checkout, so here it fails.
          bun run check:instance-graph
          # No module scope resolves the folio directory. `folioDir` throws
          # on a malformed declaration, and a throw during evaluation strands
          # every export below it — which is how bean `95s1` got an error
          # 3,186 lines from its cause that looked like a circular import.
          bun run check:module-scope-resolution
          # Every foreign-instance export `docs-site.yml` actually runs, run
          # the way it runs it — no `--base-url`, on the declaration's own
          # authority. The deploy failed SEVEN consecutive times on `main`
          # (2026-09-21) on one command this set did not contain, and six
          # merges landed against the green it printed meanwhile. The
          # invocations are read out of the deploy YAML rather than listed,
          # so adding one there is covered here with no edit; finding none
          # is exit 1, not a pass (issue #720, bean `u1iu`).
          bun run check:published-instance-exports
          # A preview must run the generators the deploy runs, with the same
          # instance arguments. `3jhq` was exactly this: staging ran the
          # exporter but not for the foreign instance, so two links 404ed on
          # every preview. Deploy and preview are DERIVED (the deploy passes no
          # `--base-url`), so neither is named in the check (bean `qgpo`).
          bun run check:invocation-parity

          # The generators THIS FILE invokes directly, run as a set.
          # Seven `--check` invocations live in workflow YAML and in no
          # `package.json` script, so a local sweep of `check:*` came
          # back clean while `gen-skill-docs --check` was red here
          # (2026-09-20). It reads them out of the YAML rather than
          # listing them, so a new one is covered the day it is added.
          bun run check:ci-invocations
          # The per-kind state dashboards under `<base>/<graph>/dashboard/`.
          # COMMITTED pages, so a difference is somebody who changed the
          # generator, the renderer it inlines, or the declaration, and did
          # not regenerate — the same contract `schema:viz:check` uses.
          bun run state:visualizer:check
          bun run harness:dirs:check
          bun run check:schema-nodes
          bun run check:retired-front-matter
          bun run check:raci
          # Subgraph containment, and how far the corpus is from the
          # owner's "subgraphs should be disconnected" (bean `x4v4`). It
          # REPORTS entanglement and broken links rather than refusing
          # them — the disentangling is known-outstanding work, and a gate
          # on that is one somebody switches off. Non-zero only on the
          # third state: a file whose edges could not be read at all.
          bun run check:subgraphs
          # Does each methodology's cited `origin` resolve to an ingested
          # source? Six cited one and NONE was in any library when this
          # axis was added (2026-09-22), so it REPORTS rather than gates,
          # on the same reasoning as `check:subgraphs` above. It is
          # non-zero only for a node whose front matter does not validate
          # or whose `evidence` points at a bib-slug no library holds —
          # a citation that claims to resolve and does not is worse than
          # none, because every listing reads it as backed.
          bun run check:methodology-evidence
          # The layout norm, ENFORCED AS A RATCHET rather than as a gate
          # on the whole corpus: no declared directory sits inside another
          # declared directory, with the four `skills/voices` nestings that
          # exist today baselined. A pair not in the baseline fails, so
          # `cat-harness` — which reached zero on 2026-09-22 and has no
          # baseline entry — cannot regress. Owner: "follow established
          # norms on layout. qa to enforce."
          bun run check:layout-norms
          # Every ingested source records its licence, or records that nobody
          # could find it and where they looked (issue #1023). It REPORTS
          # absence and `unknown`, because the field is new, and fails only on
          # a record that claims something it cannot back.
          bun run check:source-licence
          # Every declared harness visualiser has a wireframe, checked at a web
          # AND a mobile viewport (issue #1023; owner: "need both web and
          # mobile layouts in usability reviews"). Gated: a visualiser added
          # without a wireframe, or a wireframe checked at one width, fails.
          bun run check:wireframes
          bun run check:xml-comments
          bun run check:orphan-verdicts
          bun run check:partition
          # Every XML namespace the corpus declares is reconciled against a
          # specification record naming its EDITION. Added with the registry
          # (2026-09-20): a diagram conforming to a spec nobody named is the
          # defect that registry exists to end, and a registry nothing runs is
          # the `xom7` shape one level along.
          bun run external-schemas:check
          bun run docs:harness:check
          # Every instantiated harness ABOVE THE FLOOR owes a board, and the
          # board it owes shows the whole folio. Owner, 2026-09-21: "Any
          # harness above bootsteap has a board filled with all contents."
          # Gated because a harness added without one renders a navbar tile
          # pointing at a folio with no board -- which looks exactly like a
          # folio whose board is empty, and the two are different facts.
          bun run boards:default:check
          # The derived sub-graph indexes (bean `06e3`). Gated for the same
          # reason every other generated artefact here is: an index that has
          # drifted from the graph it claims to index is worse than none,
          # because it reads as current. It also reports an ORPHAN -- a
          # sub-graph page whose sub-graph now contributes nothing -- which is
          # `ankg`'s helper doing its job in a third generator.
          bun run docs:auto:check
          bun run gen:jsonld:check
          bun run readme:sync:check
          bun run avatars:css:check
          bun run themes:css:check
          # The navbar's geometry (`sjic`). GATED because the defect it closes
          # was invisible to every test that existed: `navbar.ts` and
          # `docs-ui.css` each stated the widths and each had a test asserting
          # its OWN copy, so both were green while the rail rested at 40px and
          # the sidebar at 56px -- two navbars the owner had asked to be
          # "presented same way". The generated file is only half the fix; a
          # snapshot that may go stale silently is the same defect with an
          # extra step.
          bun run navbar:geometry:check
          # The ingested-IRIS replica pages, generated from who-iris/catalogue/.
          # A generated page nobody gates drifts from the graph it claims to
          # render, and this one carries byte counts and download links -- the
          # two things a reader would take on trust.
          bun run iris:pages:check
          # The cover thumbnails, checked against the sha256, byte count and
          # PNG dimensions the catalogue nodes declare. The narrow half of
          # `yl5w` this script owns: a `materialized` claim it makes is a claim
          # it checks. It also refuses a THUMBNAIL that does not declare itself
          # derived, so a cover we rasterised cannot read as one IRIS supplied.
          #
          # NO PDF BACKEND IS INSTALLED HERE AND NONE IS NEEDED. This job
          # installs `ruff` and nothing else, and the first version of this
          # gate re-rendered each cover through PyMuPDF -- so it threw
          # `pymupdf is not installed` on every run and turned the branch red
          # three times. Four of the five claims need no decoder: the bytes
          # exist, their digest matches, their length matches, and their pixel
          # dimensions are readable straight out of the PNG's IHDR chunk. Only
          # "these bytes are what that PDF renders to" needs the backend, and
          # `--check` says in its own output which of the two it ran.
          bun run iris:covers:check
          bun run translation:block-qa:check
          # The translation STATUS page and its projection, bean `lnur`.
          # Stale-checked rather than merely generated, for the reason every
          # other generated artefact here is: a page carrying numbers nobody
          # regenerated is a page that lies by aging, which is `d2kp`.
          #
          # It exits 2 when no `translation-sources` directory is declared,
          # and that is NOT a pass — a folio with no translations is a real
          # state, and this generator is not the thing that gets to decide
          # the absence means "nothing to report".
          bun run translation:status:check

      # UN-FOLDED 2026-09-19, bean `folio-assistant-d2kp`.
      #
      # This was a CONTINUATION LINE of the step above: more-indented, so YAML
      # folded it into one plain scalar and the runner executed
      #
      #     bun run agent-memory:check bun run cat-harness/scripts/gen-docs-pages.ts --check
      #
      # `cat-harness/scripts/agent-memory.ts` ignores trailing arguments and exits 0, so
      # the gate its own comment described had NEVER RUN. Two months of green.
      #
      # It could not simply be un-folded, and that is the more interesting
      # half. `gen-docs-pages` wrote LIVE QA VERDICTS into the pages -- the
      # state class, the glyph and "0 fail, 0 warn, 10 pass, 0 n/a" -- so a
      # page went stale whenever a sweep changed its mind. Measured on `main`
      # at ed3403322: 12 pages stale, one of them because the actor-kind fixes
      # in #353 turned a failing criterion GREEN. Enabling the check as it
      # stood would have reddened every KG-touching PR that did not also
      # regenerate, which teaches exactly the wrong lesson.
      #
      # So the verdicts came out of the pages first. `docs/*.md` now carries
      # only corpus STRUCTURE -- which nodes exist, which QA families apply,
      # and whether a sidecar exists at all -- and the badge fetches its page's
      # verdict index at load, the way the QA panel has always fetched its
      # contents. The witness projections under `test/results/witnesses/` are
      # gated on EXISTENCE and not on contents, because their contents are a
      # function of the sidecars and of the working tree and the site build
      # regenerates them on every publish.
      #
      # What a red here means now: somebody added a node, renamed a block, ran
      # a first sweep, or moved a sidecar, and did not regenerate. A real
      # omission, every time.
      - name: generated docs pages are current
        run: bun run cat-harness/scripts/gen-docs-pages.ts --check

      # GATED, unlike the two projections below, and the difference is the
      # INPUT SET — which is the standard those two are excused against.
      #
      # `schema:viz` and `library:viz` derive from the WHOLE repository, so any
      # branch alive for more than a few minutes finds them stale against the
      # merge ref and a red means "somebody else merged". The voices projection
      # derives from the declared `voices` directories and the declarations
      # naming them: four voices in two instances, changed when somebody edits
      # a voice. A red here means a voice was added or a rule was edited and
      # the page was not regenerated — an omission by the author of the diff,
      # every time, which is exactly the test stated twenty lines above.
      - name: voices projection and viewer are current
        run: bun run voices:viz:check

      # THE VOICES SHAPE, NOT THE LIBRARY SHAPE, and that distinction is the
      # whole reason this is gated while `library:viz:check` twenty lines
      # below is not. The folio projection derives from the declared `folio`
      # directories and the JSON nodes in them — three stickies in one
      # directory today — so it changes when somebody edits or adds a landing
      # sticky, and NOT when somebody else merges. A red here is an omission
      # by the author of the diff, every time, which is the test the comment
      # above states. Bean `7ofc`.
      - name: folio projection and viewer are current
        run: bun run folio:viz:check

      # The handler namespace's own index. Gated on the same ground as the
      # voices projection: it derives from the DECLARATIONS (which kinds each
      # instance declares, and whether a `coverage.visualiser` names a
      # published path), not from the whole repository — so a red means
      # somebody changed a declaration and did not regenerate.
      #
      # It is also the one page a navbar tile points at: `siteLinks` publishes
      # `kg` as `/<stub>/`, and `verifySiteLinks` reports `unknown` rather
      # than `dead` on an unbuilt tree, so nothing else here would notice it
      # going missing until production (bean `8h42`).
      - name: handler namespace index is current
        run: bun run handler:index:check

      # NOT GATED: the schema and library projections.
      #
      # `schema:viz:check` and `library:viz:check` exist and are worth running
      # locally, but they are deliberately NOT in this gate set. Owner's call,
      # 2026-09-20, after the gate went red twice on PR #583 for a reason that
      # was never the author's doing.
      #
      # Both projections are derived from the WHOLE repository, so any branch
      # alive for more than a few minutes finds them stale against the merge
      # ref. Measured across one session: `main` moved four times — 120, 2, 2
      # and 11 commits — and twice that was enough to redden this gate on a
      # branch whose own tree was correct. A red that means "somebody else
      # merged while you worked" is not an omission by whoever sees it, and it
      # fails the standard stated eight lines above: "a real omission, every
      # time."
      #
      # Nothing published goes stale. `docs-site.yml` runs the WRITERS at
      # deploy, so the page a reader opens is regenerated from the tree being
      # published. What can lag is the committed copy on `main`, which exists
      # to be browsable on GitHub — and a browsable copy one merge behind is a
      # far smaller cost than a gate contributors learn to re-run without
      # reading.
      #
      # The other `--check` gates here stay, and the difference is their
      # INPUTS: each derives from a narrow set of files, so its red really does
      # mean the author of the diff forgot to regenerate.

      # The translation index is what the navbar's locale filter reads. It is
      # derived from what each page DECLARES — `lang`, and `translation_source`
      # naming what it expresses — never from a directory whose name looks like
      # a language subtag. Three outcomes, and the third is why this is not a
      # plain diff: exit 2 means the translation set could NOT BE DETERMINED
      # (no Jekyll site where one was expected, or a page whose front matter
      # will not parse and that something translates), which must never be
      # published as "this folio has no translations".
      #
      # It also catches the one thing that is easy to forget and invisible
      # locally: a translated page with no `nav_exclude: true` goes into the
      # statically built navbar for EVERY reader, whatever locale they chose.
      - name: translation index is current
        run: bun run translation:index:check

  # ── End-to-end, including the accessibility gate ────────────────────
  #
  # `bunx playwright test` ran in NO workflow before this job. Twenty-nine e2e
  # tests existed and none of them was ever a gate — they passed on whichever
  # machine a contributor happened to run them on, which is not a gate, it is a
  # habit.
  #
  # It is added here rather than left to a follow-up because bean `gjli` states
  # a rule ("ALL UI MUST FOLLOW ACCESSIBILITY GUIDELINES") and a rule whose
  # check does not run is an assertion. `test/a11y.e2e.ts` would have been
  # decoration without this.
  #
  # Chromium comes from `playwright install --with-deps`, the same call
  # `docs-site` and `feature-staging` already make to render BPMN, so this
  # introduces no new capability requirement.
  e2e:
    name: End-to-end + accessibility (hard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: npx --yes playwright install --with-deps chromium

      # The suite generates what it needs under _kg/ if absent, so the
      # artefacts under test are the ones the deploy emits rather than a
      # committed fixture that could agree with the test and disagree with
      # what ships.
      # Here rather than in the `typescript` job because bpmn-js renders
      # through Chromium, which only this job installs. Before the e2e run so
      # a stale SVG is reported on its own terms rather than inside a browser
      # test's output.
      - name: rendered BPMN SVGs are current
        run: bun run render:bpmn:check

      - name: playwright test
        run: bunx playwright test

  rust-wildcard:
    name: Rust wildcard imports (warn-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # WARN-ONLY ratchet: count non-test `use ...::*;` wildcard imports in
      # tools/. Test modules (`#[cfg(test)]` / `use super::*;`) are the bulk
      # of the legitimate baseline, so they're reported but not failed.
      - name: Wildcard `use ...::*;` report
        continue-on-error: true
        run: |
          set -uo pipefail
          # Same distinction as the Lean gate: there are ZERO .rs files in this
          # repo, so "OK — no non-test wildcard imports" was reporting a clean
          # result for a scan of nothing. `tools/` is a folio tree; this job is
          # here for folios that vendor this workflow.
          count=$(find tools -name '*.rs' 2>/dev/null | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "SKIP — no tools/**/*.rs in this repo (the Rust tree lives in the folio). Nothing scanned."
            exit 0
          fi
          # Char class covers digits too (e.g. base64::prelude::*, sha2::*) and
          # underscores (wasm_bindgen::prelude::*, extendr_api::prelude::*).
          matches=$(grep -rnE '^[[:space:]]*use [A-Za-z0-9_:]+::\*;' \
            tools --include='*.rs' 2>/dev/null | grep -vE 'use super::\*;' || true)
          if [ -n "$matches" ]; then
            echo "::warning::Non-test wildcard imports in tools/ (ratchet — narrow when touched):"
            echo "$matches" | while IFS= read -r line; do
              echo "::warning::$line"
              echo "  $line"
            done
          else
            echo "OK — no non-test wildcard imports in $count Rust file(s)"
          fi

  dependency-advisories:
    name: Dependency advisories (warn-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # WARN-ONLY by the owner's decision on bean `j41m`, and the reason is
      # worth keeping next to the step: a HARD gate on advisories hands a
      # transitive advisory nobody can patch the power to red every PR until
      # somebody adds a suppression — and the suppression is what rots.
      # `.github/dependabot.yml` is the other half: it turns the same
      # advisories into reviewable PRs rather than into a gate.
      #
      # `bun audit` needs the registry, not the modules, so there is no
      # install step. Adding one would make a dependency resolve a
      # precondition of asking whether dependencies are safe.
      #
      # NO `continue-on-error` and NO `|| true`. The script exits 0 in every
      # state on purpose, and keeps the three states apart in its OUTPUT
      # instead — which is the only place they can be kept apart once the exit
      # code carries no information. `|| true` is exactly how "could not
      # determine" becomes "fine", and this workflow has paid for that once
      # already: see the ruff note at the top of this file, where a step
      # "warned about the missing paths and exited 0, so it reported a clean
      # baseline it had never computed."
      - name: Known advisories against the resolved tree
        run: bun run check:dependency-advisories
