# bpmn: cat-harness/processes/sdlc/merge-base.bpmn
#
# Merge `main` into opted-in PR branches when it moves — bean `d33q` part B,
# story S2 of epic `7x5n` (bean `0mf0`).
#
# ## Why
#
# Measured on #1754, 2026-10-01: one `bun run merge:main` round took 19-46 min
# in an agent container shared with sibling sessions, while `main` moved every
# few minutes. GitHub does not run `pull_request` CI on a conflicted PR, so a
# branch that resolved 28 conflicts went 'dirty' again within a minute of the
# push. The resolution is mechanical BY DECLARATION
# (`cat-harness/scripts/merge-conflict-patterns.ts`), so it belongs on a
# runner, not in an agent's turn. This workflow is a second CALLER of the same
# command — never a second resolver.
#
# ## What it will and will not do
#
#  - Opt-in only: the PR must carry the `merge-main` label. A bot commit on an
#    in-flight branch is a coordination event, so nobody gets one unasked.
#  - Same-repository branches only; never a fork.
#  - It pushes ONLY what `merge:main` proved: every conflict resolved by a
#    declared pattern AND `regen` reporting nothing unrepaired. A refusal, or an
#    unproved resolution, pushes nothing.
#  - The push is a fast-forward of the branch as checked out. If the author
#    pushed meanwhile, it is rejected, and nothing is overwritten.
#  - It never adds a pattern (a pattern is declared by a person, with its
#    `why`) and never merges anything into `main`.
#  - One comment per PR, edited in place on every run, like the health issue.
#
# ## Why there is no loop
#
# It triggers on pushes to `main`, on the label being added, and by hand — not
# on `synchronize`. Its own push to a PR branch therefore cannot fire it again.
# A run that finds the branch already contains `main` exits "already up to
# date" without pushing.
#
# ## The push and the PR's own CI
#
# A push made with GITHUB_TOKEN deliberately triggers no workflow, so the
# PR's `pull_request` CI would not judge the merge commit. When the
# `MERGE_MAIN_TOKEN` secret (a fine-grained token: contents + pull requests,
# this repository) is set, the push uses it and CI fires as for any push.
# Without it, the job dispatches `code-quality-gates.yml` on the branch, which
# GitHub DOES allow from GITHUB_TOKEN, so the merge commit is still proved by
# CI rather than trusted.

name: Merge main into opted-in PRs

on:
  push:
    branches: [main]
  # `pull_request_target`, NOT `pull_request` — measured 2026-10-02: adding
  # the label to 4 conflicted PRs started 0 runs. GitHub runs no
  # `pull_request` workflow for a PR with no merge ref, and a conflicted PR has
  # none — so the trigger was blind to exactly the PRs this exists for.
  # `pull_request_target` runs in the BASE context and fires regardless of
  # mergeability. It also carries a write token, which is why every job below
  # refuses a PR whose head is not in this repository (only people with write
  # access can push such a branch) BEFORE anything is checked out.
  pull_request_target:
    types: [labeled]
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to merge main into (must carry the merge-main label). Empty: sweep every labelled PR, as a push to main does."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  select:
    # bpmn-node: Start_Merge
    name: Select opted-in PRs that are behind main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name != 'pull_request_target' || github.event.label.name == 'merge-main'
    permissions:
      pull-requests: read
    outputs:
      prs: ${{ steps.pick.outputs.prs }}
    steps:
      - name: Pick PRs
        id: pick
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          LABELLED_PR: ${{ github.event.pull_request.number }}
          INPUT_PR: ${{ github.event.inputs.pr }}
        run: |
          set -euo pipefail
          candidates=""
          case "$EVENT" in
            pull_request_target) candidates="$LABELLED_PR" ;;
            workflow_dispatch) candidates="$INPUT_PR" ;;
          esac
          # An empty dispatch sweeps like a push does.
          case "$candidates" in
            "") candidates=$(gh api "repos/$REPO/pulls?state=open&base=main&per_page=100" --paginate \
                 --jq '.[] | select(any(.labels[]; .name == "merge-main")) | .number') ;;
          esac
          prs=()
          for n in $candidates; do
            pr=$(gh api "repos/$REPO/pulls/$n")
            same=$(jq -r '.head.repo.full_name == .base.repo.full_name' <<<"$pr")
            labelled=$(jq -r 'any(.labels[]; .name == "merge-main")' <<<"$pr")
            open=$(jq -r '.state == "open"' <<<"$pr")
            if [ "$same" != true ] || [ "$labelled" != true ] || [ "$open" != true ]; then
              echo "skip #$n: same-repo=$same labelled=$labelled open=$open"; continue
            fi
            behind=$(gh api "repos/$REPO/compare/$(jq -r .head.sha <<<"$pr")...main" --jq '.ahead_by')
            if [ "$behind" = "0" ]; then echo "skip #$n: already contains main"; continue; fi
            echo "pick #$n: $behind commit(s) behind main"
            prs+=("$n")
          done
          printf 'prs=%s\n' "$(printf '%s\n' "${prs[@]:-}" | jq -Rnc '[inputs | select(length > 0) | tonumber]')" >> "$GITHUB_OUTPUT"

  merge:
    # bpmn-node: Task_Merge
    name: merge:main into PR #${{ matrix.pr }}
    needs: select
    if: needs.select.outputs.prs != '[]' && needs.select.outputs.prs != ''
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        pr: ${{ fromJSON(needs.select.outputs.prs) }}
    # Coalesce on the PR's own pushes; QUEUE on pushes to main. The group is
    # per-PR, and GitHub holds at most one pending run per group, so queue
    # depth is bounded at one either way — the only question is which of the
    # two runs survives.
    #
    # Under `pull_request_target` the hazard is real and cancelling is right: a
    # new commit on the PR means the in-flight job is merging main into a head
    # that no longer exists, so its result would be stale before it landed.
    #
    # Under `push` to main there is no such hazard, and cancelling is pure
    # loss. A job that lands `main@T1` into the PR is not worthless once main
    # has moved to `T2`: the next sweep then has only `T1 -> T2` to carry, a
    # strictly smaller step. Kill it and the PR is still at `main@T0`, so the
    # next sweep must carry `T0 -> T2` — and under a steady merge cadence that
    # one is cancelled too, so the PR never advances at all. That is bean
    # `mc8h`'s treadmill, produced by the mechanism meant to avoid it. Measured
    # (bean `o8s9`, 2026-10-03): of the last 100 runs, `push`-triggered gave 20
    # success to 21 cancelled, against 14 to 2 for `pull_request_target`. The
    # queued job re-reads main when it starts, so nothing stale lands.
    concurrency:
      group: merge-main-${{ matrix.pr }}
      cancel-in-progress: ${{ github.event_name != 'push' }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      PR: ${{ matrix.pr }}
      MARKER: "<!-- merge-main-bot -->"
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Resolve the PR's head branch
        id: pr
        run: |
          set -euo pipefail
          pr=$(gh api "repos/$REPO/pulls/$PR")
          # Checked again here, before the checkout, not only in `select`:
          # under `pull_request_target` this job holds a write token, and a
          # fork's head must never be checked out with it.
          if [ "$(jq -r '.head.repo.full_name == .base.repo.full_name' <<<"$pr")" != true ]; then
            echo "::error::#$PR's head is not in $REPO — refusing to check it out"; exit 1
          fi
          jq -r '"ref=\(.head.ref)\nsha=\(.head.sha)"' <<<"$pr" >> "$GITHUB_OUTPUT"

      # SHALLOW, THEN ONLY TWO HISTORIES — measured 2026-10-02: with
      # `fetch-depth: 0` this checkout took 319-543 s of a ~20 min job, because
      # it fetches every ref's history (2153 refs, 651 branches, and
      # `gh-pages` with every preview). A merge needs exactly two: the PR
      # branch and main. They are fetched blobless; git fetches the contents
      # of the files the merge touches on demand.
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.pr.outputs.ref }}
          fetch-depth: 1
          submodules: recursive
          token: ${{ secrets.MERGE_MAIN_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Fetch the history of the PR branch and main only
        env:
          REF: ${{ steps.pr.outputs.ref }}
        run: |
          set -euo pipefail
          git fetch -q --unshallow --no-tags --filter=blob:none origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/$REF:refs/remotes/origin/$REF"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # regen runs the writers behind every fast gate, the same set the
      # `gates` job asks — so it needs that job's interpreters too.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check the branch did not move since selection
        env:
          SELECTED: ${{ steps.pr.outputs.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SELECTED" || { echo "::notice::head moved since selection; the next run will pick it up"; exit 1; }

      # THE TOOL COMES FROM MAIN, NOT FROM THE PR — measured 2026-10-02 on 7
      # real runs: an old branch has neither the `merge:main` script nor
      # `merge-base.ts`, so `bun run merge:main` in the PR's tree logged
      # `Script not found` on every one. Main's copy is checked out OUTSIDE
      # the PR's tree (a clean tree is merge-base's precondition) and pointed
      # at it with `--root`. Main's patterns are the ones that apply, too: the
      # base being merged in is main. What merge-base then runs INSIDE the
      # tree — `qa:resolve-conflicts`, `regen` — runs after the merge, so it is
      # main's version as merged into the branch, not the branch's old one.
      - name: Check out main's merge tool beside the PR
        run: |
          set -euo pipefail
          git fetch -q origin main
          git worktree add --detach "$RUNNER_TEMP/tool" origin/main
          cd "$RUNNER_TEMP/tool"
          # merge-base.ts imports the schemas, which import bootstrap-tools — a
          # submodule a fresh worktree does not have (found by the dry run on
          # #1777's head that proves this step).
          git submodule update --init --recursive
          bun install --frozen-lockfile

      - name: merge main in, with main's merge-base.ts
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          before=$(git rev-parse HEAD)
          set +e
          bun run "$RUNNER_TEMP/tool/cat-harness/scripts/merge-base.ts" --root "$GITHUB_WORKSPACE" --base origin/main > "$RUNNER_TEMP/merge.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/merge.log"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if grep -qE '^  ✗ .*  \[' "$RUNNER_TEMP/merge.log"; then echo "refused=true" >> "$GITHUB_OUTPUT"; else echo "refused=false" >> "$GITHUB_OUTPUT"; fi
          if [ "$status" = 0 ] && [ "$(git rev-parse HEAD)" != "$before" ]; then
            echo "merged=true" >> "$GITHUB_OUTPUT"
          else
            echo "merged=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push the proved merge (fast-forward only)
        id: push
        if: steps.merge.outputs.merged == 'true'
        env:
          REF: ${{ steps.pr.outputs.ref }}
          SELECTED: ${{ steps.pr.outputs.sha }}
        run: |
          # No --force of any kind: if the author pushed during the run this is
          # rejected, which is the guard against overwriting their work.
          #
          # A REJECTION BECAUSE THE BRANCH MOVED is an expected race, the same
          # class as a refusal — measured 2026-10-02 on #1790 (run 36981901740),
          # where it put a red check on the PR that read as a CI failure. So it
          # is reported (`rejected=true`, and in the comment) and the job stays
          # green; the next push to main retries. Any OTHER push failure — the
          # branch did not move, yet the push failed — is a real error.
          #
          # THE REASON IS READ FROM THE PUSH'S OWN STDERR, never inferred —
          # measured 2026-10-02 on #1790: GitHub refused with "refusing to allow
          # a GitHub App to create or update workflow … without `workflows`
          # permission" and the comment said "the branch moved", which was
          # false. A merge commit that changes a workflow file relative to the
          # head can NEVER be pushed with GITHUB_TOKEN, so retrying is useless:
          # it is a person's merge (needs-merge-human) until the owner's
          # credentials design (#1829) supplies a token with `workflows` scope.
          if git push origin "HEAD:refs/heads/$REF" 2> "$RUNNER_TEMP/push.err"; then
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cat "$RUNNER_TEMP/push.err" >&2
          if grep -qE 'without `?workflows`? permission|refusing to allow a GitHub App to create or update workflow' "$RUNNER_TEMP/push.err"; then
            echo "::notice::the merge changes a workflow file; GITHUB_TOKEN cannot push it (needs a token with workflows scope, #1829)"
            echo "blocked=workflows" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          now=$(git ls-remote origin "refs/heads/$REF" | cut -f1)
          if [ -n "$now" ] && [ "$now" != "$SELECTED" ]; then
            echo "::notice::the branch moved during the run ($SELECTED -> $now); nothing overwritten, the next push to main retries"
            echo "rejected=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error::push failed although the branch did not move"
          exit 1

      - name: Have CI judge the merge commit
        if: steps.push.outputs.sha != ''
        env:
          REF: ${{ steps.pr.outputs.ref }}
          HAS_TOKEN: ${{ secrets.MERGE_MAIN_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" = true ]; then
            echo "pushed with MERGE_MAIN_TOKEN: the PR's own CI fires on the push"
          else
            # Every GATING workflow, so each judges the merge commit: a bot-actor
            # push leaves their `pull_request` runs at action_required (measured
            # 2026-10-02), and only a dispatch actually runs. Feature Staging is
            # preview-only and stays as it is. The real fix is a GitHub App token
            # (#1829), whose pushes trigger the PR's own runs.
            for wf in code-quality-gates.yml jsonld-gen-check.yml; do
              gh workflow run "$wf" --repo "$REPO" --ref "$REF"
            done
          fi

      # The composition is `cat-harness/scripts/merge-main-comment.ts`, run
      # from main's tool worktree like merge-base itself, so its branches are
      # unit-tested. A CANCELLED job (a newer push to main superseded it) or a
      # merge step with no exit status leaves the existing comment untouched
      # — measured 2026-10-02 on #1777 (run 36986362911), where this step ran
      # under always() with an empty STATUS and rewrote the comment to
      # "**Error** (exit )" (issue #1854).
      - name: Comment once, edited in place
        if: always() && steps.merge.outcome != 'skipped'
        env:
          JOB_STATUS: ${{ job.status }}
          STATUS: ${{ steps.merge.outputs.status }}
          MERGED: ${{ steps.merge.outputs.merged }}
          PUSHED: ${{ steps.push.outputs.sha != '' && 'success' || 'no' }}
          BLOCKED: ${{ steps.push.outputs.blocked }}
          REJECTED: ${{ steps.push.outputs.rejected }}
          SHA: ${{ steps.push.outputs.sha }}
        run: |
          set -euo pipefail
          plan=$(bun run "$RUNNER_TEMP/tool/cat-harness/scripts/merge-main-comment.ts" --log "$RUNNER_TEMP/merge.log")
          if [ "$(jq -r .action <<<"$plan")" = leave ]; then
            echo "::notice::comment left untouched — $(jq -r .reason <<<"$plan")"
            exit 0
          fi
          body=$(jq -r .body <<<"$plan")
          if [ "$(jq -r .labelNeedsHuman <<<"$plan")" = true ]; then
            gh label create needs-merge-human --color D93F0B --description "merge:main refused: an authored or undeclared conflict" --force >/dev/null
            gh pr edit "$PR" --repo "$REPO" --add-label needs-merge-human >/dev/null
          fi
          # A clean run clears an earlier refusal's label (bean `wczm` item 3):
          # it named a conflict this run has now merged, or found gone. Read
          # first, so a PR that never carried the label is not edited.
          if [ "$(jq -r .clearNeedsHuman <<<"$plan")" = true ] &&
             gh pr view "$PR" --repo "$REPO" --json labels --jq '.labels[].name' | grep -qx needs-merge-human; then
            gh pr edit "$PR" --repo "$REPO" --remove-label needs-merge-human >/dev/null
          fi
          existing=$(gh api "repos/$REPO/issues/$PR/comments?per_page=100" --paginate \
            --jq ".[] | select(.body | startswith(\"$MARKER\")) | .id" | head -n1)
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$existing" -f body="$body" >/dev/null
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -f body="$body" >/dev/null
          fi

      # A failed merge step must not be a green job — measured 2026-10-02:
      # `Script not found` on 7 runs, all green. A REFUSAL is an expected,
      # reported outcome (labelled needs-merge-human) and stays green; any
      # other non-zero exit — unrepaired, error, could not start — fails here,
      # AFTER the comment, so the PR is told why.
      - name: Fail on anything but a merge, an up-to-date branch or a refusal
        if: always() && steps.merge.outcome == 'success' && steps.merge.outputs.status != '0' && steps.merge.outputs.refused != 'true'
        env:
          STATUS: ${{ steps.merge.outputs.status }}
        run: |
          echo "::error::merge-base exited $STATUS without a refusal — see the log above"
          exit 1
