# bpmn: cat-harness/processes/merge-base.bpmn
#
# Merge `main` into opted-in PR branches when it moves — bean `d33q` part B,
# story S2 of epic `7x5n` (bean `0mf0`).
#
# ## Why
#
# Measured on #1754, 2026-10-01: one `bun run merge:main` round took 19-46 min
# in an agent container shared with sibling sessions, while `main` moved every
# few minutes. GitHub does not run `pull_request` CI on a conflicted PR, so a
# branch that resolved 28 conflicts went 'dirty' again within a minute of the
# push. The resolution is mechanical BY DECLARATION
# (`cat-harness/scripts/merge-conflict-patterns.ts`), so it belongs on a
# runner, not in an agent's turn. This workflow is a second CALLER of the same
# command — never a second resolver.
#
# ## What it will and will not do
#
#  - Opt-in only: the PR must carry the `merge-main` label. A bot commit on an
#    in-flight branch is a coordination event, so nobody gets one unasked.
#  - Same-repository branches only; never a fork.
#  - It pushes ONLY what `merge:main` proved: every conflict resolved by a
#    declared pattern AND `regen` reporting nothing unrepaired. A refusal, or an
#    unproved resolution, pushes nothing.
#  - The push is a fast-forward of the branch as checked out. If the author
#    pushed meanwhile, it is rejected, and nothing is overwritten.
#  - It never adds a pattern (a pattern is declared by a person, with its
#    `why`) and never merges anything into `main`.
#  - One comment per PR, edited in place on every run, like the health issue.
#
# ## Why there is no loop
#
# It triggers on pushes to `main`, on the label being added, and by hand — not
# on `synchronize`. Its own push to a PR branch therefore cannot fire it again.
# A run that finds the branch already contains `main` exits "already up to
# date" without pushing.
#
# ## Whose `merge:main` runs — MAIN's, never the branch's (issue #1832)
#
# The first version ran `bun run merge:main` inside the PR's checkout, so it
# ran whatever the BRANCH carried. A branch cut before the script reached
# `main` (2026-10-01) carried nothing: `error: Script not found "merge:main"`,
# exit 1, and a comment reading "Could not run" on exactly the old branches
# this bot exists for — run 36970916099 hit all four PRs it selected.
#
# So the job checks out twice: the PR into `pr/` and `main` into `tool/`
# (with submodules — the platform imports `bootstrap-tools/` at module load),
# and runs main's `merge:main` with `--root` pointing at `pr/`. Both are
# siblings, never nested: `merge-base.ts` refuses an untracked file, and a
# tool tree inside the PR's worktree would be one. The script is invoked by
# NAME from main's `package.json`, so what "merge:main" means is decided by
# `main` in one place. Its `regen` still runs in `pr/`, against the merged
# tree, which is where the proof has to be made.
#
# A tool that is missing from `main`, or that cannot load, is reported as
# such and fails the job — it is the bot's defect, not the PR's, and the
# comment says so rather than "Could not run".
#
# ## The push and the PR's own CI
#
# A push made with GITHUB_TOKEN deliberately triggers no workflow, so the
# PR's `pull_request` CI would not judge the merge commit. When the
# `MERGE_MAIN_TOKEN` secret (a fine-grained token: contents + pull requests,
# this repository) is set, the push uses it and CI fires as for any push.
# Without it, the job dispatches `code-quality-gates.yml` on the branch, which
# GitHub DOES allow from GITHUB_TOKEN, so the merge commit is still proved by
# CI rather than trusted.

name: Merge main into opted-in PRs

on:
  push:
    branches: [main]
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to merge main into (it must carry the merge-main label)"
        required: true

permissions:
  contents: read

jobs:
  select:
    # bpmn-node: Start_Merge
    name: Select opted-in PRs that are behind main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name != 'pull_request' || github.event.label.name == 'merge-main'
    permissions:
      pull-requests: read
    outputs:
      prs: ${{ steps.pick.outputs.prs }}
    steps:
      - name: Pick PRs
        id: pick
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          LABELLED_PR: ${{ github.event.pull_request.number }}
          INPUT_PR: ${{ github.event.inputs.pr }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            pull_request) candidates="$LABELLED_PR" ;;
            workflow_dispatch) candidates="$INPUT_PR" ;;
            *) candidates=$(gh api "repos/$REPO/pulls?state=open&base=main&per_page=100" --paginate \
                 --jq '.[] | select(any(.labels[]; .name == "merge-main")) | .number') ;;
          esac
          prs=()
          for n in $candidates; do
            pr=$(gh api "repos/$REPO/pulls/$n")
            same=$(jq -r '.head.repo.full_name == .base.repo.full_name' <<<"$pr")
            labelled=$(jq -r 'any(.labels[]; .name == "merge-main")' <<<"$pr")
            open=$(jq -r '.state == "open"' <<<"$pr")
            if [ "$same" != true ] || [ "$labelled" != true ] || [ "$open" != true ]; then
              echo "skip #$n: same-repo=$same labelled=$labelled open=$open"; continue
            fi
            behind=$(gh api "repos/$REPO/compare/$(jq -r .head.sha <<<"$pr")...main" --jq '.ahead_by')
            if [ "$behind" = "0" ]; then echo "skip #$n: already contains main"; continue; fi
            echo "pick #$n: $behind commit(s) behind main"
            prs+=("$n")
          done
          printf 'prs=%s\n' "$(printf '%s\n' "${prs[@]:-}" | jq -Rnc '[inputs | select(length > 0) | tonumber]')" >> "$GITHUB_OUTPUT"

  merge:
    # bpmn-node: Task_Merge
    name: merge:main into PR #${{ matrix.pr }}
    needs: select
    if: needs.select.outputs.prs != '[]' && needs.select.outputs.prs != ''
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        pr: ${{ fromJSON(needs.select.outputs.prs) }}
    # A burst of pushes to main yields ONE live run per PR: a newer run
    # supersedes an older one, whose merge would be stale before it landed.
    concurrency:
      group: merge-main-${{ matrix.pr }}
      cancel-in-progress: true
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      PR: ${{ matrix.pr }}
      MARKER: "<!-- merge-main-bot -->"
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Resolve the PR's head branch
        id: pr
        run: |
          set -euo pipefail
          gh api "repos/$REPO/pulls/$PR" --jq '"ref=\(.head.ref)\nsha=\(.head.sha)"' >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.pr.outputs.ref }}
          path: pr
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.MERGE_MAIN_TOKEN || secrets.GITHUB_TOKEN }}

      # MAIN's merge tool, beside the PR's tree rather than inside it. Pinned
      # to `main` explicitly: on a `pull_request` event the default ref is the
      # PR's merge ref, which would run the branch's tool again (issue #1832).
      - uses: actions/checkout@v7
        with:
          ref: main
          path: tool
          submodules: recursive

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # regen runs the writers behind every fast gate, the same set the
      # `gates` job asks — so it needs that job's interpreters too.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          bun install --cwd "$GITHUB_WORKSPACE/tool" --frozen-lockfile
          bun install --cwd "$GITHUB_WORKSPACE/pr" --frozen-lockfile

      - name: Check the branch did not move since selection
        env:
          SELECTED: ${{ steps.pr.outputs.sha }}
        run: |
          test "$(git -C pr rev-parse HEAD)" = "$SELECTED" || { echo "::notice::head moved since selection; the next run will pick it up"; exit 1; }

      # Separates "the tool is not there / will not load" from a merge that
      # ran and failed. Without it both read as exit 1.
      - name: Load main's merge tool
        id: tool
        run: |
          script=$(jq -r '.scripts["merge:main"] // empty' tool/package.json)
          entry=$(sed -nE 's/.*bun run ([^ ]+\.ts).*/\1/p' <<<"$script")
          if [ -z "$script" ] || [ -z "$entry" ] || [ ! -f "tool/$entry" ]; then
            echo "status=missing" >> "$GITHUB_OUTPUT"
            echo "::error::main's package.json has no runnable merge:main (script: '${script}')"
            exit 0
          fi
          if bun --cwd "$GITHUB_WORKSPACE/tool" -e "await import(process.cwd() + '/$entry')" > "$RUNNER_TEMP/tool.log" 2>&1; then
            echo "status=ok" >> "$GITHUB_OUTPUT"
          else
            cat "$RUNNER_TEMP/tool.log"
            echo "status=unloadable" >> "$GITHUB_OUTPUT"
            echo "::error::main's merge tool ($entry) failed to load"
          fi

      - name: main's merge:main, against the PR's tree
        id: merge
        if: steps.tool.outputs.status == 'ok'
        run: |
          git -C pr config user.name "github-actions[bot]"
          git -C pr config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          before=$(git -C pr rev-parse HEAD)
          set +e
          bun run --cwd "$GITHUB_WORKSPACE/tool" merge:main --root "$GITHUB_WORKSPACE/pr" > "$RUNNER_TEMP/merge.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/merge.log"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" = 0 ] && [ "$(git -C pr rev-parse HEAD)" != "$before" ]; then
            echo "merged=true" >> "$GITHUB_OUTPUT"
          else
            echo "merged=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push the proved merge (fast-forward only)
        id: push
        if: steps.merge.outputs.merged == 'true'
        env:
          REF: ${{ steps.pr.outputs.ref }}
        run: |
          # No --force of any kind: if the author pushed during the run this is
          # rejected, which is the guard against overwriting their work.
          git -C pr push origin "HEAD:refs/heads/$REF"
          echo "sha=$(git -C pr rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Have CI judge the merge commit
        if: steps.push.outcome == 'success'
        env:
          REF: ${{ steps.pr.outputs.ref }}
          HAS_TOKEN: ${{ secrets.MERGE_MAIN_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" = true ]; then
            echo "pushed with MERGE_MAIN_TOKEN: the PR's own CI fires on the push"
          else
            gh workflow run code-quality-gates.yml --repo "$REPO" --ref "$REF"
          fi

      - name: Comment once, edited in place
        if: always() && steps.tool.outcome != 'skipped'
        env:
          TOOL: ${{ steps.tool.outputs.status }}
          STATUS: ${{ steps.merge.outputs.status }}
          MERGED: ${{ steps.merge.outputs.merged }}
          PUSHED: ${{ steps.push.outcome }}
          SHA: ${{ steps.push.outputs.sha }}
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/merge.log"
          touch "$log"
          resolved=$(grep -E '^  ✓ .*  \[[a-z0-9-]+: ' "$log" | sed -E 's/.*\[([^:]+):.*/\1/' | sort | uniq -c | awk '{printf "- `%s`: %s\n", $2, $1}' || true)
          refused=$(grep -E '^  ✗ .*  \[' "$log" | sed -E 's/^  ✗ /- /' || true)
          unrepaired=$(grep -E 'STILL fails' "$log" | sed -E 's/^ *✗ /- /' || true)
          if [ "$TOOL" != ok ] || grep -q 'Script not found "merge:main"' "$log"; then
            # Checked FIRST: nothing was attempted, so no merge state below applies.
            head="**Did not run: \`main\`'s merge tool is ${TOOL:-missing} on this runner** (\`missing\` = \`main\`'s \`package.json\` names no runnable \`merge:main\`; \`unloadable\` = it would not import). Nothing was merged and nothing pushed. This is a defect in the bot or in \`main\`, not in this branch — the branch does not need the script."
          elif [ "$MERGED" = true ] && [ "$PUSHED" = success ]; then
            head="**Merged \`main\` and pushed \`${SHA:0:9}\`.** Every conflict was resolved by a declared pattern and the gate set reproduced the result; CI now judges it."
          elif [ "$MERGED" = true ]; then
            head="**Merged and proved, but the push was rejected** — the branch moved during the run. Nothing was overwritten; the next push to \`main\` retries."
          elif [ "$STATUS" = 0 ]; then
            head="**Already up to date with \`main\`.** Nothing to push."
          elif [ -n "$refused" ]; then
            head="**Refused — nothing pushed.** These conflicts are authored or named by no declared pattern, so they need a person. Adding a pattern is a deliberate change with its reason (skill \`merge-conflict-patterns\`), never a widened glob."
            gh label create needs-merge-human --repo "$REPO" --color D93F0B --description "merge:main refused: an authored or undeclared conflict" --force >/dev/null
            gh pr edit "$PR" --repo "$REPO" --add-label needs-merge-human >/dev/null
          elif [ -n "$unrepaired" ]; then
            main_ci=$(gh api "repos/$REPO/commits/main/check-runs?per_page=100" --jq '[.check_runs[] | select(.conclusion == "failure") | .name] | join(", ")')
            head="**Not proved — nothing pushed.** Every conflict matched a pattern, but regen could not reproduce these checks. If \`main\` is red on the same checks, it is main's red, not this PR's. Failing on main right now: ${main_ci:-none}."
          else
            head="**Could not run** (exit $STATUS) — see the run log. Nothing pushed."
          fi
          body="$MARKER
          $head
          ${resolved:+
          Resolved by pattern:
          $resolved}${refused:+
          Refused:
          $refused}${unrepaired:+
          Unrepaired:
          $unrepaired}

          [Run]($RUN_URL) · \`.github/workflows/merge-main.yml\` (bean \`d33q\`). Remove the \`merge-main\` label to stop."
          existing=$(gh api "repos/$REPO/issues/$PR/comments?per_page=100" --paginate \
            --jq ".[] | select(.body | startswith(\"$MARKER\")) | .id" | head -n1)
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$existing" -f body="$body" >/dev/null
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -f body="$body" >/dev/null
          fi

      - name: Fail when main's tool could not run
        if: always() && steps.tool.outcome == 'success' && steps.tool.outputs.status != 'ok'
        env:
          TOOL: ${{ steps.tool.outputs.status }}
        run: |
          echo "::error::merge tool on main is $TOOL — the bot is broken, not the PR (issue #1832)"
          exit 1
