name: Docs site (GitHub Pages)

# Builds and deploys the folio-assistant documentation site to GitHub Pages at
# https://litlfred.github.io/folio-assistant/.
#
# Serving model: the built static site is published to the **gh-pages branch**
# (with .nojekyll so it is served exactly as built). Enable it once under
# Settings → Pages → "Deploy from a branch" → gh-pages → / (root).
#
# Pipeline:
#   1. Regenerate the skill schema reference from JSON Schema (bun).
#   2. Build the Jekyll site under docs/ (just-the-docs via remote_theme).
#   3. Generate the TypeScript API reference with TypeDoc into _site/api/.
#   4. Publish the combined _site to the gh-pages branch (peaceiris).
#
# Generated pages (docs/reference/skills/*) are also committed to the repo so
# they are browsable on GitHub directly; this job keeps the published copy fresh.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      # The BPMN/DMN sources moved OUT of docs/ into the `kg` graph, where the
      # roles and skills they reference live. The SVGs the site embeds are
      # still rendered from them at deploy time, so without this path a diagram
      # edit would not rebuild the site and the published page would serve a
      # stale render — exactly the "move the wiring with the script" failure.
      - 'skills/workflows/**'
      - 'schemas/**'
      - 'scripts/gen-schema-docs.ts'
      - 'scripts/gen-docs-pages.ts'
      - 'content/docs/**'
      - 'scripts/render-bpmn.ts'
      # The navbar's locale filter reads `docs/_data/translations.json`, built
      # by this module from the pages' own front matter. A change to how that
      # is derived changes the published navbar while touching nothing under
      # `docs/`, so without this path the site would not rebuild.
      - 'content/pipeline/translation-index.ts'
      - '.github/workflows/docs-site.yml'
  workflow_dispatch:

permissions:
  contents: write  # required to push to the gh-pages branch

concurrency:
  group: docs-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # Serialise on the CONTENDED RESOURCE — `gh-pages` — not on the branch.
    #
    # `docs-site` pushes to the same `gh-pages` ref that
    # `feature-staging` does, and a concurrency group serialises only the jobs
    # that NAME it. `eoix` gave the group to `feature-staging`'s two jobs and
    # stopped there, so this workflow was still free to race them — which is
    # what PR #297 hit on 2026-09-18: `! [remote rejected] gh-pages -> gh-pages
    # (cannot lock ref ... is at 0779d88f but expected f885578d)`, after a full
    # site build.
    #
    # `cancel-in-progress: false` is load-bearing and is the same reasoning as
    # `eoix`: a pending run that a later arrival cancels is a DEPLOY SILENTLY
    # DROPPED, which is worse than the queueing it would save. The
    # workflow-level group above still applies — it scopes the run, this scopes
    # the job — so per-ref cancellation of superseded builds is unaffected.
    concurrency:
      group: gh-pages-push
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps
        run: bun install --frozen-lockfile || bun install

      - name: Regenerate skill schema reference
        run: bun run scripts/gen-schema-docs.ts

      - name: Regenerate skill instruction pages
        run: bun run scripts/gen-skill-docs.ts

      # Pages assembled from site-content/<slug>/. Regenerated here for the
      # same reason as the two above: the committed copy is browsable on
      # GitHub, and the published one must never be the stale half of that
      # pair. The --check form is the PR gate (code-quality-gates.yml); this is
      # the deploy-time refresh.
      - name: Regenerate content-backed docs pages
        run: bun run scripts/gen-docs-pages.ts

      # Same reasoning as the three regenerations above: the committed copy is
      # browsable on GitHub and the PUBLISHED one must never be the stale half
      # of that pair. A stale index here is not cosmetic — it is the navbar
      # showing the wrong set of translations to every reader.
      #
      # A non-zero exit fails the deploy on purpose. Publishing a site whose
      # translation set could not be determined would render "could not tell"
      # as "there are none", which is the one thing this pipeline must not do.
      - name: Regenerate the translation index
        run: bun run translation:index

      # The BPMN sources under skills/workflows/ are the source of truth; the SVGs
      # the workflow pages embed are rendered from them with bpmn-js in headless
      # Chromium, so the published site can never show a stale diagram.
      - name: Render BPMN workflow diagrams
        run: |
          npx --yes playwright install --with-deps chromium
          bun run render:bpmn

      # Stamp the build so a reader can tell WHAT IS DEPLOYED from the page
      # itself. Without it the only way to know whether a change is live is to
      # compare rendered behaviour against a guess -- and a stale browser cache
      # is indistinguishable from a deploy that has not run. Written as a data
      # file rather than into _config.yml so the config stays reviewable and
      # the build cannot half-apply.
      - name: Stamp the build sha
        run: |
          mkdir -p docs/_data
          {
            echo "sha: \"${GITHUB_SHA}\""
            echo "short_sha: \"${GITHUB_SHA:0:7}\""
            echo "built_at: \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\""
            echo "run_url: \"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\""
          } > docs/_data/build.yml
          cat docs/_data/build.yml

      # Build the Jekyll site from docs/ using the github-pages gem
      # (whitelists jekyll-remote-theme, so just-the-docs works).
      - name: Build Jekyll site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      # actions/jekyll-build-pages runs Jekyll in a container as root, so _site/
      # comes back owned by root and every later step — which runs as `runner` —
      # is locked out of it. That is why TypeDoc could not create _site/api and
      # `touch _site/.nojekyll` failed with Permission denied, and why this
      # workflow had failed 30 consecutive runs (back to at least 2026-08-07)
      # while the published site sat unchanged.
      - name: Take ownership of the Jekyll output
        run: sudo chown -R "$(id -u):$(id -g)" ./_site

      - name: Generate TypeScript API reference (TypeDoc)
        run: |
          npx --yes typedoc \
            --out ./_site/api \
            --entryPointStrategy expand \
            --readme none \
            --hideGenerator \
            --skipErrorChecking \
            --name "folio-assistant API" \
            schemas/types.ts schemas/constraints.ts schemas/builders.ts \
            schemas/assistant-types.ts schemas/assistant-package.ts \
            schemas/assistant-workflow.ts schemas/formalization-types.ts \
            schemas/lean-packages.ts 2>&1 | tail -20

      # Serve the prebuilt static output as-is (just-the-docs is already rendered;
      # /api is TypeDoc HTML).
      # The harness has no renderer of its own — `folio` is the only renderable
      # graph kind and it belongs to folio-assist-core — so its knowledge graph
      # is published as DATA rather than as a page. Something else may draw it.
      # A non-zero exit means a source could not be read, and a partial graph
      # must not be published as a whole one.
      # Both artefacts are named after the repository (the `stub` in
      # harness.json) and land AT THE BASE, at the URLs their own
      # `@id`/`$id` claim. There is no `kg/` subdirectory: the repository IS
      # its declaration that it holds a graph, and the stub is what separates
      # one instance's renderings from another's in a tree that overlays
      # several.
      #
      # `<stub>/index.html` is the viewer — bean `1dfh`. It carries no data of
      # its own and reads `../<stub>.jsonld` at load, so it is correct at
      # whatever base it is served from. It is a DIRECTORY because Pages
      # resolves an extensionless `<base>/<stub>` only to a directory index.
      #
      # `<stub>.json` is the same bytes as `<stub>.jsonld`. Pages has no media
      # type for `.jsonld` and serves it as octet-stream; `.json` is the only
      # way to get a correct `Content-Type` out of this host at all. The
      # `.jsonld` stays canonical — it is what every `@id` names — so this is
      # an alias, not a rename. See `skills/folio-core/serving-renderings.md`.
      #
      # No --base-url: the declaration's canonicalUrl is correct for main.
      - name: Export the knowledge graph and its schema
        run: |
          STUB=$(bun -e 'const {readDeclaration,artefactStub}=await import("./schemas/cat-harness.ts");console.log(artefactStub(readDeclaration(".")))')
          bun run scripts/kg-export.ts             --out "./_site/${STUB}.jsonld"
          bun run scripts/harness-schema-export.ts --out-dir ./_site
          bun run scripts/kg-viewer.ts             --out "./_site/${STUB}/index.html"
          cp "./_site/${STUB}.jsonld" "./_site/${STUB}.json"

          # THE VOCABULARY — one document per namespace, plus the union.
          #
          # Every term now hangs off its declaring layer's namespace: bs: for
          # bootstrap, cat: for the harness, fac: for core. Each of those is an
          # IRI stem, so each needs a document or `bs:Actor` dereferences to
          # nothing — the very defect this work exists to fix, and splitting
          # one namespace into three created three fresh instances of it. The
          # dead-link walk in `kg-export.test.ts` caught that within a minute
          # of the split, which is what retiring its by-name exemption bought.
          #
          # A namespace document is EXACT — `cat-harness/ns` carries only cat:
          # terms. A document that also defined bs:Actor would be claiming a
          # term in somebody else's namespace.
          #
          # `<base>/ns` stays as the UNION of all three: one place to read the
          # whole vocabulary, which is what a person wants and no single
          # namespace can be.
          #
          # Extensionless because the IRIs are; `.json` alongside because Pages
          # emits no correct Content-Type for `.jsonld`.
          # `ns/` is a DIRECTORY, not a file. `schemas/jsonld.ts` declares the
          # content `@context` at `<base>/ns/content/v1.jsonld`, and a static
          # host cannot serve both a file and a directory at `<base>/ns`.
          #
          # That context has ALSO never been published — `ns/` lives at the
          # repository root and nothing copied it into the site, so the URL
          # every content document names as its `@context` has been dead since
          # it was written. Copied here, which is the eighth instance of the
          # defect bean `blv9` records and the cheapest one to have fixed.
          mkdir -p "./_site/ns/content"
          cp ./ns/content/v1.jsonld "./_site/ns/content/v1.jsonld"
          bun run scripts/ns-export.ts --out "./_site/ns/vocabulary.jsonld"
          cp "./_site/ns/vocabulary.jsonld" "./_site/ns/vocabulary.json"

          for pair in "bootstrap:bootstrap" "harness:cat-harness" "core:folio-assist-core"; do
            LAYER="${pair%%:*}"; DIR="${pair##*:}"
            mkdir -p "./_site/${DIR}"
            bun run scripts/ns-export.ts --layer "$LAYER" --exact --out "./_site/${DIR}/ns.jsonld"
            cp "./_site/${DIR}/ns.jsonld" "./_site/${DIR}/ns"
            cp "./_site/${DIR}/ns.jsonld" "./_site/${DIR}/ns.json"
          done

      # The QA witnesses, published at the path the badges already point at.
      #
      # They are COMMITTED under `test/results/witnesses/` — placement follows
      # provenance, and a witness is a QA process's output, not an authored
      # page. They are SERVED from `/assets/qa/`, which is what every
      # `data-qa-src` in the generated pages says and what `docs-ui.js` fetches.
      # Jekyll only builds `docs/`, so without this copy the panel 404s on
      # every badge — and an empty panel looks exactly like "nothing has been
      # audited", which is the false pass the badges exist to prevent.
      #
      # `-T` so the CONTENTS land in `assets/qa/` rather than a nested
      # `assets/qa/witnesses/`. Mirrored in `feature-staging.yml`; a test
      # asserts both workflows carry it, because missing it in one publishes a
      # site whose evidence links are all dead.
      - name: Publish the QA witnesses and results
        run: |
          mkdir -p ./_site/assets
          cp -rT test/results/witnesses ./_site/assets/qa
          # The RESULTS beside them. `kg-export` writes this during the export
          # step above, so the copy picks up THIS run's findings rather than
          # whatever was last committed. Since bean `2634` the published graph
          # no longer carries them, so this file is the only place a consumer
          # can see what the QA pass found about the document it just fetched.
          find test/results -maxdepth 1 -name '*.qa-results.json' -exec cp {} ./_site/assets/qa/ \;
          echo "Published $(find ./_site/assets/qa -name '*.json' | wc -l) QA document(s)"

      # THE NAVBAR TILES POINT AT FILES THIS BUILD PUBLISHES -- checked, not
      # composed.
      #
      # The knowledge-graph tile's href was `'/kg/' | relative_url` written
      # into `head_custom.html` by hand, and nothing has ever been published
      # at `<base>/kg/`. The only entry point to the viewer anywhere on this
      # site was a 404 from the day it was added, and no test caught it
      # because every test asserted the attribute rather than the target --
      # the same defect that left all twenty-three of the README's chapter
      # PDF links dead. See bean `udx8`.
      #
      # This runs AFTER the export, against the real `_site`, so a tile that
      # outlives the artefact it points at fails the build instead of
      # shipping. Exit 2 ("could not determine" -- no build to check) is a
      # failure here too: at this point in the job there IS a build, so not
      # finding one means something earlier went wrong quietly.
      - name: Check the navbar tiles resolve against the built site
        run: bun run scripts/site-links.ts --site ./_site

      - name: Disable Jekyll on the published branch
        run: touch ./_site/.nojekyll

      # Bean `plj1`. This publish REPLACES the branch's contents — no
      # `keep_files` — and `STAGING/<slug>/` lives on the same branch, so every
      # merge to main silently deleted every open PR's preview. Measured
      # 2026-09-19: `feature-staging.yml` deployed a preview and commented the
      # URL on a PR; this workflow's next run landed ~5 minutes later and
      # `git ls-tree --name-only <that gh-pages commit> | grep -i staging`
      # returned nothing, for every open PR rather than only that one.
      #
      # It is the quiet version of the failure: the staging push SUCCEEDS, the
      # bot comments the URL, the check run is green, and a reviewer clicking
      # the link minutes later gets a 404 with nothing anywhere saying why.
      # AGENTS.md argues at length that a human cannot assess a rendered
      # artefact from a description and that staging is where assessment
      # happens — a URL with a half-life of one main merge undercuts exactly
      # that.
      #
      # `keep_files: true` is the one-line alternative and is NOT taken: it
      # would also stop the main site's own removed pages from ever
      # disappearing, so a renamed doc would linger on the branch
      # indefinitely. Carrying `STAGING/` forward keeps BOTH properties — a
      # deleted main page still goes, a live preview still stands — rather than
      # buying one with the other.
      #
      # This step only ever ADDS to `_site`. It cannot make the publish delete
      # the main site, which is the failure mode that would matter.
      #
      # It narrows the window rather than closing it: a staging deploy landing
      # between this fetch and the publish below is still lost. That residue is
      # the gh-pages push queue, bean `xd1s`, not this.
      - name: Carry the open PRs' STAGING previews across this publish
        run: |
          set -euo pipefail
          if ! git fetch --no-tags --depth=1 origin gh-pages 2>/dev/null; then
            echo "note: no gh-pages branch yet — nothing to carry."
            exit 0
          fi
          if ! git cat-file -e FETCH_HEAD:STAGING 2>/dev/null; then
            echo "note: gh-pages carries no STAGING/ — nothing to carry."
            exit 0
          fi
          mkdir -p ./_site
          git archive FETCH_HEAD STAGING | tar -x -C ./_site
          echo "carried across:"
          find ./_site/STAGING -maxdepth 1 -mindepth 1 -type d -printf '  %f\n' | sort

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          commit_message: 'docs(gh-pages): site from ${{ github.sha }}'
