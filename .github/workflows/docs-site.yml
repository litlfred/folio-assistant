# bpmn: cat-harness/processes/sdlc/docs-site-publish.bpmn
name: Docs site (GitHub Pages)

# Builds and deploys the folio-assistant documentation site to GitHub Pages at
# https://litlfred.github.io/folio-assistant/.
#
# Serving model: the built static site is published to the **gh-pages branch**
# (with .nojekyll so it is served exactly as built). Enable it once under
# Settings → Pages → "Deploy from a branch" → gh-pages → / (root).
#
# Pipeline:
#   1. Regenerate the skill schema reference from JSON Schema (bun).
#   2. Build the Jekyll site under docs/ (just-the-docs via remote_theme).
#   3. Generate the TypeScript API reference with TypeDoc into _site/api/.
#   4. Publish the combined _site to the gh-pages branch
#      (`scripts/publish-gh-pages.sh` — a full replace that re-reads and
#      rebuilds on a lost race rather than rebasing; see `yzsj`).
#
# Generated pages (docs/reference/skills/*) are also committed to the repo so
# they are browsable on GitHub directly; this job keeps the published copy fresh.

on:
  push:
    branches: [main]
    paths:
      - '.github/mount-from-lock.sh'  # replays the remote-mount lock (bean nn8e)
      - 'index.lock.json'
      - 'index.config.json'
      - 'folio-assistant.mount-lock.json'
      - 'cat-harness/docs/**'
      # An instance's own rendered pages are mounted into the site by
      # mount-instance-docs.ts, so a change to them must rebuild it. Without
      # this the pages are committed, gated, and never redeployed.
      - 'who-iris/docs/**'
      - 'who-iris/catalogue/**'
      # A SUBSCRIBED instance's pages are mounted from its materialised tree
      # (`subscribed-trees.ts`, bean `g8jp`), so a re-subscribe or a
      # re-materialise changes the site while touching no instance directory.
      - '*/subscriptions/**'
      # The identifier lookup this workflow publishes (bean `1br0`): the
      # script, its client, and each instance's generated index — a changed
      # index must redeploy, or the search box links to a stale one.
      - 'cat-harness-tools/scripts/**'
      - 'cat-harness-tools/id-lookup/**'
      - '*/id-lookup/**'
      # EVERY script under here, not the handful somebody remembered.
      #
      # This list was eight named scripts, each added with a comment arguing
      # that a change to THAT generator changes the published page while
      # touching nothing under `docs/`. The argument was right every time and
      # the list still drifted: bean `tyyc` derived the set of scripts this
      # workflow actually runs and found **11 of 22 uncovered**, among them
      # `kg-export.ts`, which produces both graph documents the site serves,
      # and `publish-gh-pages.sh`, which performs the deploy.
      #
      # It was measured, not guessed: `40fl` fixed a `kg-export` defect that
      # had kept `docs-site` red for over two hours, merged it to `main`, and
      # NO RUN FIRED. A fix to the publisher did not rebuild what it publishes.
      #
      # A wildcard over-triggers — a change to a script this workflow never
      # runs now rebuilds the site. That is the cheap direction, and it is the
      # same trade `incremental-render` states: over-declaring costs a needless
      # run, under-declaring serves a stale page that looks fresh. `bun run
      # check:workflow-script-paths` holds the line by DERIVING the invoked set
      # rather than trusting this comment.
      - 'cat-harness-tools/scripts/**'
      # The BPMN/DMN sources moved OUT of docs/ into the `kg` graph, where the
      # roles and skills they reference live. The SVGs the site embeds are
      # still rendered from them at deploy time, so without this path a diagram
      # edit would not rebuild the site and the published page would serve a
      # stale render — exactly the "move the wiring with the script" failure.
      - 'cat-harness/processes/**'
      - 'cat-harness/schemas/**'
      - 'cat-harness-tools/schemas/**'
      # The schema viewer is generated, so a change to the generator or to the
      # reader behind it changes the published page while touching nothing
      # under `docs/` — without these paths the site would serve a stale one.
      # Same reasoning for the library viewer, plus the corpus itself: an
      # entry added to `library/` or a file dropped in `uploads/` changes the
      # published counts while touching nothing under `docs/`.
      - 'cat-harness/library/**'
      - 'cat-harness/uploads/**'
      - 'uploads/**'
      - 'cat-harness/content/docs/**'
      # The navbar's locale filter reads `docs/_data/translations.json`, built
      # by this module from the pages' own front matter. A change to how that
      # is derived changes the published navbar while touching nothing under
      # `docs/`, so without this path the site would not rebuild.
      - 'cat-harness-tools/pipeline/translation-index.ts'
      # The DECLARATION decides every `@id` the graph documents mint —
      # `canonicalUrl` is read from it — so a change here changes the published
      # bytes while touching no script. `cat-harness/schemas/**` above covers
      # the schema, never the instance's own config.
      # `<instance>/<name>.json` since #727 reversed the suffix (declarations
      # are `.json`; `.config.json` is now a different file). Written as a
      # wildcard over the instance root rather than the two names, because THIS
      # PATTERN WAS ALREADY WRONG ONCE: it was added as `*.config.json` hours
      # before #727 landed, and would have matched nothing while looking
      # deliberate — the same silent miss `tyyc` is about, inside `tyyc`'s own
      # fix. A suffix that moves twice in a day is not a thing to spell twice.
      - 'cat-harness/*.json'
      - 'bootstrap/*.json'
      # Every file of bootstrap is published as it sits (`publish-instance-files.ts`,
      # bean `iwtn`), so a change to any of them changes the site.
      - 'bootstrap/**'
      - 'bootstrap-tools/**'
      # The IG sites this workflow builds (bean `mftp`): the stager and the
      # page generator, each IG instance's index, menu and pages. Without these
      # an IG re-ingest or a generator fix would not redeploy what it changes.
      - 'fhir-harness/scripts/**'
      - '*/fhir-artifact-index/**'
      # smart-base, smart-trust and smart-immunizations are remote mounts
      # since the cutover (bean hupw): a new pin is an edit to the declaration
      # and its lock, not to a tree here.
      - 'folio-assistant.json'
      - 'folio-assistant.mount-lock.json'
      - '.github/workflows/docs-site.yml'
  workflow_dispatch:
    inputs:
      record_writers:
        # Bean fwtz, option B (owner card 2026-10-31, "rerun and measure"):
        # run every derive:publish writer under strace and publish what each
        # read and wrote (cat-harness-tools `writer-cone.ts`). strace costs a
        # traced script 3-10x (bean 4rbc), so it is a manual run until that
        # cost is measured, never part of a push deploy. It skips nothing.
        description: 'Record what each derive:publish writer reads and writes (slower; skips nothing)'
        type: boolean
        default: false

permissions:
  contents: write  # required to push to the gh-pages branch
  issues: write    # the publication manager's alert (bean vigi): one tracking issue
  actions: read    # bean fwtz: download the newest writer-records artifact for the writers dry run

# A deploy: never cancelled in progress, since a run cancelled mid-build or
# mid-push is a deploy dropped (owner, 2026-10-23). Without cancel-in-progress
# the group still keeps only the NEWEST pending run per ref, so a burst of
# main pushes builds the running one and the latest, not every one.
concurrency:
  group: docs-site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    # bpmn-node: Start_Push
    runs-on: ubuntu-latest
    # A hung step fails in minutes, not at GitHub's 6 h limit (run
    # 38290940471 was cancelled there, 2026-10-13). "Build Jekyll site" has
    # its own, tighter bound below.
    timeout-minutes: 120
    # Serialise on the CONTENDED RESOURCE — `gh-pages` — not on the branch.
    #
    # A concurrency group serialises only the jobs that NAME it, and this one
    # is named by `publish.yml` and by a folio's `blueprint` and `lean_ci` —
    # NOT by `feature-staging`. That job held it once (`eoix`) and dropped it
    # on 2026-09-19, measured: a PENDING job is cancelled when a newer one
    # queues for the same group, so three previews from three branches inside
    # 17 seconds lost two. This comment said until 2026-10-03 that staging was
    # still in the group; it has not been since. The race with staging is
    # handled on both sides instead: `publish-gh-pages.sh` re-reads and
    # rebuilds on a rejected push (PR #297 hit that rejection on 2026-09-18,
    # `cannot lock ref ... is at 0779d88f but expected f885578d`, after a full
    # site build), and since #1956 a staging push waits until this job's
    # commit is ten minutes old (`staging-push-gate.ts`), so a preview cannot
    # cancel the Pages build that publishes the main site.
    #
    # `cancel-in-progress: false` is load-bearing and is the same reasoning as
    # `eoix`: a pending run that a later arrival cancels is a DEPLOY SILENTLY
    # DROPPED, which is worse than the queueing it would save. The
    # workflow-level group above still applies — it scopes the run, this scopes
    # the job — so a superseded PENDING build per ref is still replaced.
    concurrency:
      group: gh-pages-push
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # bootstrap/ and bootstrap-tools/ arrive by remote mount, not as submodules (bean nn8e, #2462):
      # the committed lock pins each to a SHA; .github/mount-from-lock.sh fetches the pinned cat-harness replayer and runs it.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - name: Mount bootstrap and bootstrap-tools from the lock
        shell: bash  # gate-shell.sh is inside cat-harness, which this step mounts
        run: bash .github/mount-from-lock.sh --root .

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Install deps
        run: bun install --frozen-lockfile

      # The site READS the work plan at build time — `gen-docs-pages.ts` writes
      # `assets/beans/index.json` from `beanDefsDir()`, and `state-visualizer`
      # renders the store — so the graph has to be on disk before those steps
      # run. After arc `fs43`'s cutover it is on `cat/cat-harness/beans` and
      # this is what puts it there; inert while nothing is tip-keyed (bean
      # `9ofm`, §4 `site` row).
      #
      # Deliberately NOT paired with a trigger on pushes to the bean branch.
      # That needs more than a path: this job checks out `github.ref`, which
      # for such a push is a branch carrying no code, and the concurrency group
      # is keyed by the same ref. Bean `fwtz` carries it. Note what is and is
      # not a regression: `beans/**` is not in this workflow's path filter
      # today either, so a bean edit does not rebuild the site NOW.
      - name: Mount the subgraphs kept on branches (bean 9c7h)
        # fsh-guts lives on cat/cat-harness/fsh-guts, not on main. Every reader
        # refuses an unmounted copy (exit 2) rather than reading it as empty, and
        # this step exits 1 loudly if the branch cannot be reached.
        run: bun run cat state:mount

      - name: Build the IG artefact indexes (fhir-harness#124)
        # Each IG instance's fhir-artifact-index/ (index, menu, releases),
        # written from the IG's cached AST and its sushi-config.yaml by
        # `ig-index:build` (fhir-harness), before any page step reads it.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun run cat ig-index:build

      - name: Build the mounted IG instances' pages before the QA working copy (bean hupw)
        # The same step code-quality-gates' QA working-copy job runs after the
        # mount. `check:wireframes`, one of qa:refresh's writers, resolves the
        # smart-base/smart-trust/smart-immunizations viewers FROM these pages
        # (`viewer-declarations.ts`); without them the `fhir-artifact-index`
        # wireframe's covers read as undeclared refs, the writer fails, and
        # nothing is published. The publish step below (`smart:pages:publish`)
        # still runs as before; it regenerates these pages and adds the
        # OpenAPI ones.
        run: bun run smart:pages

      # Bean `ieum`, owner 2026-10-07: "security check before release". Runs after
      # the mount (as in code-quality-gates, so fixity sees the same tree) and
      # before anything is built, so a refused gate publishes nothing.
      # `docs-site-publish.bpmn` Task_SecurityGate.
      # Q-SPD-7b (owner card 2026-11-01 16:17Z, option A): the merged PR's
      # `code-quality-gates` run built this copy already, over the same steps.
      # When that run tested THIS tree (its `tested-tree-<tree>` record), its
      # `qa-working-copy` artifact is restored byte-identical to its manifest
      # and the build below is skipped (~8 min). Otherwise it says why and the
      # build runs as before. `.github/scripts/qa-copy-reuse.sh` explains it.
      - name: Reuse the merged PR's QA working copy when it tested this tree (Q-SPD-7b)
        id: qa-reuse
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: bash .github/scripts/qa-copy-reuse.sh

      - name: Produce the QA working copy the security gate reads (bean ieum)
        # `check:qa-reviewer-permission`, one of the gate's blocking checks,
        # READS the derived QA results, which are not committed (bean `5hox`).
        # Without them it fails, and the gate refused every publish from
        # 91d6a0b on (issue #2459). The same step code-quality-gates runs
        # before its gates (bean `72a8`).
        # Q-SPD-7b (owner card 2026-11-01, A): skipped when the step before
        # restored the merged PR's copy of this same tree.
        if: ${{ steps.qa-reuse.outputs.reused != 'true' }}
        run: bun run cat qa:working-copy

      - name: Release security gate
        run: bun run cat security:gate

      - name: Generate the mounted SMART IG instances' pages (bean hupw)
        # smart-base, smart-trust and smart-immunizations are REMOTE MOUNTS of
        # their forks (folio-assistant.json `remoteMounts`, laid down by the
        # state:mount step above). Each fork ignores its generated `docs/` and
        # smart-trust's OpenAPI pages, which folio-assistant's generators write
        # (gen-ig-pages, gen-openapi-pages), so they are built here, at publish,
        # and never committed. The OpenAPI half writes into the mounted
        # `openapi/` directory, which is why it runs only in a publish build:
        # nothing checks the mount after this step.
        run: bun run smart:pages:publish

      # B1 (owner, 2026-10-14): `derive:publish` now also runs every
      # instance's declared `builtAtPublish` writers — the pages no instance
      # commits because they are computed over this index's other instances or
      # from a branch-kept graph. One of them is `render:bpmn` (other instances'
      # diagrams), which draws through Chromium, so the browser is installed
      # before this step rather than only before the later render.
      # PlantUML 1.2026.9 needs Java 21 (its ELK classes are class file 65);
      # ubuntu-latest's PATH java is 17, which broke every publish from
      # 2026-10-30 13:23Z (#2744). The major is read from the plantuml
      # tool-release declaration, so a later bump moves it too.
      - name: Java runtime the PlantUML release declares (#2744)
        uses: ./.github/actions/plantuml-java

      - name: Install Chromium for the publish-time BPMN drawings (B1)
        run: npx --yes playwright install --with-deps chromium

      - name: strace, for the writer records (bean fwtz)
        if: ${{ inputs.record_writers }}
        run: |
          if command -v strace >/dev/null; then strace -V | head -1; exit 0; fi
          sudo apt-get update -qq && sudo apt-get install -y -qq strace && strace -V | head -1

      - name: Build the derived artefacts kept off the commit (bean 0b8c)
        env:
          # Bean fwtz: traced writers and build/writer-cone/records.json, only on a manual run that asks.
          CAT_WRITER_RECORD: ${{ inputs.record_writers && '1' || '' }}
        # A page derived from a branch-kept graph (the fsh-guts viewer) cannot
        # be current in a commit, so it is never committed: one state:push
        # made a committed copy stale on main and every open PR (2026-10-05).
        # check:derived-from names them; this runs each one's declared writer
        # against the mount above, sources before consumers.
        run: bun run cat derive:publish

      # BEAN fwtz, OPTION B, AS A DRY RUN (owner card 2026-10-31, "rerun and
      # measure"). `writer-records.yml`, run after each deploy, uploads what
      # each writer read and wrote (artifact `writer-records`).
      # Against it, `writer-cone-verify.ts` says which writers this build
      # could have skipped, and whether skipping them would have been right:
      # every recorded output must equal what the full run above just wrote.
      # `skip-unsafe` must stay at zero before any writer is skipped. It skips
      # nothing; best effort and bounded, like the page dry run below.
      - name: Writers, rerun and measure, dry run (bean fwtz)
        continue-on-error: true
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          # Everything this step says also goes to a log the stamp step carries
          # into build.json, so a quiet or failed run can be read from gh-pages.
          exec > >(tee "$RUNNER_TEMP/writer-verify.log") 2>&1
          S=cat-harness-tools/scripts/writer-cone-verify.ts
          if [ ! -f "$S" ]; then echo "this tools pin has no $S: no dry run"; exit 0; fi
          # The newest records `writer-records.yml` uploaded after a deploy.
          D="$RUNNER_TEMP/prev-writer-records"; mkdir -p "$D"
          URL=$(gh api "repos/$REPO/actions/artifacts?name=writer-records&per_page=1" --jq '.artifacts[0] | select(.expired == false) | .archive_download_url' 2>/dev/null || true)
          if [ -z "$URL" ] || ! gh api "$URL" > "$D/a.zip" 2>/dev/null || ! unzip -q -o "$D/a.zip" -d "$D"; then
            echo "no writer records recorded yet: nothing to judge"; exit 0
          fi
          P="$D/records.json"
          bun run "$S" --prev "$P" --out "$RUNNER_TEMP/writer-verdicts.json" --summary "$GITHUB_STEP_SUMMARY"

      # WHERE THIS BUILD'S QA EVIDENCE COMES FROM, decided before anything is
      # generated. Bean `tfqf`, reader audit F6 (defects C9, C10).
      #
      # The derived QA corpus is published to the `qa-reports` branch by
      # `code-quality-gates.yml` (`qa:publish`), keyed `main/<sha>`. This reads
      # that entry — or the newest `main` entry as a labelled fallback — into a
      # scratch directory. While `test/results/` is still committed the
      # checkout wins; once it is not (bean `5hox`) the fetched entry is
      # materialised into the checkout so the generator below reads it. With
      # neither, the build says "QA not available for this ref" in the log, in
      # the badges, in the `qa` tile and in `assets/qa/availability.json` —
      # and never publishes a smaller set as if it were the whole.
      #
      # It must run BEFORE the generator: `gen-docs-pages.ts` recreates
      # `witnesses/` itself, and a corpus check made after that finds its own
      # output (the 965 → 2 count, C9).
      - name: Fetch this build's QA evidence from qa-reports
        env:
          SHA: ${{ github.sha }}
        run: |
          bun run cat-harness-tools/scripts/qa-site-assets.ts fetch \
            --ref "main/$SHA" --fallback main \
            --results cat-harness/test/results \
            --state "$RUNNER_TEMP/qa-site-assets.state.json"

      - name: Regenerate skill schema reference
        run: bun run cat-harness-tools/scripts/gen-schema-docs.ts

      - name: Regenerate skill instruction pages
        run: bun run cat-harness-tools/scripts/gen-skill-docs.ts

      # Pages assembled from site-content/<slug>/. Regenerated here for the
      # same reason as the two above: the committed copy is browsable on
      # GitHub, and the published one must never be the stale half of that
      # pair. The --check form is the PR gate (code-quality-gates.yml); this is
      # the deploy-time refresh.
      - name: Regenerate content-backed docs pages
        # `--burndown-history` (bean tk99, owner 2026-10-24 option C): fetch the
        # bean store's history and write `assets/beans/burndown.json`, the
        # board's burn-down feed. Publish only; never committed.
        run: bun run cat-harness-tools/scripts/gen-docs-pages.ts --burndown-history

      # The /qa/ page (docs/qa/index.html) is written by the state visualiser
      # from the QA results this build fetched. It was committed and never
      # regenerated here, so once QA leaves `main` (bean 5hox) it would show a
      # frozen count. Owner ruling 2026-10-01: regenerate it in the build.
      - name: Regenerate the QA state page from this build's results
        run: bun run cat state:visualizer

      # harness.json carries each navbar tile's count, read from the
      # projections the steps above just rewrote — and the beans count is LIVE
      # (open beans on the work-plan tip). So it is build-time data:
      # regenerated here, and `docs:harness:check` compares the committed copy
      # without the counts (folio-assistant#2526: 188 committed, 189 in CI).
      # Owner, 2026-10-10: "regenerate at build".
      - name: Regenerate docs/_data/harness.json with this build's tile counts
        run: bun run cat docs:harness

      # The LSI viewer page's PER-INDEX DETAIL (docs/lsi/index.md), on the same
      # reasoning one step up. Bean `tqjj` splits that page by what each value
      # is a function of: its front matter, prose and verdict table are a
      # function of the tree and stay committed, while each index's size,
      # retained share, dimension poles and findings are a function of the
      # index's CONTENT — which a one-sentence edit to any of 229 skills moves,
      # and which cost 319 of the last 400 commits on `main`. `--detail` adds
      # that half here and nowhere else.
      #
      # It has to be THIS workflow's step. A gate job does not fetch, so
      # `lsi:viz -- --detail` there would read `qa-reports` at `main`, which
      # resolves to the LATEST published entry — a value that depends on when
      # the run happened rather than on the tree, which is bean `in5a`'s loop.
      # The fetch step above pins the entry to THIS build's sha, so the
      # published page is about the commit it ships with.
      - name: Add the LSI viewer page's per-index detail from this build's indexes
        run: bun run cat lsi:viz -- --detail

      # The schema graph's projection and its viewer. Same reasoning as the
      # regenerations above: the committed copy is browsable on GitHub and the
      # PUBLISHED one must never be the stale half of that pair. `schemas/` is
      # a declared graph holding CONTENT, and until this step it was the
      # largest declared subgraph in the instance with no way to look at it
      # (bean `xgd8`).
      - name: Regenerate the schema graph projection and viewer
        run: bun run cat schema:viz

      # The L1 corpus — `library/` entries and the `uploads/` queues feeding
      # them. Same contract as the schema viewer above: the committed copy is
      # browsable on GitHub and the published one must never be its stale
      # half. `library/` is the subgraph every knowledge-graph reference to a
      # source resolves THROUGH, and until this step nobody could look at it
      # (bean `jbx2`).
      # Keywords first: the viewer reads keywords.json, and like the projection
      # they derive from a WHOLE library (one new entry reweights every term),
      # so they are regenerated here rather than gated (issue #2302).
      - name: Regenerate library keywords
        run: bun run cat library:keywords
      - name: Regenerate the library projection and viewer
        run: bun run cat library:viz

      # THE INTAKE QUEUE, as its own harness. Split from the library viewer
      # 2026-09-21: both directories declared the same `coverage.visualiser`,
      # so the uploads tile opened the corpus browser and rendered the
      # library's entry count -- 0 on this instance, while 27 sources waited
      # in the queue beside it.
      #
      # It runs HERE rather than being gated by `code-quality-gates`, for the
      # reason stated against `library:viz:check` in that file: it derives from
      # the whole repository, so a branch alive for a few minutes finds it
      # stale against the merge ref and a red would mean "somebody else
      # merged". Nothing published goes stale, because this step regenerates
      # it from the tree being deployed.
      - name: Regenerate the uploads projection and viewer
        run: bun run cat uploads:viz

      # Every voice its instance declares, with the passage each rule was read
      # from. Same contract as the two viewers above: the committed copy is
      # browsable on GitHub and the published one must never be its stale half.
      #
      # This one carries a claim the others do not. `check-voices.ts` exists
      # because PR #210 shipped ten plausible rules per voice with
      # `source: null`, one asserting the opposite of its source — so every
      # rule now cites a page and a quote, and until this page NONE of those
      # citations was readable without opening JSON (bean `bu2q`).
      - name: Regenerate the voices projection and viewer
        run: bun run cat voices:viz

      # The handler namespace's own index, at `/<handler>/`. It lists what the
      # four generators above publish, so it runs AFTER them — not because it
      # reads their output (it derives from the declarations) but because a
      # reader arriving at the index should not find it describing a kind the
      # build has not written yet.
      - name: Regenerate the handler namespace index
        run: bun run cat handler:index

      # Same reasoning as the three regenerations above: the committed copy is
      # browsable on GitHub and the PUBLISHED one must never be the stale half
      # of that pair. A stale index here is not cosmetic — it is the navbar
      # showing the wrong set of translations to every reader.
      #
      # A non-zero exit fails the deploy on purpose. Publishing a site whose
      # translation set could not be determined would render "could not tell"
      # as "there are none", which is the one thing this pipeline must not do.
      - name: Regenerate the translation index
        run: bun run cat translation:index

      # The BPMN sources under processes/ are the source of truth; the SVGs
      # the workflow pages embed are rendered from them with bpmn-js in headless
      # Chromium, so the published site can never show a stale diagram.
      - name: Render BPMN workflow diagrams
        run: |
          npx --yes playwright install --with-deps chromium
          bun run cat render:bpmn

      # A page per diagram of every mounted instance, after the drawings it
      # embeds exist: see the same step in feature-staging.yml.
      - name: Build a page for every mounted process
        run: bun run cat processes:viz

      # Stamp the build so a reader can tell WHAT IS DEPLOYED from the page
      # itself. Without it the only way to know whether a change is live is to
      # compare rendered behaviour against a guess -- and a stale browser cache
      # is indistinguishable from a deploy that has not run. Written as a data
      # file rather than into _config.yml so the config stays reviewable and
      # the build cannot half-apply.
      - name: Stamp the build sha
        run: |
          mkdir -p cat-harness/docs/_data
          {
            echo "sha: \"${GITHUB_SHA}\""
            # NO `short_sha`, `built_at` or `run_url` (owner, 2026-10-31): the
            # footer rendered them into EVERY page, so every page changed on
            # every deploy and no preview could share main's unchanged files.
            # The footer renders constant and `docs-ui.js` fills it from
            # `build.json`, which "Write the build stamp for client-side
            # readers" below writes with the same facts.
            # Where this commit's CI results appear. The site renders in
            # parallel with CI and does not wait for it (owner, 2026-10-23),
            # so it links to the results instead of stating them.
            echo "checks_url: \"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}/checks\""
          } > cat-harness/docs/_data/build.yml
          cat cat-harness/docs/_data/build.yml

      # Build the Jekyll site from docs/ with Jekyll 4 and the gems in
      # .github/pages-jekyll/Gemfile (jekyll-remote-theme, so just-the-docs works).
      # COMPOSE the documentation tree before Jekyll sees it.
      #
      # Owner's ruling, 2026-09-21 (bean `n0nf`, issue #638): *"there is also
      # docs/ dir in repo root managed by cat-harness. other harness augment or
      # overlay ontop of that"*. `cat-harness/docs/` is the BASE and stays
      # exactly where it is — the compose ruling is what makes moving its 241
      # files unnecessary — and the repository root's `docs/` overlays it.
      #
      # It runs AFTER the build stamp, so `_data/build.yml` is composed in
      # rather than stranded in a directory Jekyll no longer reads.
      #
      # WHY CHANGING `source:` ON THE LIVE PUBLISH PATH IS SAFE: an EMPTY
      # overlay composes byte-identically to the base, proven against the real
      # tree by `compose-docs.test.ts` rather than asserted here. So this is a
      # no-op until somebody deliberately authors a page under `docs/`, and the
      # risk is bounded to that moment instead of to this commit.
      - name: Compose the docs layers
        run: bun run cat-harness-tools/scripts/compose-docs.ts --out ./_docs

      # EACH IG IS BUILT INSIDE THIS SITE (bean `mftp`, owner 2026-10-05:
      # "Build in main site"), so its pages wear this site's chrome — sidebar,
      # search, language selector — rather than a site of their own. Each IG
      # whose instance records its source (`fhir-artifact-index/menu.json`) is
      # cloned at that commit, staged, and composed into `_docs/<instance>/`,
      # its includes and data namespaced per IG. Which IGs is DATA, so this
      # names none. Before the Jekyll build, which is what renders them.
      - name: Compose each IG into the docs source
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          # Retried: Maven Central answers 429 under load, and one unretried
          # 429 failed a whole preview build on 2026-10-05 (#2238).
          curl -sSfL --retry 5 --retry-delay 15 --retry-all-errors -o /tmp/plantuml.jar \
            https://repo1.maven.org/maven2/net/sourceforge/plantuml/plantuml/1.2026.9/plantuml-1.2026.9.jar
          bun run fhir-harness/scripts/stage-ig-sites.ts --work ./_ig --baseurl "/${REPO_NAME}" \
            --plantuml-jar /tmp/plantuml.jar --compose-into ./_docs > ./_ig-list.txt

      # The exact source the next step renders, handed to the SEPARATE
      # undefined-variable check (liquid-undefined.yml; owner, 2026-10-09,
      # bean 8pyz: "CI is in CI not part of render"). continue-on-error: the
      # check can never break or slow this deploy.
      - name: Hand the Jekyll source to the Liquid check
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: jekyll-source
          path: ./_docs
          retention-days: 3

      # Jekyll 4, with the gems in .github/pages-jekyll/Gemfile (owner,
      # 2026-10-15: "jekyll 4 a"). It replaces actions/jekyll-build-pages
      # (github-pages 232, Jekyll 3.10), which re-globbed every `<dir>/*`
      # front-matter scope on every defaults lookup and hung this step to the
      # 6 h limit (#2550's sed worked around that). Measured on the composed
      # docs source: the same 554 pages, hrefs, titles and SEO tags, 18 s
      # against 137 s. It runs as the runner user, so `_site/` needs no chown.
      - uses: ruby/setup-ruby@26e5b7d197ebf60545ee9667bcbace0be11ccaec # v1.334.0
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: ./.github/pages-jekyll

      - name: Build Jekyll site
        # ~3x the healthy 11-15 min, so a hang fails here rather than at 6 h.
        timeout-minutes: 45
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/.github/pages-jekyll/Gemfile
          JEKYLL_ENV: production
        run: bundle exec jekyll build --source ./_docs --destination ./_site

      # An IG's source can repeat an anchor, and the Publisher's output repeats
      # it too. Keep the first copy (where every link already lands), rename
      # the rest, and report each one — per IG, over its composed pages.
      - name: Rename repeated ids on the IG pages
        run: |
          while read -r INSTANCE SRC AT; do
            bun run fhir-harness/scripts/build-ig-site.ts --dedupe-ids "./_site/${INSTANCE}"
          done < ./_ig-list.txt

      # Mount every OTHER instance's rendered content under the built site.
      #
      # Jekyll above builds ONE directory — `cat-harness/docs` — so an instance
      # that publishes its own rendered pages was built by nothing and reachable
      # at no URL. `who-iris/docs/` was in exactly that state: six committed,
      # gated pages that no deployed site served.
      #
      # Owner's addressing rule, 2026-09-20: `<base-url>/<path-to-kind-or-node>`
      # — a harness that instantiates a directory gets a visualiser for it,
      # mounted under that directory's KIND. So `/docs/who-iris/`, and
      # `/library/who-iris/` the day the library visualiser (bean jbx2) lands
      # with a front door of its own. No change here when it does.
      - name: Mount instance-rendered content
        run: bun run cat-harness-tools/scripts/mount-instance-docs.ts --site ./_site --built cat-harness --theme-source ./_docs


      # The inline PDF viewer (bean `folio-assistant-5ea6`): pdf.js, pinned and
      # hash-checked in `pdf-viewer.ts`, installed into the BUILT site and never
      # committed. `--allow` is this repository's own owner on the two hosts its
      # pages link PDFs from; the viewer refuses any other cross-origin `?src=`.
      - name: Install the inline PDF viewer
        env:
          OWNER: ${{ github.repository_owner }}
        run: >-
          bun run cat-harness-tools/scripts/pdf-viewer.ts --site ./_site
          --allow "https://cdn.jsdelivr.net/gh/$OWNER/"
          --allow "https://raw.githubusercontent.com/$OWNER/"

      # WCAG 3.1.1 (Language of Page). Bean `zru7`: the pinned theme emits
      # `<html lang="{{ site.lang | default: 'en-US' }}">` — `site.lang`, not
      # `page.lang` — so all 70 translated pages were served declaring en-US, and
      # `docs-ui.js` repaired `lang` only inside its RTL branch, leaving the 56
      # es/fr/ru/zh pages permanently wrong with JavaScript on or off.
      #
      # A post-build pass rather than a layout override, for the reason
      # `strip-preview-seo.ts` states one file over: the tag lives in the REMOTE
      # theme, so fixing it at the source means vendoring a file the theme pin
      # exists to avoid vendoring. This reads each page's OWN
      # `fa-translation-meta` block and couples to nothing.
      - name: Put each page's own locale on its html element
        run: bun run cat-harness-tools/scripts/set-html-lang.ts --site ./_site

      # The DIRECTORY, not a list of eight files.
      #
      # `schemas/` is a declared graph and every module in it carries a
      # `@graphNode` tag saying whether it is a node — so membership is a
      # property the directory already states, and an entry-point list is a
      # second, hand-maintained answer to it. Measured 2026-09-20: the literal
      # list produced **8** module pages out of **100** modules in the
      # directory (72 of them declared KG nodes); expanding the directory
      # produces **95**, with 0 errors. So 87 modules had no published
      # reference at all, and nothing would ever have reported that — a file
      # added to `schemas/` was silently absent from the API reference, which
      # is the one failure a reader cannot distinguish from "this instance has
      # none".
      #
      # `--entryPointStrategy expand` over a directory is what makes the list
      # unnecessary: it walks what is there. Adding a schema now publishes its
      # reference with no second edit, which is the same rule
      # `check:schema-nodes` enforces for the graph itself.
      - name: Generate TypeScript API reference (TypeDoc)
        uses: ./.github/actions/typedoc-api
        with:
          out: ./_site/api
          name: folio-assistant API

      # Serve the prebuilt static output as-is (just-the-docs is already rendered;
      # /api is TypeDoc HTML).
      # The harness has no renderer of its own — `folio` is the only renderable
      # graph typology and it belongs to folio-assistant-core — so its knowledge graph
      # is published as DATA rather than as a page. Something else may draw it.
      # A non-zero exit means a source could not be read, and a partial graph
      # must not be published as a whole one.
      # Both artefacts are named after the repository (the `stub` in the
      # instance's own declaration -- `cat-harness/cat-harness.json` here)
      # and land AT THE BASE, at the URLs their own
      # `@id`/`$id` claim. There is no `kg/` subdirectory: the repository IS
      # its declaration that it holds a graph, and the stub is what separates
      # one instance's renderings from another's in a tree that overlays
      # several.
      #
      # `<stub>/index.html` is the viewer — bean `1dfh`. It carries no data of
      # its own and reads `../<stub>.jsonld` at load, so it is correct at
      # whatever base it is served from. It is a DIRECTORY because Pages
      # resolves an extensionless `<base>/<stub>` only to a directory index.
      #
      # `<stub>.json` is the same bytes as `<stub>.jsonld`. Pages has no media
      # type for `.jsonld` and serves it as octet-stream; `.json` is the only
      # way to get a correct `Content-Type` out of this host at all. The
      # `.jsonld` stays canonical — it is what every `@id` names — so this is
      # an alias, not a rename. See `skills/ui/ui-core/serving-renderings.md`.
      #
      # No --base-url: the declaration's canonicalUrl is correct for main,
      # and a foreign instance declaring none falls back to it — see
      # `exportIdentity`, which carries that rule and why (bean `40fl`).
      #
      # `check:published-instance-exports` runs the `--instance` commands
      # below from a checkout, so a break in them is visible before a merge
      # rather than only in this workflow's own run (bean `u1iu`).
      #
      # `--scope instance` (the default, said aloud). Which instance publishes
      # what, where, and the one-release tombstones for an `@id` that moved:
      # `instance-publication` §"What each instance publishes" (bean `4ak5`).
      - name: Export the knowledge graph and its schema
        run: |
          # Bean fwtz: when each command of this step started, carried into
          # build.json below, to find which of its ~9 minutes to cut first.
          T="$RUNNER_TEMP/kg-step-times.log"; : > "$T"
          trap 'case "$BASH_COMMAND" in *"bun run"*) printf "%s %s\n" "$(date +%s)" "${BASH_COMMAND:0:160}" >> "$T";; esac' DEBUG
          STUB=$(bun run cat-harness-tools/scripts/print-stub.ts ./cat-harness)
          bun run cat-harness-tools/scripts/kg-export.ts             --scope instance --out "./_site/${STUB}/${STUB}.jsonld"
          bun run cat-harness-tools/scripts/harness-schema-export.ts --out-dir ./_site
          # The viewer at its declared route, `<locale>/<stub>/kg/`, and a
          # forwarding page at `<stub>/` where the site holds none (o7eq).
          bun run cat-harness-tools/scripts/kg-viewer.ts             --site ./_site
          cp "./_site/${STUB}/${STUB}.jsonld" "./_site/${STUB}/${STUB}.json"
          # The host's document sits under its own directory, like every layer's
          # (owner, 2026-10-23, litlfred/cat-harness-tools#603 decision 1b). The old
          # root `<stub>.jsonld` is the one-release tombstone the export writes there,
          # and its `.json` alias forwards with it.
          cp "./_site/${STUB}.jsonld" "./_site/${STUB}.json"

          # bootstrap's OWN graph, as its own document.
          #
          # Not decoration: this instance's graph LINKS INTO it. Bean `pve3`,
          # the owner's ruling of 2026-09-21 ("neither"), removed
          # `bootstrap/skills/` from cat-harness's declared directories, so
          # a Tool here that satisfies a skill there now mints
          # `bootstrap.jsonld#skill/<id>`. Publishing the target is what
          # keeps that an IRI rather than a 404 with an `@id` in front of it,
          # and `kg-export.test.ts` fails if this step is removed.
          #
          # `--instance` builds the GENERIC collectors against that root, never
          # this instance's content under that name — see `buildExport`.
          #
          # TWO publishers wrote a bootstrap graph until bean `dyd3`: this one,
          # at `<base>/bootstrap.jsonld`, and `gen-bootstrap-graph.ts` at
          # `<base>/bootstrap/bootstrap.jsonld`. Measured 2026-09-21: 88 nodes
          # each, 85 of them doc-relative — so 85 subjects under two identities
          # no consumer merges, with only the 3 absolute namespace IRIs shared.
          # A reader got whichever URL they happened to hold.
          #
          # Collapsing the PATHS alone would not have settled it: at one URL the
          # two still disagree on 74 of the 88 nodes, so the site would publish
          # whichever step ran last. One publisher is the fix.
          #
          # The surviving path is `<stub>/<stub>.jsonld` rather than
          # `<stub>.jsonld` because `bootstrap/` already holds that instance's
          # OTHER rendered documents — `ns.jsonld` among them — so the graph
          # belongs beside them rather than one level up.
          # `gen-bootstrap-graph.ts` was removed on 2026-09-30 (owner, bean
          # `xsqm`); since then the one publisher is bootstrap-tools'
          # `export-graph.ts`, below.
          #
          # `.json` alongside for the reason every other rendering here has
          # one: Pages has no media type for `.jsonld` and serves it as
          # octet-stream. The `.jsonld` stays canonical — it is what the `@id`
          # names — so this is an alias, not a rename.
          #
          # WRITTEN BY BOOTSTRAP-TOOLS since 2026-09-30 (owner, bean `xsqm`:
          # "bootstrap.jsonld, should be in bootstrap-tools"): bootstrap's own
          # graph in bootstrap's classes and standard properties, not
          # cat-harness's exporter. Node ids are unchanged, so every
          # `bootstrap.jsonld#skill/<id>` link cat-harness mints still lands.
          BOOT_STUB=$(bun run cat-harness-tools/scripts/print-stub.ts ./bootstrap)
          # The instance's directory comes from the one resolver, `publishedPath`
          # (bean `sthf`): `<name>/`, the NAME naming the directory and the stub
          # naming the document in it. Exit 3 is `"enabled": false`, declared not
          # published; anything else non-zero fails the step.
          if BOOT_DIR=$(bun run cat-harness-tools/scripts/print-published-path.ts ./bootstrap); then
            BOOT_DIR=${BOOT_DIR%/}
          else
            rc=$?; [ "$rc" -eq 3 ] || exit "$rc"
            BOOT_DIR=""
          fi
          SITE="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          if [ -n "$BOOT_DIR" ]; then
            bun run bootstrap-tools/scripts/export-graph.ts --root ./bootstrap --base-url "${SITE}/${BOOT_DIR}/" --provenance --out "./_site/${BOOT_DIR}/${BOOT_STUB}.jsonld"
            cp "./_site/${BOOT_DIR}/${BOOT_STUB}.jsonld" "./_site/${BOOT_DIR}/${BOOT_STUB}.json"
          fi

          # The swimlane glossaries, beside the graphs whose role IRIs they
          # reuse -- bean `lqo9` slice 2, issue #596. PUBLISHED rather than
          # left as a build output because the document IS its own
          # `skos:ConceptScheme`: every concept's `inScheme` names this URL, so
          # an unpublished one would be `blv9` -- a scheme IRI that resolves to
          # nothing, which is the defect `ns-export` exists to have fixed.
          #
          # `.json` alias for the same reason as every document above: Pages
          # serves `.jsonld` as octet-stream. The `.jsonld` stays canonical.

          # EVERY OTHER declared instance's graph, one document each — bean
          # `4ak5` item 1. The set is derived from the declarations by the
          # script, never listed here; the two instances above keep their
          # own steps and are named, with why, in its PUBLISHED_ELSEWHERE.
          # `check:published-instance-exports` runs the same plan, and fails if
          # any declared instance is published by neither.
          bun run cat-harness-tools/scripts/instance-exports.ts --out-dir ./_site

          bun run cat-harness-tools/scripts/glossary-export.ts --out "./_site/${STUB}/${STUB}-glossary.jsonld"
          cp "./_site/${STUB}/${STUB}-glossary.jsonld" "./_site/${STUB}/${STUB}-glossary.json"
          cp "./_site/${STUB}-glossary.jsonld" "./_site/${STUB}-glossary.json"
          if [ -n "$BOOT_DIR" ]; then
            bun run cat-harness-tools/scripts/glossary-export.ts --instance ./bootstrap --out "./_site/${BOOT_DIR}/${BOOT_STUB}-glossary.jsonld"
          fi

          # The graph once per locale -- bean `jmpb`, on the owner's ruling.
          # Writes NOTHING today and says so: measured 2026-09-22, no locale
          # carries a catalogue applying to either graph. It is wired now
          # rather than later so the first diagram `.po` to land publishes its
          # locale with no workflow edit, and so the gates and the deploy run
          # the same command. Each document's node `@id`s are the core's --
          # a translation is not a new term.
          # `--core`: the document kg-export wrote above, read rather than built a
          # second time (bean fwtz: 19 s of this step on main). An older tools
          # pin ignores the flag and builds it, as before.
          bun run cat-harness-tools/scripts/kg-locale-export.ts --core "./_site/${STUB}/${STUB}.jsonld" --out-dir "./_site/${STUB}"
          if [ -n "$BOOT_DIR" ]; then
            bun run cat-harness-tools/scripts/kg-locale-export.ts --instance ./bootstrap --out-dir "./_site/${BOOT_DIR}"
            cp "./_site/${BOOT_DIR}/${BOOT_STUB}-glossary.jsonld" "./_site/${BOOT_DIR}/${BOOT_STUB}-glossary.json"
          fi

          # bootstrap's OWN files, as they sit, with each `.md` also rendered
          # as `.html` -- bean `iwtn`, ruling 3. bootstrap renders nothing, so
          # its `renderExemption.reachableAt` names its own `README.md`, and
          # the navbar tab links to `<base>/bootstrap/README.html`. LAST, and
          # it never overwrites: the graph's `.json` copy above has the same
          # name as bootstrap's declaration, and the graph keeps that address.
          # `--allow-collision bootstrap.json`: the graph's `.json` copy and bootstrap's
          # declaration share that address, and the graph keeps it (bootstrap-graph-publication).
          # Any OTHER different file at a taken address fails this step.
          if [ -n "$BOOT_DIR" ]; then
            bun run cat-harness-tools/scripts/publish-instance-files.ts --instance ./bootstrap --out "./_site/${BOOT_DIR}" --allow-collision bootstrap.json
          fi
          # bootstrap's diagram vocabulary at its extensionless address, which is
          # the XML namespace its diagrams bind (bean `12s9` stage 2), plus the
          # `.json` copy every rendering here carries for Pages.
          if [ -n "$BOOT_DIR" ]; then
            cp "./_site/${BOOT_DIR}/processes/ns.jsonld" "./_site/${BOOT_DIR}/processes/ns"
            cp "./_site/${BOOT_DIR}/processes/ns.jsonld" "./_site/${BOOT_DIR}/processes/ns.json"
          fi
          # cat-harness's diagram vocabulary likewise (bean `12s9` stage 3). Its
          # processes are not otherwise published, so it is copied from source.
          mkdir -p "./_site/${STUB}/processes"
          for f in ns ns.jsonld ns.json; do cp ./cat-harness/processes/ns.jsonld "./_site/${STUB}/processes/$f"; done

          # The identifier lookup (bean `1br0`, issue #1972 step 3): its client page
          # and each instance's generated index, copied into the built tree before
          # rail-standalone-pages so it receives the rail.
          bun run cat-harness-tools/scripts/publish-id-lookup.ts --site ./_site

          # THE HARNESS RAIL ON EVERY STANDALONE PAGE — bean `oi1y`, and it is
          # here, after the line above, for a reason that cost a wrong claim.
          #
          # A page Jekyll copies through verbatim inherits no layout and so no
          # sidebar. `mount-instance-docs.ts` rails the MOUNT ROUTES, and
          # `viewer-page.ts` rails what the generators emit; everything else
          # fell between them — 23 wireframe `as-is.html` pages with no
          # navigation and no outward link at all, and bootstrap's 10.
          #
          # The first version called this from `mount-instance-docs.ts`, 142
          # lines above, where bootstrap's pages DO NOT YET EXIST. It railed the
          # wireframes (committed) and silently missed bootstrap (generated),
          # and no unit test could see it because a fixture hands the pass a
          # finished directory. Caught by counting the staged build.
          #
          # So: LAST, after every generator that writes a page. It is
          # idempotent — `injectRail` refuses a page that already has one — so
          # anything railed earlier is left byte-identical.
          #
          # `--theme-source ./_docs`: ONE RAIL ON EVERY PAGE (owner, 2026-10-15,
          # "folio rail everywhere", option A). The theme's own pages are railed
          # too, their side bar replaced, and every page gets the site's Pages
          # and the same top bar. A tools pin without the flag ignores it.
          bun run cat-harness-tools/scripts/rail-standalone-pages.ts --site ./_site --built cat-harness --theme-source ./_docs

          # THE TRASHCAN, reachable BY NAME and by nothing else.
          #
          # The export above STRIPS `fsh-guts` from every graph it publishes,
          # so nothing in `<stub>.jsonld` links here. Why it is a second
          # document: `instance-publication` §"What each instance publishes".
          #
          # `fsh-guts/logs/` sits inside the tree it walks and is NOT in it.
          # The exporter admits a file only if it declares
          # `folio-fsh-guts/v1`, so a log entry is excluded by what it says
          # it is — not by the gitignore, which is a property of the checkout
          # rather than of the export.
          #
          # `.json` alongside for the same reason every other rendering has
          # one: Pages has no media type for `.jsonld` and serves it as
          # octet-stream.
          bun run cat-harness-tools/scripts/fsh-guts-export.ts --out "./_site/fsh-guts.jsonld"
          cp "./_site/fsh-guts.jsonld" "./_site/fsh-guts.json"

          # THE VOCABULARY — one document per namespace, plus the union.
          #
          # Every term now hangs off its declaring layer's namespace: bs: for
          # bootstrap, cat: for the harness, fac: for core. Each of those is an
          # IRI stem, so each needs a document or `bs:Actor` dereferences to
          # nothing — the very defect this work exists to fix, and splitting
          # one namespace into three created three fresh instances of it. The
          # dead-link walk in `kg-export.test.ts` caught that within a minute
          # of the split, which is what retiring its by-name exemption bought.
          #
          # A namespace document is EXACT — `cat-harness/ns` carries only cat:
          # terms. A document that also defined bs:Actor would be claiming a
          # term in somebody else's namespace.
          #
          # `<base>/ns` stays as the UNION of all three: one place to read the
          # whole vocabulary, which is what a person wants and no single
          # namespace can be.
          #
          # NO extensionless `<stub>/ns` here any more (owner, 2026-10-15,
          # bean folio-assistant-63q4). The term IRIs moved to each instance's
          # own iriBase (`https://litlfred.github.io/<stub>/<version>/ns#`,
          # cat-harness/schemas/namespaces.ts), served by that instance's own
          # Pages, so nothing names `<this site>/<stub>/ns` (measured: the
          # kg-export dead-link walk passes without it). (It was also a clash
          # until owner D1, 2026-10-15: bootstrap's context then sat at
          # `ns/context/v1.jsonld`, so publish-instance-files made `<stub>/ns/`
          # a DIRECTORY. A layer whose ns is a document now publishes its
          # context beside it, `ns.context.v1.jsonld`.)
          # `.jsonld` and `.json` stay as downloads; `.json` because Pages
          # emits no correct Content-Type for `.jsonld`.
          # `ns/` is a DIRECTORY, not a file. `cat-harness/schemas/jsonld.ts` declares the
          # content `@context` at `<base>/ns/content/v1.jsonld`, and a static
          # host cannot serve both a file and a directory at `<base>/ns`.
          #
          # That context has ALSO never been published — `ns/` lives at the
          # repository root and nothing copied it into the site, so the URL
          # every content document names as its `@context` has been dead since
          # it was written. Copied here, which is the eighth instance of the
          # defect bean `blv9` records and the cheapest one to have fixed.
          mkdir -p "./_site/ns/content"
          cp ./cat-harness/ns/content/v1.jsonld "./_site/ns/content/v1.jsonld"
          # The named-subgraph context (bean `c1m4`): every
          # `docs/subgraph/**/index*.jsonld` names it by URL rather than inlining it.
          mkdir -p "./_site/ns/subgraph"
          cp ./cat-harness/ns/subgraph/v1.jsonld "./_site/ns/subgraph/v1.jsonld"
          # Content-addressed payloads (bean `f233`): `<BASE_URL>/payload/sha256/<hex>`
          # plus each `<hex>.json` sidecar. Copied VERBATIM, never through Jekyll
          # (excluded in _config.yml): a rendered body would not hash to its name.
          mkdir -p "./_site/payload"
          cp -R ./cat-harness/docs/payload/. "./_site/payload/"
          # The SQLite slices (bean `q8ar`), one line each, built from the tree
          # being deployed rather than committed, because their sources move
          # on most merges (every session writes `beans/`). The deploy payloads
          # (bean files, todo files, published library entries) are
          # content-addressed in the same `payload/sha256/` namespace, added
          # here and never to the committed `docs/payload/`, whose orphan audit
          # admits KG nodes only. The `kg` slice writes none: it points at the
          # committed KG payloads copied just above. Each run also rewrites
          # `assets/slices/index.json`, which lists every slice built so far.
          # Searched at `slices/search.html?slice=<name>`.
          # The database is CONTENT-ADDRESSED, `<slice>.<sha256>.sqlite3`, and
          # the fixed `<slice>.sqlite3.json` manifest names it (bean `wixl`), so
          # a CDN cannot pair a fresh manifest with stale bytes. Old builds do
          # not pile up: each run writes only the current file, this deploy is a FULL REPLACE of
          # `gh-pages` (`publish-gh-pages.sh`, `rm -r '*'` over the branch), and
          # the STAGING/ previews it carries forward are restored as they were.
          # A CDN may still hold, for one TTL (Pages: max-age=600), a stale
          # manifest and the older file it names -- a self-consistent pair --
          # or a stale manifest whose file is gone, which the page reports.
          bun run cat-harness-tools/scripts/gen-slice-sqlite.ts --out ./_site/assets/slices --payload-out ./_site/payload/sha256 --slice beans
          bun run cat-harness-tools/scripts/gen-slice-sqlite.ts --out ./_site/assets/slices --payload-out ./_site/payload/sha256 --slice todos
          bun run cat-harness-tools/scripts/gen-slice-sqlite.ts --out ./_site/assets/slices --payload-out ./_site/payload/sha256 --slice library
          bun run cat-harness-tools/scripts/gen-slice-sqlite.ts --out ./_site/assets/slices --payload-out ./_site/payload/sha256 --slice kg
          # Each harness's setup position and health (bean `supn`; owner, 2026-10-24,
          # "Work out at publish time"): bootstrap's setup check, offline and
          # dry-run, one `<harness>.json` per harness plus `index.json`. Built
          # from the tree being deployed and never committed.
          bun run cat harness:state --out ./_site/assets/harnesses
          # No all-layers union here any more (owner, 2026-09-30: "Retire it"):
          # each term is defined by its layer's own document, below, and the
          # Glossary publishes SKOS for every scheme. bootstrap's document is
          # bootstrap's own, written by bootstrap-tools and committed, so it is
          # copied rather than rebuilt by a harness exporter.
          mkdir -p "./_site/bootstrap"
          for ext in "ns.jsonld" "ns.json"; do cp ./bootstrap/ns.jsonld "./_site/bootstrap/${ext}"; done

          for pair in "harness:cat-harness" "core:folio-assistant-core"; do
            LAYER="${pair%%:*}"; DIR="${pair##*:}"
            mkdir -p "./_site/${DIR}"
            bun run cat-harness-tools/scripts/ns-export.ts --layer "$LAYER" --exact --out "./_site/${DIR}/ns.jsonld"
            cp "./_site/${DIR}/ns.jsonld" "./_site/${DIR}/ns.json"
          done

          # The ROOT INDEX (bean `4ak5` item 3): `<site>/index.jsonld` and its
          # `.json` alias name every declared instance at depth 1 — its export,
          # where this site serves it, its directories and graph typologies, its
          # dependencies, its subgraph root, and a node count and digest of
          # the document. LAST in this step because it reads what the lines
          # above wrote, and it exits 1 on any instance whose export is not
          # there rather than publishing a shorter map. Built here and never
          # committed: `instance-publication` §"What each instance publishes".
          bun run cat-harness-tools/scripts/root-index.ts --site ./_site
          trap - DEBUG
          printf "%s end\n" "$(date +%s)" >> "$T"
          # The stamp step writes build.json later and merges these times into it.

      # Every `maintains` claim, checked where the answer exists.
      #
      # A Tool's `maintains` asserts it is authoritative for a PUBLISHED artefact.
      # `kg:schema:check` reconciles only the claims whose Tool invokes the schema
      # exporter — it cannot see inside `_site/`, and a check that answers a
      # question it cannot see is worse than one that declines to. So the rest were
      # unchecked, and an unchecked claim that rots is a 404 a reader follows.
      # Bean `6f1x`.
      #
      # Here, after assembly, the tree exists. An unbuilt tree exits 2
      # (could-not-determine) rather than passing, which is the state that matters:
      # this workflow failed all 30 runs over two months once, and a check that is
      # green where nobody built the site is how that stays invisible.
      #
      # Invoked by its DECLARED SCRIPT NAME rather than by its path, and that is
      # load-bearing rather than tidy: `commandRunsScript` matches a script name
      # at a token boundary, so a workflow that spells out the path runs the
      # check while `unrunScripts` reports it as run by nothing — a gate that
      # cannot fail, which is bean `ot9a` exactly. Found by that ratchet on its
      # first encounter with this step.
      - name: Every maintained artefact is in the published tree
        id: artefacts
        # Reported, not blocking: the site deploys whatever this says (owner,
        # 2026-10-23); `Judge the built-site checks` fails the run after the push.
        continue-on-error: true
        run: bun run cat check:maintained-artefacts ./_site

      # No page carries a block-level tag as escaped TEXT.
      #
      # Here for the same reason as the step above — it needs the assembled tree —
      # and by the same convention, invoked by its DECLARED SCRIPT NAME so
      # `unrunScripts` can see it running.
      #
      # It exists because the whole source-level gate wall passed over a published
      # landing page whose stickies were not elements. `landing.html` built its
      # `<article>` tag across several lines and one `{% endif -%}` right-stripped
      # the newline before the next attribute, so the tag emitted as
      # `…--fa-text-scale:0.74;"aria-labelledby=…`. That is unparseable, `index.md`
      # is markdown, and Kramdown escaped the entire block: 3 escaped `<article>`
      # tags, 0 real. The template was valid HTML the whole time, which is exactly
      # why nothing readable from a checkout could catch it — only the built page
      # shows what the markdown converter did.
      - name: No escaped block-level markup in the published tree
        id: escaped
        # Reported, not blocking: the site deploys whatever this says (owner,
        # 2026-10-23); `Judge the built-site checks` fails the run after the push.
        continue-on-error: true
        run: bun run cat check:escaped-markup ./_site

      # The QA witnesses, published at the path the badges already point at.
      #
      # They are COMMITTED under `test/results/witnesses/` — placement follows
      # provenance, and a witness is a QA process's output, not an authored
      # page. They are SERVED from `/assets/qa/`, which is what every
      # `data-qa-src` in the generated pages says and what `docs-ui.js` fetches.
      # Jekyll only builds `docs/`, so without this copy the panel 404s on
      # every badge — and an empty panel looks exactly like "nothing has been
      # audited", which is the false pass the badges exist to prevent.
      #
      # `-T` so the CONTENTS land in `assets/qa/` rather than a nested
      # `assets/qa/witnesses/`. Mirrored in `feature-staging.yml`; a test
      # asserts both workflows carry it, because missing it in one publishes a
      # site whose evidence links are all dead.
      #
      # The copy is then JUDGED (bean `tfqf`, C10): `qa-site-assets.ts verify`
      # counts what landed against what the source held when the build
      # started, fails the step on a shortfall, and publishes
      # `assets/qa/availability.json` naming the source. A silent shrink was
      # the defect — this step used to print a smaller count and stay green.
      - name: Publish the QA witnesses and results
        id: qa_assets
        # Reported, not blocking: the site deploys whatever this says (owner,
        # 2026-10-23); `Judge the built-site checks` fails the run after the push.
        continue-on-error: true
        run: |
          mkdir -p ./_site/assets/qa
          # Guarded: with no corpus and nothing generated there is no
          # directory, and `verify` below — not a `cp` error — says what that
          # means.
          if [ -d cat-harness/test/results/witnesses ]; then
            cp -rT cat-harness/test/results/witnesses ./_site/assets/qa
          fi
          # Every OTHER instance's witness tree too: `gen-docs-pages.ts` renders
          # the docs source every mounted instance declares (owner, 2026-10-23,
          # "A1"), and each instance's pages keep their projections under its
          # OWN `test/results/witnesses/`. Their badges fetch them from
          # `/assets/qa/<instance>/<slug>/` — qualified by instance, so the same
          # page in two layers is two witness directories and nothing collides.
          for w in */test/results/witnesses; do
            if [ -d "$w" ] && [ "$w" != cat-harness/test/results/witnesses ]; then
              mkdir -p "./_site/assets/qa/${w%%/*}"
              cp -rT "$w" "./_site/assets/qa/${w%%/*}"
            fi
          done
          # The RESULTS beside them. `kg-export` writes this during the export
          # step above, so the copy picks up THIS run's findings rather than
          # whatever was last committed. Since bean `2634` the published graph
          # no longer carries them, so this file is the only place a consumer
          # can see what the QA pass found about the document it just fetched.
          if [ -d cat-harness/test/results ]; then
            find cat-harness/test/results -maxdepth 1 -name '*.qa-results.json' -exec cp {} ./_site/assets/qa/ \;
          fi
          bun run cat-harness-tools/scripts/qa-site-assets.ts verify \
            --site ./_site --results cat-harness/test/results \
            --state "$RUNNER_TEMP/qa-site-assets.state.json"
          # The panels' links to each result file, judged on what was BUILT
          # (bean `bejf`, #2217): every projection carries `sidecarLinks`, and
          # none addresses a stored result on `main`. Mirrored in
          # `feature-staging.yml`.
          bun run cat check:qa-result-links --site ./_site

      # THE NAVBAR TILES POINT AT FILES THIS BUILD PUBLISHES -- checked, not
      # composed.
      #
      # The knowledge-graph tile's href was `'/kg/' | relative_url` written
      # into `head_custom.html` by hand, and nothing has ever been published
      # at `<base>/kg/`. The only entry point to the viewer anywhere on this
      # site was a 404 from the day it was added, and no test caught it
      # because every test asserted the attribute rather than the target --
      # the same defect that left all twenty-three of the README's chapter
      # PDF links dead. See bean `udx8`.
      #
      # This runs AFTER the export, against the real `_site`, so a tile that
      # outlives the artefact it points at fails the build instead of
      # shipping. Exit 2 ("could not determine" -- no build to check) is a
      # failure here too: at this point in the job there IS a build, so not
      # finding one means something earlier went wrong quietly.
      - name: Check the navbar tiles resolve against the built site
        id: tiles
        # Reported, not blocking: the site deploys whatever this says (owner,
        # 2026-10-23); `Judge the built-site checks` fails the run after the push.
        continue-on-error: true
        run: bun run cat-harness-tools/scripts/site-links.ts --root ./cat-harness --site ./_site

      # One search index per scope — each instance, each target locale, the
      # platform — cut from the index Jekyll just wrote, plus the manifest a
      # page reads to load only its own (issue #1972, bean `m7mn`). Before the
      # verify step, whose `search-scopes` verifier checks the split matches
      # THIS index and partitions it exactly.
      - name: Split the search index per scope
        run: bun run cat-harness-tools/scripts/search-split.ts --dir ./_site

      # VERIFY BEFORE DEPLOYING — bean `vigi`, owner 2026-09-23:
      # "a set of post processing tools for verification that a failure
      # triggers an alert to the publisher manager ... before deployment".
      # `processes/publish-verification.bpmn`. The verifier set runs over the
      # built tree; exit 1 (a finding) and exit 2 (could not tell) are both
      # failures.
      #
      # It no longer STOPS the deploy. Owner, 2026-10-23: "gh-pages rendering
      # is parallel NOT DEPENDENDT on CI. gh-pages should render wether all CI
      # succeeeds or not." So every built-site check in this job is
      # `continue-on-error`, the site deploys, and `Judge the built-site
      # checks` after the push turns any failure back into a red run — which
      # is what still reaches the publication manager's alert. The precedent
      # is the Liquid check (bean `8pyz`, "CI is in CI not part of render").
      - name: Verify the export before deploying
        id: verify
        continue-on-error: true
        run: bun run cat-harness-tools/scripts/publish-verify.ts --dir ./_site --report "$RUNNER_TEMP/publish-verify.md"

      # EVERY LINK, against the tree that ships (fa#2741). The tiles check
      # above reads the navbar only; a link check of the published site found
      # 262 missing targets nobody had been told about. `--fix` first repoints
      # the two kinds with one right answer: a missing translation goes to the
      # untranslated page or diagram, and a source file the site does not
      # publish goes to that file on GitHub at the pinned commit. The rest is
      # reported in the step summary. It is NOT judged below yet: about a
      # hundred dead links remain to fix by hand, and judging it now would turn
      # every publish red and open a publication-manager alert each time. It
      # joins the judged checks once the count reaches zero.
      - name: Repoint and check every link in the built site
        id: dead_links
        continue-on-error: true
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          set -o pipefail
          bun run cat-harness-tools/scripts/site-dead-links.ts --site ./_site --root . --fix \
            --base-path "/$REPO_NAME" --repo "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA" \
            --report "$RUNNER_TEMP/dead-links.tsv" | tee -a "$GITHUB_STEP_SUMMARY"

      # MINIFY LAST, and it is a POST-BUILD PASS rather than a Jekyll plugin
      # on purpose. CI builds with `bundle exec jekyll build` and the gem set
      # in .github/pages-jekyll/Gemfile; `jekyll-minifier` would add a gem to
      # that set for a job this tree's post-processing already does, and the
      # `remote_theme` that `_config.yml` lines 10-45 argue must only move
      # through `upstream-version-adoption` stays pinned there. Nothing has to
      # move: this job already post-processes the emitted tree
      # (`set-html-lang`, `rail-standalone-pages`), so one more pass over
      # `_site` couples to no gem, no theme file and no config.
      #
      # It runs AFTER every check and rewrite above, and the ordering is the
      # correctness argument rather than tidiness: `check:escaped-markup`,
      # `check:maintained-artefacts`, `site-links` and `publish-verify` all
      # read this HTML, and `staging-banner`/`folio-mount` decide whether a
      # marker is live by asking whether it sits inside a COMMENT (bean
      # `ur84`). Minifying before any of them would silently change what they
      # judge. Measured on the published main site: 9.4% of its 614 MiB of
      # HTML is comments, 10.3% once the unrendered inter-tag whitespace goes,
      # and ~22% of gzipped transfer.
      #
      # Mirrored in `feature-staging.yml`, which `check:invocation-parity`
      # requires -- a preview must carry the deploy's passes or it is not a
      # preview of what ships.
      - name: Minify the built pages
        run: bun run cat-harness-tools/scripts/minify-site.ts --site ./_site

      - name: Disable Jekyll on the published branch
        run: touch ./_site/.nojekyll

      # ONE file carries the build's moment, read by the work-plan dashboard
      # at load time to say "generated … · N commits behind main". Not a page
      # and not committed: `_data/build.yml` already varies per run for the
      # footer, and this is the same three facts as JSON for a page Jekyll
      # never renders (the generated visualisers are copied verbatim).
      #
      # `mounts` records the tip of each branch-mounted subgraph this build
      # read (`state:mount`'s markers), so the NEXT deploy can say what moved
      # since this one: a bean edit is an input to the dependency cone like a
      # code change (bean `fwtz`, option C). No marker readable records `{}`,
      # which the cone reads as "unknown", never as "nothing moved".
      - name: Write the build stamp for client-side readers
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CHECKS_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}/checks
        run: |
          MARKERS=$(git rev-parse --path-format=absolute --git-path branch-mounts)
          MOUNTS=$(jq -n '[inputs | select(.id and .tip) | {(.id): .tip}] | add // {}' "$MARKERS"/*.json 2>/dev/null) || MOUNTS='{}'
          jq -n --arg sha "$GITHUB_SHA" --arg built "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg runUrl "$RUN_URL" --arg checksUrl "$CHECKS_URL" \
            --argjson mounts "$MOUNTS" '{sha: $sha, built: $built, runUrl: $runUrl, checksUrl: $checksUrl, mounts: $mounts}' > ./_site/build.json
          # Bean fwtz: the writers' dry-run verdicts ride in the stamp, so they
          # can be read from gh-pages (build.json is rewritten every deploy and
          # the page dry run already expects it to move).
          if [ -f "$RUNNER_TEMP/writer-verdicts.json" ]; then
            jq --slurpfile v "$RUNNER_TEMP/writer-verdicts.json" '. + {writerVerdicts: $v[0]}' ./_site/build.json > "$RUNNER_TEMP/build.json" && mv "$RUNNER_TEMP/build.json" ./_site/build.json
          fi
          if [ -f "$RUNNER_TEMP/writer-verify.log" ]; then
            jq --rawfile l "$RUNNER_TEMP/writer-verify.log" '. + {writerVerifyLog: ($l | split("\n") | .[-60:])}' ./_site/build.json > "$RUNNER_TEMP/build.json" && mv "$RUNNER_TEMP/build.json" ./_site/build.json
          fi
          if [ -f "$RUNNER_TEMP/kg-step-times.log" ]; then
            jq --rawfile l "$RUNNER_TEMP/kg-step-times.log" '. + {kgStepTimes: ($l | split("\n") | map(select(. != "")))}' ./_site/build.json > "$RUNNER_TEMP/build.json" && mv "$RUNNER_TEMP/build.json" ./_site/build.json
          fi
          cat ./_site/build.json
          # Bean fwtz: the writer records sit beside the stamp, so the NEXT
          # deploy can ask which writers' reads moved since this one.
          if [ -f build/writer-cone/records.json ]; then
            mkdir -p ./_site/writer-cone && cp build/writer-cone/records.json ./_site/writer-cone/records.json
            jq -r '"writer records: \(.writers | length) recorded, \(.unrecorded | length) not"' ./_site/writer-cone/records.json
          fi

      # CARRY THE OPEN PRs' REVIEW PREVIEWS ACROSS THIS DEPLOY — bean `plj1`.
      #
      # The publish step below is a FULL REPLACE: `peaceiris/actions-gh-pages`
      # with `keep_files` unset clones `gh-pages`, runs
      # `git rm -r --ignore-unmatch '*'` over the whole branch and copies
      # `publish_dir` in (its `src/git-utils.ts`, `setRepo`). This is the only
      # one of the repository's six `gh-pages` publishers without
      # `keep_files: true`, and it is the one that fires on every push to
      # `main` — so it deleted every `STAGING/<slug>/` preview, for every open
      # PR, on every deploy. Measured on the real branch 2026-09-19: three
      # `docs(gh-pages)` commits, 1/3/1 previews on their parents, zero after.
      #
      # It is SILENT — the staging push succeeds, the bot comments the URL, the
      # check run is green, and an unrelated merge removes the artefact minutes
      # later. `AGENTS.md`'s merge discipline turns on staging being where a
      # human assesses a rendered artefact, so a preview with a half-life of one
      # main merge undercuts exactly that argument.
      #
      # `keep_files: true` is NOT the fix. It is not path-scoped, and the action
      # offers nothing that is (`keep_files`, `force_orphan`, `exclude_assets` —
      # and `exclude_assets` filters the SOURCE, not the branch). So it would
      # also stop the main site's own DELETED pages from ever disappearing:
      # rename a doc and both URLs serve forever.
      #
      # THE OTHER END OF THIS TRADEOFF IS `feature-staging.yml`, and the two
      # comments are one argument seen from its two sides. Staging carried
      # `keep_files: true` to survive the deletion this file records — and paid
      # for it in exactly the way predicted above: its previews could never show
      # a REMOVAL, only an addition (bean `85im`, five stale `proposals/*.html`
      # served after main relocated them). Neither end is fixable with a flag.
      # Both are now fixed the same way and for the same reason: each deploy
      # names the paths it owns. This one restores the previews into `_site` so
      # a full replace does not touch them; that one deletes and rewrites its
      # OWN `STAGING/<slug>/` and no other. If you change either, read both. Restoring the previews into
      # `_site` keeps both halves — the main site stays a full replace, the
      # previews are part of what is published.
      #
      # LAST STEP BEFORE THE PUSH, deliberately: the action re-clones `gh-pages`
      # itself, so everything between this read and that clone is a window in
      # which a `feature-staging` deploy could land a preview this push then
      # removes. Seconds, against the whole of every deploy before this change —
      # and the verify step below is what stops a loss inside it being silent.
      #
      # Exit 2 means the branch COULD NOT BE READ, and it fails the job on
      # purpose. "Could not read `gh-pages`" must never be published as "there
      # are no previews to keep" — the same rule the translation index follows
      # two steps up.
      #
      # `--state` lands at the workspace root, NOT under `_site`: it is job
      # state that the verify step reads back, not a page, and writing it into
      # the publish directory would serve it at the site root.
      # THE RESTORE NOW RUNS INSIDE THE PUBLISH, ONCE PER ATTEMPT — which is
      # what closes the window the paragraph above describes. `peaceiris` is
      # gone: it clones, replaces and pushes in ONE step, so the race window
      # was inside the action and there was nothing to wrap, and `docs-site`
      # had no retry at all. It lost a push on `main` at 19:53 on 2026-09-20
      # (run 308) and self-healed on the next merge, which is why it stayed
      # invisible. Bean `yzsj`, issue #605 half (a).
      #
      # A REBASE WOULD HAVE BEEN THE WRONG RETRY, and this is the part worth
      # keeping. `feature-staging` rebases correctly because its commit touches
      # one `STAGING/<slug>/`. This commit replaces the WHOLE TREE, so
      # replaying it onto a newer `gh-pages` would re-apply that replacement
      # over whatever landed in between — `plj1` again, re-created by the
      # safety mechanism. So each attempt RE-READS the branch and REBUILDS:
      # fetch, reset, restore against the current contents, lay `_site` down,
      # commit, push.
      - name: Check out the publish branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: gh-pages
          path: pages
          persist-credentials: true

      # THE DEPENDENCY-CONE DEPLOY, AS A DRY RUN — bean `fwtz`, option C
      # (owner, 2026-10-23). A full run takes over 20 minutes; a cone-only
      # refresh about 2. Before anything is skipped, this measures whether the
      # cone would have been right: it computes the cone from the commit the
      # LIVE site was built from (`pages/build.json`, not the previous push —
      # a cancelled run would otherwise be skipped over), plus every branch
      # mount that moved, predicts the rendered files with the docs renderer
      # (`staging-changes.ts expand` → `docs-rendered-impact.ts`, where any
      # doubt carries), and compares that with what THIS full build changed
      # against the site it replaces, deploy stamps blanked. The verdict —
      # `cone-safe`, `cone-unsafe` (a determined cone missed a file: the switch
      # would have served it stale) or `full` (the fallback) — goes to the step
      # summary and `$RUNNER_TEMP/cone/dryrun.json`.
      #
      # It SKIPS NOTHING and publishes nothing: the full build above is what
      # deploys, whatever this says. Best effort and bounded, so a dry run can
      # never block or delay a publish by more than its timeout; and a tools
      # pin without the script says so and exits clean.
      - name: Dependency-cone deploy, dry run (bean fwtz)
        continue-on-error: true
        timeout-minutes: 8
        run: |
          set -eu
          S=cat-harness-tools/scripts/docs-cone-dryrun.ts
          if [ ! -f "$S" ]; then
            echo "this tools pin has no $S: no dry run"
            exit 0
          fi
          W="$RUNNER_TEMP/cone"; mkdir -p "$W"
          bun run "$S" inputs --stamp pages/build.json --out-changed "$W/changed.txt" --out-doubts "$W/doubts.json"
          BASE=$(jq -r '.base // empty' "$W/doubts.json")
          if [ -n "$BASE" ] && git show "$BASE:index.lock.json" > "$W/base.lock.json" 2>/dev/null; then
            LOCK=(--base-lock "$W/base.lock.json")
          else
            LOCK=()
          fi
          bun run cat-harness-tools/scripts/staging-changes.ts expand \
            --changed-files "$W/changed.txt" "${LOCK[@]}" --head-lock index.lock.json \
            --repo "$GITHUB_REPOSITORY" --head "$GITHUB_SHA" \
            --out-list "$W/cone-inputs.txt" --out-json "$W/sources.json" --out-impact "$W/rendered-impact.json"
          bun run "$S" judge --before pages --after ./_site \
            --predicted "$W/rendered-impact.json" --sources "$W/sources.json" --doubts "$W/doubts.json" \
            --out "$W/dryrun.json" --summary "$GITHUB_STEP_SUMMARY"

      # The live site's root 404.html. GitHub Pages serves it for every
      # missing path, and a preview that shares the live site's unchanged
      # files (staging-share.ts) relies on it for a deep link opened before
      # the preview's worker is installed: it registers that worker and
      # reloads. Elsewhere it says the page is missing.
      - name: Write the root 404 page
        run: |
          S=cat-harness-tools/scripts/staging-share.ts
          if [ -f "$S" ]; then bun run "$S" write-404 --site ./_site; else echo "this tools pin has no $S: no 404 page"; fi

      - name: Publish to gh-pages
        id: deploy
        env:
          SITE: ./_site
          STATE: ./.staging-restored.json
          COMMIT_SHA: ${{ github.sha }}
          PAGES_DIR: ./pages
        run: bash cat-harness-tools/scripts/publish-gh-pages.sh

      # A GREEN DEPLOY IS NOT EVIDENCE HERE — that is the whole shape of `plj1`,
      # where every push succeeded and the artefact was gone anyway. So the
      # previews are checked against the branch AFTER the push, from what the
      # restore recorded rather than from anything in this process's memory.
      #
      # A preview pushed after ours only ADDS to the branch, so this cannot
      # report a false loss. Exit 1 names what did not survive; exit 2 is a
      # verifier that has gone blind, which must not read as a pass.
      #
      # It fails the job, and the failure message says so: the SITE deployed
      # correctly and what was lost is a review preview, recovered by re-running
      # Feature Staging on the affected PR. A red run for a correct deploy is
      # the accepted cost — the alternative is the silence this bean exists to
      # retire.
      - name: Verify the staging previews survived the deploy
        id: previews
        run: bun run cat-harness-tools/scripts/restore-staging.ts --verify --state ./.staging-restored.json

      # THE BUILT-SITE CHECKS, JUDGED AFTER THE PUSH. Each ran above with
      # `continue-on-error`, so a finding never stopped the deploy (owner,
      # 2026-10-23: gh-pages renders whether CI succeeds or not). Here a
      # finding fails the run, so it is red and the alert below fires, with the
      # site already live.
      - name: Judge the built-site checks
        if: ${{ !cancelled() }}
        env:
          ARTEFACTS: ${{ steps.artefacts.outcome }}
          ESCAPED: ${{ steps.escaped.outcome }}
          QA_ASSETS: ${{ steps.qa_assets.outcome }}
          TILES: ${{ steps.tiles.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
        run: |
          failed=0
          for pair in "maintained artefacts=$ARTEFACTS" "escaped markup=$ESCAPED" "QA witnesses and results=$QA_ASSETS" "navbar tiles=$TILES" "verify the export=$VERIFY"; do
            name="${pair%%=*}"; outcome="${pair#*=}"
            echo "$name: ${outcome:-not reached}"
            if [ "$outcome" = "failure" ]; then
              echo "::error::built-site check failed: $name (the site deployed regardless)"
              failed=1
            fi
          done
          exit "$failed"

      # THE ONE ALERT — `processes/publish-alert.bpmn`. Owner, 2026-09-23:
      # "every step post 'push the publish button' should be same". Any failure
      # in this job — an incomplete export, the verifier set, the deploy, a lost
      # preview — reaches the publication manager the same way: ONE tracking
      # issue labelled with the role, opened on the first failure and COMMENTED
      # on for each later one (an edit does not notify; a new failed publish is
      # news). The next clean publish closes it. The role, not a person: no
      # actor declares a GitHub account for `publication-manager`.
      - name: Alert the publication manager
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ARTEFACTS: ${{ steps.artefacts.outcome }}
          ESCAPED: ${{ steps.escaped.outcome }}
          QA_ASSETS: ${{ steps.qa_assets.outcome }}
          TILES: ${{ steps.tiles.outcome }}
          DEAD_LINKS: ${{ steps.dead_links.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
          DEPLOY: ${{ steps.deploy.outcome }}
          PREVIEWS: ${{ steps.previews.outcome }}
        run: |
          set -euo pipefail
          gh label create publication-manager --color 5319E7 --description "The publication manager's alert: a step after the publish button failed" --force
          {
            echo "A publish of \`${GITHUB_SHA::8}\` failed after the publish button — [run]($RUN_URL)."
            echo
            echo "| step | outcome |"
            echo "|---|---|"
            echo "| every maintained artefact present | ${ARTEFACTS:-not reached} |"
            echo "| no escaped block-level markup | ${ESCAPED:-not reached} |"
            echo "| QA witnesses and results | ${QA_ASSETS:-not reached} |"
            echo "| navbar tiles resolve | ${TILES:-not reached} |"
            echo "| every link resolves | ${DEAD_LINKS:-not reached} |"
            echo "| verify the export before deploying | ${VERIFY:-not reached} |"
            echo "| deploy to gh-pages | ${DEPLOY:-not reached} |"
            echo "| staging previews survived | ${PREVIEWS:-not reached} |"
            echo
            if [ "${DEPLOY:-}" = "success" ]; then
              echo "**The site DID deploy** — what failed is after it, and is live."
            else
              echo "**Nothing was deployed.** The live site is the previous publish."
            fi
            if [ -f "$RUNNER_TEMP/publish-verify.md" ]; then echo; cat "$RUNNER_TEMP/publish-verify.md"; fi
            echo
            echo "Triage: hold the release, or fix forward and publish again. The next clean publish closes this issue. \`processes/publish-alert.bpmn\`, bean \`vigi\`."
          } > "$RUNNER_TEMP/alert.md"
          existing=$(gh issue list --label publication-manager --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file "$RUNNER_TEMP/alert.md"
            echo "commented on #$existing"
          else
            gh issue create --title "Publishing failed after the publish button" --label publication-manager --body-file "$RUNNER_TEMP/alert.md"
          fi

      - name: Close the publication manager's alert
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          existing=$(gh issue list --label publication-manager --state open --json number --jq '.[0].number // empty' || true)
          if [ -n "$existing" ]; then
            gh issue close "$existing" --comment "Published cleanly in [this run]($RUN_URL). Closed by \`docs-site.yml\`."
          fi
