# CI image — build the prepared image every CI job restores its setup from
# (bean folio-assistant-ay33).
#
# ghcr.io/<owner>/<repo>-ci:<key> (here ghcr.io/litlfred/folio-assistant-ci) holds the remote mounts
# index.lock.json pins, node_modules and Playwright's Chromium. The recipe —
# key, build and restore — is cat-harness-tools' shared `ci-image` action, and
# jobs restore with its shared `ci-setup` action, both called at the commit
# index.lock.json pins (check:workflow-pins). With no image for its key a job
# falls back to mounting and installing, so this workflow only ever saves time.
# A re-pin of cat-harness-tools changes the recipe, and with it the key.
#
# Triggers:
#   - a push to main that changes what the image holds or how it is built:
#     build and push the new key's image, unless it already exists;
#   - workflow_dispatch: the same, from any ref, for a first build or a
#     forced rebuild;
#   - a pull request touching the lock or this workflow: build it, push it to a
#     throwaway registry INSIDE the job, restore it the way ci-setup does and
#     verify the mounts. Nothing leaves the runner, and this job has no
#     package permission.
#
# Security: the image holds no secret — every file comes from a public
# repository at the commit the committed lock pins, or from npm through
# bun.lock. Only the `publish` job can write a package (`packages: write`),
# and it runs only on main or a dispatch. Actions are pinned by commit, and
# the throwaway registry by digest.
name: CI image

on:
  push:
    branches: [main]
    paths:
      - index.lock.json
      - bun.lock
      - package.json
      - .github/workflows/ci-image.yml
  pull_request:
    paths:
      - index.lock.json
      - .github/workflows/ci-image.yml
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if an image for this key exists
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Build and restore the image locally (no push)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      registry:
        image: registry@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373 # registry:2
        ports:
          - 5000:5000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - name: Build and push to the local registry
        uses: litlfred/cat-harness-tools/.github/actions/ci-image@4e79324d5d3637bbc592b657f71f1ec3b6b86797 # index.lock.json
        with:
          op: build
          ref: localhost:5000/folio-assistant-ci:test
          insecure: "true"
      # A job without a browser restores the workspace layers only, and the
      # skipped layers must still pass the digest check.
      - name: Restore the workspace layers only
        uses: litlfred/cat-harness-tools/.github/actions/ci-image@4e79324d5d3637bbc592b657f71f1ec3b6b86797 # index.lock.json
        with:
          op: fetch
          scheme: http
          image: localhost:5000/folio-assistant-ci
          key: test
          workspace: ${{ runner.temp }}/ws-only/ws
          browsers: ${{ runner.temp }}/ws-only/pw
          roles: ws
      - name: Prepare a fresh checkout
        run: |
          [ -z "$(ls -A "$RUNNER_TEMP/ws-only/pw" 2>/dev/null)" ] || { echo "a workspace-only restore wrote browsers"; exit 1; }
          git worktree add -q --detach "$RUNNER_TEMP/fresh" HEAD
      - name: Restore into the fresh checkout, as ci-setup does
        uses: litlfred/cat-harness-tools/.github/actions/ci-image@4e79324d5d3637bbc592b657f71f1ec3b6b86797 # index.lock.json
        with:
          op: fetch
          scheme: http
          image: localhost:5000/folio-assistant-ci
          key: test
          workspace: ${{ runner.temp }}/fresh
          browsers: ${{ runner.temp }}/pw-fresh
          roles: ws pw
      - name: Verify the restored checkout
        run: |
          cd "$RUNNER_TEMP/fresh"
          bun run cat mount:lock:check
          bun install --frozen-lockfile
          PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/pw-fresh" bun -e '
            const { chromium } = require("playwright");
            const b = await chromium.launch(); const p = await b.newPage();
            await p.setContent("<p>ok</p>"); console.log("chromium:", await p.textContent("p")); await b.close();'

  publish:
    name: Build and push the image for this key
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    concurrency:
      group: ci-image-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - name: Image key
        id: recipe
        uses: litlfred/cat-harness-tools/.github/actions/ci-image@4e79324d5d3637bbc592b657f71f1ec3b6b86797 # index.lock.json
        with:
          op: key
      - name: Whether it is already built
        id: key
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          FORCE: ${{ inputs.force }}
          KEY: ${{ steps.recipe.outputs.key }}
          IMAGE: ${{ steps.recipe.outputs.image }}
        run: |
          key="$KEY"; image="$IMAGE"
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          if [ "$FORCE" != true ] && docker manifest inspect "$image:$key" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=CI image::$image:${key:0:12}… already exists"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and push
        if: steps.key.outputs.exists != 'true'
        uses: litlfred/cat-harness-tools/.github/actions/ci-image@4e79324d5d3637bbc592b657f71f1ec3b6b86797 # index.lock.json
        with:
          op: build
          ref: ${{ steps.key.outputs.image }}:${{ steps.key.outputs.key }}
      - name: A fresh checkout to restore into
        run: git worktree add -q --detach "$RUNNER_TEMP/fresh" HEAD
      # Anonymously, as every job pulls it: a package that is not public fails
      # here rather than silently in every job's fallback.
      - name: Restore it the way a job will, and time it
        uses: litlfred/cat-harness-tools/.github/actions/ci-image@4e79324d5d3637bbc592b657f71f1ec3b6b86797 # index.lock.json
        with:
          op: fetch
          image: ${{ steps.key.outputs.image }}
          key: ${{ steps.key.outputs.key }}
          workspace: ${{ runner.temp }}/fresh
          browsers: ${{ runner.temp }}/pw-fresh
          roles: ws pw
      - name: Verify the restored checkout
        run: cd "$RUNNER_TEMP/fresh" && bun run cat mount:lock:check
