# Post-merge regeneration check and automated repair — bean `folio-assistant-ey1c`
# (owner's ruling of 2026-10-11, option 1: a folio-assistant workflow on push: main).
#
# ## The failure this exists for
#
# `merge-main.yml` regenerates an opted-in branch when `main` moves, but after a
# branch merges nothing regenerates `main` itself. Any merge that changes an
# enumerated or counted directory can leave `main` red on a derived artefact
# (e.g. `readme:subgraphs:check` counting files in `uploads/`), and branches that
# happen to carry the regenerated files then repair `main` by accident.
#
# ## Principles
#
# 1. Detected and ACTED on: `main` going stale on a derived artefact is detected
#    and a repair is generated.
# 2. A reviewable branch, never a direct push to `main`: the repair is pushed to
#    `automation/post-merge-regen-<sha>` and proposed for review against `main`,
#    so it cannot bypass the CI gates.
# 3. NEGATIVE CONTROL: a merge that changes nothing counted proposes nothing.
# 4. Honest reporting: a stale check with no writer, or whose writer fails, is a
#    red run (exit 1), never claimed as a repair.
#
# ## Why not `layer-post-merge-regen.yml`
#
# The layers (cat-harness, …) call cat-harness-tools' reusable
# `layer-post-merge-regen.yml`. It is LAYER-only: it checks out this index,
# deletes the caller's locked mount `fa/<instance>/`, copies the caller in its
# place and requires `<instance>/<instance>.json`. Called from the index itself
# it would copy the whole index into `fa/folio-assistant/` and stop at the
# missing `folio-assistant/folio-assistant.json`; it has no input for "the caller
# IS the index". Here no swap is needed: `post-merge:regen` is a cat-harness-tools
# script and this checkout is the composed index it runs in, so the job mounts
# from the lock and lets the script itself commit, push and propose the repair.
# It commits only what the index tracks (the mounts are gitignored): a layer's
# own files are that layer's to repair, through its own call of the reusable.

name: Post-merge regen check and repair

# AT MOST HOURLY (owner, 2026-11-01, card Q-PIPE-1 A). Until then every push
# to main started a 39-minute regen, and on a busy day the repairs ran back to
# back, each holding one of the account's 40 shared runner slots to redo the
# repair the next one would redo again. Now a cheap hourly `tick` asks whether
# main moved since the last regen and, only then, dispatches this workflow on
# main. The dispatched run is the regen. Trade-off: a stale derived file on
# main is repaired up to an hour later. Dispatch it by hand to repair now.
on:
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (report only, do not create PR)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # Hourly: dispatch a regen only when main moved since the last one. A
  # dispatch with GITHUB_TOKEN does start a run (workflow_dispatch is the
  # exception to "events from GITHUB_TOKEN start nothing").
  tick:
    name: Has main moved since the last regen?
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          main=$(gh api "repos/$REPO/commits/main" --jq .sha)
          # The newest dispatched regen that was not cancelled, running or done.
          last=$(gh api "repos/$REPO/actions/workflows/post-merge-regen.yml/runs?event=workflow_dispatch&branch=main&per_page=20" \
            --jq '[.workflow_runs[] | select(.conclusion != "cancelled")][0].head_sha // ""')
          if [ "$main" = "$last" ]; then
            echo "main ${main:0:7} already has a regen run: nothing to do."
            exit 0
          fi
          echo "main moved (${last:0:7} -> ${main:0:7}): dispatching a regen."
          gh workflow run post-merge-regen.yml --repo "$REPO" --ref main

  regen:
    name: Check post-merge derived artefacts
    if: ${{ github.event_name == 'workflow_dispatch' }}
    # One regen at a time; a newer dispatch waits rather than cancelling.
    concurrency:
      group: post-merge-regen
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      pull-requests: write
    steps:
      # The repair PR is pushed with the harness bot (or the PAT) when one is
      # configured, as merge-main.yml does: a branch pushed with GITHUB_TOKEN
      # starts no CI, and the repair PR must be judged by the gates.
      - id: bot
        if: vars.HARNESS_BOT_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.HARNESS_BOT_ID }}
          private-key: ${{ secrets.HARNESS_BOT_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          token: ${{ steps.bot.outputs.token || secrets.PUSH_BRANCH_TRIGGERING_CI || secrets.GITHUB_TOKEN }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - name: Cache remote mounts (bean cis1)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/cat-mount
          key: cat-mount-v1-${{ hashFiles('index.lock.json') }}
          restore-keys: |
            cat-mount-v1-
      - name: Mount every instance from the lock
        shell: bash  # gate-shell.sh is inside cat-harness, which this step mounts
        run: bash .github/mount-from-lock.sh --root .
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # PlantUML 1.2026.9 needs Java 21 (its ELK classes are class file 65);
      # ubuntu-latest's PATH java is 17 (#2744). The major is read from the
      # plantuml tool-release declaration, so a later bump moves it too.
      - name: Java runtime the PlantUML release declares (#2744)
        uses: ./.github/actions/plantuml-java
      - name: Install Chromium, for the checks that draw through a browser
        # `render:bpmn` and the `*:processes:render:check` gates draw BPMN with
        # bpmn-js in Chromium, which code-quality-gates.yml installs and this
        # job did not, so both were reported unrepaired on every run (bean
        # ey1c). This checkout's own Playwright installs the build it expects.
        run: node_modules/.bin/playwright install --with-deps chromium
      - name: Mount the subgraphs kept on branches (bean 9c7h)
        run: bun run cat state:mount
      # Bean `ksek`: give `post-merge:regen` the same pre-built inputs that
      # `code-quality-gates.yml`'s `qa-working-copy` and `publish-pages` jobs
      # build before the gate jobs run. Without `ig-index:build` and
      # `smart:pages`, `index:render:check` exits 2 (`could not determine: no
      # artefact index at .../smart-base/fhir-artifact-index/index.json`);
      # without `qa:working-copy` and `derive:publish`, the checks that read the
      # gitignored `test/results/` working copy or `builtAtPublish` outputs fail
      # in the audit pass on a clean `main` tree. All four steps write only into
      # gitignored mounts, `test/results/`, and `build/`, so index-tracked
      # staleness (`AGENTS.md`, `README.md`, `CLAUDE.md`, `GEMINI.md`, etc.) is
      # never masked.
      - name: Build the IG artefact indexes the pages read (fhir-harness#124, bean ksek)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun run cat ig-index:build
      - name: Build the mounted IG instances' pages (beans hupw, ksek)
        run: bun run cat smart:pages
      - name: Produce the QA working copy this run reads (beans 72a8, ksek)
        continue-on-error: true
        run: bun run cat qa:working-copy
      - name: Build the publish-time pages this run reads (B1, bean ksek)
        continue-on-error: true
        run: bun run cat derive:publish
      - name: Run post-merge regen
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token || secrets.PUSH_BRANCH_TRIGGERING_CI || secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run == true }}
          QA_WORKING_COPY_BUILDING: "1"
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          args=(--json)
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); else args+=(--create-pr); fi
          # `|| code=$?`, NOT a bare call followed by `code=$?`: Actions runs
          # this with `bash -e`, so a non-zero regen (its verdict, not a crash)
          # ended the step before the report below was printed. Every red run
          # from #2614 to #2619 said only "exited with code 1".
          code=0
          bun run cat post-merge:regen "${args[@]}" > "$RUNNER_TEMP/regen.json" || code=$?
          cat "$RUNNER_TEMP/regen.json"
          {
            echo "### post-merge regen: folio-assistant"
            echo '```json'
            cat "$RUNNER_TEMP/regen.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
