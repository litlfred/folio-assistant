name: release-please

# Tier-2 item 2f from workplan v2. Automates semver + CHANGELOG +
# release-PR creation for the 7 published packages under tools/.
#
# How it works:
#   1. On every push to main, `googleapis/release-please-action`
#      walks the commit history since the last release tag for each
#      configured package.
#   2. It groups commits by conventional-commit type
#      (feat/fix/docs/...) and computes the next semver bump:
#        - feat:        minor bump (or patch with bump-patch-for-minor-pre-major)
#        - fix:         patch bump
#        - feat!:       major bump
#        - chore/test/build: hidden by default; no release
#   3. If there are releasable commits since the last tag, it
#      opens (or updates) a "release-pr" with:
#        - CHANGELOG.md updated
#        - version bumped in pyproject.toml / Cargo.toml / package.json
#          (per the package's `extra-files` config)
#   4. Merging the release-PR triggers the second pass which CREATES
#      the GitHub release + tag (e.g. `pyhecke-v0.2.0`).
#   5. Downstream publish workflows (pyhecke-pypi-publish.yml,
#      pyhecke-native-wheels.yml, etc.) are still triggered manually
#      via workflow_dispatch — release-please does NOT auto-publish.
#      Owner reviews the cut release on GitHub, then triggers the
#      publish workflow with `target=pypi`.
#
# Config: NONE, and that is deliberate as of 2026-09-20 (bean
# `folio-assistant-frq2`). This block used to name
# `.github/release-please-config.json` and `-manifest.json` as though they
# were here; neither has ever existed in this repository, and the step below
# passed both paths to the action. See the comment on the step for what was
# measured and why a config was not simply written.
#
# EVERYTHING ABOVE THIS LINE DESCRIBES THE OTHER REPOSITORY. The push trigger,
# the seven packages under `tools/`, `pyhecke`, `qou-substrate`, the stranded
# release branches and their PR numbers — all of it came across at the split
# (109a4ff) with the prose untouched. The corrections are below, and that
# ordering has a measured cost: on 2026-09-20 an agent read this header,
# stopped before reaching them, and reported to the owner as fact that this
# workflow runs on every push to `main`. It does not.
#
# KNOWN ISSUE — silent PR-creation failure
# ─────────────────────────────────────────
# Observed 2026-05-24/25: every push to main creates the
# `release-please--branches--main--components--<pkg>` branch on origin
# with a valid release commit, but the PR-open step silently no-ops.
# Two release branches got stranded this way; manually opened as PR
# #1234 (pyhecke 0.1.1) + PR #1235 (qou-substrate 0.1.1).
#
# Most likely cause: GitHub repo setting
#   Settings → Actions → General → "Workflow permissions"
#   → "Allow GitHub Actions to create and approve pull requests"
# is OFF. Without it, `secrets.GITHUB_TOKEN` cannot open PRs even
# with the explicit `pull-requests: write` permission below.
#
# Owner-side fix options (in order of preference):
#   A. Flip the above setting ON (one click; persistent).
#   B. Create a fine-grained PAT with `contents: write` +
#      `pull-requests: write` scopes, store as RELEASE_PLEASE_TOKEN
#      secret, then change the `token:` line below to use it. Bonus:
#      PR-creation uses the PAT-owner's identity so the PR triggers
#      downstream CI (GITHUB_TOKEN-created PRs do not, by design).
#
# Until either lands, every release lifecycle requires the manual
# rescue path: `gh pr create --head release-please--...`. See
# docs/release-process.md (once added) for the exact recipe.

#
# TRIGGERS, ACTUAL: `workflow_dispatch` only.
# The triggers described above are the other repo's. Copied in at the split
# (109a4ff) with the trigger neutered and the prose left alone. Correct here:
# this workflow releases the packages under `tools/`, which the platform does not carry. See bean `folio-assistant-5rfy`.

on:
  workflow_dispatch:

permissions:
  contents: write       # create release PRs + tags + releases
  pull-requests: write  # open / update the release PR (also needs the
                        # repo-level "Allow Actions to create PRs"
                        # setting; see KNOWN ISSUE block above)

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          # Token: GITHUB_TOKEN is the conservative default but suffers
          # from the silent-fail issue documented above. If a fine-
          # grained PAT is available, prefer it via:
          #   token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          # (Coalesce so the workflow still runs when the PAT secret is
          # unset; it just falls back to the half-broken path.)
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          # NO `config-file:` / `manifest-file:` — REMOVED 2026-09-20, bean
          # `folio-assistant-frq2`. They named
          # `.github/release-please-config.json` and
          # `.github/release-please-manifest.json`, and NEITHER FILE HAS EVER
          # EXISTED here: both were inherited from the other repository at the
          # split, along with the header prose above.
          #
          # THIS DOES NOT MAKE THE WORKFLOW WORK, and it is not meant to.
          # Removing the lines stops it ASSERTING a config location that is
          # wrong; release-please now falls back to its own defaults, which it
          # will also not find. The workflow remains unexercised — zero tags in
          # this repository, and `workflow_dispatch` only.
          #
          # A config was deliberately NOT written instead, because the package
          # it would release CANNOT BE BUILT (frq2 §5, measured):
          #
          #   · `release-folio-assistant.yml` packs `PKG_DIR: folio-assistant`
          #     — a directory that does not exist here.
          #   · `package.json`'s `files[]` resolves 2 of 6 at the root; `src/`,
          #     `ui/` and the two `viewer/` entries moved under `cat-harness/`.
          #   · `package.json` is named `@anthropic-ai/folio-assistant`, a
          #     scope this repository presumably does not own.
          #
          # A config naming a package whose own `files[]` does not resolve
          # would make this path LOOK configured while leaving it as broken —
          # the `xom7` shape. Before one is written, the package has to be
          # buildable and `instance-versioning.md` §3.1 has to have said WHICH
          # instances are publishable; that is its first open question, and a
          # config written now would answer it by accident.
