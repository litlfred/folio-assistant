# The re-pin train's merge rule — issue #2873 (owner, 2026-11-01, card
# Q-SPD-3 B): a train PR may merge when its checks show NO NEW FAILURES
# compared with fa main.
#
# It runs when a check workflow's run completes on a `repin-train/` branch
# (workflow_run), and on dispatch. Each time it compares every check run on the
# train head with those on main's newest commit whose checks have all
# finished (`.github/scripts/repin-train.ts verdict`):
#
#   - a check failing on the train and passing on main (or not run there) is a
#     NEW failure, and the status is red;
#   - a check failing on both is main's known debt, and does not block;
#   - a check still running keeps the status pending.
#
# The result is the commit status `repin-train / no new failures` on the train
# head, and one PR comment edited in place. Could-not-determine is never
# green. It never merges: a person does.

#
# TRIGGERS, ACTUAL (the owner's decision, card Q-SPD-3 B): `workflow_run` (a check workflow completed) and
# `workflow_dispatch`. It judges PRs; no PR or push to main triggers it.

name: Re-pin train verdict

on:
  workflow_run:
    workflows: ["Code-quality gates", "Feature Staging (GitHub Pages)"]
    types: [completed]
  workflow_dispatch:
    inputs:
      sha:
        description: The train head commit to judge
        required: true

permissions:
  contents: read

concurrency:
  group: repin-train-verdict-${{ github.event.workflow_run.head_sha || inputs.sha }}
  cancel-in-progress: false

jobs:
  verdict:
    name: No new failures compared with fa main
    # Only this repository's own re-pin branches: a fork can name a branch
    # `repin-train/…` too, and this job holds statuses and pull-requests write
    # (security audit V2, 2026-11-01).
    if: ${{ github.event_name == 'workflow_dispatch' || (startsWith(github.event.workflow_run.head_branch, 'repin-train/') && github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
      statuses: write
      pull-requests: write
      issues: write
    steps:
      # main's copy of the script, never the train branch's: the branch's code
      # is what is being judged.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - name: Compare the train head with main
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha || inputs.sha }}
        run: bun .github/scripts/repin-train.ts verdict --sha "$SHA"
