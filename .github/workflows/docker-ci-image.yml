# DEPRECATED — All CI workflows now use the unified paper-assistant image.
# See build-lean-mcp.yml for the active build workflow.
#
# This workflow is disabled (no automatic triggers). Use manual dispatch
# only if you need a standalone qou-ci image for some reason.
#
# Original: Build and publish the QOU CI Docker image to GHCR.

name: "[DEPRECATED] CI Docker Image"

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/qou-ci

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/share/powershell /usr/local/.ghcup
          sudo docker system prune -af
          df -h /

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true

      - name: Read Lean toolchain version
        id: toolchain
        run: |
          TC=$(cat content/quantum-observable-universe/lean/lean-toolchain)
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "version<<$EOF" >> "$GITHUB_OUTPUT"
          echo "${TC}" >> "$GITHUB_OUTPUT"
          echo "$EOF" >> "$GITHUB_OUTPUT"
          echo "Lean toolchain: ${TC}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .github/docker
          push: true
          build-args: |
            LEAN_TOOLCHAIN=${{ steps.toolchain.outputs.version }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
