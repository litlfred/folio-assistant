# WRITER RECORDS FOR THE RERUN-AND-MEASURE DEPLOY — bean `fwtz`, option B
# (owner card 2026-10-31, "rerun and measure").
#
# After each docs-site deploy on main, build the site's inputs the same way
# docs-site does and run `derive:publish` with every writer under strace
# (cat-harness-tools `writer-cone.ts`). The result, what each writer read and
# wrote, is uploaded as the artifact `writer-records`. The NEXT docs-site run
# downloads the newest one and judges, after its own full build, which
# writers it could have skipped and whether that would have been right
# (`writer-cone-verify.ts`).
#
# Why a workflow of its own, not a step of docs-site: strace costs a traced
# script 3-10x (bean 4rbc), so recording inside the deploy would delay every
# publish. And docs-site keeps only the newest pending run, so a manual
# record run there is cancelled by the next push (run 41196478832 was).
# This one publishes nothing and pushes nothing.
#
# THE QA RECORDS ARE CARRIED FORWARD, AND RE-TRACED AT MOST DAILY
# (runner-request cuts, 2026-11-05). Measured on run of 2026-11-05 00:11Z:
# 90 min on the runner, of which the traced QA working copy was 64 min and
# traced `derive:publish` 21 min; every merge that deploys pays it again.
# Now the previous recording (the `writer-cone-` cache) is restored first, and
# while its QA records are under 24 hours old the QA working copy is built in
# SKIP mode — exactly as a preview builds it: a step whose recorded reads all
# match is put back from its recorded outputs, any other step runs (untraced,
# so it keeps its old record, which no longer matches and so is never trusted:
# "any doubt runs it", `qa-cone.ts`). The writers are still traced on every
# deploy. A full re-trace of the QA steps happens when the QA records are
# missing or older than 24 h, or on a dispatch with `full_qa`.
#
# TRIGGERS, ACTUAL: `workflow_run` (a docs-site deploy on main succeeded) and
# `workflow_dispatch`. No cron: the 24-hour age above is read from the
# restored recording, not kept by a timer (owner's decision, bean `fwtz`
# option B, records after each deploy).
name: Writer records (bean fwtz)

on:
  workflow_run:
    workflows: ["Docs site (GitHub Pages)"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      full_qa:
        description: Re-trace every QA step too, whatever the age of the QA records
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  record:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    # One recording at a time. The group sits on the job, not the workflow,
    # so a run whose `if` skips it (a cancelled deploy) never joins it: at
    # workflow level such a run cancelled recording 41197008752. A running
    # recording finishes; only a newer pending one replaces an older pending.
    concurrency:
      group: writer-records
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The commit the deploy built, not whatever main is now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - name: Mount the layers from the lock
        shell: bash
        run: bash .github/mount-from-lock.sh --root .
      - name: Install deps
        run: bun install --frozen-lockfile
      - name: Mount the subgraphs kept on branches
        run: bun run cat state:mount
      - name: Build the IG artefact indexes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun run cat ig-index:build
      - name: Build the mounted IG instances' pages
        run: bun run smart:pages
      # The previous recording: the QA records carried forward, and each
      # recorded step's outputs for skip mode to put back. One slot per writer
      # (`derive-cache.ts` commitStaged), so the cache does not grow.
      - name: Restore the previous recording
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: build/writer-cone
          key: writer-cone-${{ github.event.workflow_run.head_sha || github.sha }}
          restore-keys: writer-cone-
      - name: Re-trace the QA steps this time?
        id: qa
        env:
          FULL_QA: ${{ inputs.full_qa && 'true' || 'false' }}
        run: |
          f=build/writer-cone/qa-records.json; at=build/writer-cone/qa-recorded-at
          now=$(date +%s); age=""
          [ -f "$at" ] && age=$(( now - $(cat "$at") ))
          if [ "$FULL_QA" = "true" ]; then why="asked for (full_qa)"; mode=record
          elif [ ! -f "$f" ] || [ -z "$age" ]; then why="no QA records to carry forward"; mode=record
          elif [ "$age" -ge 86400 ]; then why="the QA records are $(( age / 3600 )) h old (24 h at most)"; mode=record
          else why="the QA records are $(( age / 3600 )) h old: carried forward, the QA copy built as a preview builds it"; mode=skip
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "QA steps: $mode — $why" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: strace
        run: |
          if command -v strace >/dev/null; then strace -V | head -1; exit 0; fi
          sudo apt-get update -qq && sudo apt-get install -y -qq strace && strace -V | head -1
      # Each QA step runs traced too, so a preview reruns only the QA steps
      # whose reads changed (owner card Q-CONE-2 B, 2026-11-01; records in
      # build/writer-cone/qa-records.json, kept by the cache below).
      # One step for both modes, so the record mode stays the step it was.
      # `record`: every step traced, and the time of the re-trace kept.
      # `skip`: the carried-forward records, as a preview builds the copy.
      - name: Produce the QA working copy, every step traced (some writers read it)
        env:
          QA_MODE: ${{ steps.qa.outputs.mode }}
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          start=$(date +%s)
          if [ "$QA_MODE" = "record" ]; then
            CAT_WRITER_RECORD=1 bun run cat qa:working-copy
            date +%s > build/writer-cone/qa-recorded-at
          else
            CAT_WRITER_SKIP=1 bun run cat qa:working-copy
          fi
          echo "QA working copy ($QA_MODE) took $(( $(date +%s) - start ))s" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Generate the mounted SMART IG instances' pages
        run: bun run smart:pages:publish
      - name: Java runtime the PlantUML release declares
        uses: ./.github/actions/plantuml-java
      - name: Install Chromium for the BPMN drawings
        run: npx --yes playwright install --with-deps chromium
      - name: derive:publish, every writer traced
        env:
          CAT_WRITER_RECORD: '1'
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          start=$(date +%s)
          bun run cat derive:publish
          echo "traced derive:publish took $(( $(date +%s) - start ))s" | tee -a "$GITHUB_STEP_SUMMARY"
      # Records AND each recorded writer's outputs (build/writer-cone/outputs),
      # for previews to skip unchanged writers and put their outputs back
      # (owner 2026-10-31 14:32Z). Saved from main, so every PR can restore it.
      - name: Keep the records and outputs for previews
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: build/writer-cone
          key: writer-cone-${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Upload the records
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: writer-records
          path: |
            build/writer-cone/records.json
            build/writer-cone/qa-records.json
          retention-days: 14
          if-no-files-found: error
