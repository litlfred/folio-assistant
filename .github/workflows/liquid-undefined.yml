# Undefined Liquid variables, as a CI CHECK -- never a step of the render.
#
# Owner, 2026-10-09 (bean 8pyz): *"jekyll strict (if not error out, just
# message)"*, then, choosing where it runs: *"1 but CI is in CI not part of
# render"*. Jekyll renders an undefined variable as the empty string and says
# nothing; `cat-harness/docs/_plugins/liquid-undefined-warn.rb` makes it say
# so. The docs site and the staging previews build with
# `actions/jekyll-build-pages`, which loads no `_plugins/` (and is kept for
# the pinned remote theme -- see docs-site.yml's minify step), so the plugin
# cannot run there. It runs HERE, on a second build of the exact source those
# workflows rendered, whose output is thrown away.
#
# The hand-off: each render workflow uploads its composed `_docs/` as the
# `jekyll-source` artifact, `continue-on-error`, so this check can never
# break or slow a deploy. This workflow fires when one completes, downloads
# that artifact, and builds it with the plugin.
#
# What it reports and how it fails:
# - undefined variables are a MESSAGE: the job summary lists them and the
#   JSON record is uploaded as `liquid-undefined`. They do not fail the job.
# - could-not-check is never green: no artifact, no plugin in the source, or
#   a build that does not complete FAILS the job, with which one it was.
#
# TWO WAYS IN, ONE CHECK (owner, 2026-10-23: "green PR must mean green main").
# - `workflow_call`, from Feature Staging's own run: its `liquid-undefined`
#   job calls this file once `stage` has handed the source off, so the
#   verdict is a job of the PULL REQUEST's run, which merge-guard reads
#   (check 5, `ci`). Before this, a PR render was checked only by a
#   `workflow_run` run, which GitHub attaches to the DEFAULT BRANCH: a PR
#   could be green and merge, and the red arrived afterwards on main.
#   Called, it still builds a SECOND time from the uploaded artifact rather
#   than from the deploy's own build, so the render stays free of it (bean
#   8pyz: "CI is in CI not part of render").
# - `workflow_run` on the Docs site, which renders MAIN itself: that render
#   has no pull request, so its check is post-merge by nature. Feature
#   Staging is no longer listed here -- every run of it that stages now
#   checks itself in-run, and listing it too re-checked the same source on
#   main.
#
# TRIGGERS, ACTUAL: `workflow_run` (Docs site) and `workflow_call`. It has no
# `pull_request` trigger of its own; the pull request runs named above are
# Feature Staging's, which call it.
name: Liquid undefined-variable check

on:
  workflow_run:
    workflows: ["Docs site (GitHub Pages)"]
    types: [completed]
  workflow_call:
    inputs:
      head_sha:
        description: "The commit the calling run rendered, for the report."
        required: true
        type: string

permissions:
  contents: read
  actions: read

# One check per branch, the newest: keyed by the branch the TRIGGERING run
# rendered, not by this run's own ref (a `workflow_run` run's ref is always
# the default branch, so keying on it would let one PR's check cancel
# another's). Owner, 2026-10-23: main's queue stacked three of these, and
# only the newest render's answer matters. The run-id fallback keeps a run
# with no triggering branch in a group of its own.
concurrency:
  # Called (workflow_call), `github.event.workflow_run` is empty, so the run-id
  # fallback keeps one PR's call from cancelling another's.
  group: liquid-undefined-${{ github.event.workflow_run.head_branch && format('branch-{0}', github.event.workflow_run.head_branch) || format('run-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  # Did the triggering run render anything at all? Feature Staging's `stage`
  # job is SKIPPED by design on a push whose PR is not conflicted (its
  # pull_request run stages it), and on a cleanup or a merge-queue entry; the
  # run still concludes `success`. Such a run rendered nothing, so there is
  # nothing to check, and that is not "could not check". The test is the
  # hand-off step itself, and whether it RAN: a job skipped at job level
  # lists no steps, and a job that started but failed before the hand-off
  # lists it as `skipped`. Either way nothing was rendered, and the failure
  # is already red on the triggering run itself; re-reporting it here put a
  # second red run on the default branch for every failed PR render (runs
  # 39626625602 on 2026-10-21 and 39812719508 on 2026-10-22, triggered by
  # PR renders that failed at "Install deps" and at the derived-artefact
  # build). A hand-off that RAN but left no artifact (the upload is
  # continue-on-error) still reaches the check below, which fails it as
  # NOT CHECKED, so could-not-check stays red.
  rendered:
    name: Did the triggering run render?
    # Only for a `workflow_run`: a caller calls only once its hand-off ran.
    if: inputs.head_sha == '' && github.event.workflow_run.conclusion != 'cancelled' && github.event.workflow_run.conclusion != 'skipped'
    runs-on: ubuntu-latest
    outputs:
      ran: ${{ steps.jobs.outputs.ran }}
    steps:
      - id: jobs
        env:
          GH_TOKEN: ${{ github.token }}
          JOBS_URL: ${{ github.event.workflow_run.jobs_url }}
        run: |
          n=$(gh api --paginate "$JOBS_URL" --jq '[.jobs[].steps[]? | select(.name == "Hand the Jekyll source to the Liquid check" and .conclusion != "skipped")] | length' | awk '{s+=$1} END {print s+0}')
          if [ "$n" -gt 0 ]; then
            echo "ran=true" >> "$GITHUB_OUTPUT"
          else
            echo "ran=false" >> "$GITHUB_OUTPUT"
            echo "Nothing rendered: no job of ${{ github.event.workflow_run.name }} run ${{ github.event.workflow_run.html_url }} reached the Jekyll hand-off (skipped, or failed before it -- see that run), so there is no source to check." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  check:
    name: Undefined Liquid variables in the rendered source
    # A run that never got as far as the hand-off has nothing to check; one
    # that failed AFTER it still rendered a source worth reading.
    needs: rendered
    # `always()` so a call, where `rendered` is skipped, still runs.
    if: always() && (inputs.head_sha != '' || needs.rendered.outputs.ran == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SRC_NAME: ${{ inputs.head_sha != '' && github.workflow || github.event.workflow_run.name }}
      SRC_URL: ${{ inputs.head_sha != '' && format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) || github.event.workflow_run.html_url }}
      SRC_BRANCH: ${{ inputs.head_sha != '' && (github.head_ref || github.ref_name) || github.event.workflow_run.head_branch }}
      SRC_SHA: ${{ inputs.head_sha || github.event.workflow_run.head_sha }}
    steps:
      # Called: the artifact is this same run's, so no run id is named.
      - name: The source the calling run rendered
        id: source_call
        if: inputs.head_sha != ''
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: jekyll-source
          path: ./_docs

      - name: The source the triggering run rendered
        id: source
        if: inputs.head_sha == ''
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: jekyll-source
          path: ./_docs
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Could it be checked?
        env:
          GOT: ${{ steps.source_call.outcome == 'success' || steps.source.outcome == 'success' }}
        run: |
          src="$SRC_NAME run $SRC_URL"
          if [ "$GOT" != "true" ] || [ ! -f ./_docs/_config.yml ]; then
            echo "NOT CHECKED: $src left no jekyll-source artifact (it stopped before the hand-off, or the upload failed)." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ ! -f ./_docs/_plugins/liquid-undefined-warn.rb ]; then
            echo "NOT CHECKED: the source $src rendered carries no _plugins/liquid-undefined-warn.rb (cat-harness pinned before it landed)." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ ! -f ./_docs/Gemfile ]; then
            echo "NOT CHECKED: the source carries no Gemfile to build with." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: ./_docs

      # `cd` rather than `working-directory:` -- `_docs` is created by the
      # download step, and GitHub resolves a step's working directory before
      # the step runs.
      - name: Build with the plugin, output discarded
        env:
          FOLIO_LIQUID_UNDEFINED_REPORT: ${{ runner.temp }}/liquid-undefined.json
        run: |
          cd ./_docs
          bundle exec jekyll build --source . --destination "$RUNNER_TEMP/_site-check"

      - name: Report
        run: |
          r="$RUNNER_TEMP/liquid-undefined.json"
          {
            echo "### Undefined Liquid variables"
            echo
            echo "Source: $SRC_NAME — $SRC_BRANCH @ \`$SRC_SHA\` ([run]($SRC_URL))"
            echo
            if [ ! -f "$r" ]; then
              echo "NOT CHECKED: the build wrote no record, so the plugin did not run."
            else
              ruby -rjson -e '
                d = JSON.parse(File.read(ARGV[0]))["undefined"]
                if d.empty?
                  puts "None: every variable a page rendered was defined."
                  exit
                end
                puts "#{d.sum { |x| x["count"] }} reference(s) to #{d.size} undefined variable(s) rendered EMPTY. A message, not a failure (bean 8pyz)."
                puts
                puts "| variable | times | e.g. |"
                puts "|---|---|---|"
                d.sort_by { |x| [x["path"].start_with?("site.data.") ? 0 : 1, -x["count"]] }.first(100).each { |x| puts "| `#{x["path"]}` | #{x["count"]} | #{x["pages"].first(3).join(", ")} |" }
              ' "$r"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          [ -f "$r" ] || { echo "the plugin did not run: no record at $r"; exit 1; }

      - name: Keep the record
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: liquid-undefined
          path: ${{ runner.temp }}/liquid-undefined.json
          if-no-files-found: ignore
          retention-days: 14
