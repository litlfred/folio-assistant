# ONE scheduled job for the 15-minute sweeps (runner-request cuts, 2026-11-05).
#
# Measured over 21 h on 2026-11-04/05 (600 runs): half of all runs were
# scheduled, and three workflows each started a runner every 15 minutes —
# Staging publish (90/day), Preview verify sweep (93/day), Re-pin train verdict
# (96/day) — nearly always to find nothing to do. During runner saturation each
# of those tiny jobs still queued 10-25 minutes, in front of real work, because
# the account-wide pool counts REQUESTS, not seconds.
#
# This job asks each question with API calls only, in seconds, and starts the
# workflow concerned ONLY when there is work:
#
#   - Staging publish: a `staging-site-*` artifact is waiting
#     (the queue `staging-publish.yml` drains; its safety net, Q-SPD-5c).
#   - Preview verify: the sweep itself runs HERE, unchanged
#     (`.github/scripts/preview-verify-sweep.sh`): it only dispatches.
#   - Re-pin train verdict: an open train waits for a verdict
#     (`repin-train.ts pending`, the same `trainsToJudge` the sweep judges).
#   - Merge train: an open train waits for a verdict, a bisect batch is
#     queued, or an opted-in PR is ready (`merge-train.ts pending`, bean hd58).
#   - Conflicted PR previews (owner, 2026-10-06: "preview can still run, just
#     not merge ready"): GitHub delivers no `pull_request` event to a PR that
#     conflicts with its base. Feature Staging's `push` trigger used to start a
#     runner on EVERY branch push to cover that case (23/day, almost all
#     deciding "not conflicted"). Here: an open PR of this repository whose
#     `mergeable_state` is `dirty` (which licenses only "conflicts", bean yv4z)
#     and whose head has no Feature Staging run is dispatched on its own branch
#     (`--ref`), which is the run the push used to start. An `unknown` state
#     means not computed yet (bean h2s9): the next tick asks again.
#
# Each workflow keeps its own `workflow_dispatch`, concurrency and semantics;
# only who starts it changed. One runner per tick instead of three-plus.
#
# Every step is independent: one failing does not stop the others
# (`continue-on-error`), and the job still goes red so it is seen.
#
# TRIGGERS, ACTUAL: `schedule` (every 15 minutes) and `workflow_dispatch`.
# It reads open PRs, but no PR event starts it: the owner's decision for the
# sweeps it took over (Q-SPD-5c, Q-SPD-9b A, Q-SPD-3 B — a sweep, off the
# critical path) and the owner's request of 2026-11-05 ("all speed
# improvements") to cut runner requests.
name: Scheduled sweeps (one dispatcher)

on:
  schedule:
    # Off the quarter-hours, where GitHub's scheduler queues heaviest.
    - cron: '4,19,34,49 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: read  # the merge-train opt-in: who added the label (bean hd58)
  statuses: read
  checks: read
  actions: write  # list artifacts and runs; dispatch the workflows; read and prune the Actions cache

# A tick that finds the previous one still running is not needed.
concurrency:
  group: sweeps
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Staging publish — anything waiting?
        id: publish
        continue-on-error: true
        run: |
          set -euo pipefail
          n=$(gh api --paginate "repos/$REPO/actions/artifacts?per_page=100" \
            --jq '[.artifacts[] | select(.expired == false and (.name | startswith("staging-site-")) and .workflow_run.head_repository_id != null and .workflow_run.head_repository_id == .workflow_run.repository_id)] | length' | awk '{s+=$1} END{print s+0}')
          echo "staging-publish: $n preview artifact(s) waiting"
          [ "$n" -gt 0 ] || exit 0
          # A publisher queued or running drains the whole queue already.
          busy=0
          for st in queued in_progress waiting pending; do
            k=$(gh api "repos/$REPO/actions/workflows/staging-publish.yml/runs?status=$st&per_page=1" --jq '.total_count')
            busy=$((busy + k))
          done
          if [ "$busy" -gt 0 ]; then echo "a publisher is already queued or running ($busy)"; exit 0; fi
          gh workflow run staging-publish.yml -R "$REPO"
          echo "dispatched staging-publish.yml"

      - name: Preview verify sweep
        id: verify
        continue-on-error: true
        run: bash .github/scripts/preview-verify-sweep.sh

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - name: Re-pin train verdict — does an open train wait?
        id: repin
        continue-on-error: true
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          shas=$(bun .github/scripts/repin-train.ts pending)
          if [ -z "$shas" ]; then echo "no open train waits for a verdict"; exit 0; fi
          echo "trains waiting for a verdict:"; echo "$shas"
          busy=0
          for st in queued waiting pending; do
            k=$(gh api "repos/$REPO/actions/workflows/repin-train-verdict.yml/runs?status=$st&per_page=1" --jq '.total_count')
            busy=$((busy + k))
          done
          if [ "$busy" -gt 0 ]; then echo "a verdict run is already queued ($busy)"; exit 0; fi
          gh workflow run repin-train-verdict.yml -R "$REPO"
          echo "dispatched repin-train-verdict.yml (judges every open train)"

      - name: Merge train — a train to judge, or a batch ready? (bean hd58)
        id: train
        continue-on-error: true
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          # The same off switch merge-train.yml reads, so a workflow PR counts as ready only when the train may carry it.
          MERGE_TRAIN_CARRIES_WORKFLOWS: ${{ vars.MERGE_TRAIN_CARRIES_WORKFLOWS == 'true' && (vars.HARNESS_BOT_ID != '' || secrets.PUSH_BRANCH_TRIGGERING_CI != '') }}
        run: |
          set -euo pipefail
          why=$(bun .github/scripts/merge-train.ts pending)
          if [ -z "$why" ]; then echo "merge train: nothing to do"; exit 0; fi
          echo "merge train: $why"
          busy=0
          for st in queued in_progress waiting pending; do
            k=$(gh api "repos/$REPO/actions/workflows/merge-train.yml/runs?status=$st&per_page=1" --jq '.total_count')
            busy=$((busy + k))
          done
          if [ "$busy" -gt 0 ]; then echo "a merge-train run is already queued or running ($busy)"; exit 0; fi
          gh workflow run merge-train.yml -R "$REPO"
          echo "dispatched merge-train.yml"

      - name: Conflicted PRs — stage the ones whose head has no preview run
        id: conflicted
        continue-on-error: true
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r num ref sha; do
            [ -n "$num" ] || continue
            # `dirty` licenses only "conflicts" (bean yv4z); `unknown` is not computed yet (bean h2s9).
            state=$(gh api "repos/$REPO/pulls/$num" --jq '.mergeable_state // "unknown"')
            [ "$state" = "dirty" ] || continue
            runs=$(gh api "repos/$REPO/actions/workflows/feature-staging.yml/runs?head_sha=$sha&per_page=1" --jq '.total_count')
            if [ "$runs" -gt 0 ]; then echo "#$num ($ref) conflicts; its head ${sha:0:12} already has a Feature Staging run"; continue; fi
            echo "#$num ($ref) conflicts and head ${sha:0:12} has no Feature Staging run: dispatching it on its branch"
            gh workflow run feature-staging.yml -R "$REPO" --ref "$ref" || echo "::warning::could not dispatch Feature Staging for #$num ($ref)"
          done < <(gh api --paginate "repos/$REPO/pulls?state=open&per_page=100" \
            --jq '.[] | select(.head.repo.full_name == "'"$REPO"'") | [.number, .head.ref, .head.sha] | @tsv')

      # Once a day (the first tick of 06:00-06:14 UTC) or on a dispatch: the hit rate of every
      # `cached-step` and the Actions cache budget, and delete the entries of
      # closed PRs' merge refs, which no run can read any more
      # (`.github/actions/cached-step/README.md`, "Budget").
      - name: Cache report — hit rate per step, budget (daily)
        id: cache
        continue-on-error: true
        run: |
          set -uo pipefail
          if [ "${{ github.event_name }}" != workflow_dispatch ] && ! [[ "$(date -u +%H%M)" =~ ^06(0|1[0-4]) ]]; then
            echo "not the daily tick"; exit 0
          fi
          bash .github/scripts/cache-report.sh --hours 24 --prune --json "$RUNNER_TEMP/cache-report.json"

      # The raw facts the cache viewer reads (cat-harness-tools `caches:viz --stored`).
      - name: Upload the cache report for the viewer
        if: steps.cache.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        continue-on-error: true
        with:
          name: cache-report
          path: ${{ runner.temp }}/cache-report.json
          retention-days: 14
          overwrite: true
          if-no-files-found: ignore

      - name: Any sweep failed?
        if: steps.publish.outcome == 'failure' || steps.verify.outcome == 'failure' || steps.repin.outcome == 'failure' || steps.train.outcome == 'failure' || steps.conflicted.outcome == 'failure' || steps.cache.outcome == 'failure'
        run: |
          echo "::error::a sweep failed — publish=${{ steps.publish.outcome }} verify=${{ steps.verify.outcome }} repin=${{ steps.repin.outcome }} train=${{ steps.train.outcome }} conflicted=${{ steps.conflicted.outcome }} cache=${{ steps.cache.outcome }}"
          exit 1
