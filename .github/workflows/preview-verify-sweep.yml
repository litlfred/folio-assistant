# Verify agent-built previews, one at a time, off the critical path.
#
# Owner, 2026-11-01, Q-SPD-9 B and Q-SPD-9b A (folio-assistant#2881): a PR
# preview may go live from an agent's own build. When the PR's Feature
# Staging run finds an agent record for its exact tree, it builds nothing and
# leaves a pending `preview/agent-build` status on the head commit. This sweep
# is the queue that status forms: it finds the oldest pending one and
# dispatches Feature Staging in verify mode (`verify_pr`), which rebuilds the
# same tree IN FULL, compares every file, and replaces the preview if
# anything differs.
#
# LOW PRIORITY by construction: at most ONE verify runs at a time, and the
# sweep starts the next only when none is queued or running. A preview's
# reviewer never waits on it; the merge does (`preview/agent-build`).
#
# Why a sweep and not a queued job: a PENDING job in a shared concurrency group
# is cancelled by the next arrival rather than kept (measured 2026-09-19, see
# `feature-staging.yml`'s `stage` job). A sweep loses nothing that way: a
# verify cancelled or never started is still pending, and the next sweep
# finds it.
#
# Main and release builds never come here: they are CI-built, always.
#
# TRIGGERS, ACTUAL: workflow_dispatch only. The 15-minute tick is now
# `sweeps.yml`, which runs the same script (`.github/scripts/preview-verify-sweep.sh`)
# inside its one scheduled job, so the tick costs no runner of its own
# (runner-request cuts, 2026-11-05). It reads open PRs; no PR event starts it,
# by the owner's decision (Q-SPD-9b A): one verify at a time, off the critical
# path, which a per-PR trigger could not hold.
name: Preview verify sweep

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  statuses: read
  actions: write

concurrency:
  group: preview-verify-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Dispatch the oldest pending verify, when none is running
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: bash .github/scripts/preview-verify-sweep.sh
