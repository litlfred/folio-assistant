# Verify agent-built previews, one at a time, off the critical path.
#
# Owner, 2026-11-01, Q-SPD-9 B and Q-SPD-9b A (folio-assistant#2881): a PR
# preview may go live from an agent's own build. When the PR's Feature
# Staging run finds an agent record for its exact tree, it builds nothing and
# leaves a pending `preview/agent-build` status on the head commit. This sweep
# is the queue that status forms: it finds the oldest pending one and
# dispatches Feature Staging in verify mode (`verify_pr`), which rebuilds the
# same tree IN FULL, compares every file, and replaces the preview if
# anything differs.
#
# LOW PRIORITY by construction: at most ONE verify runs at a time, and the
# sweep starts the next only when none is queued or running. A preview's
# reviewer never waits on it; the merge does (`preview/agent-build`).
#
# Why a sweep and not a queued job: a PENDING job in a shared concurrency group
# is cancelled by the next arrival rather than kept (measured 2026-09-19, see
# `feature-staging.yml`'s `stage` job). A sweep loses nothing that way: a
# verify cancelled or never started is still pending, and the next sweep
# finds it.
#
# Main and release builds never come here: they are CI-built, always.
name: Preview verify sweep

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  statuses: read
  actions: write

concurrency:
  group: preview-verify-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Dispatch the oldest pending verify, when none is running
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          # One verify at a time: a verify is a Feature Staging dispatch run.
          # Any dispatch counts (a cleanup too): waiting a sweep costs nothing.
          busy=0
          for st in queued in_progress waiting pending; do
            n=$(gh api "repos/$REPO/actions/workflows/feature-staging.yml/runs?event=workflow_dispatch&status=$st&per_page=20" \
              --jq '.total_count')
            busy=$((busy + n))
          done
          if [ "$busy" -gt 0 ]; then
            echo "a Feature Staging dispatch is already queued or running ($busy): the next sweep tries again"
            exit 0
          fi
          # The queue: open PRs whose head commit has `preview/agent-build`
          # pending. Oldest head commit first.
          best=""; best_at=""
          while IFS=$'\t' read -r num ref sha; do
            [ -n "$num" ] || continue
            # Newest first, so [0] is the status as it stands.
            line=$(gh api "repos/$REPO/commits/$sha/statuses?per_page=100" \
              --jq '[.[] | select(.context == "preview/agent-build")][0] | "\(.state // "")\t\(.created_at // "")"')
            state="${line%%$'\t'*}"; at="${line#*$'\t'}"
            [ "$state" = "pending" ] || continue
            echo "pending: #$num ($ref) since $at"
            if [ -z "$best_at" ] || [[ "$at" < "$best_at" ]]; then best="$num"$'\t'"$ref"; best_at="$at"; fi
          done < <(gh api --paginate "repos/$REPO/pulls?state=open&per_page=100" \
            --jq '.[] | select(.head.repo.full_name == "'"$REPO"'") | [.number, .head.ref, .head.sha] | @tsv')
          if [ -z "$best" ]; then
            echo "no agent-built preview is waiting for a verify"
            exit 0
          fi
          num="${best%%$'\t'*}"; ref="${best#*$'\t'}"
          echo "dispatching the verify of #$num ($ref)"
          gh workflow run feature-staging.yml -R "$REPO" -f branch="$ref" -f verify_pr="$num"
