# Dependabot — the other half of `j41m`, and deliberately not the same half.
#
# `check:dependency-advisories` (warn-only, in code-quality-gates.yml) answers
# "is anything we depend on known-vulnerable, TODAY, on this PR?" It reports
# and never blocks, because a transitive advisory nobody can patch must not
# red every PR — the suppression that follows is what rots.
#
# Dependabot answers the other question: "what would fixing it look like?" It
# turns an advisory into a reviewable PR with the bump already made. One tells
# you; the other does the work. Neither gates a merge.
#
# ## Only what THIS repository holds (bean `197s`, re-measured 2026-10-20)
#
# Since the separation this is an INDEX checkout: every instance arrives by
# remote mount (`index.lock.json`), and `git ls-files` holds exactly one
# `package.json` — the root's, which declares NO dependencies (its
# `workspaces` name mounts, not committed directories). The npm block that
# listed `/cat-harness/schemas`, `/cat-harness/schemas/block-qa-schema`,
# `/cat-harness-tools/scripts/tests` and `/cat-harness-tools/adapters/mcp-server`
# — and the pip entry for `/cat-harness-tools/python` — named directories that
# do not exist in this repository, so Dependabot scanned nothing there and
# reported nothing: the `dh4f` shape, a consumer over an empty directory.
#
# Those manifests belong to their instances' own repositories, and each
# instance's Dependabot lives there (cat-harness-tools carries its pip and
# Actions entries since this change). What stays here is what is committed
# here: the Python helpers under `.github/scripts` and the workflows.
#
# The bun question this file used to defer (does Dependabot regenerate
# `bun.lock`?) moves with the npm manifests: it is answered in a repository
# whose `package.json` has dependencies, not in one whose root has none.

version: 2
updates:
  # ── pip ────────────────────────────────────────────────────────────────
  - package-ecosystem: pip
    directories:
      - "/.github/scripts"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    labels:
      - dependencies
    commit-message:
      prefix: "deps"

  # ── GitHub Actions ─────────────────────────────────────────────────────
  # This one is load-bearing beyond hygiene: an action is code this repository
  # executes with its own token on every push. `check:workflow-injection`
  # guards what the workflows THEMSELVES do with untrusted input; nothing
  # guards the actions they call. A stale `actions/checkout@v4` is a supply
  # chain this repo had no eyes on at all.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "ci"
