# bootstrap-tools's checks on every pull request (owner, 2026-10-14: every
# harnessed layer is judged by ONE reusable workflow the harness owns, and
# "there shouldnt be copying of code"). Everything is decided there.
name: Harness PR checks
on:
  pull_request:
    # Draft PRs run only the fast tier (bean dft1, issue 616 of the shared workflow);
    # ready_for_review re-runs the full tier the moment a PR is marked ready.
    types: [opened, synchronize, reopened, ready_for_review]
  # main's own run keeps main's answer, the gate seconds and the cone records
  # in caches every PR can read (PRs #406 and #411 of the workflow it calls); a run on a PR
  # can only read caches saved from its own PR or from main.
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    uses: litlfred/cat-harness-tools/.github/workflows/layer-pr-checks.yml@main
    with:
      # On a draft PR: prepare and typecheck only; the full tier runs on ready_for_review.
      draft-fast-tier: true
      # One job a side, not four (Q-CIS-2 A, fix 1). This layer's tests and
      # gates are about 6 minutes of work in all (four shards of 1.4-1.9 min,
      # measured 2026-11-01), while each extra job waits for a runner.
      gate-shards: 1
