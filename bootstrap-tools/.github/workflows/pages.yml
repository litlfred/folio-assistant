# The site at https://litlfred.github.io/bootstrap-tools/ (landing on README.html) — every README here
# as one page with a table of contents, beside every file as it sits, and this
# repository's graph (bootstrap-tools.jsonld) with its named subgraphs under
# subgraph/.
#
# Staged by scripts/site.ts and committed onto the gh-pages branch as a full
# replace; GitHub Pages builds the branch (Jekyll). Pages must be on, serving
# gh-pages, and the branch must exist first (owner, 2026-10-01) —
# `bun run scripts/init.ts --root .` checks both (site:branch, site:enabled).
# The process is processes/render-kg-to-github-pages.bpmn.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: bootstrap-tools
      # Beside the tools, read-only: this repository's graph and its named
      # subgraphs are written in bootstrap's classes, so site.ts reads
      # bootstrap's namespace from its declaration (export-graph.ts). Public,
      # so no secret.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: litlfred/bootstrap
          path: bootstrap
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Install
        working-directory: bootstrap-tools
        run: bun install --frozen-lockfile
      - name: Check every link on the README page lands
        working-directory: bootstrap-tools
        run: bun run scripts/readme-book.ts --root . --check
      - name: Stage the site
        working-directory: bootstrap-tools
        run: bun run scripts/site.ts --root . --out ../_site-src
      # The publish step is a plain script, not workflow shell, so an agent or a
      # person runs the same two commands (site.ts, then publish-site.ts) with
      # their own git credentials (owner, 2026-10-04, bootstrap-tools#7).
      - name: Publish the staged site onto gh-pages (full replace; rebuild, never rebase)
        working-directory: bootstrap-tools
        env:
          REMOTE: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: >-
          bun run scripts/publish-site.ts --site ../_site-src --remote "$REMOTE"
          --message "Publish ${{ github.sha }}"
          --name "github-actions[bot]" --email "41898282+github-actions[bot]@users.noreply.github.com"
