# fhir-harness's checks on every pull request (owner, 2026-10-14: every
# harnessed layer is judged by ONE reusable workflow the harness owns, and
# "there shouldnt be copying of code"). Everything is decided there.
name: Harness PR checks

on:
  pull_request:
    # Draft PRs run only the fast tier (bean dft1, cat-harness-tools#616);
    # ready_for_review re-runs the full tier the moment a PR is marked ready.
    # closed: the PR's runs are cancelled (the `cancel` job below).
    types: [opened, synchronize, reopened, ready_for_review, closed]
  # main's own run keeps main's answer, the gate seconds and the cone records
  # in caches every PR can read (cat-harness-tools#406, #411); a run on a PR
  # can only read caches saved from its own PR or from main.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    uses: litlfred/cat-harness-tools/.github/workflows/layer-pr-checks.yml@main
    with:
      # On a draft PR: prepare and typecheck only; the full tier runs on ready_for_review.
      draft-fast-tier: true
      # The IG site imports cat-harness-tools' shared page layout by path (`scripts/page-layout.ts`), not by package name, so
      # `auto` cannot see it. Take it at main, which a pin in the index may predate.
      layers-at-main: cat-harness-tools
  # Post-merge QA of main (owner, 2026-10-30, "Both"): the push run above
  # judged main's whole gate set; this keeps one `main-red` issue open while
  # main is red and closes it when main is green. See
  # https://github.com/litlfred/cat-harness-tools/blob/main/.github/workflows/layer-main-qa.yml
  main-qa:
    needs: checks
    if: ${{ !cancelled() && github.event_name == 'push' }}
    permissions:
      contents: read
      issues: write
      actions: read
    uses: litlfred/cat-harness-tools/.github/workflows/layer-main-qa.yml@main
    with:
      verdict: ${{ needs.checks.outputs.main-verdict }}
      failures: ${{ needs.checks.outputs.main-failures }}
      checks-result: ${{ needs.checks.result }}
  # A PR closed or merged: every queued or running run on its head branch,
  # of any workflow, is cancelled (owner, 2026-10-30, "Both"). This workflow
  # already ran on `closed`, which cancelled only its own run through the
  # checks' concurrency.
  cancel:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    permissions:
      actions: write
    uses: litlfred/cat-harness-tools/.github/workflows/layer-cancel-on-close.yml@main
