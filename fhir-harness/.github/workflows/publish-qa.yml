# Publish this layer's QA results (its declared `qa` directory,
# test/results/) to the cat/cat-harness/qa-reports branch of THIS repository,
# keyed by commit: main/<sha> on a push to main, pr/<n>/<sha> on a pull
# request. An index that mounts this layer reads them at the commit its
# lock pins. The branch is created on the first run.
#
# Bean folio-assistant-7mwa; owner, 2026-11-03, "2. Each layer publishes".
# Reusable workflow: litlfred/cat-harness-tools#1427.
name: Publish QA results
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    uses: litlfred/cat-harness-tools/.github/workflows/layer-qa-publish.yml@f14a21207e6ede9057df031af3bc3aa3d6268a6a # main at litlfred/cat-harness-tools#1427; trails index.lock.json until this layer re-pins cat-harness-tools
    with:
      instance: fhir-harness
