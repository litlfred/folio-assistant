# TEMPLATE — an IG repository's OWN site, built with the folio-assistant
# harness and published to that repository's gh-pages (#2235, bean mftp).
#
# Copy to `.github/workflows/folio-site.yml` in the IG repository and replace
# the two placeholders:
#   @@INSTANCE@@  the folio-assistant instance that IS this IG (e.g. my-ig)
#   @@LABEL@@     the label its navbar home row carries (e.g. My Implementation Guide)
# The repository needs folio-assistant as a submodule at `folio-assistant/`.
#
# The site wears the MAIN site's chrome — search, the locale selector, the
# harness navbar — because the IG is composed INTO a chrome-only copy of the
# main site's Jekyll source (`compose-docs --shell`) at its root
# (`stage-ig-sites --compose-at-root`), and the shell's navbar is rendered for
# THIS instance (`gen-navbar-include --instance`): this IG first, then the
# harnesses it is built on, every other link to the main site.
#
# The base path is the REPOSITORY'S name on GitHub Pages, read rather than
# assumed, so the site is right whatever the repository is called.
name: folio site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: folio-site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      INSTANCE: "@@INSTANCE@@"
      LABEL: "@@LABEL@@"
      BASE: /${{ github.event.repository.name }}
      MAIN_SITE: https://litlfred.github.io/folio-assistant
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: oven-sh/setup-bun@v2

      - name: Install folio-assistant
        working-directory: folio-assistant
        run: bun install --frozen-lockfile

      - name: Set up Ruby for the site
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: folio-assistant/cat-harness/docs

      - name: The main site's chrome, with this instance's navbar
        working-directory: folio-assistant
        run: |
          # --instance/--title/--link-root scope the shell's harness data to THIS
          # IG (#2263): its tiles, icon row, rail scope and title, with the
          # main site's graphs linked there and none of its counts shown here.
          bun run cat-harness/scripts/compose-docs.ts --out "$RUNNER_TEMP/docs" --shell \
            --instance "$INSTANCE" --title "$LABEL" --link-root "$MAIN_SITE"
          bun run cat-harness/scripts/gen-navbar-include.ts --instance "$INSTANCE" \
            --link-root "$MAIN_SITE" --title "$LABEL" \
            --out "$RUNNER_TEMP/docs/_includes/generated/navbar-footer.html"

      - name: Compose this IG at the site root
        working-directory: folio-assistant
        run: |
          curl -sSfL --retry 5 --retry-delay 15 --retry-all-errors -o "$RUNNER_TEMP/plantuml.jar" \
            https://repo1.maven.org/maven2/net/sourceforge/plantuml/plantuml/1.2024.7/plantuml-1.2024.7.jar
          # The work directory is OUTSIDE the checkout: the source copy is the
          # checkout, and a work directory inside it would copy itself.
          bun run fhir-harness/scripts/stage-ig-sites.ts --work "$RUNNER_TEMP/ig" --baseurl "$BASE" \
            --only "$INSTANCE" --source .. --plantuml-jar "$RUNNER_TEMP/plantuml.jar" \
            --compose-into "$RUNNER_TEMP/docs" --compose-at-root

      - name: Build the site
        run: |
          BUNDLE_GEMFILE="$PWD/folio-assistant/cat-harness/docs/Gemfile" bundle exec jekyll build \
            --source "$RUNNER_TEMP/docs" --destination ./_site --baseurl "$BASE"
          bun run folio-assistant/fhir-harness/scripts/build-ig-site.ts --dedupe-ids ./_site
          # The served data the JSON and DAK views fetch (`../fhir-artifact-index/`).
          cp -a "folio-assistant/${INSTANCE}/fhir-artifact-index" ./_site/fhir-artifact-index
          touch ./_site/.nojekyll

      - name: Give any page Jekyll did not lay out the same navbar
        working-directory: folio-assistant
        run: |
          bun run cat-harness/scripts/rail-standalone-pages.ts --site ../_site --built cat-harness \
            --foreign-site --home-label "$LABEL" --instance "$INSTANCE"

      - name: Publish to gh-pages
        if: github.ref == 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: _site
