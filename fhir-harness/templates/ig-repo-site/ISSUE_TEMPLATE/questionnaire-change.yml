# TEMPLATE — copy to `.github/ISSUE_TEMPLATE/questionnaire-change.yml` in an IG
# repository, unchanged: it has no placeholders. It is for a person filing a
# change by hand. The ✍ suggest editor's Questionnaire mode does not open it:
# GitHub ignores a prefilled `body` when `template=` names an issue form, so it
# opens a plain issue whose body carries the same fields (`questionnaire`,
# `edited`, `patch`, `items`, `source`, and the reason).
# Skill: fhir-harness `fhir-questionnaire-wireframe`, step 7.
name: Suggest a change to a form (Questionnaire)
description: Propose a change to a Questionnaire, or to the wireframe it was derived from. To have it written for you, use the ✍ suggest link on the form page instead.
title: "Suggested edit: Questionnaire/"
labels: ["questionnaire-change"]
body:
  - type: markdown
    attributes:
      value: |
        Say which form, which side you changed, and what the change is. An editor applies it to the side you changed and brings the other side back in line, then posts preview links here.
  - type: input
    id: questionnaire
    attributes:
      label: Questionnaire
      description: Its canonical URL, or `Questionnaire/<id>`.
      placeholder: Questionnaire/example-intake
    validations:
      required: true
  - type: dropdown
    id: edited
    attributes:
      label: What did you change?
      description: The side you edited is the source of this change; the other one is brought in line with it.
      options:
        - questionnaire
        - wireframe
    validations:
      required: true
  - type: textarea
    id: items
    attributes:
      label: Items, before and after
      description: A readable table of the items that changed. The ✍ editor writes it; by hand, describe each change in words.
    validations:
      required: true
  - type: textarea
    id: patch
    attributes:
      label: JSON Patch (RFC 6902)
      description: Over the built Questionnaire JSON, each path annotated with the item's linkId. Optional when you fill this in by hand.
      render: json
  - type: input
    id: source
    attributes:
      label: Source
      description: The FSH file and line the item comes from, when known.
  - type: textarea
    id: rationale
    attributes:
      label: Why
      description: What the change is for.
