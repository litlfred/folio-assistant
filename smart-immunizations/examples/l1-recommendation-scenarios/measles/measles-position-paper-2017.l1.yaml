# L1 source for the measles DAK: WHO measles vaccines position paper, April 2017.
#
# AUTHORED, not generated. This file is the reviewable source; tools/build_l1.py turns it into a
# smart-kg L1 graph document (build/, gitignored -- see smart-kg docs/STORAGE.md).
#
# Rules this file keeps:
#   * every `statement`, `text` and `quote` is VERBATIM from the English column of the PDF, and the
#     build fails if it cannot find it on the stated page(s) of library/wer-92-17/WER9217.en.txt;
#   * strength and certainty are NOT recorded: the position paper does not state GRADE strength or
#     certainty per recommendation (it points at separately published evidence-to-recommendation
#     tables). Absence is recorded, not invented;
#   * background epidemiology (incidence, case-fatality, cost-effectiveness figures) is not turned
#     into recommendations;
#   * which sentences count as a recommendation, and the PICO and health-intervention groupings,
#     are judgements, so those nodes and edges are emitted as `inferred` or `decided`.
#
# Ontology: litlfred/smart-kg ontology/l1/l1.json, schemaVersion 1.0, main @ 66a9b13.

