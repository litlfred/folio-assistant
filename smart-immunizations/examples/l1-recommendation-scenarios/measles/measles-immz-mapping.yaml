    process: {id: could-not-determine, source: inferred, basis: "Cold-chain storage has no IMMZ process (logistics belongs to an LMIS)."}
    act: store freeze-dried measles vaccine refrigerated below +8 °C
    outcome: the vaccine keeps its potency
    domain: {code: health-system-strengthening, source: inferred, basis: "Supply chain."}

  V02:
    personas:
      - {id: health-worker-hw, source: inferred, basis: "The health worker prepares the session's vaccine and diluent."}
    process: {id: IMMZ.B, source: inferred, basis: "Cooling the diluent to 2–8 °C before reconstitution is preparing the session's supply — IMMZ.B. Storing it unfrozen at ambient temperature beforehand is logistics."}
