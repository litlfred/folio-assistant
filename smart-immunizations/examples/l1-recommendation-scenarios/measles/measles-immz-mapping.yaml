    outcome: reconstitution does not damage the vaccine
    domain: {code: health-system-strengthening, source: inferred, basis: "Supply chain."}

  V03:
    personas:
      - {id: epi-manager, source: inferred, basis: "Cold-chain and storage management is the EPI manager's."}
    process: {id: could-not-determine, source: inferred, basis: "Storage protected from light has no IMMZ process."}
    act: store the vaccine in coloured glass vials protected from sunlight
    outcome: light does not inactivate the vaccine
    domain: {code: health-system-strengthening, source: inferred, basis: "Supply chain."}

  V04:
    personas:
      - {id: health-worker-hw, source: inferred, basis: "The health worker reconstitutes and uses the vial."}
    process: {id: IMMZ.D, source: inferred, basis: "Handling a reconstituted vial during the session is part of administering it — IMMZ.D. The remark (fatal errors from contaminated vials) makes it a safety step."}
    act: keep reconstituted vaccine in the dark at 2–8 °C and discard it after 6 hours
    outcome: no client receives contaminated or inactive vaccine
    domain: {code: health-system-strengthening, source: inferred, basis: "Vaccine handling."}

  V05:
    personas:
      - {id: health-worker-hw, source: inferred, basis: "The health worker checks the client's current illness."}
    process: {id: IMMZ.D, source: inferred, basis: "IMMZ.D5.DT.Measles contraindications (precaution for acute illness)."}
    act: vaccinate a client with a mild concurrent infection, but defer MCV for high fever or other serious acute illness
    outcome: minor illness is not a missed opportunity, and serious illness is not confounded
    domain: {code: clinical, source: inferred, basis: "A per-client precaution."}

