# Publish this layer's JSON-LD context to gh-pages, at
# <iriBase>ns.context.v1.jsonld, on every push to main (bean
# 63q4, owner 2026-10-15). Beside the vocabulary, not under ns/ (owner
# 2026-10-15, D1): this layer's ns is a document, served at <iriBase>v<major>/ns,
# so ns/ cannot also be a directory there. The reusable workflow reads the
# path off the build, so nothing here spells it. Everything is decided in the
# reusable workflow: it builds only this instance's context, writes that one
# path to gh-pages (nothing else there is touched), creates gh-pages if absent,
# and skips with a notice while the instance declares no iriBase.
# GitHub Pages is switched on once, by hand: Settings -> Pages ->
# "Deploy from a branch: gh-pages, / (root)".
name: Publish JSON-LD context
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    uses: litlfred/cat-harness-tools/.github/workflows/layer-publish-context.yml@main
