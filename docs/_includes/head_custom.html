<!--
  Site-wide styling for the BPMN workflow figures.

  just-the-docs pulls this file into <head> on every page. The diagrams are wide
  (a swimlane process does not shrink well), so the figure scrolls horizontally
  inside its own container rather than forcing the page body to scroll.

  The SVGs carry their own white backdrop — see scripts/render-bpmn.ts — so they
  stay legible under the dark colour scheme even if this stylesheet is missing.
-->
<style>
  .bpmn-figure {
    overflow-x: auto;
    background: #fff;
    border: 1px solid rgba(128, 128, 128, 0.35);
    border-radius: 6px;
    margin: 1em 0 0.4em;
  }
  .bpmn-figure img {
    display: block;
    width: 100%;
    min-width: 1200px;
    max-width: none;
  }
  .bpmn-source {
    margin-top: 0;
    font-size: 0.75rem;
  }
</style>

<!--
  Site UI: a QR of the current page in the sidebar header, and zoom /
  full-width controls on the figures.

  Loaded as same-origin files with no inline script, so no script-src
  relaxation is needed. The QR is generated in the browser from
  window.location.href rather than baked per page at build time, so it is
  right for anchors, query strings, and both the directory and .html forms of
  the same page. The UTF-8 shim must come after the encoder: without it the
  encoder's stringToBytes is single-byte and a non-ASCII character in a URL
  silently encodes to mojibake.
-->
<!--
  The configured colour scheme, published for docs/assets/js/docs-ui.js.

  just-the-docs' first stylesheet is `just-the-docs-default.css`, which is
  whatever `color_scheme` in _config.yml compiled to -- so `jtd.getTheme()`
  returns the string "default" on a fresh load, never "dark". The scheme
  toggle needs to know what "default" MEANS here, and reading it from the
  config is the one way that does not go stale when the config changes.
-->
<script type="application/json" id="fa-site-scheme">{"scheme": "{{ site.color_scheme | default: 'light' }}"}</script>
<!--
  Translation metadata for this page, consumed by docs-ui.js to auto-render
  language coverage and QA badges. The translation pipeline stamps front matter;
  this block publishes it to the client. No manual editing needed.
-->
<script type="application/json" id="fa-translation-meta">{
  "lang": "{{ page.lang | default: 'en' }}",
  "translationStatus": "{{ page.translation_status | default: '' }}",
  "translationSource": "{{ page.translation_source | default: '' }}",
  "supportedLocales": {{ site.translation_locales | default: '["ar","zh","en","fr","ru","es"]' }},
  "availableLocales": {{ page.available_locales | jsonify | default: '[]' }},
  "sweep": {
    "run": {% if site.data.translation-qa %}true{% else %}false{% endif %},
    "sweptAt": "{{ site.data.translation-qa.sweptAt | default: '' }}",
    "totalPages": {{ site.data.translation-qa.totalPages | default: 0 }},
    "pagesWithTranslations": {{ site.data.translation-qa.pagesWithTranslations | default: 0 }},
    "complete": {% if site.data.translation-qa.complete %}true{% else %}false{% endif %}
  }
}</script>
<link rel="stylesheet" href="{{ '/assets/css/docs-ui.css' | relative_url }}">
<script src="{{ '/assets/js/vendor/qrcode.js' | relative_url }}" defer></script>
<script src="{{ '/assets/js/vendor/qrcode_UTF8.js' | relative_url }}" defer></script>
<script src="{{ '/assets/js/docs-ui.js' | relative_url }}" defer></script>

<!--
  The landing panel — the instance's declared description drawn inside the
  quiet part of its declared backdrop. Markup: `_includes/landing.html`.

  The region comes in as custom properties (`--fl-x` …) set per instance from
  `cat-harness.json`, so this stylesheet knows nothing about where any
  particular picture is quiet. That is the whole design: a downstream folio
  swaps the art and the numbers and needs no CSS.
-->
<style>
  .folio-landing { position: relative; margin: 0 0 2rem; }
  .folio-landing__art { display: block; }
  .folio-landing__art img {
    display: block; width: 100%; height: auto; border-radius: 8px;
  }
  .folio-landing__text {
    position: absolute;
    /* The properties are set by `landing.html`, per breakpoint, from each
       variant's OWN region — the swap has to happen at the same breakpoint as
       the `<picture>` swap or the words stay where the wide crop was quiet. */
    left: var(--fl-x); top: var(--fl-y);
    width: var(--fl-w); height: var(--fl-h);
    /* The type scales with THIS BOX, not with the picture and not with the
       viewport — so `cqw` below is a fraction of the space the words actually
       have. Sizing against the picture was the second attempt and it is wrong
       for a reason worth keeping: each layout's box is a different fraction of
       its image (62.5% wide on the laptop crop, 72% on the phone), so one
       ratio against the image is too small on one and too large on another.
       Against the box, one ratio is right everywhere. */
    container-type: inline-size;
    display: flex; flex-direction: column; justify-content: center;
    /* `overflow: visible`, deliberately. The region is where the text is AIMED,
       not a clip path: it is centred in the quiet area, so a description too
       long for the box grows symmetrically into the margin that area has on
       either side. `hidden` was the first version and it silently truncated
       the last line on the square crop — a landing page that drops words is
       strictly worse than one whose words sit a little proud of their box. */
    overflow: visible;
    /* The cloud is cream in both colour schemes — it is part of the picture,
       not of the theme — so the overlay fixes its own ink rather than
       inheriting a light-on-light body colour under `color_scheme: dark`. */
    color: #2f4636;
  }
  .folio-landing__text > :first-child { margin-top: 0; }
  .folio-landing__text > :last-child { margin-bottom: 0; }
  .folio-landing__text p {
    margin: 0; line-height: 1.35; font-weight: 600;
    /* 3.1% of the picture's width. Bounded at both ends because the picture is
       not the only constraint: below ~11px nobody can read it however roomy
       the cloud, and on a 4K monitor an unbounded ratio is absurd. The
       fallback is for browsers without container queries — they get the old
       viewport-relative behaviour rather than a default 16px that overflows. */
    /* 3.6% of the box's width, ceiling 1.35rem. Derived rather than picked:
       the longest line here is 47 characters, a bold sans runs about 0.52em
       per character, and 47 x 0.52 x F must stay under the box width — which
       gives F <= 0.0387 of it. 4.2% was the first try and it wrapped that line
       on the laptop crop, pushing a fifth line down onto the cat's ear. Bounded at both ends
       because the box is not the only constraint — below ~11px nobody can read
       it however roomy the cloud, and on a 4K monitor an unbounded ratio is
       absurd. The first declaration is the fallback for browsers without
       container queries: viewport-relative, rather than a default 16px that
       overflows the cloud. */
    font-size: clamp(0.7rem, 1.6vw, 1.35rem);
    font-size: clamp(0.7rem, 3.6cqw, 1.35rem);
  }

  /* No declared region → the picture stands alone and the words go beneath it.
     Guessing a position is how text lands on the cat. */
  .folio-landing--no-region .folio-landing__text,
  .folio-landing--plain {
    position: static; width: auto; height: auto; color: inherit;
  }
  .folio-landing--no-region .folio-landing__text { margin-top: 1rem; }
  .folio-landing--no-region .folio-landing__text p,
  .folio-landing--plain p { font-size: inherit; font-weight: inherit; }

  @media (prefers-reduced-motion: no-preference) {
    .folio-landing__art img { transition: opacity .2s ease; }
  }
</style>
