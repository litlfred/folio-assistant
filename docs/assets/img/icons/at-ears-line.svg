<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="c@t-harness">
  <title>c@t-harness — an at-sign with ears</title>
  <g fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- ears, sitting on the ring -->
    <path d="M20.5 17.6 L11 5.5 L13.9 25.5" />
    <path d="M43.5 17.6 L53 5.5 L50.1 25.5" />
    <!-- the ring, open at the lower right like a real @ -->
    <path d="M38.84 52.79 A20 20 0 1 1 50.79 40.84" />
    <!-- the inner a -->
    <circle cx="30" cy="34" r="6.5" />
    <path d="M36.5 27.5 L36.5 39 q0 4 5.5 4.6" />
  </g>
</svg>
