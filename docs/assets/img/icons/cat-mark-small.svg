<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="c@t-harness">
  <title>c@t-harness — the same mark, simplified for small sizes</title>
  <!--
    SIMPLIFIED MEANS THICKER, NOT SMALLER. Measured 2026-09-19 at the sidebar's
    1.5rem (24 px, so x0.2 against this 120-unit viewBox).

    The ears DELIBERATELY cross the ring — `cat-mark.svg` says so: "the ears
    grow out of the top of the bowl and cross the ring". An ear tip sits 42.3
    units from the ring centre and the ring band spanned 36.8-48.8 before this
    change (35.8-49.8 after it), so the cat
    and the ring overlap BY DESIGN and the only thing telling them apart is the
    white halo drawn around the cat's outline.

    That halo was `stroke-width="3"` — 0.6 px at 24 px. Sub-pixel, so the two
    sage shapes fused into a disc and the mark read as a blob with a pale
    smudge in it. Shrinking the cat would have been the wrong fix: it would
    have destroyed the crossing the design is built on to solve a problem the
    crossing does not cause.

    So: halo 3 -> 8 (1.6 px at 24 px, a real gap) and ring 12 -> 14 (2.8 px, so
    the band still reads as a ring where a 4-unit halo crosses it, leaving 5
    units of sage either side). Geometry is otherwise IDENTICAL to
    `cat-mark.svg` minus the whiskers, so this is the same glyph drawn for a
    size, not a second mark.

    Nothing here is clipped: the ring's outer edge is 49.8 from (60.5, 57.8),
    giving margins of 8.0 top, 10.7 left, 9.7 right, 12.4 bottom.
  -->
<defs>
    <path id="catOuter" d="M33.5 60
      C32.8 52 33.2 45.5 34.2 42 L35 24 L52.5 40.5
      C55.5 39 65.5 39 68.5 40.5 L86 24 L86.8 42
      C87.8 45.5 88.2 52 87.5 60
      C87.5 77 77.5 86 60.5 86 C43.5 86 33.5 77 33.5 60 Z"/>
  </defs>
  <g fill="none" stroke="#6f8b66" stroke-width="14" stroke-linecap="round">
    <circle cx="60.5" cy="57.8" r="42.8" stroke-dasharray="224 44.9" stroke-dashoffset="-63"/>
    <path d="M70.5 99.6 Q 88 102.5 98 89.5"/>
  </g>
  <use href="#catOuter" fill="#ffffff" stroke="#ffffff" stroke-width="8" stroke-linejoin="round"/>
  <use href="#catOuter" fill="#6f8b66"/>
  <path d="M37 43 L37.4 28.5 L49.5 39.5 Z" fill="#cfe0c2"/>
  <path d="M84 43 L83.6 28.5 L71.5 39.5 Z" fill="#cfe0c2"/>
  <path d="M60.5 47.5 C71 47.5 78 55 78 64.5 C78 74 71 81 60.5 81
           C50 81 43 74 43 64.5 C43 55 50 47.5 60.5 47.5 Z" fill="#ffffff"/>
</svg>
