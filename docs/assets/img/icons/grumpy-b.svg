<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="c@t-harness">
  <title>c@t-harness — the at-sign IS the head; its inner ring is the muzzle</title>
  <g fill="none" stroke="#4b5563" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <!-- ears, growing out of the ring -->
    <path d="M27.5 27.5 L14 4 L44 16" fill="#c9ced6"/>
    <path d="M92.5 27.5 L106 4 L76 16" fill="#c9ced6"/>
    <!-- the @ ring, open at the lower right -->
    <path d="M73.3 99.6 A42 42 0 1 1 98.4 74.5" />
    <!-- the inner a of the @ doubles as the muzzle -->
    <circle cx="54" cy="62" r="15" stroke-width="5"/>
    <path d="M69 48 L69 72 q0 8 11 9.5" stroke-width="5"/>
    <!-- the face, inside the ring, above the muzzle -->
    <g stroke-width="5">
      <path d="M34 36 L47 43"/>
      <path d="M78 34 L67 41"/>
      <path d="M41 50 L41 53" stroke-width="6"/>
      <path d="M64 50 L64 53" stroke-width="6"/>
    </g>
    <!-- the frown, drawn inside the muzzle -->
    <path d="M54 60 q-6 7 -11 2" stroke-width="4"/>
    <path d="M54 60 q6 7 11 2" stroke-width="4"/>
  </g>
</svg>
